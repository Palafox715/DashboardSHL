<!DOCTYPE html>
<html lang='es'>
<head>
<meta charset='utf-8'/>
<meta name='viewport' content='width=device-width, initial-scale=1'/>
<title>Leaderboard — Quartz Rift Event</title>
<style>
  :root{
    --vh: 1vh;
    --dark-bg: #0A0A0A;
    --ink:#E0E0E0;
    --glass: rgba(0,0,0, .55);
    --glass-strong: rgba(0,0,0, .75);
    --neon-blue: #44CCFF;
    --neon-purple: #FF44CC;
    --neon-red: #FF4444;
    --glow-blue: rgba(44, 204, 255, .6);
    --glow-purple: rgba(255, 68, 204, .5);
    --glow-red: rgba(255, 68, 68, .5);
  }
  
  html,body{
    margin:0; min-height:100%; width:100%;
    background:var(--dark-bg); color:var(--ink);
    font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;
    overflow-x: hidden; overflow-y: auto;
  }

  /* FONDO MATRIX Y GRADIENTES (INTACTOS) */
  #matrix-canvas { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: -2; opacity: 0.12; pointer-events: none; }
  body::before, body::after{
    content:""; position:fixed; inset:-20%;
    background: radial-gradient(40% 40% at 20% 20%, var(--glow-blue), transparent),
                radial-gradient(30% 30% at 50% 90%, var(--glow-purple), transparent);
    z-index:-1; pointer-events:none; mix-blend-mode:lighten; animation:float 22s linear infinite;
  }
  @keyframes float{ 0%, 100%{transform:translate3d(0,0,0)} 50%{transform:translate3d(2%, -2%, 0)} }

  /* ESTRUCTURA DEL DASHBOARD (INTACTA) */
  #board{
    position:relative; z-index:1; width:100vw; min-height:100vh;
    padding:calc(1.2*var(--vh)) calc(1.6*var(--vh)); box-sizing:border-box;
    display:flex;flex-direction:column;gap:calc(0.8*var(--vh));
    max-width: 1400px; margin: 0 auto; /* Centrado para dejar espacio a las grietas */
  }
  
  .top-header-flex{ display: flex; justify-content: space-between; align-items: center; gap: 10px; }
  .header-controls { display: flex; align-items: center; gap: 15px; }

  #dailyTotalDisplay{
    background: var(--glass-strong); padding: 8px 16px; border-radius: 10px;
    border: 1px solid var(--neon-blue); box-shadow: 0 0 15px var(--glow-blue);
    text-align: right;
  }
  #dailyTotalDisplay .label{ font-size: 10px; font-weight: 600; color: var(--neon-blue); text-transform: uppercase; }
  #dailyTotalDisplay .value{ font-size: 24px; font-weight: 900; color: var(--neon-blue); line-height: 1; }

  .chips{ display:flex; gap:10px; flex-wrap:wrap; justify-content:center; }
  .chip{ padding: 5px 12px; border-radius:999px; background:var(--glass); border:1px solid rgba(255,255,255,.2); font-weight:800; font-size:12px; }

  .table-wrap{ flex:1; overflow-x: auto; background: var(--glass); border-radius: 12px; border: 1px solid rgba(255,255,255,0.05); }
  table{ width:100%; border-collapse:separate; border-spacing:0 8px; table-layout:fixed; }
  thead th{ background:var(--glass-strong); text-transform:uppercase; font-size:12px; padding:10px; border-bottom: 2px solid rgba(255,255,255,.1); }
  tbody td{ padding:10px; text-align:center; border-top:1px solid rgba(255,255,255,.05); }
  
  .bar{ position:relative; height:18px; border-radius:10px; background:rgba(255,255,255,0.1); overflow:hidden; }
  .bar > .fill{ position:absolute; left:0; top:0; bottom:0; width:0%; transition: width 0.8s ease; }
  .bar.today > .fill{ background: var(--neon-blue); box-shadow: 0 0 10px var(--glow-blue); }
  .bar.total > .fill{ background: var(--neon-purple); box-shadow: 0 0 10px var(--glow-purple); }
  .bar .value{ position:relative; z-index:1; font-size:11px; font-weight:900; color:white; text-shadow: 1px 1px 2px black; }

  #diag { position: fixed; bottom: 10px; left: 10px; font-size: 10px; padding: 5px 10px; border-radius: 5px; background: rgba(0,0,0,0.8); border-left: 3px solid var(--neon-blue); z-index: 100; }

  /* =========================================
     NUEVO: SISTEMA DE GRIETAS (MINERÍA IDLE) 
     ========================================= */
  
  /* Sombras laterales para simular profundidad/roca */
  .rift-overlay {
    position: fixed; top: 0; bottom: 0; width: 120px; z-index: 50; pointer-events: none;
  }
  #rift-left { left: 0; background: linear-gradient(to right, rgba(0,0,0,0.9), transparent); border-right: 1px solid rgba(255,255,255,0.02); }
  #rift-right { right: 0; background: linear-gradient(to left, rgba(0,0,0,0.9), transparent); border-left: 1px solid rgba(255,255,255,0.02); }

  /* Nodos de Cristal */
  .crystal-node {
    position: absolute; width: 40px; height: 60px; pointer-events: auto;
    clip-path: polygon(50% 0%, 100% 50%, 50% 100%, 0% 50%); /* Forma de diamante */
    transition: transform 0.3s ease, filter 0.3s ease, opacity 0.3s ease;
    cursor: not-allowed; opacity: 0.3; transform: scale(0.2);
  }
  
  .crystal-node.ready { cursor: pointer; opacity: 1; transform: scale(1); animation: pulse-crystal 2s infinite alternate; }
  
  /* Posicionamiento y Colores Específicos */
  #node-blue { top: 30%; left: 30px; background: linear-gradient(135deg, #00f, var(--neon-blue)); }
  .ready#node-blue { filter: drop-shadow(0 0 15px var(--neon-blue)); }

  #node-red { top: 45%; right: 30px; background: linear-gradient(135deg, #800, var(--neon-red)); }
  .ready#node-red { filter: drop-shadow(0 0 15px var(--neon-red)); }

  #node-purple { top: 65%; left: 40px; background: linear-gradient(135deg, #808, var(--neon-purple)); }
  .ready#node-purple { filter: drop-shadow(0 0 15px var(--neon-purple)); }

  @keyframes pulse-crystal {
    0% { transform: scale(1); filter: brightness(1); }
    100% { transform: scale(1.1); filter: brightness(1.3); }
  }

  /* HUD DE LA BÓVEDA (Abajo Derecha) */
  #vault-hud {
    position: fixed; bottom: 30px; right: 30px; z-index: 100;
    background: rgba(10, 10, 15, 0.85); backdrop-filter: blur(10px);
    border: 1px solid rgba(255,255,255,0.1); border-radius: 15px; padding: 20px;
    text-align: right; box-shadow: 0 10px 30px rgba(0,0,0,0.8);
    border-right: 3px solid #FFF; /* Cambiará dinámicamente */
  }
  .vault-title { font-size: 10px; color: var(--ink); letter-spacing: 2px; opacity: 0.6; margin-bottom: 5px; }
  .vault-score { font-size: 38px; font-weight: 900; color: #FFF; line-height: 1; text-shadow: 0 0 10px rgba(255,255,255,0.5); }
  
  /* Texto flotante al recolectar */
  .floating-text {
    position: fixed; font-weight: 900; font-size: 20px; z-index: 200; pointer-events: none;
    animation: floatUp 1s cubic-bezier(0.1, 0.8, 0.3, 1) forwards;
  }
  @keyframes floatUp {
    0% { transform: translateY(0) scale(0.5); opacity: 1; }
    100% { transform: translateY(-50px) scale(1.5); opacity: 0; }
  }

  @media (max-width: 768px) {
    .rift-overlay { width: 60px; }
    #node-blue { left: 10px; } #node-red { right: 10px; } #node-purple { left: 15px; }
  }
</style>
</head>
<body>

<canvas id="matrix-canvas"></canvas>

<div id="rift-left" class="rift-overlay">
    <div id="node-blue" class="crystal-node" onclick="mineCrystal('blue')"></div>
    <div id="node-purple" class="crystal-node" onclick="mineCrystal('purple')"></div>
</div>
<div id="rift-right" class="rift-overlay">
    <div id="node-red" class="crystal-node" onclick="mineCrystal('red')"></div>
</div>

<div id="vault-hud">
    <div class="vault-title">BÓVEDA LOCAL (DATOS)</div>
    <div id="vault-score" class="vault-score">0</div>
</div>

<div id='board'>
  <div class='top-header-flex'> 
    <h2 style="margin:0; font-size: 28px;">🏁 Leaderboard</h2>
    <div class="header-controls">
        <div id='dailyTotalDisplay'>
          <div class='label'>Total Diario</div>
          <div class='value' id='totalTodayValue'>0</div>
        </div>
    </div>
  </div>

  <div class='chips'>
    <div id='chipWeekly' class='chip'>Week: —</div>
    <div id='chipDaily' class='chip'>Daily: —</div>
    <button class="chip" onclick="updateData()" style="cursor:pointer; background:rgba(255,255,255,0.1)">🔄 Refrescar Red</button>
  </div>

  <div class='table-wrap'>
    <table id='tbl'>
      <thead>
        <tr>
          <th style="width:50px">#</th>
          <th style="text-align:left">Agent</th>
          <th>Today</th>
          <th>Total</th>
        </tr>
      </thead>
      <tbody></tbody>
    </table>
  </div>
</div>

<div id="diag">Iniciando sistemas...</div>

<script>
/* ==========================================================================
   MÓDULO 1: LA GRIETA DE CUARZO (IDLE MINER LOCAL)
   ========================================================================== */

// Configuración de los minerales (Tiempos en milisegundos)
const MINERALS = {
    blue:   { id: 'node-blue',   time: 2 * 60 * 1000,   points: 250,  color: '#44CCFF' }, // 2 Minutos
    red:    { id: 'node-red',    time: 5 * 60 * 1000,   points: 500,  color: '#FF4444' }, // 5 Minutos
    purple: { id: 'node-purple', time: 10 * 60 * 1000,  points: 1000, color: '#FF44CC' }  // 10 Minutos
};

let localVault = 0;

function initMiner() {
    // 1. Cargar Bóveda
    localVault = parseInt(localStorage.getItem('qv_vault')) || 0;
    updateVaultUI();

    // 2. Iniciar ciclos de crecimiento
    Object.keys(MINERALS).forEach(key => {
        let lastMined = localStorage.getItem(`qv_time_${key}`);
        if (!lastMined) {
            // Si es la primera vez, el tiempo inicia ahora
            lastMined = Date.now();
            localStorage.setItem(`qv_time_${key}`, lastMined);
        }
    });

    // 3. Bucle de vigilancia (cada segundo revisa el estado)
    setInterval(checkGrowth, 1000);
    checkGrowth(); // Chequeo inicial
}

function checkGrowth() {
    const now = Date.now();
    
    Object.keys(MINERALS).forEach(key => {
        const min = MINERALS[key];
        const el = document.getElementById(min.id);
        const lastMined = parseInt(localStorage.getItem(`qv_time_${key}`));
        
        const elapsed = now - lastMined;
        const progress = Math.min(elapsed / min.time, 1.0); // De 0.0 a 1.0

        if (progress >= 1.0) {
            // Cristal listo para cosechar
            if (!el.classList.contains('ready')) {
                el.classList.add('ready');
                el.style.transform = `scale(1)`;
                el.style.opacity = `1`;
            }
        } else {
            // Cristal creciendo (escala visual del 20% al 90%)
            el.classList.remove('ready');
            const scale = 0.2 + (progress * 0.7); 
            const opacity = 0.3 + (progress * 0.5);
            el.style.transform = `scale(${scale})`;
            el.style.opacity = opacity;
        }
    });
}

function mineCrystal(key) {
    const el = document.getElementById(MINERALS[key].id);
    
    // Si no está listo, ignorar el clic
    if (!el.classList.contains('ready')) return;

    // 1. Sumar puntos y guardar
    const pointsGained = MINERALS[key].points;
    localVault += pointsGained;
    localStorage.setItem('qv_vault', localVault);
    
    // 2. Reiniciar temporizador del cristal
    localStorage.setItem(`qv_time_${key}`, Date.now());
    
    // 3. Feedback Visual
    el.classList.remove('ready');
    updateVaultUI(MINERALS[key].color);
    spawnFloatingText(pointsGained, MINERALS[key].color, el);
    
    // Forzar actualización visual inmediata
    checkGrowth();
}

function updateVaultUI(glowColor = '#FFF') {
    const scoreEl = document.getElementById('vault-score');
    const hudEl = document.getElementById('vault-hud');
    
    // Animación de contador
    scoreEl.innerText = localVault.toLocaleString();
    
    // Brillo temporal al recolectar
    hudEl.style.borderRightColor = glowColor;
    scoreEl.style.color = glowColor;
    scoreEl.style.textShadow = `0 0 15px ${glowColor}`;
    
    setTimeout(() => {
        hudEl.style.borderRightColor = '#FFF';
        scoreEl.style.color = '#FFF';
        scoreEl.style.textShadow = `0 0 10px rgba(255,255,255,0.5)`;
    }, 500);
}

function spawnFloatingText(points, color, sourceEl) {
    const rect = sourceEl.getBoundingClientRect();
    const floating = document.createElement('div');
    floating.className = 'floating-text';
    floating.innerText = `+${points}`;
    floating.style.color = color;
    floating.style.left = `${rect.left + (rect.width/2) - 15}px`;
    floating.style.top = `${rect.top}px`;
    floating.style.textShadow = `0 0 10px ${color}`;
    
    document.body.appendChild(floating);
    setTimeout(() => floating.remove(), 1000);
}


/* ==========================================================================
   MÓDULO 2: DASHBOARD Y RED (SISTEMAS INTACTOS DE GOOGLE SHEETS)
   ========================================================================== */
const API_KEY = "AIzaSyCCBAapFj9Fd-8cOIfpDJxrOP__76zxAxM";
const WEEKLY_ID = "1xNrDZ6uXUS0XMU3033SALOPPORgyjQomH68W2GyTAUo";
const DAILY_ID = "1MeGKl3Qok84NymsXnuHuA4reL_l9Y1SqqLuejIMeaUA";

function setDiag(msg, color = "#44CCFF") {
    const d = document.getElementById('diag');
    if(d) { d.innerText = msg; d.style.borderLeftColor = color; }
}

function getLocalDate(){ return new Date(new Date().toLocaleString('en-US',{timeZone:"America/Tijuana"})); }

function computeWeeklyTab(){
    const d = getLocalDate(); const start = new Date(d.getFullYear(), 0, 1);
    const days = Math.floor((d - start) / 86400000);
    let week = Math.ceil((days + start.getDay() + 1) / 7);
    if (d.getDay() < 3 || (d.getDay() === 3 && d.getHours() < 12)) week--;
    return `W${week}`;
}

async function fetchSheet(id, range) {
    const url = `https://sheets.googleapis.com/v4/spreadsheets/${id}/values/${encodeURIComponent(range)}?key=${API_KEY}`;
    try { const r = await fetch(url); return r.ok ? await r.json() : null; } catch (e) { return null; }
}

async function updateData() {
    setDiag("📡 Sincronizando Uplink...");
    const weeklyTab = computeWeeklyTab();
    const master = await fetchSheet(WEEKLY_ID, `${weeklyTab}!A3:O96`);
    if (!master) { setDiag("❌ Error Weekly", "#FF44CC"); return; }
    
    const today = getLocalDate();
    const fmt = today.toLocaleString('en-US', {month:'short', day:'2-digit'});
    let daily = await fetchSheet(DAILY_ID, `${fmt}!A2:D100`);
    if (!daily) daily = await fetchSheet(DAILY_ID, `Tabla_25!A2:D100`);

    const dailyRows = daily?.values || [];
    const agents = master.values.map(row => {
        const id = (row[0] || "").toString().trim();
        const name = (row[1] || "").toString().trim();
        if (!id || !name) return null;
        const match = dailyRows.find(d => (d[1] || "").toString().trim() === id);
        return { name, today: match ? parseInt(match[2]) || 0 : 0, total: parseInt(row[14]) || 0 };
    }).filter(x => x).sort((a,b) => b.today - a.today);

    renderList(agents);
    document.getElementById('totalTodayValue').innerText = agents.reduce((s, a) => s + a.today, 0);
    document.getElementById('chipWeekly').innerText = `Week: ${weeklyTab}`;
    document.getElementById('chipDaily').innerText = `Daily: ${daily ? (daily.range.split('!')[0]) : '---'}`;
    setDiag("✅ Uplink Estable");
}

function renderList(data) {
    const tbody = document.querySelector("#tbl tbody"); if(!tbody) return;
    tbody.innerHTML = "";
    const maxT = Math.max(1, ...data.map(d => d.today));
    const maxW = Math.max(1, ...data.map(d => d.total));
    data.forEach((a, i) => {
        tbody.innerHTML += `<tr>
            <td>${i+1}</td>
            <td style="text-align:left; font-weight:800">${a.name}</td>
            <td><div class="bar today"><div class="fill" style="width:${(a.today/maxT)*100}%"></div><div class="value">${a.today}</div></div></td>
            <td><div class="bar total"><div class="fill" style="width:${(a.total/maxW)*100}%"></div><div class="value">${a.total}</div></div></td>
        </tr>`;
    });
}

/* ==========================================================================
   MOTOR MATRIX DE FONDO
   ========================================================================== */
const mCanvas = document.getElementById('matrix-canvas');
const mCtx = mCanvas.getContext('2d');
let mw, mh, mCols, mYpos;
function initMatrix() {
    mw = mCanvas.width = window.innerWidth; mh = mCanvas.height = window.innerHeight;
    mCols = Math.floor(mw / 25); mYpos = Array(mCols).fill(0);
}
function drawMatrix() {
    mCtx.fillStyle = 'rgba(10, 10, 10, 0.1)'; mCtx.fillRect(0, 0, mw, mh);
    mCtx.fillStyle = '#44CCFF'; mCtx.font = '15px monospace';
    mYpos.forEach((y, i) => {
        mCtx.fillText(String.fromCharCode(0x30A0 + Math.random() * 96), i * 25, y);
        mYpos[i] = y > 100 + Math.random() * 10000 ? 0 : y + 20;
    });
}

/* ==========================================================================
   INICIALIZACIÓN MAESTRA
   ========================================================================== */
(async function init() {
    initMatrix(); setInterval(drawMatrix, 50);
    initMiner(); // Arranca el minijuego de fondo
    await updateData(); setInterval(updateData, 60000);
})();
</script>
</body>
</html>
