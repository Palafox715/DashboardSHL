<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Shoreline — Dashboard</title>
<style>
  :root {
    --bg-dark: #0b0c10;
    --panel-dark: rgba(31, 40, 51, 0.85); 
    --text-main: #c5c6c7;
    --text-light: #ffffff;
    --neon-green: #00ffcc;
    --neon-orange: #ff4500;
  }

  body {
    margin: 0;
    font-family: "Inter", system-ui, sans-serif;
    background: var(--bg-dark);
    color: var(--text-main);
    overflow-x: hidden; 
    overflow-y: auto; 
    position: relative;
    width: 100%;
  }

  #battlefield {
    position: fixed;
    top: 0; left: 0;
    width: 100vw; height: 100vh;
    z-index: 1; 
    pointer-events: none;
  }

  #battlefield-entities {
    position: fixed;
    top: 0; left: 0;
    width: 100vw; height: 100vh;
    z-index: 2; 
    pointer-events: none; 
  }

  /* === ESTRUCTURA DOM TÁCTICA: CONTENEDOR Y SPRITE === */
  .agent-container {
    position: absolute;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    transition: transform 0.1s linear, opacity 0.3s ease;
    will-change: transform;
    pointer-events: auto; /* Permite interacción del mouse en el contenedor */
    cursor: crosshair;
  }

  .agent-sprite {
    width: 100%; height: auto;
    object-fit: contain;
    image-rendering: pixelated; 
    image-rendering: crisp-edges;
    transition: filter 0.2s ease, transform 0.2s ease; 
  }

  /* === GLOBO DE CARTA (TOOLTIP INTERACTIVO) === */
  .agent-card-tooltip {
    position: absolute;
    bottom: 100%; /* Aparece justo encima del personaje */
    left: 50%;
    /* Posición inicial oculta y ligeramente reducida */
    transform: translateX(-50%) translateY(10px) scale(0.9);
    opacity: 0;
    visibility: hidden;
    transition: all 0.2s cubic-bezier(0.25, 1, 0.5, 1);
    pointer-events: none; /* Evita parpadeos si el mouse toca la carta */
    width: 140px; /* Ancho táctico de la carta. Ajustable según proporción */
    z-index: 100;
    background: var(--bg-dark);
    border-radius: 8px;
    padding: 4px;
  }

  /* Estilos de carta por facción */
  .agent-container.Gio .agent-card-tooltip { border: 2px solid var(--neon-green); box-shadow: 0 0 15px rgba(0,255,204,0.5); }
  .agent-container.ricky .agent-card-tooltip { border: 2px solid var(--neon-orange); box-shadow: 0 0 15px rgba(255,69,0,0.5); }

  .agent-card-tooltip img {
    width: 100%;
    height: auto;
    border-radius: 4px;
    display: block;
  }

  /* Animación al pasar el mouse */
  .agent-container:hover .agent-card-tooltip {
    opacity: 1;
    visibility: visible;
    transform: translateX(-50%) translateY(-10px) scale(1); /* Flota hacia arriba */
  }

  /* Efecto Espejo (Ricky Team) */
  .agent-container.Gio .agent-sprite {
    filter: drop-shadow(0 0 5px rgba(0, 255, 204, 0.9)) drop-shadow(0 0 15px rgba(0, 255, 204, 0.6));
  }
  
  .agent-container.ricky .agent-sprite {
    filter: drop-shadow(0 0 5px rgba(255, 69, 0, 0.9)) drop-shadow(0 0 15px rgba(255, 69, 0, 0.6));
    transform: scaleX(-1); 
  }

  @keyframes floatUp {
    0% { opacity: 1; transform: translateY(0) scale(1); }
    100% { opacity: 0; transform: translateY(-60px) scale(1.3); }
  }
  
  .floating-score {
    position: absolute;
    top: -20px;
    color: #fff;
    font-weight: 900;
    font-size: 14px;
    pointer-events: none;
    animation: floatUp 1.5s cubic-bezier(0.25, 1, 0.5, 1) forwards;
    z-index: 100;
  }

  .flash-active.Gio .agent-sprite { filter: drop-shadow(0 0 20px #fff) drop-shadow(0 0 40px #fff) brightness(1.5) !important; }
  .flash-active.ricky .agent-sprite { filter: drop-shadow(0 0 20px #fff) drop-shadow(0 0 40px #fff) brightness(1.5) !important; transform: scaleX(-1); }

  .agent-name-label {
    margin-top: -5px; 
    color: #fff;
    font-size: 11px;
    font-weight: 800;
    text-transform: uppercase;
    white-space: nowrap; 
    pointer-events: none;
    text-align: center;
    text-shadow: -1px -1px 0 #000, 1px -1px 0 #000, -1px 1px 0 #000, 1px 1px 0 #000;
  }

  header, .dashboard { position: relative; z-index: 10; }
  header { text-align: center; padding: 1rem 0 0.5rem 0; }
  h1 { font-size: 2.4rem; font-weight: 800; margin-bottom: 0.3rem; color: var(--text-light); text-shadow: 0 0 10px rgba(255, 255, 255, 0.2); }

  .supremacy-wrapper {
    position: relative; width: 80%; height: 45px; margin: 1.5rem auto; background: #111;
    border-radius: 8px; border: 2px solid #333; display: flex; overflow: hidden;
    box-shadow: 0 0 20px rgba(0, 0, 0, 0.8) inset, 0 5px 15px rgba(0,0,0,0.5);
  }
  .supremacy-side { height: 100%; transition: width 0.8s cubic-bezier(0.25, 1, 0.5, 1); display: flex; align-items: center; position: relative; }
  .team-Gio-bar { width: 50%; background: linear-gradient(90deg, rgba(0,255,204,0.2) 0%, rgba(0,255,204,0.8) 100%); box-shadow: inset -5px 0 15px var(--neon-green); }
  .team-ricky-bar { width: 50%; background: linear-gradient(270deg, rgba(255,69,0,0.2) 0%, rgba(255,69,0,0.8) 100%); box-shadow: inset 5px 0 15px var(--neon-orange); }
  .clash-point {
    position: absolute; top: -5px; bottom: -5px; width: 6px; background: #fff;
    box-shadow: 0 0 15px #fff, 0 0 30px #fff; transform: translateX(-50%); z-index: 10;
    transition: left 0.8s cubic-bezier(0.25, 1, 0.5, 1); left: 50%; 
  }

  .bar-labels { display: flex; justify-content: space-between; width: 80%; margin: 0.5rem auto 1.5rem auto; font-weight: 800; font-size: 1.2rem; text-transform: uppercase; letter-spacing: 1px; }
  #Gio-label { color: var(--neon-green); text-shadow: 0 0 8px rgba(0, 255, 204, 0.5); }
  #ricky-label { color: var(--neon-orange); text-shadow: 0 0 8px rgba(255, 69, 0, 0.5); }

  .dashboard { display: flex; justify-content: center; align-items: flex-start; width: 90%; margin: 1rem auto 3rem auto; gap: 19rem; }
  .team { flex: 1; background: var(--panel-dark); backdrop-filter: blur(5px); border-radius: 46px; box-shadow: 0 10px 25px rgba(0,0,0,0.5); overflow: hidden; min-width: 580px; max-width: 840px; border: 1px solid rgba(255,255,255,0.1); }
  h2 { text-align: center; color: var(--neon-green); background: rgba(0, 255, 204, 0.1); padding: 0.8rem; font-size: 1.4rem; font-weight: 800; margin: 0; text-shadow: 0 0 5px var(--neon-green); }
  h2.orange { color: var(--neon-orange); background: rgba(255, 69, 0, 0.1); text-shadow: 0 0 5px var(--neon-orange); }
  table { width: 100%; border-collapse: collapse; text-align: center; font-size: 1.0rem; color: var(--text-main); }
  th, td { padding: 8px 10px; border-bottom: 1px solid #333; }
  th { background: rgba(0, 255, 204, 0.2); color: var(--neon-green); font-weight: 700; text-transform: uppercase; }
  .team.orange th { background: rgba(255, 69, 0, 0.2); color: var(--neon-orange); }
  tr:nth-child(even) td { background: rgba(255, 255, 255, 0.03); }
  .sum-row { background: #111; color: var(--text-light); font-weight: 700; }
  .totals-center { position: absolute; top: 30%; left: 50%; transform: translate(-50%, -55%); background: var(--panel-dark); backdrop-filter: blur(5px); border-radius: 65px; padding: 1.3rem 2.3rem; text-align: center; box-shadow: 0 8px 25px rgba(0,0,0,0.5); border: 2px solid rgba(255,255,255,0.1); }
  .totals-center h3 { margin: 0; font-size: 1.3rem; color: var(--text-light); }
  .totals-center span { display: block; font-size: 2.7rem; font-weight: 800; margin: 0.3rem 0; transition: all 0.3s ease-in-out; }
</style>
</head>
<body>

<canvas id="battlefield"></canvas>
<div id="battlefield-entities"></div>

<header>
  <h1>Shoreline Competition</h1>
  <div class="supremacy-wrapper">
    <div id="Gio-bar" class="supremacy-side team-Gio-bar"></div>
    <div id="ricky-bar" class="supremacy-side team-ricky-bar"></div>
    <div id="clash-indicator" class="clash-point"></div>
  </div>
  <div class="bar-labels">
    <span id="Gio-label">🟢 Facción Gio: 0% (0)</span>
    <span id="ricky-label">🟠 Facción Ricky: 0% (0)</span>
  </div>
</header>

<div class="dashboard">
  <div class="team">
    <h2>🟢 Facción Gio</h2>
    <table id="table-Gio">
      <thead><tr><th>Agent</th><th>ID</th><th>Cr Pull</th><th>Xfer</th><th>Total</th></tr></thead>
      <tbody></tbody>
      <tfoot><tr class="sum-row"><td colspan="2">TOTAL</td><td id="Gio-cr">0</td><td id="Gio-xf">0</td><td id="Gio-total">0</td></tr></tfoot>
    </table>
  </div>
  <div class="totals-center" id="totals-center">
    <h3>XFER Totals</h3>
    <span id="Gio-xfer-total">0</span>
    <span style="font-size:3.0rem;">VS</span>
    <span id="ricky-xfer-total">0</span>
  </div>
  <div class="team orange">
    <h2 class="orange">🟠 Facción Ricky</h2>
    <table id="table-ricky">
      <thead><tr><th>Agent</th><th>ID</th><th>Cr Pull</th><th>Xfer</th><th>Total</th></tr></thead>
      <tbody></tbody>
      <tfoot><tr class="sum-row"><td colspan="2">TOTAL</td><td id="ricky-cr">0</td><td id="ricky-xf">0</td><td id="ricky-total">0</td></tr></tfoot>
    </table>
  </div>
</div>

<script>
const SHEET_ID = "1xNrDZ6uXUS0XMU3033SALOPPORgyjQomH68W2GyTAUo";
const API_KEY  = "AIzaSyCCBAapFj9Fd-8cOIfpDJxrOP__76zxAxM"; 
const TIMEZONE = "America/Tijuana";

const canvas = document.getElementById('battlefield');
const ctx = canvas.getContext('2d');
const entitiesContainer = document.getElementById('battlefield-entities'); 

let width, height;
let currentDominancePct = 50; 
let particles = []; 

function resizeCanvas() {
  width = canvas.width = window.innerWidth;
  height = canvas.height = window.innerHeight;
}
window.addEventListener('resize', resizeCanvas);
resizeCanvas();

class Entity {
  constructor(id, name, team, xfer) {
    this.id = id;
    this.name = name;
    this.team = team;
    this.xfer = 0; 
    
    // 1. Contenedor principal
    this.domElement = document.createElement('div');
    this.domElement.className = `agent-container ${this.team}`;
    this.domElement.id = `agent-${id}`; 

    // === TÁCTICA: INTERACCIÓN Y PAUSA ===
    this.isHovered = false;
    this.domElement.addEventListener('mouseenter', () => {
      this.isHovered = true;
      this.domElement.style.zIndex = "1000"; // Asegura que la carta quede sobre todos
    });
    this.domElement.addEventListener('mouseleave', () => {
      this.isHovered = false;
      this.domElement.style.zIndex = ""; // Restaura el nivel natural
    });
    
    // 2. Globo de Carta PNG (Tooltip)
    const cardTooltip = document.createElement('div');
    cardTooltip.className = 'agent-card-tooltip';
    const cardImg = document.createElement('img');
    
    // Intentamos cargar la carta específica del agente usando su ID
    cardImg.src = `./cartas/${id}.png`;
    
    // === NUEVO BLINDAJE TÁCTICO ===
    // Si la imagen [id].png no existe, se dispara este error y cargamos la carta por defecto.
    cardImg.onerror = function() { 
      this.src = "./cartas/Default.png"; 
      
      // Doble blindaje: Si por algún motivo "Default.png" también es borrado o no carga,
      // ocultamos el globo limpiamente para no mostrar el ícono de "imagen rota".
      this.onerror = function() { cardTooltip.style.display = 'none'; };
    };
    
    cardTooltip.appendChild(cardImg);
    this.domElement.appendChild(cardTooltip);

    // 3. GIF Animado
    const img = document.createElement('img');
    const spritePath = `./Sprite/${id}.gif`;
    img.src = spritePath;
    
    img.onerror = function() {
      this.src = "./Sprite/default.gif"; 
      this.onerror = function() { this.style.display = 'none'; };
    };
    img.className = 'agent-sprite';
    this.domElement.appendChild(img);
    
    // 4. Etiqueta de Nombre
    const nameLabel = document.createElement('span');
    nameLabel.className = 'agent-name-label';
    nameLabel.textContent = this.name.split(' ')[0]; 
    this.domElement.appendChild(nameLabel);

    entitiesContainer.appendChild(this.domElement);
    
    this.y = Math.random() * height;
    if (this.team === 'Gio') {
      this.x = Math.random() * (width * (currentDominancePct/100));
    } else {
      this.x = (width * (currentDominancePct/100)) + Math.random() * (width * ((100-currentDominancePct)/100));
    }
    
    const angle = Math.random() * Math.PI * 2;
    this.vx = Math.cos(angle); 
    this.vy = Math.sin(angle);

    this.updateStats(xfer);
  }

  triggerScoreEffect(pointsGained) {
    if (!this.domElement) return;
    this.domElement.classList.add('flash-active');
    setTimeout(() => { if (this.domElement) this.domElement.classList.remove('flash-active'); }, 500);

    const scorePopup = document.createElement('div');
    scorePopup.className = 'floating-score';
    scorePopup.textContent = `+${pointsGained} XFER!`;
    const glowColor = this.team === 'Gio' ? 'var(--neon-green)' : 'var(--neon-orange)';
    scorePopup.style.textShadow = `0 0 5px #000, 0 0 15px ${glowColor}`;
    this.domElement.appendChild(scorePopup);
    setTimeout(() => { if (scorePopup && scorePopup.parentNode) scorePopup.remove(); }, 1500);
  }

  updateStats(xfer) {
    this.xfer = xfer;
    this.size = 50 + Math.min(xfer * 2.0, 100); 
    this.collideRadius = this.size / 2;
    this.maxSpeed = 1.0 + Math.min(xfer * 0.15, 5.0);
    
    if (this.domElement) {
      this.domElement.style.width = `${this.size}px`;
      this.domElement.style.height = `${this.size}px`;
    }
  }

  update(wallX) {
    // TÁCTICA: Si el usuario está inspeccionando al agente, congelamos su posición temporalmente
    if (this.isHovered) return;

    const attractionForce = 0.015;
    if (this.team === 'Gio') { this.vx += attractionForce; } else { this.vx -= attractionForce; }

    const currentSpeed = Math.sqrt(this.vx * this.vx + this.vy * this.vy);
    if (currentSpeed > this.maxSpeed) {
      this.vx = (this.vx / currentSpeed) * this.maxSpeed;
      this.vy = (this.vy / currentSpeed) * this.maxSpeed;
    }

    this.x += this.vx;
    this.y += this.vy;

    if (this.y - this.collideRadius <= 0 || this.y + this.collideRadius >= height) {
      this.vy *= -1;
      this.y = Math.max(this.collideRadius, Math.min(this.y, height - this.collideRadius));
    }

    if (this.team === 'Gio') {
      if (this.x - this.collideRadius <= 0) { this.vx = Math.abs(this.vx); this.x = this.collideRadius; }
      if (this.x + this.collideRadius >= wallX) { 
        this.vx = -(this.maxSpeed * (1.5 + Math.random())); 
        this.vy += (Math.random() - 0.5) * 2; 
        this.x = wallX - this.collideRadius; 
      }
    } else {
      if (this.x + this.collideRadius >= width) { this.vx = -Math.abs(this.vx); this.x = width - this.collideRadius; }
      if (this.x - this.collideRadius <= wallX) { 
        this.vx = this.maxSpeed * (1.5 + Math.random()); 
        this.vy += (Math.random() - 0.5) * 2; 
        this.x = wallX + this.collideRadius; 
      }
    }
  }

  draw() {
    this.domElement.style.transform = `translate3d(${this.x - this.collideRadius}px, ${this.y - this.collideRadius}px, 0)`;
  }
}

function animate() {
  ctx.clearRect(0, 0, width, height);
  const wallX = width * (currentDominancePct / 100);
  ctx.beginPath(); ctx.moveTo(wallX, 0); ctx.lineTo(wallX, height);
  ctx.strokeStyle = 'rgba(255,255,255,0.1)'; ctx.lineWidth = 2; ctx.stroke();

  particles.forEach(p => {
    p.update(wallX);
    p.draw(); 
  });
  requestAnimationFrame(animate);
}
animate(); 

function num(v) { const n = Number(String(v ?? "").replace(/,/g, "").trim()); return Number.isFinite(n) ? n : 0; }
function pad2(n) { return String(n).padStart(2, "0"); }
function nowTZ() { return new Date(new Date().toLocaleString("en-US", { timeZone: TIMEZONE })); }

function getCurrentWeekNumber() {
  const now = nowTZ();
  const currentYear = now.getFullYear();
  let firstThursday = new Date(currentYear, 0, 1);
  while (firstThursday.getDay() !== 4) { firstThursday.setDate(firstThursday.getDate() + 1); }
  if (now < firstThursday) { return 52; }
  const daysDiff = Math.floor((now - firstThursday) / 86400000);
  return Math.floor(daysDiff / 7) + 1; 
}

async function fetchJSON(url, { tries = 4, baseDelay = 700 } = {}) {
  let lastErr;
  for (let i = 0; i < tries; i++) {
    try {
      const r = await fetch(url, { cache: "no-store" });
      const text = await r.text();
      if (r.ok) return JSON.parse(text);
      if (r.status === 429 || (r.status >= 500 && r.status < 600)) {
        await new Promise(res => setTimeout(res, baseDelay * Math.pow(2, i) + Math.random() * 250));
        continue;
      }
      throw new Error(`HTTP ${r.status}`);
    } catch (e) {
      lastErr = e;
      await new Promise(res => setTimeout(res, baseDelay * Math.pow(2, i) + Math.random() * 250));
    }
  }
  throw lastErr;
}

async function listSheetTitles() {
  const cache = window.__tabsCache;
  if (cache && (Date.now() - cache.at) < 600000) return cache.titles;
  const url = `https://sheets.googleapis.com/v4/spreadsheets/${SHEET_ID}?fields=sheets(properties(title))&key=${API_KEY}`;
  const j = await fetchJSON(url);
  const titles = (j.sheets || []).map(s => s?.properties?.title).filter(Boolean);
  window.__tabsCache = { at: Date.now(), titles };
  return titles;
}

function extractW(title) {
  const m = /^W(\d{1,2})$/.exec(title.trim());
  if (!m) return null;
  return { n: Number(m[1]), title, normalized: `W${pad2(Number(m[1]))}` };
}

async function loadData() {
  try {
    const teamRange = `TeamLayout!A1:Z150`;
    const teamData = (await fetchJSON(`https://sheets.googleapis.com/v4/spreadsheets/${SHEET_ID}/values/${encodeURIComponent(teamRange)}?key=${API_KEY}`)).values || [];

    const mapGio = new Map();
    const mapRicky = new Map();

    if (teamData.length >= 2) {
      const headers1 = teamData[0] || [];
      const headers2 = teamData[1] || [];
      let GioStart = -1, rickyStart = -1;
      headers1.forEach((h, i) => {
        if (String(h).toUpperCase().includes("GIO")) GioStart = i;
        if (String(h).toUpperCase().includes("RICKY")) rickyStart = i;
      });
      if (GioStart === -1) GioStart = 0;
      if (rickyStart === -1) rickyStart = 9;
      let GioCols = { name: -1, id: -1 }, rickyCols = { name: -1, id: -1 };
      const limitGio = rickyStart > GioStart ? rickyStart : headers2.length;
      for (let i = GioStart; i < limitGio; i++) {
        const h = String(headers2[i]).toUpperCase();
        if (h.includes("NAME")) GioCols.name = i;
        if (h === "ID") GioCols.id = i;
      }
      for (let i = rickyStart; i < headers2.length; i++) {
        const h = String(headers2[i]).toUpperCase();
        if (h.includes("NAME")) rickyCols.name = i;
        if (h === "ID") rickyCols.id = i;
      }
      teamData.slice(2).forEach(row => {
        if (GioCols.id !== -1 && row[GioCols.id]) {
          const id = String(row[GioCols.id]).trim();
          if (id) mapGio.set(id, { id, name: String(row[GioCols.name] || "Unknown").trim(), team: "Gio", cr: 0, xf: 0, total: 0 });
        }
        if (rickyCols.id !== -1 && row[rickyCols.id]) {
          const id = String(row[rickyCols.id]).trim();
          if (id) mapRicky.set(id, { id, name: String(row[rickyCols.name] || "Unknown").trim(), team: "ricky", cr: 0, xf: 0, total: 0 });
        }
      });
    }

    const titles = await listSheetTitles();
    const currentWeekNum = getCurrentWeekNumber();
    let weeklyTab = `W${pad2(currentWeekNum)}`;

    if (!titles.includes(weeklyTab)) {
      const weekTabs = titles.map(extractW).filter(Boolean).sort((a,b) => b.n - a.n);
      if (weekTabs.length > 0) { weeklyTab = weekTabs[0].title; } else { throw new Error("No se encontraron pestañas semanales válidas."); }
    }
    document.querySelector("h1").textContent = `Shoreline Competition - ${weeklyTab}`;

    const dataRange = `${weeklyTab}!A1:Z150`; 
    const dataValues = (await fetchJSON(`https://sheets.googleapis.com/v4/spreadsheets/${SHEET_ID}/values/${encodeURIComponent(dataRange)}?valueRenderOption=UNFORMATTED_VALUE&key=${API_KEY}`)).values || [];
    
    if (dataValues.length >= 3) {
      const headersWeek = dataValues[1] || [];
      const crIndexes = [], xfIndexes = [];
      headersWeek.forEach((h, i) => {
        const txt = String(h).toUpperCase().replace(/\s+/g, "");
        if (txt.includes("CRPULL") || txt === "CR") crIndexes.push(i);
        if (txt.includes("XFER") || txt === "XF") xfIndexes.push(i);
      });
      dataValues.slice(2).forEach(row => {
        const id = String(row[0] || "").trim();
        if (!id) return;
        let crSum = 0, xfSum = 0;
        crIndexes.forEach(idx => crSum += num(row[idx]));
        xfIndexes.forEach(idx => xfSum += num(row[idx]));
        if (mapGio.has(id)) { let agent = mapGio.get(id); agent.cr += crSum; agent.xf += xfSum; agent.total += (crSum + xfSum); } 
        else if (mapRicky.has(id)) { let agent = mapRicky.get(id); agent.cr += crSum; agent.xf += xfSum; agent.total += (crSum + xfSum); }
      });
    }

    const GioBody = document.querySelector("#table-Gio tbody");
    const rickyBody = document.querySelector("#table-ricky tbody");
    GioBody.innerHTML = rickyBody.innerHTML = "";
    const GioArr = Array.from(mapGio.values()).filter(a => a.total > 0 || a.cr > 0 || a.xf > 0);
    const rickyArr = Array.from(mapRicky.values()).filter(a => a.total > 0 || a.cr > 0 || a.xf > 0);

    const allAgents = [...GioArr, ...rickyArr];
    allAgents.forEach(agent => {
      let existingParticle = particles.find(p => p.id === agent.id);
      if (existingParticle) {
        existingParticle.team = agent.team; 
        if (agent.xf > existingParticle.xfer && existingParticle.xfer > 0) {
          const pointsGained = agent.xf - existingParticle.xfer;
          existingParticle.triggerScoreEffect(pointsGained);
        }
        existingParticle.updateStats(agent.xf);
      } else {
        particles.push(new Entity(agent.id, agent.name, agent.team, agent.xf));
      }
    });

    particles = particles.filter(p => {
      const isActive = allAgents.some(a => a.id === p.id);
      if (!isActive && p.domElement) { p.domElement.remove(); }
      return isActive;
    });

    GioArr.sort((a,b)=> b.total - a.total);
    rickyArr.sort((a,b)=> b.total - a.total);
    let jCr=0, jXf=0, jTot=0, rCr=0, rXf=0, rTot=0;
    
    GioArr.forEach((d, index) => { jCr += d.cr; jXf += d.xf; jTot += d.total; const mvpIcon = (index === 0 && d.total > 0) ? " 👑" : ""; GioBody.insertAdjacentHTML("beforeend", `<tr><td>${d.name}${mvpIcon}</td><td>${d.id}</td><td>${d.cr}</td><td>${d.xf}</td><td>${d.total}</td></tr>`); });
    rickyArr.forEach((d, index) => { rCr += d.cr; rXf += d.xf; rTot += d.total; const mvpIcon = (index === 0 && d.total > 0) ? " 👑" : ""; rickyBody.insertAdjacentHTML("beforeend", `<tr><td>${d.name}${mvpIcon}</td><td>${d.id}</td><td>${d.cr}</td><td>${d.xf}</td><td>${d.total}</td></tr>`); });

    document.getElementById("Gio-cr").textContent = jCr; document.getElementById("Gio-xf").textContent = jXf; document.getElementById("Gio-total").textContent = jTot;
    document.getElementById("ricky-cr").textContent = rCr; document.getElementById("ricky-xf").textContent = rXf; document.getElementById("ricky-total").textContent = rTot;
    const totalXfer = (jXf + rXf) > 0 ? (jXf + rXf) : 1; 
    const GioDomination = (jXf / totalXfer) * 100;
    const rickyDomination  = (rXf / totalXfer) * 100;
    currentDominancePct = GioDomination; 
    
    document.getElementById("Gio-bar").style.width = `${GioDomination}%`; document.getElementById("ricky-bar").style.width = `${rickyDomination}%`; document.getElementById("clash-indicator").style.left = `${GioDomination}%`;
    document.getElementById("Gio-label").textContent = `🟢 Facción Gio: ${GioDomination.toFixed(1)}% (${jXf} XFER)`; document.getElementById("ricky-label").textContent = `🟠 Facción Ricky: ${rickyDomination.toFixed(1)}% (${rXf} XFER)`;

    const GioBox = document.getElementById("Gio-xfer-total");
    const rickyBox = document.getElementById("ricky-xfer-total");
    GioBox.textContent = jXf; rickyBox.textContent = rXf;
    
    GioBox.style.color = "var(--neon-green)"; rickyBox.style.color = "var(--neon-orange)";
    if (jXf > rXf) { GioBox.style.opacity = "1"; GioBox.style.textShadow = "0 0 15px var(--neon-green)"; rickyBox.style.opacity = "0.5"; rickyBox.style.textShadow = "none"; } 
    else if (rXf > jXf) { rickyBox.style.opacity = "1"; rickyBox.style.textShadow = "0 0 15px var(--neon-orange)"; GioBox.style.opacity = "0.5"; GioBox.style.textShadow = "none"; }

  } catch (err) {
    console.error("❌ Error al cargar los datos:", err);
  }
}

loadData();
setInterval(loadData, 60000); 
</script>
