<!DOCTYPE html>
<html lang='es'>
<head>
<meta charset='utf-8'/>
<meta name='viewport' content='width=device-width, initial-scale=1'/>
<title>Leaderboard — Pixel Art Edition</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=VT323&display=swap" rel="stylesheet">

<style>
  /* ===== VARIABLES PIXEL ART ===== */
  :root{
    --vh: 1vh;
    --bg-color: #2d1b4e; /* Fondo morado oscuro retro */
    --panel-bg: #4a3276; /* Fondo de paneles */
    --text-color: #e0f8cf; /* Blanco verdoso retro */
    --border-color: #000000;
    --pixel-border: 3px solid var(--border-color);
    
    /* Colores de acento retro 8-bit */
    --pixel-green: #5ede5e;
    --pixel-blue: #4fa4f3;
    --pixel-yellow: #ebd320;
    --pixel-orange: #d95763;
    --pixel-shadow: 4px 4px 0px #000000; /* Sombra dura sin difuminar */
  }
  
  /* Reset General para estilo Pixel */
  html,body{
    margin:0;
    min-height:100%;
    width:100%;
    background-color: var(--bg-color);
    /* Patrón de fondo retro opcional */
    background-image: 
      linear-gradient(rgba(255,255,255,.05) 2px, transparent 2px),
      linear-gradient(90deg, rgba(255,255,255,.05) 2px, transparent 2px);
    background-size: 20px 20px, 20px 20px;
    color:var(--text-color);
    font-family: 'VT323', monospace; /* Fuente Pixelada */
    font-size: 18px;
    image-rendering: pixelated; /* Fuerza renderizado nítido */
    overflow-x: hidden;
    overflow-y: auto;
  }

  /* Quitamos las animaciones de fondo previas */
  body::before, body::after { display: none; }

  #board{
    position:relative; z-index:1;
    width:100vw;
    min-height:100vh;
    padding: 20px; box-sizing:border-box;
    display:flex;flex-direction:column; gap: 15px;
  }
  
  /* HEADER BLOCKY */
  .top-header-flex{
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    gap: 10px;
    border-bottom: var(--pixel-border);
    padding-bottom: 15px;
    margin-bottom: 10px;
  }

  h2{
    margin:0; text-align:left;
    font-size: 3rem; letter-spacing: 2px;
    color: var(--pixel-yellow);
    text-shadow: 3px 3px 0px #000; /* Sombra dura */
    text-transform: uppercase;
  }

  #dailyTotalDisplay{
    background: var(--panel-bg);
    padding: 10px 15px;
    border: var(--pixel-border);
    box-shadow: var(--pixel-shadow);
    text-align: right;
    flex-shrink: 0;
    border-radius: 0px; /* IMPORTANTE: Sin bordes redondeados */
  }
  #dailyTotalDisplay .label{
    font-size: 1.2rem;
    color: var(--pixel-blue);
    text-transform: uppercase;
    margin-bottom: 5px;
  }
  #dailyTotalDisplay .value{
    font-size: 2.5rem;
    color: var(--pixel-green);
    line-height: 1;
    text-shadow: 2px 2px 0px #000;
  }

  /* CHIPS (Etiquetas) Retro */
  .chips{
    display:flex; gap: 10px; flex-wrap:wrap;
    justify-content:flex-start;
  }
  .chip{
    padding: 5px 10px;
    background: var(--panel-bg);
    border: var(--pixel-border);
    font-size: 1.4rem;
    text-transform: uppercase;
    box-shadow: 2px 2px 0px #000;
  }

  /* TABLA PIXELADA */
  .table-wrap{ flex:1; min-height:0; position:relative; overflow: auto; }
  table{
    width:100%;
    min-width: 600px;
    /* Colapsar bordes para el look de rejilla retro */
    border-collapse: collapse; 
    border-spacing: 0;
    font-size: 1.5rem;
  }
  
  /* Cabecera de tabla */
  thead th{
    position:sticky; top:0; z-index:2;
    background: var(--panel-bg);
    text-transform:uppercase;
    font-size: 1.4rem; padding: 10px;
    border: var(--pixel-border); /* Bordes gruesos en cada celda */
    color: var(--pixel-blue);
  }
  
  /* Columnas */
  th, td { text-align: center; vertical-align: middle; }
  th.col-agent, td.col-agent{ text-align:left; }

  /* Cuerpos de tabla */
  tbody td{
    background: var(--bg-color);
    border: var(--pixel-border); /* Borde en todas las celdas */
    padding: 8px;
  }
  
  /* Hover fila retro (cambio de color instantáneo) */
  tbody tr:hover td{ 
    background: var(--panel-bg); 
    cursor: pointer;
  }

  /* Ajuste de Nombre */
  .agent-wrap{ display:flex; align-items:center; min-width:0; }
  .name{ 
      font-weight: normal;
      white-space:nowrap; 
      font-size: 1.6rem;
      padding-left: 5px;
      color: var(--text-color);
      letter-spacing: 1px;
  }

  /* BARRAS DE PROGRESO PIXELADAS */
  .bar{ 
    position:relative; height: 24px; 
    background: #000; /* Fondo negro para la barra vacía */
    border: var(--pixel-border);
    overflow:hidden; 
    border-radius: 0; /* Cuadradas */
  }
  /* Relleno sólido sin degradado */
  .bar > .fill{ 
    position:absolute; left:0; top:0; bottom:0; width:0%; 
    background: var(--pixel-blue);
    /* Patrón de escaneo opcional para el relleno */
    background-image: linear-gradient(transparent 50%, rgba(0,0,0,.2) 50%);
    background-size: 100% 4px;
    transition: width .5s steps(10); /* La transición por pasos da sensación retro */
  }
  .bar.total > .fill{ 
    background: var(--pixel-orange);
    background-image: linear-gradient(transparent 50%, rgba(0,0,0,.2) 50%);
    background-size: 100% 4px;
  }
  .bar .value{ 
    position:relative; z-index:1; 
    font-size: 1.4rem; 
    color: #fff;
    text-shadow: 2px 2px 0px #000;
    line-height: 22px;
  }

  #meta{ display:flex;justify-content:flex-start;align-items:center; font-size: 1.2rem; margin-top: 10px; }
  #diag { color: var(--pixel-yellow); }

  /* ===== MEDALLAS PIXEL ART (Bloques cuadrados) ===== */
  .medal-block {
    display: inline-block;
    width: 30px; height: 30px;
    line-height: 30px;
    text-align: center;
    border: var(--pixel-border);
    font-size: 1.4rem;
    font-weight: bold;
    color: #000;
    margin-right: 5px;
    box-shadow: 2px 2px 0px #000;
  }
  /* ORO 8-bit */
  .medal-gold { background: var(--pixel-yellow); }
  /* PLATA 8-bit */
  .medal-silver { background: #a8a8a8; }
  /* BRONCE 8-bit */
  .medal-bronze { background: #c77b58; }
  
  .rankwrap{ display:flex; align-items:center; justify-content:center; }

  /* MOBILE RETRO */
  @media (max-width: 768px) {
    #board { padding: 10px; gap: 10px; }
    .top-header-flex { flex-direction: column; align-items: stretch; border-bottom: none;}
    #dailyTotalDisplay { text-align: center; margin-top: 15px; }
    h2 { text-align: center; font-size: 2.5rem; }
    table { min-width: unset; }
    thead { display: none; }
    tbody, tr, td { display: block; width: 100%; box-sizing: border-box; }
    
    tbody tr { 
      margin-bottom: 15px; padding: 10px; 
      border: var(--pixel-border);
      background: var(--panel-bg);
      box-shadow: var(--pixel-shadow);
    }
    /* En móvil quitamos los bordes internos de celda para que parezca una tarjeta */
    tbody td { 
      padding: 4px 0; border: none; display: flex; 
      justify-content: space-between; align-items: center; 
      background: none;
      text-align: left;
    }
    th.col-day, td.col-day { display: none; }
    
    /* Etiquetas retro para móvil */
    td.col-rank::before { content: '[RANK]'; color: var(--pixel-yellow); margin-right: 10px; }
    td.col-agent::before { content: '[AGENT]'; color: var(--pixel-yellow); margin-right: 10px; }
    td.col-today::before { content: '[TODAY]'; color: var(--pixel-yellow); margin-right: 10px; }
    td.col-total::before { content: '[TOTAL]'; color: var(--pixel-yellow); margin-right: 10px; }
    
    .bar { height: 20px; flex-grow: 1; margin-left: 10px; }
    .bar .value { line-height: 18px; font-size: 1.2rem; }
    .rankwrap { justify-content: flex-start; }
  }
</style>
</head>
<body>
<div id='board'>
  <div class='top-header-flex'> 
    <h2>👾 LEADERBOARD</h2>
    <div id='dailyTotalDisplay'>
      <div class='label'>TOTAL DIARIO (TODAY)</div>
      <div class='value' id='totalTodayValue'>0</div>
    </div>
  </div>

  <div class='chips'>
    <div id='chipWeekly' class='chip'>WEEK: —</div>
    <div id='chipDaily' class='chip'>DAILY: —</div>
  </div>

  <div class='table-wrap'>
    <table id='tbl'>
      <thead>
        <tr>
          <th class='col-rank'>RANK</th>
          <th class='col-agent'>AGENT</th>
          <th class='col-today'>TODAY</th>
          <th class='col-day'>WED</th>
          <th class='col-day'>THU</th>
          <th class='col-day'>FRI</th>
          <th class='col-day'>SAT</th>
          <th class='col-day'>MON</th>
          <th class='col-day'>TUE</th>
          <th class='col-total'>TOTAL</th>
        </tr>
      </thead>
      <tbody></tbody>
    </table>
  </div>

  <div id='meta'>
    <div id='diag'>LOADING SYSTEM...</div>
  </div>
</div>

<script>
// Nota: En pixel art no necesitamos calcular VH dinámicamente, usaremos tamaños fijos/rem.
// La función setVHVar se ha eliminado para simplificar.

/* IDs y API (MISMOS DATOS QUE EL ANTERIOR) */
const API_KEY        = "AIzaSyDwOqp2uizZol2et6Uqi7CnntW9Hkrinjg";
const WEEKLY_SHEETID = "1xNrDZ6uXUS0XMU3033SALOPPORgyjQomH68W2GyTAUo";
const DAILY_ID_RAW   = "1MeGKl3Qok84NymsXnuHuA4reL_l9Y1SqqLuejIMeaUA";

const TIMEZONE        = "America/Tijuana";
const DAILY_REFRESH  = 12000; 
const WEEKLY_REFRESH = 5*60*1000;

let ALL_DATA=[]; 

function diag(t, cls){ document.getElementById('diag').innerHTML = `<span class="${cls||''}">${t}</span>`; }
function setChipWeekly(t){ document.getElementById('chipWeekly').textContent = `WEEK: ${t}`; }
function setChipDaily(t){ document.getElementById('chipDaily').textContent = `DAILY: ${t}`; }
function getLocalDate(){ const s=new Date().toLocaleString('en-US',{timeZone:TIMEZONE}); return new Date(s); }
function isoWeek(d){ const x=new Date(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate())); const n=x.getUTCDay()||7; x.setUTCDate(x.getUTCDate()+4-n); const y=new Date(Date.UTC(x.getUTCFullYear(),0,1)); return {week:Math.ceil((((x-y)/86400000)+1)/7), year:x.getUTCFullYear()}; }
function weeksInISOYear(y){ const d=new Date(Date.UTC(y,11,31)); const day=d.getUTCDay(); return (day===4 || (d.getUTCDate()===31 && day===3))?53:52; }
function computeWeeklyTabName(){
  const url=new URL(window.location.href); const override=url.searchParams.get('weeklyTab'); if(override) return override;
  const local=getLocalDate(); const hrs=local.getHours(); const dow=local.getDay(); const iw=isoWeek(local); let w=iw.week;
  const afterCut=(dow>4)||(dow===4&&hrs>=14); if(afterCut){ w++; const mx=weeksInISOYear(iw.year); if(w>mx){w=1;} }
  return `W${w}`;
}
const emoji=/[\u{1F1E6}-\u{1F1FF}\u{1F300}-\u{1FAFF}\u{1F900}-\u{1F9FF}\u{2600}-\u{27BF}\u{FE0F}]/gu;
function normName(s){ return (s||"").replace(emoji,"").normalize('NFD').replace(/[\u0300-\u036f]/g,"").replace(/[^\x20-\x7E]/g,"").replace(/\s{2,}/g," ").trim().toUpperCase(); }
function normID(s){ return (s||"").toString().trim(); }

/* fetch con cache-busting (Idéntico) */
async function fetchSafeJSON(url, {tries=4, baseDelay=700} = {}) {
  let lastErr;
  for (let i = 0; i < tries; i++) {
    try {
      const r = await fetch(url, {
        cache: 'no-store',
        headers: { 'Cache-Control': 'no-cache, no-store, max-age=0', 'Pragma': 'no-cache' },
      });
      if (r.ok) return await r.json();
      const text = await r.text();
      if (r.status === 429 || (r.status >= 500 && r.status < 600)) {
        const jitter = Math.random() * 250;
        await new Promise(res => setTimeout(res, baseDelay * Math.pow(2, i) + jitter));
        continue;
      }
      throw new Error(`HTTP ${r.status} • ${text.slice(0,180)}`);
    } catch (e) {
      lastErr = e;
      const jitter = Math.random() * 250;
      await new Promise(res => setTimeout(res, baseDelay * Math.pow(2, i) + jitter));
    }
  }
  throw lastErr || new Error('fetchSafeJSON: unknown');
}

// (Las funciones de lectura de datos readWeeklyTab y readDailyApproved son idénticas al anterior, omito pegarlas para ahorrar espacio, pero DEBEN estar aquí)
async function readWeeklyTab(weeklyTab){
  const ranges=[`${weeklyTab}!A3:C96`,`${weeklyTab}!D3:D96`,`${weeklyTab}!F3:F96`,`${weeklyTab}!H3:H96`,`${weeklyTab}!J3:J96`,`${weeklyTab}!L3:L96`,`${weeklyTab}!N3:N96`,`${weeklyTab}!O3:O96`].map(encodeURIComponent);
  const url=`https://sheets.googleapis.com/v4/spreadsheets/${WEEKLY_SHEETID}/values:batchGet?`+ranges.map(r=>`ranges=${r}`).join("&")+`&valueRenderOption=UNFORMATTED_VALUE&key=${API_KEY}`;
  const j=await fetchSafeJSON(url); const vr=j.valueRanges||[];
  const base=vr[0]?.values||[]; const toCol=v=>(v?.values||[]).map(r=>(r[0]??"").toString().trim());
  const d=toCol(vr[1]), f=toCol(vr[2]), h=toCol(vr[3]), jv=toCol(vr[4]), l=toCol(vr[5]), n=toCol(vr[6]), oT=toCol(vr[7]);
  const len=Math.max(base.length,d.length,f.length,h.length,jv.length,l.length,n.length,oT.length);
  const out=[];
  for(let i=0;i<len;i++){
    const id=normID(base[i]?.[0]??""); const name=(base[i]?.[1]??"").toString().trim();
    if(!id && !name) continue;
    out.push({ id,idKey:id, name, nameKey:normName(name),
      wed:parseInt(d[i]||0), thu:parseInt(f[i]||0), fri:parseInt(h[i]||0),
      sat:parseInt(jv[i]||0), mon:parseInt(l[i]||0), tue:parseInt(n[i]||0),
      total:parseInt(oT[i]||0), today:0 });
  }
  out.sort((a,b)=>(b.total||0)-(a.total||0));
  return out;
}
function fmtDailyTab(dt){ const m=new Intl.DateTimeFormat('en-US',{month:'short',timeZone:TIMEZONE}).format(dt); const dd=new Intl.DateTimeFormat('en-US',{day:'2-digit',timeZone:TIMEZONE}).format(dt); return `${m} ${dd}`; }
function getDailyTabCandidates(){
  const url=new URL(window.location.href); const o=url.searchParams.get('dailyTab'); if(o) return [o];
  const now=getLocalDate(); const y=new Date(now.getTime()-86400000); return [fmtDailyTab(now), fmtDailyTab(y)];
}
async function readDailyApproved(){
  const rangesFor=tab=>([`${tab}!A2:A70`,`${tab}!B2:B70`,`${tab}!C2:C70`,`${tab}!E2:E70`,`${tab}!F2:F70`,`${tab}!G2:G70`].map(encodeURIComponent));
  const tabs=getDailyTabCandidates();
  const DAILY_IDS=[DAILY_ID_RAW];
  for(const id of DAILY_IDS){
    for(const tab of tabs){
      const url=`https://sheets.googleapis.com/v4/spreadsheets/${id}/values:batchGet?`+rangesFor(tab).map(r=>`ranges=${r}`).join("&")+`&valueRenderOption=UNFORMATTED_VALUE&key=${API_KEY}`;
      try{
        const j=await fetchSafeJSON(url); const vr=j.valueRanges||[];
        const A=vr[0]?.values||[], B=vr[1]?.values||[], C=vr[2]?.values||[];
        const E=vr[3]?.values||[], F=vr[4]?.values||[], G=vr[5]?.values||[];
        const mapByName=new Map(); const mapByID=new Map();
        function addPair(nmCell,idCell,valCell){
          const nm=(nmCell?.[0]??"").toString(); const id=(idCell?.[0]??"").toString().trim(); const v=parseInt((valCell?.[0]??0))||0;
          if(nm.trim()){ const nk=normName(nm); mapByName.set(nk,(mapByName.get(nk)||0)+v); }
          if(id){ mapByID.set(id,(mapByID.get(id)||0)+v); }
        }
        const rowsFK=Math.max(A.length,B.length,C.length); for(let i=0;i<rowsFK;i++) addPair(A[i],B[i],C[i]);
        const rowsRG=Math.max(E.length,F.length,G.length); for(let i=0;i<rowsRG;i++) addPair(E[i],F[i],G[i]);
        return {id, tab, mapByName, mapByID};
      }catch(e){ /* intenta siguiente tab */ }
    }
  }
  return {id:DAILY_IDS[0], tab:tabs[0], mapByName:new Map(), mapByID:new Map()};
}

function updateTotalDisplay(total){
  document.getElementById('totalTodayValue').textContent = total.toLocaleString('en-US');
}

function renderList(list){
  const tbody=document.querySelector("#tbl tbody"); tbody.innerHTML="";
  
  const maxToday=Math.max(1, ...list.map(p=>p.today||0)); 
  const maxTotal=Math.max(1, ...list.map(p=>p.total||0));
  // Ajustamos toPct para que no sea tan suave, pasos de 10%
  const toPct=(v,max)=>{
      let pct = Math.max(5, Math.min(100, Math.round((v/max)*100)));
      return Math.floor(pct / 10) * 10; // Redondear a decenas para efecto escalonado
  };
  
  list.forEach((p,i)=>{
    const rowIndex=i;
    const today=p.today||0, total=p.total||0;

    // ===== CAMBIO A MEDALLAS PIXELADAS (DIVS CUADRADOS) =====
    let medalHTML='';
    if (rowIndex===0) medalHTML = `<div class="medal-block medal-gold">1ST</div>`;
    else if (rowIndex===1) medalHTML = `<div class="medal-block medal-silver">2ND</div>`;
    else if (rowIndex===2) medalHTML = `<div class="medal-block medal-bronze">3RD</div>`;

    const tr=document.createElement('tr');
    tr.innerHTML = `
      <td class="col-rank">
        <div class="rankwrap">
          ${medalHTML}
          ${rowIndex > 2 ? `<span>${rowIndex+1}</span>` : ''}
        </div>
      </td>
      <td class="col-agent">
        <div class="agent-wrap">
          <div class="name" title="${p.name}">${p.name}</div>
        </div>
      </td>
      <td class="col-today">
        <div class="bar today">
          <div class="fill" style="width:0%"></div>
          <div class="value">${today}</div>
        </div>
      </td>
      <td class="col-day">${p.wed||0}</td>
      <td class="col-day">${p.thu||0}</td>
      <td class="col-day">${p.fri||0}</td>
      <td class="col-day">${p.sat||0}</td>
      <td class="col-day">${p.mon||0}</td>
      <td class="col-day">${p.tue||0}</td>
      <td class="col-total">
        <div class="bar total">
          <div class="fill" style="width:0%"></div>
          <div class="value">${total}</div>
        </div>
      </td>
    `;
    tbody.appendChild(tr);

    // Animación de barras (con steps() en el CSS para efecto retro)
    setTimeout(()=>{
      tr.querySelector('.bar.today > .fill').style.width = toPct(today, maxToday) + '%';
      tr.querySelector('.bar.total > .fill').style.width = toPct(total, maxTotal) + '%';
    }, 50);
  });
}

async function updateData(){
  diag('SCANNING DATA...', 'pulse');
  const weeklyTab=computeWeeklyTabName();
  setChipWeekly(weeklyTab);

  const [weeklyData, dailyData] = await Promise.all([
    readWeeklyTab(weeklyTab),
    readDailyApproved()
  ]);
  
  setChipDaily(dailyData.tab);
  
  const tempMap = new Map();
  weeklyData.forEach(p => tempMap.set(p.idKey, p));
  
  dailyData.mapByName.forEach((score, nameKey) => {
    let agent = weeklyData.find(p => p.nameKey === nameKey);
    if (agent) agent.today = score;
  });
  
  dailyData.mapByID.forEach((score, idKey) => {
    let agent = tempMap.get(idKey);
    if (agent) agent.today = score;
  });

  weeklyData.sort((a, b) => {
    if ((b.today || 0) !== (a.today || 0)) return (b.today || 0) - (a.today || 0);
    const totalA = (a.total||0) + (a.today||0);
    const totalB = (b.total||0) + (b.today||0);
    return totalB - totalA;
  });

  ALL_DATA = weeklyData.filter((p, i) => i < 3 || (p.total||0) > 0 || (p.today||0) > 0);
  
  const totalToday = ALL_DATA.reduce((sum, p) => sum + (p.today || 0), 0);
  updateTotalDisplay(totalToday);

  diag(`SYSTEM UPDATED: ${new Date().toLocaleTimeString('en-US', {timeZone: TIMEZONE, hour12: false})}`);
}

(async function init(){
  await updateData();
  renderList(ALL_DATA); 
  setInterval(updateData, DAILY_REFRESH); 
})();
</script>
</body>
</html>
