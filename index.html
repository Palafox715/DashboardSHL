<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Shoreline — Monthly Dashboard</title>
<style>
  :root {
    --bg-dark: #0b0c10;
    --panel-dark: rgba(31, 40, 51, 0.85); /* Ligeramente transparente para ver las partículas detrás */
    --text-main: #c5c6c7;
    --text-light: #ffffff;
    --neon-green: #00ffcc;
    --neon-orange: #ff4500;
  }

  body {
    margin: 0;
    font-family: "Inter", system-ui, sans-serif;
    background: var(--bg-dark);
    color: var(--text-main);
    overflow-x: hidden;
    overflow-y: auto;
  }

  /* ===== El Campo de Batalla (Canvas Background) ===== */
  #battlefield {
    position: fixed;
    top: 0;
    left: 0;
    width: 100vw;
    height: 100vh;
    z-index: -1; /* Mantiene las partículas detrás del texto y paneles */
    pointer-events: none; /* Permite hacer clic a través del canvas */
  }

  header {
    text-align: center;
    padding: 1rem 0 0.5rem 0;
    position: relative;
    z-index: 10;
  }

  h1 {
    font-size: 2.4rem;
    font-weight: 800;
    margin-bottom: 0.3rem;
    color: var(--text-light);
    text-shadow: 0 0 10px rgba(255, 255, 255, 0.2);
  }

  /* ===== Barra de Conquista ===== */
  .supremacy-wrapper {
    position: relative;
    width: 80%;
    height: 45px;
    margin: 1.5rem auto;
    background: #111;
    border-radius: 8px;
    border: 2px solid #333;
    display: flex;
    overflow: hidden;
    box-shadow: 0 0 20px rgba(0, 0, 0, 0.8) inset, 0 5px 15px rgba(0,0,0,0.5);
  }

  .supremacy-side {
    height: 100%;
    transition: width 0.8s cubic-bezier(0.25, 1, 0.5, 1);
    display: flex;
    align-items: center;
    position: relative;
  }

  .team-javi-bar {
    width: 50%;
    background: linear-gradient(90deg, rgba(0,255,204,0.2) 0%, rgba(0,255,204,0.8) 100%);
    box-shadow: inset -5px 0 15px var(--neon-green);
  }

  .team-ricky-bar {
    width: 50%;
    background: linear-gradient(270deg, rgba(255,69,0,0.2) 0%, rgba(255,69,0,0.8) 100%);
    box-shadow: inset 5px 0 15px var(--neon-orange);
  }

  .clash-point {
    position: absolute;
    top: -5px;
    bottom: -5px;
    width: 6px;
    background: #fff;
    box-shadow: 0 0 15px #fff, 0 0 30px #fff;
    transform: translateX(-50%);
    z-index: 10;
    transition: left 0.8s cubic-bezier(0.25, 1, 0.5, 1);
    left: 50%; 
  }

  .bar-labels {
    display: flex;
    justify-content: space-between;
    width: 80%;
    margin: 0.5rem auto 1.5rem auto;
    font-weight: 800;
    font-size: 1.2rem;
    text-transform: uppercase;
    letter-spacing: 1px;
  }

  #javi-label { color: var(--neon-green); text-shadow: 0 0 8px rgba(0, 255, 204, 0.5); }
  #ricky-label { color: var(--neon-orange); text-shadow: 0 0 8px rgba(255, 69, 0, 0.5); }

  /* ===== Dashboard ===== */
  .dashboard {
    display: flex;
    justify-content: center;
    align-items: flex-start;
    width: 90%;
    margin: 1rem auto 3rem auto;
    gap: 19rem;
    position: relative;
    z-index: 10;
  }

  .team {
    flex: 1;
    background: var(--panel-dark);
    backdrop-filter: blur(5px); /* Añade un efecto cristal mate a las tablas */
    border-radius: 46px;
    box-shadow: 0 10px 25px rgba(0,0,0,0.5);
    overflow: hidden;
    min-width: 580px;
    max-width: 840px;
    border: 1px solid rgba(255,255,255,0.1);
  }

  h2 {
    text-align: center;
    color: var(--neon-green);
    background: rgba(0, 255, 204, 0.1);
    padding: 0.8rem;
    font-size: 1.4rem;
    font-weight: 800;
    margin: 0;
    text-shadow: 0 0 5px var(--neon-green);
  }

  h2.orange {
    color: var(--neon-orange);
    background: rgba(255, 69, 0, 0.1);
    text-shadow: 0 0 5px var(--neon-orange);
  }

  table { width: 100%; border-collapse: collapse; text-align: center; font-size: 1.0rem; color: var(--text-main); }
  th, td { padding: 8px 10px; border-bottom: 1px solid #333; }
  th { background: rgba(0, 255, 204, 0.2); color: var(--neon-green); font-weight: 700; text-transform: uppercase; }
  .team.orange th { background: rgba(255, 69, 0, 0.2); color: var(--neon-orange); }
  tr:nth-child(even) td { background: rgba(255, 255, 255, 0.03); }
  .sum-row { background: #111; color: var(--text-light); font-weight: 700; }

  .totals-center {
    position: absolute;
    top: 30%;
    left: 50%;
    transform: translate(-50%, -55%);
    background: var(--panel-dark);
    backdrop-filter: blur(5px);
    border-radius: 65px;
    padding: 1.3rem 2.3rem;
    text-align: center;
    box-shadow: 0 8px 25px rgba(0,0,0,0.5);
    border: 2px solid rgba(255,255,255,0.1);
  }

  .totals-center h3 { margin: 0; font-size: 1.3rem; color: var(--text-light); }
  .totals-center span { display: block; font-size: 2.7rem; font-weight: 800; margin: 0.3rem 0; transition: all 0.3s ease-in-out; }
  .win { color: var(--neon-green); text-shadow: 0 0 10px var(--neon-green); }
  .lose { color: var(--neon-orange); opacity: 0.8; }
</style>
</head>
<body>

<canvas id="battlefield"></canvas>

<header>
  <h1>Shoreline Monthly Competition</h1>
  <div class="supremacy-wrapper">
    <div id="javi-bar" class="supremacy-side team-javi-bar"></div>
    <div id="ricky-bar" class="supremacy-side team-ricky-bar"></div>
    <div id="clash-indicator" class="clash-point"></div>
  </div>
  <div class="bar-labels">
    <span id="javi-label">🟢 Facción Javi: 0% (0)</span>
    <span id="ricky-label">🟠 Facción Ricky: 0% (0)</span>
  </div>
</header>

<div class="dashboard">
  <div class="team">
    <h2>🟢 Facción Javi</h2>
    <table id="table-javi">
      <thead><tr><th>Agent</th><th>ID</th><th>Cr Pull</th><th>Xfer</th><th>Total</th></tr></thead>
      <tbody></tbody>
      <tfoot><tr class="sum-row"><td colspan="2">TOTAL</td><td id="javi-cr">0</td><td id="javi-xf">0</td><td id="javi-total">0</td></tr></tfoot>
    </table>
  </div>
  <div class="totals-center" id="totals-center">
    <h3>XFER Totals</h3>
    <span id="javi-xfer-total">0</span>
    <span style="font-size:3.0rem;">VS</span>
    <span id="ricky-xfer-total">0</span>
  </div>
  <div class="team orange">
    <h2 class="orange">🟠 Facción Ricky</h2>
    <table id="table-ricky">
      <thead><tr><th>Agent</th><th>ID</th><th>Cr Pull</th><th>Xfer</th><th>Total</th></tr></thead>
      <tbody></tbody>
      <tfoot><tr class="sum-row"><td colspan="2">TOTAL</td><td id="ricky-cr">0</td><td id="ricky-xf">0</td><td id="ricky-total">0</td></tr></tfoot>
    </table>
  </div>
</div>

<script>
// ID DEL NUEVO ARCHIVO
const SHEET_ID = "1xNrDZ6uXUS0XMU3033SALOPPORgyjQomH68W2GyTAUo";
// AQUI DEBE PEGAR SU API KEY REAL
const API_KEY  = "AIzaSyCCBAapFj9Fd-8cOIfpDJxrOP__76zxAxM"; 
const TIMEZONE = "America/Tijuana";

// ==========================================
// MOTOR DE PARTÍCULAS / ENTIDADES
// ==========================================
const canvas = document.getElementById('battlefield');
const ctx = canvas.getContext('2d');
let width, height;
let currentDominancePct = 50; // Inicia en 50/50
let particles = [];

function resizeCanvas() {
  width = canvas.width = window.innerWidth;
  height = canvas.height = window.innerHeight;
}
window.addEventListener('resize', resizeCanvas);
resizeCanvas();

class Entity {
  constructor(id, name, team, xfer) {
    this.id = id;
    this.name = name;
    this.team = team;
    this.updateStats(xfer);
    
    // Nacer en posiciones aleatorias dentro de su territorio
    this.y = Math.random() * height;
    if (this.team === 'javi') {
      this.x = Math.random() * (width * (currentDominancePct/100));
    } else {
      this.x = (width * (currentDominancePct/100)) + Math.random() * (width * ((100-currentDominancePct)/100));
    }
    
    // Dirección aleatoria
    const angle = Math.random() * Math.PI * 2;
    this.vx = Math.cos(angle) * this.maxSpeed;
    this.vy = Math.sin(angle) * this.maxSpeed;
  }

  updateStats(xfer) {
    this.xfer = xfer;
    // Pragmatismo matemático: Radio base 3, crece un máximo de +15 dependiendo de los xfers
    this.radius = 3 + Math.min(xfer * 0.4, 15); 
    // Velocidad base 0.5, crece hasta +3 dependiendo de los xfers
    this.maxSpeed = 0.5 + Math.min(xfer * 0.1, 3);
  }

  update(wallX) {
    this.x += this.vx;
    this.y += this.vy;

    // Rebote en el techo y el suelo
    if (this.y - this.radius <= 0 || this.y + this.radius >= height) {
      this.vy *= -1;
      this.y = Math.max(this.radius, Math.min(this.y, height - this.radius));
    }

    // Lógica del muro de contención "Supremacy Wall"
    if (this.team === 'javi') {
      if (this.x - this.radius <= 0) { this.vx *= -1; this.x = this.radius; }
      if (this.x + this.radius >= wallX) { this.vx *= -1; this.x = wallX - this.radius; }
    } else {
      if (this.x + this.radius >= width) { this.vx *= -1; this.x = width - this.radius; }
      if (this.x - this.radius <= wallX) { this.vx *= -1; this.x = wallX + this.radius; }
    }
  }

  draw(ctx) {
    ctx.beginPath();
    ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
    
    if (this.team === 'javi') {
      ctx.fillStyle = '#00ffcc';
      ctx.shadowColor = '#00ffcc';
    } else {
      ctx.fillStyle = '#ff4500';
      ctx.shadowColor = '#ff4500';
    }
    
    ctx.shadowBlur = 10;
    ctx.fill();
    ctx.closePath();
    ctx.shadowBlur = 0; // Reset para no afectar otros dibujos
  }
}

function animate() {
  ctx.clearRect(0, 0, width, height);
  
  // Dibujar el muro invisible (opcional, una línea sutil)
  const wallX = width * (currentDominancePct / 100);
  ctx.beginPath();
  ctx.moveTo(wallX, 0);
  ctx.lineTo(wallX, height);
  ctx.strokeStyle = 'rgba(255,255,255,0.1)';
  ctx.lineWidth = 2;
  ctx.stroke();

  // Actualizar y dibujar todas las partículas
  particles.forEach(p => {
    p.update(wallX);
    p.draw(ctx);
  });

  requestAnimationFrame(animate);
}
animate(); // Iniciar el bucle de renderizado


// ==========================================
// LÓGICA DE EXTRACCIÓN DE DATOS
// ==========================================
function num(v) { const n = Number(String(v ?? "").replace(/,/g, "").trim()); return Number.isFinite(n) ? n : 0; }
function pad2(n) { return String(n).padStart(2, "0"); }
function nowTZ() { return new Date(new Date().toLocaleString("en-US", { timeZone: TIMEZONE })); }

function getCurrentWeekNumber() {
  const now = nowTZ();
  const firstJan = new Date(now.getFullYear(), 0, 1);
  const days = Math.floor((now - firstJan) / 86400000);
  let weekNum = Math.ceil((days + firstJan.getDay() + 1) / 7);
  if (weekNum < 1) weekNum = 1;
  if (weekNum > 53) weekNum = 53;
  return weekNum; 
}

async function fetchJSON(url, { tries = 4, baseDelay = 700 } = {}) {
  let lastErr;
  for (let i = 0; i < tries; i++) {
    try {
      const r = await fetch(url, { cache: "no-store" });
      const text = await r.text();
      if (r.ok) return JSON.parse(text);
      if (r.status === 429 || (r.status >= 500 && r.status < 600)) {
        await new Promise(res => setTimeout(res, baseDelay * Math.pow(2, i) + Math.random() * 250));
        continue;
      }
      throw new Error(`HTTP ${r.status}`);
    } catch (e) {
      lastErr = e;
      await new Promise(res => setTimeout(res, baseDelay * Math.pow(2, i) + Math.random() * 250));
    }
  }
  throw lastErr;
}

async function listSheetTitles() {
  const cache = window.__tabsCache;
  if (cache && (Date.now() - cache.at) < 600000) return cache.titles;
  const url = `https://sheets.googleapis.com/v4/spreadsheets/${SHEET_ID}?fields=sheets(properties(title))&key=${API_KEY}`;
  const j = await fetchJSON(url);
  const titles = (j.sheets || []).map(s => s?.properties?.title).filter(Boolean);
  window.__tabsCache = { at: Date.now(), titles };
  return titles;
}

function extractW(title) {
  const m = /^W(\d{1,2})$/.exec(title.trim());
  if (!m) return null;
  return { n: Number(m[1]), title, normalized: `W${pad2(Number(m[1]))}` };
}

async function sheetValues(rangeA1) {
  const url = `https://sheets.googleapis.com/v4/spreadsheets/${SHEET_ID}/values/${encodeURIComponent(rangeA1)}?valueRenderOption=UNFORMATTED_VALUE&key=${API_KEY}`;
  const j = await fetchJSON(url);
  return j.values || [];
}

function tryParseDate(value) {
  if (value == null) return null;
  const s = String(value).trim();
  if (!s) return null;
  const d1 = new Date(s);
  if (Number.isFinite(d1.getTime())) return d1;
  const n = Number(s);
  if (Number.isFinite(n) && n > 20000 && n < 90000) {
    const base = new Date(Date.UTC(1899, 11, 30));
    return new Date(base.getTime() + n * 86400000);
  }
  return null;
}

async function getWeekTabMonthKey(tabTitle) {
  window.__wkMonth = window.__wkMonth || new Map();
  if (window.__wkMonth.has(tabTitle)) return window.__wkMonth.get(tabTitle);
  const header = await sheetValues(`${tabTitle}!A1:T2`);
  let found = null;
  for (const row of header) {
    for (const cell of row) {
      const d = tryParseDate(cell);
      if (d) { found = d; break; }
    }
    if (found) break;
  }
  const key = found ? `${found.getFullYear()}-${pad2(found.getMonth() + 1)}` : null;
  window.__wkMonth.set(tabTitle, key);
  return key;
}

async function getActiveWeeklyTabsForCurrentMonth() {
  const titles = await listSheetTitles();
  const weekTabs = titles.map(extractW).filter(Boolean);
  if (!weekTabs.length) throw new Error('Sin tabs semanales.');
  const currentWeek = getCurrentWeekNumber();
  const candidates = weekTabs.filter(w => w.n >= 1 && w.n <= currentWeek).map(w => w.title);
  const baseCandidates = candidates.length ? candidates : weekTabs.map(w => w.title);
  const now = nowTZ();
  const monthKeyNow = `${now.getFullYear()}-${pad2(now.getMonth() + 1)}`;
  const monthTabs = [];
  for (const t of baseCandidates.sort()) {
    const mk = await getWeekTabMonthKey(t);
    if (mk && mk === monthKeyNow) monthTabs.push(t);
  }
  if (!monthTabs.length) {
    const best = baseCandidates.map(extractW).filter(Boolean).sort((a,b)=>b.n-a.n)[0];
    return { tabs: [best?.title || baseCandidates[0]], mode: "fallback", monthKeyNow };
  }
  return { tabs: monthTabs, mode: "month-sum", monthKeyNow };
}

async function loadData() {
  try {
    // Obtenemos las pestañas semanales activas
    const { tabs } = await getActiveWeeklyTabsForCurrentMonth();
    
    // Mapas independientes para cada equipo
    const mapJavi = new Map();
    const mapRicky = new Map();

    for (const weeklyTab of tabs) {
      // Extendemos el rango a Z para cubrir ambas tablas horizontales
      const dataRange = `${weeklyTab}!A1:Z150`; 
      const dataValues = (await fetchJSON(`https://sheets.googleapis.com/v4/spreadsheets/${SHEET_ID}/values/${encodeURIComponent(dataRange)}?valueRenderOption=UNFORMATTED_VALUE&key=${API_KEY}`)).values || [];
      
      if (dataValues.length < 3) continue;

      const headers1 = dataValues[0] || []; // Fila 1: "Javi", "Ricky"
      const headers2 = dataValues[1] || []; // Fila 2: "AGENT NAME", "ID", etc.

      // 1. Encontrar dónde empieza la zona de cada equipo dinámicamente
      let javiStartIndex = -1, rickyStartIndex = -1;
      headers1.forEach((h, i) => {
        const txt = String(h).toUpperCase().trim();
        if (txt.includes("JAVI")) javiStartIndex = i;
        if (txt.includes("RICKY")) rickyStartIndex = i;
      });

      // Fallbacks por si alguien borra los títulos de la Fila 1 (basado en su imagen)
      if (javiStartIndex === -1) javiStartIndex = 0;   // Asume Col A
      if (rickyStartIndex === -1) rickyStartIndex = 9; // Asume Col J

      // Función auxiliar para mapear índices de columnas en un rango específico
      function getCols(startIdx, endIdx) {
        let cols = { name: -1, id: -1, cr: -1, xf: -1 };
        for(let i = startIdx; i < endIdx; i++) {
          const h = String(headers2[i] || "").toUpperCase().trim();
          if (h.includes("AGENT NAME")) cols.name = i;
          if (h === "ID") cols.id = i;
          if (h === "CRPULL") cols.cr = i;
          if (h === "XFER") cols.xf = i;
        }
        return cols;
      }

      // Definir los límites de búsqueda de columnas para cada equipo
      const limitJavi = rickyStartIndex > javiStartIndex ? rickyStartIndex : headers2.length;
      const javiCols = getCols(javiStartIndex, limitJavi);
      const rickyCols = getCols(rickyStartIndex, headers2.length);

      // 2. Extraer los datos fila por fila
      dataValues.slice(2).forEach(row => {
        // --- Procesar datos de Facción Javi ---
        if (javiCols.id !== -1 && row[javiCols.id]) {
          const id = String(row[javiCols.id]).trim();
          if (id) {
            const name = String(row[javiCols.name] || "Unknown").trim();
            const cr = num(row[javiCols.cr]);
            const xf = num(row[javiCols.xf]);
            const prev = mapJavi.get(id) || { name, id, team: "javi", cr: 0, xf: 0, total: 0 };
            prev.cr += cr; prev.xf += xf; prev.total += (cr + xf);
            mapJavi.set(id, prev);
          }
        }

        // --- Procesar datos de Facción Ricky ---
        if (rickyCols.id !== -1 && row[rickyCols.id]) {
          const id = String(row[rickyCols.id]).trim();
          if (id) {
            const name = String(row[rickyCols.name] || "Unknown").trim();
            const cr = num(row[rickyCols.cr]);
            const xf = num(row[rickyCols.xf]);
            const prev = mapRicky.get(id) || { name, id, team: "ricky", cr: 0, xf: 0, total: 0 };
            prev.cr += cr; prev.xf += xf; prev.total += (cr + xf);
            mapRicky.set(id, prev);
          }
        }
      });
    }

    // Limpiar tablas en el Dashboard
    const javiBody = document.querySelector("#table-javi tbody");
    const rickyBody = document.querySelector("#table-ricky tbody");
    javiBody.innerHTML = rickyBody.innerHTML = "";

    // Convertir mapas a arreglos
    const javiArr = Array.from(mapJavi.values());
    const rickyArr = Array.from(mapRicky.values());

    // 3. Sincronizar las partículas en el canvas
    const allAgents = [...javiArr, ...rickyArr];
    allAgents.forEach(agent => {
      let existingParticle = particles.find(p => p.id === agent.id);
      if (existingParticle) {
        // Actualizamos stats. Si el agente cambió de equipo, forzamos la actualización visual (opcional pero recomendado)
        existingParticle.team = agent.team; 
        existingParticle.updateStats(agent.xf);
      } else {
        particles.push(new Entity(agent.id, agent.name, agent.team, agent.xf));
      }
    });

    // 4. Ordenar por totales y renderizar
    javiArr.sort((a,b)=> b.total - a.total);
    rickyArr.sort((a,b)=> b.total - a.total);

    let jCr=0, jXf=0, jTot=0, rCr=0, rXf=0, rTot=0;

    javiArr.forEach(d=>{
      jCr += d.cr; jXf += d.xf; jTot += d.total;
      javiBody.insertAdjacentHTML("beforeend", `<tr><td>${d.name}</td><td>${d.id}</td><td>${d.cr}</td><td>${d.xf}</td><td>${d.total}</td></tr>`);
    });

    rickyArr.forEach(d=>{
      rCr += d.cr; rXf += d.xf; rTot += d.total;
      rickyBody.insertAdjacentHTML("beforeend", `<tr><td>${d.name}</td><td>${d.id}</td><td>${d.cr}</td><td>${d.xf}</td><td>${d.total}</td></tr>`);
    });

    // 5. Actualizar la UI (Totales y Barra de Supremacía)
    document.getElementById("javi-cr").textContent = jCr; document.getElementById("javi-xf").textContent = jXf; document.getElementById("javi-total").textContent = jTot;
    document.getElementById("ricky-cr").textContent = rCr; document.getElementById("ricky-xf").textContent = rXf; document.getElementById("ricky-total").textContent = rTot;

    const totalXfer = (jXf + rXf) > 0 ? (jXf + rXf) : 1; 
    const javiDomination = (jXf / totalXfer) * 100;
    const rickyDomination  = (rXf / totalXfer) * 100;
    
    currentDominancePct = javiDomination; // Variable global para el muro

    document.getElementById("javi-bar").style.width = `${javiDomination}%`;
    document.getElementById("ricky-bar").style.width = `${rickyDomination}%`;
    document.getElementById("clash-indicator").style.left = `${javiDomination}%`;

    document.getElementById("javi-label").textContent = `🟢 Facción Javi: ${javiDomination.toFixed(1)}% (${jXf} XFER)`;
    document.getElementById("ricky-label").textContent = `🟠 Facción Ricky: ${rickyDomination.toFixed(1)}% (${rXf} XFER)`;

    const javiBox = document.getElementById("javi-xfer-total");
    const rickyBox = document.getElementById("ricky-xfer-total");
    javiBox.textContent = jXf; rickyBox.textContent = rXf;

    javiBox.classList.remove("win","lose"); rickyBox.classList.remove("win","lose");
    if (jXf > rXf){ javiBox.classList.add("win"); rickyBox.classList.add("lose"); }
    else if (rXf > jXf){ rickyBox.classList.add("win"); javiBox.classList.add("lose"); }

  } catch (err) {
    console.error("❌ Error al cargar los datos:", err);
  }
}

loadData();
setInterval(loadData, 60000);
</script>
</body>
</html>
