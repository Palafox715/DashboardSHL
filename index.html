<!DOCTYPE html>
<html lang='es'>
<head>
<meta charset='utf-8'/>
<meta name='viewport' content='width=device-width, initial-scale=1'/>
<title>Leaderboard — Guardian Protocol: Team Elite</title>
<style>
  :root{
    --vh: 1vh;
    --dark-bg: #0A0A0A;
    --ink:#E0E0E0;
    --glass: rgba(0,0,0, .6);
    --glass-strong: rgba(0,0,0, .85);
    --neon-blue: #44CCFF;
    --neon-purple: #FF44CC;
    --neon-red: #FF4444;
    --neon-yellow: #FFDD44;
    --neon-green: #44FF88;
    --neon-white: #FFFFFF;
  }
  
  html,body{ margin:0; min-height:100%; width:100%; background:var(--dark-bg); color:var(--ink); font-family:system-ui,-apple-system,sans-serif; overflow: hidden; }

  /* FONDO MATRIX */
  #matrix-canvas { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: -2; opacity: 0.12; pointer-events: none; }
  body::before, body::after{ content:""; position:fixed; inset:-20%; background: radial-gradient(40% 40% at 20% 20%, var(--glow-blue), transparent), radial-gradient(30% 30% at 50% 90%, var(--glow-purple), transparent); z-index:-1; pointer-events:none; mix-blend-mode:lighten; animation:float 22s linear infinite; }
  @keyframes float{ 0%, 100%{transform:translate3d(0,0,0)} 50%{transform:translate3d(2%, -2%, 0)} }

  /* DASHBOARD CENTRAL */
  #board{ position:relative; z-index:1; width:100vw; height: 100vh; padding:calc(1.2*var(--vh)) calc(1.6*var(--vh)); box-sizing:border-box; display:flex;flex-direction:column;gap:calc(0.8*var(--vh)); max-width: 1200px; margin: 0 auto; overflow-y: auto; padding-bottom: 150px; }
  .top-header-flex{ display: flex; justify-content: space-between; align-items: center; }
  #dailyTotalDisplay{ background: var(--glass-strong); padding: 8px 16px; border-radius: 10px; border: 1px solid var(--neon-blue); text-align: right; }
  #dailyTotalDisplay .value{ font-size: 24px; font-weight: 900; color: var(--neon-blue); }
  .table-wrap{ flex:1; overflow-x: auto; background: var(--glass); border-radius: 12px; border: 1px solid rgba(255,255,255,0.05); }
  table{ width:100%; border-collapse:separate; border-spacing:0 8px; table-layout:fixed; }
  thead th{ background:var(--glass-strong); text-transform:uppercase; font-size:12px; padding:10px; }
  tbody td{ padding:10px; text-align:center; border-top:1px solid rgba(255,255,255,0.05); }
  .bar{ position:relative; height:18px; border-radius:10px; background:rgba(255,255,255,0.1); overflow:hidden; }
  .bar > .fill{ position:absolute; left:0; top:0; bottom:0; width:0%; transition: width 0.8s ease; }
  .bar.today > .fill{ background: var(--neon-blue); }
  .bar.total > .fill{ background: var(--neon-purple); }

  /* DOCK DEL EQUIPO */
  #team-dock { position: fixed; bottom: 30px; left: 30px; z-index: 95; display: flex; gap: 10px; background: var(--glass-strong); padding: 10px 15px; border-radius: 15px; border: 1px solid rgba(255,255,255,0.1); backdrop-filter: blur(10px); }
  .team-slot { width: 50px; height: 50px; border-radius: 50%; background: rgba(0,0,0,0.5); border: 2px dashed rgba(255,255,255,0.2); display: flex; justify-content: center; align-items: center; overflow: hidden; transition: 0.3s; cursor: pointer; }
  .team-slot.filled { border-style: solid; border-color: var(--neon-yellow); box-shadow: 0 0 15px rgba(255,221,68,0.3); }
  .team-slot.active-slot { border-color: var(--neon-blue); box-shadow: 0 0 20px var(--neon-blue); transform: scale(1.1); }
  .team-slot img { width: 85%; height: 85%; object-fit: contain; }

  /* OVERLAYS */
  .overlay-screen { position: fixed; inset: 0; background: radial-gradient(circle, rgba(10,10,30,0.98), #000); z-index: 10000; display: none; flex-direction: column; justify-content: center; align-items: center; text-align: center; }
  .starter-grid { display: flex; gap: 20px; flex-wrap: wrap; justify-content: center; max-width: 900px; padding: 20px; }
  .starter-card { background: var(--glass-strong); border: 1px solid rgba(255,255,255,0.1); border-radius: 15px; padding: 15px; width: 130px; cursor: pointer; transition: 0.3s; }
  .starter-card:hover { border-color: var(--neon-blue); transform: translateY(-5px); }
  .s-img { width: 70px; height: 70px; background-size: contain; background-repeat: no-repeat; background-position: center; margin-bottom: 10px; }

  /* CELEBRACIÓN EQUIPO COMPLETO */
  .celebration-grid { display: flex; gap: 20px; margin: 40px 0; }
  .celeb-member { display: flex; flex-direction: column; align-items: center; }
  .celeb-img { width: 120px; height: 120px; background-size: contain; background-repeat: no-repeat; background-position: center; filter: drop-shadow(0 0 15px rgba(255,255,255,0.5)); }

  /* GUARDIÁN */
  #guardian-area { position: fixed; bottom: 0; left: 0; width: 100vw; height: 100vh; z-index: 90; pointer-events: none; }
  #guardian-wrapper { position: absolute; bottom: 20px; left: 50%; pointer-events: none; transition: width 0.8s, height 0.8s; }
  #guardian-sprite { width: 100%; height: 100%; pointer-events: auto; cursor: pointer; background-size: contain; background-position: center; background-repeat: no-repeat; }
  #guardian-hud { position: fixed; bottom: 20px; right: 30px; z-index: 95; background: var(--glass-strong); padding: 15px; border-radius: 12px; border: 1px solid rgba(255,255,255,0.3); display: none; width: 240px; }

  /* MINERÍA */
  .rift-overlay { position: fixed; top: 0; bottom: 0; width: 200px; z-index: 50; pointer-events: none; }
  #rift-left { left: 0; background: linear-gradient(to right, rgba(0,0,0,0.9), transparent); }
  #rift-right { right: 0; background: linear-gradient(to left, rgba(0,0,0,0.9), transparent); }
  .crystal-node { position: absolute; width: 60px; height: 70px; background-size: contain; background-position: center; background-repeat: no-repeat; transition: all 0.4s; opacity: 0.1; }
  .crystal-node.ready { opacity: 1; cursor: pointer; pointer-events: auto; animation: levitate-neon-pulse 2s infinite alternate; }
  @keyframes levitate-neon-pulse { 0% { transform: scale(1); filter: brightness(1); } 100% { transform: scale(1.1); filter: brightness(1.5) drop-shadow(0 0 10px var(--node-color)); } }
</style>
</head>
<body>

<div id="evo-flash" style="position:fixed; inset:0; background:white; z-index:100001; opacity:0; pointer-events:none; transition:opacity 0.5s;"></div>
<canvas id="matrix-canvas"></canvas>

<div id="starter-selection" class="overlay-screen">
    <div class="starter-title">INCUBADORA DE DATOS</div>
    <div class="starter-grid" id="starter-grid-container"></div>
    <button class="btn-vic" style="margin-top:20px; background:none; border:1px solid gray; color:gray;" onclick="closeStarterSelection()">CANCELAR (ESC)</button>
</div>

<div id="victory-screen" class="overlay-screen">
    <div style="position: absolute; width: 200vw; height: 200vw; background: repeating-conic-gradient(from 0deg, transparent 0deg 15deg, rgba(255,221,68,0.1) 15deg 30deg); animation: spin-rays 20s linear infinite; z-index: -1;"></div>
    <div class="starter-title" style="color:var(--neon-yellow)">¡EVOLUCIÓN MÁXIMA!</div>
    <div id="vic-img" style="width:200px; height:200px; background-size:contain; background-repeat:no-repeat; background-position:center; filter:drop-shadow(0 0 30px #FFF);"></div>
    <div id="vic-name" style="font-size: 30px; font-weight: 900; margin-bottom: 20px; color:white; text-transform:uppercase;">NOM</div>
    <button class="btn-vic" style="background:var(--neon-blue); border:none; padding:15px 30px; font-weight:900; border-radius:10px; cursor:pointer;" onclick="closeVictoryScreen()">RECLAMAR Y VOLVER (ESC)</button>
</div>

<div id="team-celebration" class="overlay-screen">
    <div class="starter-title" style="color:var(--neon-green)">¡HALL OF FAME COMPLETO!</div>
    <div class="celebration-grid" id="celeb-grid"></div>
    <button class="btn-vic" style="background:var(--neon-yellow); color:#000; border:none; padding:15px 40px; font-weight:900; border-radius:10px; cursor:pointer;" onclick="closeCelebration()">CONTINUAR OPERACIONES</button>
</div>

<div id="team-dock">
    <div style="position:absolute; top:-18px; left:10px; font-size:9px; color:var(--neon-blue); font-weight:bold;">HALL OF FAME</div>
    <div class="team-slot" id="ts-0" onclick="switchGuardian(0)"></div><div class="team-slot" id="ts-1" onclick="switchGuardian(1)"></div>
    <div class="team-slot" id="ts-2" onclick="switchGuardian(2)"></div><div class="team-slot" id="ts-3" onclick="switchGuardian(3)"></div>
    <div class="team-slot" id="ts-4" onclick="switchGuardian(4)"></div><div class="team-slot" id="ts-5" onclick="switchGuardian(5)"></div>
</div>

<div id="guardian-hud">
    <div class="g-header"><div class="g-title" id="g-name-display">Huevo</div><div class="g-level" id="g-lvl-display">Lv. 1</div></div>
    <div style="font-size:9px; margin-bottom:4px; opacity:0.6;">SATISFACCIÓN</div>
    <div class="bar-bg"><div class="sat-fill" id="g-sat-fill"></div></div>
    <div style="font-size:9px; margin-bottom:4px; opacity:0.6;">EXPERIENCIA</div>
    <div class="bar-bg"><div class="exp-fill" id="g-exp-fill"></div></div>
    <button class="g-btn" id="btn-feed" onclick="feedGuardian()"><span>🥩 Alimentar</span> <span style="color:var(--neon-purple)">500 pts</span></button>
    <button class="g-btn" id="btn-train" onclick="trainGuardian()"><span id="txt-train">⚔️ Entrenar</span> <span id="cost-train" style="color:var(--neon-purple)">1500 pts</span></button>
    <button class="g-btn" style="border-color:var(--neon-blue); margin-top:10px; justify-content:center;" onclick="openStarterSelection()">🔄 Cambiar / Reclutar</button>
    <button class="g-btn" style="border:none; color:#888; justify-content:center;" onclick="toggleGuardianMenu()">Cerrar Panel</button>
</div>

<div id="vault-hud"><div class="vault-title">BÓVEDA LOCAL</div><div id="vault-score" class="vault-score">0</div></div>

<div id="guardian-area"><div id="guardian-wrapper"><div id="guardian-sprite" onclick="toggleGuardianMenu()"></div></div></div>

<div id="rift-left" class="rift-overlay"></div><div id="rift-right" class="rift-overlay"></div>

<div id='board'>
  <div class='top-header-flex'><h2 style="margin:0; font-size: 28px;">🏁 Leaderboard</h2><div id='dailyTotalDisplay'><div class='value' id='totalTodayValue'>0</div></div></div>
  <div class='table-wrap'><table id='tbl'><thead><tr><th>#</th><th style="text-align:left">Agent</th><th>Today</th><th>Total</th></tr></thead><tbody></tbody></table></div>
</div>

<script>
/* --- BASE DE DATOS UNIFICADA (27 POKÉMON) --- */
const EGG_IMG = "https://archives.bulbagarden.net/media/upload/0/06/HOMEEgg.png";
const POKEDEX_DB = {
  "fire": { baseName: "Charmander", color: "#FF4444", stages: [
    { minLevel: 3, name: "Charmander", size: 60, speed: 1.2, type: "Fuego", imgF: "https://img.pokemondb.net/sprites/black-white/anim/normal/charmander.gif", imgB: "https://img.pokemondb.net/sprites/black-white/anim/back-normal/charmander.gif" },
    { minLevel: 7, name: "Charmeleon", size: 120, speed: 2.2, type: "Fuego Feroz", imgF: "https://img.pokemondb.net/sprites/black-white/anim/normal/charmeleon.gif", imgB: "https://img.pokemondb.net/sprites/black-white/anim/back-normal/charmeleon.gif" },
    { minLevel: 12, name: "Charizard", size: 240, speed: 3.8, type: "Fuego/Volador", imgF: "https://img.pokemondb.net/sprites/black-white/anim/normal/charizard.gif", imgB: "https://img.pokemondb.net/sprites/black-white/anim/back-normal/charizard.gif" }
  ]},
  "water": { baseName: "Squirtle", color: "#44CCFF", stages: [
    { minLevel: 3, name: "Squirtle", size: 60, speed: 1.2, type: "Agua", imgF: "https://img.pokemondb.net/sprites/black-white/anim/normal/squirtle.gif", imgB: "https://img.pokemondb.net/sprites/black-white/anim/back-normal/squirtle.gif" },
    { minLevel: 7, name: "Wartortle", size: 120, speed: 2.2, type: "Agua", imgF: "https://img.pokemondb.net/sprites/black-white/anim/normal/wartortle.gif", imgB: "https://img.pokemondb.net/sprites/black-white/anim/back-normal/wartortle.gif" },
    { minLevel: 12, name: "Blastoise", size: 240, speed: 3.8, type: "Agua Pesada", imgF: "https://img.pokemondb.net/sprites/black-white/anim/normal/blastoise.gif", imgB: "https://img.pokemondb.net/sprites/black-white/anim/back-normal/blastoise.gif" }
  ]},
  "grass": { baseName: "Bulbasaur", color: "#44FF88", stages: [
    { minLevel: 3, name: "Bulbasaur", size: 60, speed: 1.2, type: "Planta", imgF: "https://img.pokemondb.net/sprites/black-white/anim/normal/bulbasaur.gif", imgB: "https://img.pokemondb.net/sprites/black-white/anim/back-normal/bulbasaur.gif" },
    { minLevel: 7, name: "Ivysaur", size: 120, speed: 2.2, type: "Planta", imgF: "https://img.pokemondb.net/sprites/black-white/anim/normal/ivysaur.gif", imgB: "https://img.pokemondb.net/sprites/black-white/anim/back-normal/ivysaur.gif" },
    { minLevel: 12, name: "Venusaur", size: 240, speed: 3.8, type: "Planta Colosal", imgF: "https://img.pokemondb.net/sprites/black-white/anim/normal/venusaur.gif", imgB: "https://img.pokemondb.net/sprites/black-white/anim/back-normal/venusaur.gif" }
  ]},
  "bug": { baseName: "Caterpie", color: "#AABB22", stages: [
    { minLevel: 3, name: "Caterpie", size: 60, speed: 1, type: "Bicho", imgF: "https://projectpokemon.org/images/normal-sprite/caterpie.gif", imgB: "https://projectpokemon.org/images/sprites-models/normal-back/caterpie.gif" },
    { minLevel: 7, name: "Metapod", size: 100, speed: 0.5, type: "Bicho", imgF: "https://projectpokemon.org/images/normal-sprite/metapod.gif", imgB: "https://projectpokemon.org/images/sprites-models/normal-back/metapod.gif" },
    { minLevel: 12, name: "Butterfree", size: 200, speed: 3.5, type: "Bicho/Volador", imgF: "https://projectpokemon.org/images/normal-sprite/butterfree.gif", imgB: "https://projectpokemon.org/images/sprites-models/normal-back/butterfree.gif" }
  ]},
  "electric": { baseName: "Pikachu", color: "#FFDD44", stages: [
    { minLevel: 3, name: "Pikachu", size: 80, speed: 2, type: "Eléctrico", imgF: "https://projectpokemon.org/images/normal-sprite/pikachu.gif", imgB: "https://projectpokemon.org/images/sprites-models/normal-back/pikachu.gif" },
    { minLevel: 12, name: "Raichu", size: 140, speed: 3, type: "Eléctrico", imgF: "https://projectpokemon.org/images/normal-sprite/raichu.gif", imgB: "https://projectpokemon.org/images/sprites-models/normal-back/raichu.gif" }
  ]},
  "normal": { baseName: "Snorlax", color: "#336688", stages: [
    { minLevel: 3, name: "Snorlax", size: 260, speed: 0.3, type: "Normal", imgF: "https://projectpokemon.org/images/normal-sprite/snorlax.gif", imgB: "https://projectpokemon.org/images/sprites-models/normal-back/snorlax.gif" }
  ]},
  "psychic": { baseName: "Abra", color: "#FFCC44", stages: [
    { minLevel: 3, name: "Abra", size: 60, speed: 1.5, type: "Psíquico", imgF: "https://projectpokemon.org/images/normal-sprite/abra.gif", imgB: "https://projectpokemon.org/images/sprites-models/normal-back/abra.gif" },
    { minLevel: 12, name: "Mega Alakazam", size: 240, speed: 3.5, type: "Psíquico Supremo", imgF: "https://projectpokemon.org/images/normal-sprite/alakazam-mega.gif", imgB: "https://projectpokemon.org/images/sprites-models/normal-back/alakazam-mega.gif" }
  ]},
  "legendary": { baseName: "Mewtwo", color: "#CC44FF", stages: [
    { minLevel: 3, name: "Mewtwo", size: 180, speed: 2.5, type: "Psíquico", imgF: "https://projectpokemon.org/images/normal-sprite/mewtwo.gif", imgB: "https://projectpokemon.org/images/sprites-models/normal-back/mewtwo.gif" },
    { minLevel: 12, name: "Mega Mewtwo Y", size: 260, speed: 4.5, type: "Psíquico/Volador", imgF: "https://projectpokemon.org/images/normal-sprite/mewtwo-megay.gif", imgB: "https://projectpokemon.org/images/sprites-models/normal-back/mewtwo-megay.gif" }
  ]},
  "canine": { baseName: "Growlithe", color: "#FF6600", stages: [
    { minLevel: 3, name: "Growlithe", size: 65, speed: 1.5, type: "Fuego", imgF: "https://projectpokemon.org/images/normal-sprite/growlithe.gif", imgB: "https://projectpokemon.org/images/sprites-models/normal-back/growlithe.gif" },
    { minLevel: 12, name: "Arcanine", size: 180, speed: 3.0, type: "Fuego Legendario", imgF: "https://projectpokemon.org/images/normal-sprite/arcanine.gif", imgB: "https://projectpokemon.org/images/sprites-models/normal-back/arcanine.gif" }
  ]},
  "ancient_fly": { baseName: "Aerodactyl", color: "#BBBBCC", stages: [
    { minLevel: 3, name: "Aerodactyl", size: 160, speed: 3.0, type: "Volador", imgF: "https://projectpokemon.org/images/normal-sprite/aerodactyl.gif", imgB: "https://projectpokemon.org/images/sprites-models/normal-back/aerodactyl.gif" },
    { minLevel: 12, name: "Mega Aerodactyl", size: 240, speed: 4.5, type: "Volador", imgF: "https://projectpokemon.org/images/normal-sprite/aerodactyl-mega.gif", imgB: "https://projectpokemon.org/images/sprites-models/normal-back/aerodactyl-mega.gif" }
  ]}
};

/* --- ESTADO GLOBAL --- */
let gStats = { active: null, sat: 100, team: [], progress: {} };
let localVault = 0, gPosX = window.innerWidth/2, gPosY = 20, gDirX = 1, gDirY = 1, facingAway = false, isEvolving = false;

function saveAll() { localStorage.setItem('qv_elite_stats', JSON.stringify(gStats)); localStorage.setItem('qv_elite_vault', localVault); }

function initVault() { localVault = parseInt(localStorage.getItem('qv_elite_vault')) || 0; updateVaultUI(); }

function initGuardian() {
    const saved = localStorage.getItem('qv_elite_stats');
    if(saved) gStats = JSON.parse(saved);
    renderTeamDock();
    if(!gStats.active) { openStarterSelection(); return; }
    setInterval(logicTick, 1000);
    setInterval(() => { if(!isEvolving && gStats.progress[gStats.active].level >= 3) facingAway = !facingAway; }, 5000);
    requestAnimationFrame(moveLoop);
    updateGuardianUI(); updateGuardianVisuals();
}

function openStarterSelection() {
    document.getElementById('guardian-hud').style.display='none';
    const container = document.getElementById('starter-grid-container');
    container.innerHTML = '';
    Object.keys(POKEDEX_DB).forEach(key => {
        if(!gStats.team.includes(key)) {
            const prog = gStats.progress[key] || {level:1};
            const card = document.createElement('div'); card.className = 'starter-card';
            card.onclick = () => { gStats.active = key; if(!gStats.progress[key]) gStats.progress[key]={level:1, exp:0}; saveAll(); closeStarterSelection(); };
            card.innerHTML = `<div style="font-size:9px; opacity:0.6;">${prog.level>1?'Nivel '+prog.level:'Huevo'}</div>
                              <div class="s-img" style="background-image:url('${prog.level<3?EGG_IMG:POKEDEX_DB[key].stages[0].imgF}')"></div>
                              <div class="s-name" style="color:${POKEDEX_DB[key].color}">${POKEDEX_DB[key].baseName}</div>`;
            container.appendChild(card);
        }
    });
    document.getElementById('starter-selection').style.display='flex';
}

function closeStarterSelection() { document.getElementById('starter-selection').style.display='none'; updateGuardianUI(); updateGuardianVisuals(); }

function switchGuardian(idx) { if(gStats.team[idx]) { gStats.active = gStats.team[idx]; saveAll(); updateGuardianUI(); updateGuardianVisuals(); } }

function logicTick() {
    if(!gStats.active || isEvolving) return;
    gStats.sat = Math.max(0, gStats.sat - 0.05);
    const sprite = document.getElementById('guardian-sprite');
    sprite.style.filter = gStats.sat <= 0 ? 'grayscale(1) brightness(0.5)' : 'none';
    saveAll(); updateGuardianUI();
}

function moveLoop() {
    if(gStats.active && !isEvolving) {
        const prog = gStats.progress[gStats.active];
        const stages = POKEDEX_DB[gStats.active].stages;
        const stage = [...stages].reverse().find(s => prog.level >= s.minLevel) || {size:50, speed:0.5, type:"Incubando"};
        gPosX += stage.speed * gDirX;
        if(gPosX > window.innerWidth-250 || gPosX < 220) gDirX *= -1;
        if(prog.level >= 12 || stage.type.includes("Volador")) {
            gPosY += stage.speed * 0.8 * gDirY;
            if(gPosY > window.innerHeight-300 || gPosY < 20) gDirY *= -1;
        } else gPosY = 20;
        const wrap = document.getElementById('guardian-wrapper');
        wrap.style.left = gPosX+'px'; wrap.style.bottom = gPosY+'px';
        wrap.style.transform = `scaleX(${gDirX === 1 ? -1 : 1})`;
    }
    requestAnimationFrame(moveLoop);
}

function updateGuardianVisuals() {
    if(!gStats.active) return;
    const prog = gStats.progress[gStats.active];
    const stages = POKEDEX_DB[gStats.active].stages;
    const stage = [...stages].reverse().find(s => prog.level >= s.minLevel) || {size:50, imgF:EGG_IMG, imgB:EGG_IMG};
    const sprite = document.getElementById('guardian-sprite');
    const wrap = document.getElementById('guardian-wrapper');
    wrap.style.width = stage.size+'px'; wrap.style.height = stage.size+'px';
    sprite.style.backgroundImage = `url('${facingAway?stage.imgB:stage.imgF}')`;
    renderTeamDock();
}

function updateGuardianUI() {
    if(!gStats.active) return;
    const prog = gStats.progress[gStats.active];
    const stage = [...POKEDEX_DB[gStats.active].stages].reverse().find(s => prog.level >= s.minLevel) || {name:"Huevo"};
    document.getElementById('g-name-display').innerText = stage.name;
    document.getElementById('g-lvl-display').innerText = 'Lv. ' + prog.level;
    document.getElementById('g-sat-fill').style.width = gStats.sat+'%';
    document.getElementById('g-exp-fill').style.width = (prog.level >= 12 ? 100 : (prog.exp/(prog.level*100))*100)+'%';
    document.getElementById('btn-train').disabled = prog.level >= 12 || localVault < 1500;
}

function trainGuardian() {
    let p = gStats.progress[gStats.active];
    if(p.level < 12 && deductPoints(1500)) {
        p.exp += 50;
        if(p.exp >= p.level * 100) {
            p.level++; p.exp = 0;
            if(p.level === 12) {
                if(!gStats.team.includes(gStats.active)) gStats.team.push(gStats.active);
                saveAll();
                if(gStats.team.length === 6) showCelebration(); else showVictoryScreen();
            } else triggerEvo();
        }
        saveAll(); updateGuardianUI(); updateGuardianVisuals();
    }
}

function feedGuardian() { if(deductPoints(500)) { gStats.sat = Math.min(100, gStats.sat+30); saveAll(); updateGuardianUI(); } }

function showVictoryScreen() {
    const stage = POKEDEX_DB[gStats.active].stages[POKEDEX_DB[gStats.active].stages.length-1];
    document.getElementById('vic-img').style.backgroundImage = `url('${stage.imgF}')`;
    document.getElementById('vic-name').innerText = stage.name;
    document.getElementById('victory-screen').style.display = 'flex';
}
function closeVictoryScreen() { document.getElementById('victory-screen').style.display='none'; }

function showCelebration() {
    const grid = document.getElementById('celeb-grid');
    grid.innerHTML = '';
    gStats.team.forEach(key => {
        const stage = POKEDEX_DB[key].stages[POKEDEX_DB[key].stages.length-1];
        grid.innerHTML += `<div class="celeb-member"><div class="celeb-img" style="background-image:url('${stage.imgF}')"></div><div style="font-weight:900; color:#FFF;">${stage.name}</div></div>`;
    });
    document.getElementById('team-celebration').style.display = 'flex';
}
function closeCelebration() { document.getElementById('team-celebration').style.display = 'none'; }

function triggerEvo() { isEvolving=true; document.getElementById('evo-flash').style.opacity=1; setTimeout(()=>{ updateGuardianVisuals(); document.getElementById('evo-flash').style.opacity=0; isEvolving=false; }, 800); }

function renderTeamDock() {
    for(let i=0; i<6; i++) {
        const slot = document.getElementById('ts-'+i);
        if(gStats.team[i]) {
            const key = gStats.team[i];
            const stages = POKEDEX_DB[key].stages;
            slot.innerHTML = `<img src="${stages[stages.length-1].imgF}">`;
            slot.className = 'team-slot filled' + (gStats.active === key ? ' active-slot' : '');
        } else { slot.innerHTML = ''; slot.className = 'team-slot'; }
    }
}

function deductPoints(v) { if(localVault >= v) { localVault -= v; updateVaultUI(); return true; } return false; }
function updateVaultUI() { document.getElementById('vault-score').innerText = localVault.toLocaleString(); }
function toggleGuardianMenu() { const h = document.getElementById('guardian-hud'); h.style.display = h.style.display==='block'?'none':'block'; }

window.addEventListener('keydown', (e) => { if(e.key === "Escape") { closeVictoryScreen(); closeStarterSelection(); closeCelebration(); } });

/* --- MINERÍA Y DATA --- */
const API_KEY = "AIzaSyCCBAapFj9Fd-8cOIfpDJxrOP__76zxAxM", WEEKLY_ID = "1xNrDZ6uXUS0XMU3033SALOPPORgyjQomH68W2GyTAUo";
async function updateData() {
    try {
        const r = await fetch(`https://sheets.googleapis.com/v4/spreadsheets/${WEEKLY_ID}/values/W9!A3:O96?key=${API_KEY}`);
        const data = await r.json();
        if(data.values) {
            const tbody = document.querySelector("#tbl tbody"); tbody.innerHTML = '';
            data.values.slice(0,10).forEach((row, i) => { tbody.innerHTML += `<tr><td>${i+1}</td><td style="text-align:left; font-weight:800">${row[1]}</td><td>${row[14]||0}</td><td>${row[14]||0}</td></tr>`; });
            document.getElementById('totalTodayValue').innerText = data.values.reduce((s, r) => s + (parseInt(r[14])||0), 0);
        }
    } catch(e) {}
}

const GEM_TYPES = { blue:{p:250,t:60000,c:"#44CCFF",img:"https://i.ibb.co/7sBBH4c/pngwing-com-1.png"}, red:{p:500,t:300000,c:"#FF4444",img:"https://i.ibb.co/XZrXPwGc/pngwing-com.png"}, purple:{p:1000,t:600000,c:"#FF44CC",img:"https://i.ibb.co/4gwYj5LG/pngegg.png"} };
function initMiner() {
    const left = document.getElementById('rift-left'), right = document.getElementById('rift-right');
    for(let i=0; i<12; i++) { createNode(left, 'blue'); createNode(right, 'red'); }
}
function createNode(parent, type) {
    const n = document.createElement('div'); n.className = 'crystal-node'; n.style.backgroundImage = `url('${GEM_TYPES[type].img}')`;
    n.style.top = Math.random()*80+10+'%'; n.style.left = Math.random()*60+20+'px';
    n.style.setProperty('--node-color', GEM_TYPES[type].c); parent.appendChild(n);
    setTimeout(() => n.classList.add('ready'), GEM_TYPES[type].t);
    n.onclick = () => { if(n.classList.contains('ready')) { localVault += GEM_TYPES[type].p; updateVaultUI(); n.classList.remove('ready'); setTimeout(()=>n.classList.add('ready'), GEM_TYPES[type].t); saveAll(); } };
}

(async function init() { initVault(); initGuardian(); initMiner(); updateData(); setInterval(updateData, 60000); })();
</script>
