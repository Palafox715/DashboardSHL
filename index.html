<!DOCTYPE html>
<html lang='es'>
<head>
<meta charset='utf-8'/>
<meta name='viewport' content='width=device-width, initial-scale=1'/>
<title>Blue Protocol — Leaderboard & Defense</title>
<style>
  :root{
    --vh: 1vh;
    --bg-color: #000510;
    --blue-neon: #0080FF;
    --blue-dark: #001A33;
    --blue-dim: #004080;
    --blue-glow: rgba(0, 128, 255, 0.4);
    --border: #0080FF;
  }
  
  html,body{
    margin:0; min-height:100%; width:100%;
    background: var(--bg-color);
    color: var(--blue-neon);
    font-family: 'Segoe UI', 'Courier New', monospace;
    overflow-x: hidden; overflow-y: auto;
  }

  /* CRT BLUE EFFECT */
  body::before {
    content: " "; display: block; position: fixed;
    top: 0; left: 0; bottom: 0; right: 0;
    background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.1) 50%), linear-gradient(90deg, rgba(0, 0, 255, 0.03), rgba(0, 255, 255, 0.01), rgba(0, 0, 255, 0.03));
    z-index: 10; background-size: 100% 3px, 3px 100%; pointer-events: none;
  }

  #matrix-canvas { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 0; opacity: 0.15; }

  /* GAME UI REPOSITIONED */
  #game-container {
    position: fixed; top: 0; left: 0; width: 100%; height: 100%;
    z-index: 20; pointer-events: none; display: none;
  }
  #game-canvas { width: 100%; height: 100%; cursor: crosshair; pointer-events: auto; }
  
  .game-stats-bottom {
    position: fixed; bottom: 20px; right: 20px;
    background: rgba(0, 26, 51, 0.9); border: 2px solid var(--blue-neon);
    padding: 15px; font-weight: bold; z-index: 25; text-align: right;
    box-shadow: 0 0 15px var(--blue-glow);
  }

  #board{
    position:relative; z-index:1; width:100vw; min-height:100vh;
    padding: 20px; box-sizing:border-box;
    display:flex; flex-direction:column; gap: 15px;
  }
  
  .top-header-flex{ display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid var(--blue-dark); padding-bottom: 15px; }
  
  /* COUNTER TOP RIGHT: TOTAL XFERS */
  #totalXfersDisplay{
    background: #000; padding: 10px 20px; border: 1px solid var(--blue-neon);
    box-shadow: 0 0 15px var(--blue-glow); text-align: right;
  }
  .xfers-label { font-size: 10px; color: var(--blue-dim); letter-spacing: 2px; }
  .xfers-value { font-size: 32px; font-weight: 800; text-shadow: 0 0 10px var(--blue-neon); }

  .btn-defense {
    background: transparent; color: var(--blue-neon); border: 1px solid var(--blue-neon);
    padding: 10px 25px; cursor: pointer; font-weight: bold;
    text-transform: uppercase; transition: 0.3s;
  }
  .btn-defense:hover { background: var(--blue-neon); color: #000; box-shadow: 0 0 20px var(--blue-neon); }

  h2{ margin:0; font-size: 28px; letter-spacing: 4px; text-shadow: 0 0 8px var(--blue-neon); }

  .table-wrap{ flex:1; overflow-x: auto; }
  table{ width:100%; border-collapse:separate; border-spacing:0 6px; }
  thead th{ background: var(--blue-dark); color: #fff; padding: 12px; text-align: left; font-size: 12px; letter-spacing: 1px; }
  
  tbody tr { transition: transform 0.2s; }
  tbody tr:hover { transform: scale(1.005); }
  tbody td{ background: rgba(0, 26, 51, 0.6); border-top: 1px solid var(--blue-dim); border-bottom: 1px solid var(--blue-dim); padding: 12px; }
  
  /* PROGRESS BARS BLUE */
  .bar{ position:relative; height:20px; background: rgba(0,0,0,0.5); border:1px solid var(--blue-dim); border-radius: 3px; overflow: hidden; }
  .bar > .fill{ position:absolute; left:0; top:0; bottom:0; background: linear-gradient(90deg, var(--blue-dim), var(--blue-neon)); box-shadow: 0 0 10px var(--blue-neon); transition: width 1s ease-out; }
  .bar .value{ position:relative; z-index:1; font-weight:bold; font-size:11px; color: #fff; line-height: 20px; padding-left: 8px; }

  .rank-id { font-weight: bold; color: var(--blue-neon); opacity: 0.7; }
</style>
</head>
<body>
<canvas id="matrix-canvas"></canvas>

<div id="game-container">
    <div class="game-stats-bottom">
        <span style="color: #fff; font-size: 12px;">SCORE_LOG:</span><br>
        <span id="game-score" style="font-size: 24px;">0</span> PTS<br>
        <span id="game-kills" style="color: var(--blue-dim);">0</span> UNITS ELIMINATED
    </div>
    <canvas id="game-canvas"></canvas>
</div>

<div id='board'>
  <div class='top-header-flex'> 
    <h2>SYSTEM://BLUE_LEADERBOARD</h2>
    <div style="display: flex; gap: 20px; align-items: center;">
        <button class="btn-defense" onclick="toggleGame()">ACTIVATE_DEFENSE</button>
        <div id='totalXfersDisplay'>
          <div class="xfers-label">TOTAL_XFERS_DETECTED</div>
          <div class='xfers-value' id='xfersCounter'>0</div>
        </div>
    </div>
  </div>

  <div class='table-wrap'>
    <table id='tbl'>
      <thead>
        <tr>
          <th style="width:5%">ID</th>
          <th style="width:35%">AGENT_IDENTIFIER</th>
          <th style="width:15%">STATUS</th>
          <th style="width:45%">DAILY_XFERS_UPLINK</th>
        </tr>
      </thead>
      <tbody>
        </tbody>
    </table>
  </div>

  <div id='meta' style="color:var(--blue-dim); font-size: 11px; display: flex; justify-content: space-between;">
    <div id='diag'>Connection: Secure // Protocol: Blue_v2.0</div>
    <div id='clock'>--:--:--</div>
  </div>
</div>

<script>
/* CONFIGURATION */
const API_KEY = "AIzaSyCCBAapFj9Fd-8cOIfpDJxrOP__76zxAxM";
const WEEKLY_SHEETID = "1xNrDZ6uXUS0XMU3033SALOPPORgyjQomH68W2GyTAUo";
const DAILY_SHEETID = "1MeGKl3Qok84NymsXnuHuA4reL_l9Y1SqqLuejIMeaUA";

/* MATRIX BLUE EFFECT */
const canvas = document.getElementById('matrix-canvas');
const ctx = canvas.getContext('2d');
let w = canvas.width = window.innerWidth;
let h = canvas.height = window.innerHeight;
const columns = Math.floor(w / 20);
const yPositions = Array(columns).fill(0);

function drawMatrix() {
  ctx.fillStyle = 'rgba(0, 5, 16, 0.1)';
  ctx.fillRect(0, 0, w, h);
  ctx.fillStyle = '#004080';
  ctx.font = '15px monospace';
  yPositions.forEach((y, i) => {
    const text = String.fromCharCode(Math.random() * 128);
    ctx.fillText(text, i * 20, y);
    if (y > 100 + Math.random() * 10000) yPositions[i] = 0;
    else yPositions[i] = y + 20;
  });
}
setInterval(drawMatrix, 50);

/* --- BLUE DEFENSE MINIGAME --- */
const gCanvas = document.getElementById('game-canvas');
const gCtx = gCanvas.getContext('2d');
let gameActive = false;
let gameScore = 0;
let gameKills = 0;
let enemies = [];
const enemyEmojis = ['👾', '👽', '🛸'];
const rareEmojis = ['🚀', '⭐'];

class Enemy {
    constructor(isRare = false) {
        this.x = Math.random() * (window.innerWidth - 50);
        this.y = -50;
        this.speed = isRare ? 6 : 2 + Math.random() * 3;
        this.isRare = isRare;
        this.emoji = isRare ? rareEmojis[Math.floor(Math.random()*rareEmojis.length)] : enemyEmojis[Math.floor(Math.random()*enemyEmojis.length)];
        this.fontSize = isRare ? 50 : 35;
    }
    update() { this.y += this.speed; }
    draw() {
        gCtx.font = `${this.fontSize}px Arial`;
        gCtx.fillText(this.emoji, this.x, this.y);
    }
}

function toggleGame() {
    gameActive = !gameActive;
    const container = document.getElementById('game-container');
    container.style.display = gameActive ? 'block' : 'none';
    if(gameActive) {
        gCanvas.width = window.innerWidth;
        gCanvas.height = window.innerHeight;
        gameScore = 0; gameKills = 0; enemies = [];
        updateHUD();
        animateGame();
    }
}

function updateHUD() {
    document.getElementById('game-score').textContent = gameScore;
    document.getElementById('game-kills').textContent = gameKills;
}

gCanvas.addEventListener('mousedown', (e) => {
    if(!gameActive) return;
    const rect = gCanvas.getBoundingClientRect();
    const mx = e.clientX - rect.left;
    const my = e.clientY - rect.top;
    
    enemies.forEach((en, i) => {
        if(mx > en.x && mx < en.x + 50 && my > en.y - 40 && my < en.y + 10) {
            gameKills++;
            gameScore += en.isRare ? 500 : 100;
            enemies.splice(i, 1);
            updateHUD();
        }
    });
});

window.addEventListener('keydown', (e) => { if(e.key === "Escape" && gameActive) toggleGame(); });

function animateGame() {
    if(!gameActive) return;
    gCtx.clearRect(0, 0, gCanvas.width, gCanvas.height);
    if(Math.random() < 0.04) {
        let isRare = (gameKills > 0 && gameKills % 50 === 0);
        enemies.push(new Enemy(isRare));
    }
    enemies.forEach((en, i) => {
        en.update();
        en.draw();
        if(en.y > gCanvas.height + 50) enemies.splice(i, 1);
    });
    requestAnimationFrame(animateGame);
}

/* --- DATA LOGIC: XFERS PROCESSING --- */
async function loadSystemData() {
    document.getElementById('diag').innerText = "> Sincronizando con el servidor central...";
    try {
        // En un entorno real, aquí usarías el fetch a Google Sheets
        // Obteniendo datos de la Columna C para 'xfers'
        const response = await fetch(`https://sheets.googleapis.com/v4/spreadsheets/${DAILY_SHEETID}/values/Feb 25!A2:C70?key=${API_KEY}`);
        const data = await response.json();
        const rows = data.values || [];
        
        let totalGlobalXfers = 0;
        let activeAgents = rows.map((row, index) => {
            const xfers = parseInt(row[2]) || 0; // Columna C (índice 2)
            totalGlobalXfers += xfers;
            return {
                name: row[0] || "Unknown Agent",
                xfers: xfers,
                id: row[1] || "---"
            };
        }).filter(a => a.name !== "Unknown Agent");

        // Ordenar por xfers
        activeAgents.sort((a, b) => b.xfers - a.xfers);
        
        document.getElementById('xfersCounter').innerText = totalGlobalXfers;
        renderLeaderboard(activeAgents);
        document.getElementById('diag').innerText = "> Uplink exitoso. Protocolo Blue activo.";
    } catch (err) {
        document.getElementById('diag').innerText = "> Error en la conexión. Reintentando...";
        console.error(err);
    }
}

function renderLeaderboard(agents) {
    const tbody = document.querySelector("#tbl tbody");
    tbody.innerHTML = "";
    const maxXfers = Math.max(...agents.map(a => a.xfers), 1);

    agents.forEach((agent, i) => {
        const row = document.createElement('tr');
        const pct = (agent.xfers / maxXfers) * 100;
        
        row.innerHTML = `
            <td class="rank-id">${i + 1}</td>
            <td style="color: #fff; font-weight: bold;">${agent.name}</td>
            <td style="font-size: 10px; color: ${agent.xfers > 0 ? '#00FF41' : '#ff4444'}">
                ${agent.xfers > 0 ? '● ONLINE' : '○ IDLE'}
            </td>
            <td>
                <div class="bar">
                    <div class="fill" style="width: ${pct}%"></div>
                    <div class="value">${agent.xfers} XFERS</div>
                </div>
            </td>
        `;
        tbody.appendChild(row);
    });
}

// Inicialización
loadSystemData();
setInterval(loadSystemData, 15000); // Refresco cada 15 segundos

// Reloj
setInterval(() => {
    const n = new Date();
    document.getElementById('clock').innerText = n.toLocaleTimeString();
}, 1000);
</script>
</body>
</html>
