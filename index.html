<!DOCTYPE html>
<html lang='es'>
<head>
<meta charset='utf-8'/>
<meta name='viewport' content='width=device-width, initial-scale=1'/>
<title>PROTOCOL: VALENTINE</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&family=Share+Tech+Mono&display=swap" rel="stylesheet">

<style>
  /* ===== PALETA ETHEREAL RED ===== */
  :root{
    --bg-color: #0f0505;
    --glass-bg: rgba(30, 10, 10, 0.6);
    --border-color: #591018;
    
    --primary-red: #D90429;   /* Rojo Sangre */
    --neon-pink: #FF4D6D;     /* Rosa Brillante */
    --gold-accent: #FFD700;   /* Dorado */
    --text-main: #FFF0F5;     /* Blanco Lavanda */
    
    --font-header: 'Cinzel', serif;
    --font-tech: 'Share Tech Mono', monospace;
    
    --glow-soft: 0 0 10px rgba(255, 77, 109, 0.3);
    --glow-strong: 0 0 15px var(--primary-red), 0 0 30px var(--neon-pink);
  }

  /* Animación de latido para el modo activo */
  @keyframes heartbeat {
    0% { transform: scale(1); box-shadow: 0 0 0 0 rgba(217, 4, 41, 0.7); }
    70% { transform: scale(1.02); box-shadow: 0 0 20px 10px rgba(217, 4, 41, 0); }
    100% { transform: scale(1); box-shadow: 0 0 0 0 rgba(217, 4, 41, 0); }
  }

  body.cupid-mode {
    --primary-red: #FF0055;
    --border-color: #FFD700;
  }
  
  html,body{
    margin:0; height:100%; width:100%;
    background-color: var(--bg-color);
    color: var(--text-main);
    font-family: var(--font-tech);
    font-size: 16px;
    overflow: hidden;
    cursor: default;
  }

  #matrix-canvas { position: fixed; top: 0; left: 0; z-index: 0; opacity: 0.4; pointer-events: none; }
  
  /* Gradiente viñeta para dar profundidad */
  body::after {
    content: " "; display: block; position: absolute; inset:0;
    background: radial-gradient(circle, transparent 40%, #000 100%);
    z-index: 0; pointer-events: none;
  }

  /* Overlay Poético */
  #wake-overlay {
      position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
      background: rgba(0,0,0,0.95); z-index: 10000;
      display: none; place-items: center; justify-content: center;
      flex-direction: column;
      text-align: center;
      color: var(--neon-pink); font-family: var(--font-header); font-size: 2rem;
      text-shadow: var(--glow-strong);
  }

  #board{
    position:relative; z-index:1;
    width: 90%; height: 90%; margin: 5vh auto;
    background: var(--glass-bg);
    backdrop-filter: blur(10px);
    border: 1px solid var(--border-color);
    box-shadow: 0 0 30px rgba(89, 16, 24, 0.4);
    border-radius: 15px;
    padding: 20px; box-sizing:border-box;
    display:flex; flex-direction:column; gap: 15px;
    overflow-y: auto;
    transition: all 0.5s ease;
  }
  
  /* ESTILO CUANDO "CUPIDO" ESTÁ ACTIVO (Modo Fiesta) */
  #board.infected {
      animation: heartbeat 1.5s infinite;
      border-color: var(--neon-pink);
      box-shadow: inset 0 0 50px rgba(255, 0, 85, 0.2);
  }

  .top-header-flex{
    display: flex; justify-content: space-between; align-items: center;
    border-bottom: 1px solid var(--border-color); padding-bottom: 15px;
  }

  h2{ 
    margin:0; text-align:left; font-size: 2rem; 
    font-family: var(--font-header); letter-spacing: 3px; 
    color: var(--neon-pink); text-shadow: var(--glow-soft);
  }
  h2::before { content: "♥ "; color: var(--primary-red); }

  #dailyTotalDisplay{
    border: 1px solid var(--border-color); padding: 10px 20px;
    border-radius: 50px;
    background: rgba(0, 0, 0, 0.3);
    cursor: help; transition: all 0.3s;
  }
  #dailyTotalDisplay:hover{ border-color: var(--neon-pink); box-shadow: var(--glow-soft); }
  #dailyTotalDisplay .label{ font-size: 0.8rem; color: #aaa; text-transform: uppercase; letter-spacing: 2px;}
  #dailyTotalDisplay .value{ 
      font-size: 1.5rem; color: var(--gold-accent); font-weight: bold; 
      font-family: var(--font-header);
  }

  .chips{ display:flex; gap: 15px; margin-top: 5px; }
  .chip { 
    cursor: pointer; padding: 5px 15px; border-radius: 20px;
    border: 1px solid rgba(255,255,255,0.1); font-size: 0.8rem;
    color: #cca; transition: 0.3s; 
  }
  .chip:hover { background: rgba(255, 77, 109, 0.1); border-color: var(--neon-pink); }
  .chip::before{ content: ">> "; color: var(--primary-red); }

  .table-wrap{ flex:1; min-height:0; position:relative; overflow: auto; margin-top:10px; }
  table{ width:100%; border-collapse: separate; border-spacing: 0 5px; }
  
  thead th{
    position:sticky; top:0; z-index:2;
    background: rgba(15, 5, 5, 0.9); color: var(--neon-pink);
    text-align: center; padding: 10px;
    font-family: var(--font-header); letter-spacing: 1px;
    font-size: 0.9rem;
    border-bottom: 1px solid var(--border-color);
  }
  th.col-agent, td.col-agent{ text-align:left; }

  tbody tr {
    background: rgba(255, 255, 255, 0.02);
    transition: transform 0.2s, background 0.2s;
  }
  tbody td{
    padding: 12px 8px; vertical-align: middle;
    border-bottom: 1px solid rgba(255,255,255,0.05);
  }
  tbody tr:hover { 
    background: rgba(217, 4, 41, 0.1); 
    transform: scale(1.01);
  }
  tbody tr:hover td { color: #fff; text-shadow: 0 0 8px white; }

  .agent-wrap .name{ font-size: 1.1rem; letter-spacing: 0.5px; color: #fff; }
  .ascii-bar{ font-family: var(--font-tech); font-size: 0.8rem; color: var(--neon-pink); opacity: 0.8; }

  /* ===== ESTILOS DEL "ELEGIDO" (Target/Cupid) ===== */
  .smith-row td {
      background: linear-gradient(90deg, transparent, rgba(255, 77, 109, 0.1), transparent) !important;
      color: var(--neon-pink) !important;
      border-bottom: 1px solid var(--primary-red);
      cursor: pointer !important;
  }
  .smith-row .name { font-weight: bold; text-shadow: var(--glow-soft); }
  .smith-glitch { animation: pulse-text 2s infinite; }
  @keyframes pulse-text { 0%, 100% { opacity: 1; } 50% { opacity: 0.7; text-shadow: var(--glow-strong); } }

  #meta{ margin-top: 10px; border-top: 1px solid var(--border-color); padding-top:10px; color: #666; font-size: 0.8rem; display:flex; justify-content:space-between;}
  
  .rank-txt { color: #666; font-family: var(--font-header); }
  .rank-1 { color: var(--gold-accent); text-shadow: 0 0 10px var(--gold-accent); font-size: 1.2rem;}

  /* Scrollbar elegante */
  ::-webkit-scrollbar { width: 6px; }
  ::-webkit-scrollbar-track { background: #111; }
  ::-webkit-scrollbar-thumb { background: var(--border-color); border-radius: 3px; }

  /* ===== ESTILOS DEL MINI JUEGO ===== */
  #mini-score-panel {
      position: fixed; bottom: 20px; right: 20px;
      background: rgba(15, 5, 5, 0.9);
      border: 1px solid var(--primary-red);
      box-shadow: 0 0 15px rgba(255, 77, 109, 0.2);
      padding: 10px 20px; border-radius: 8px;
      z-index: 9998; display: flex; align-items: center; gap: 10px;
      font-family: var(--font-tech);
      transition: transform 0.2s;
  }
  #mini-score-panel:hover { transform: scale(1.05); }
  
  .score-label { color: var(--neon-pink); font-size: 0.8rem; letter-spacing: 1px; }
  .score-val { color: var(--gold-accent); font-size: 1.5rem; font-weight: bold; text-shadow: 0 0 10px var(--gold-accent); }

  #flying-cupid {
      position: fixed;
      font-size: 3.5rem; /* Tamaño del cupido */
      z-index: 9999;
      cursor: crosshair; /* Cursor de mira para disparar */
      user-select: none;
      filter: drop-shadow(0 0 15px var(--neon-pink));
      transition: top 0.8s cubic-bezier(0.2, 0.8, 0.2, 1), 
                  left 0.8s cubic-bezier(0.2, 0.8, 0.2, 1), 
                  transform 0.1s;
  }
  
  /* Animación al recibir un disparo */
  .cupid-hit {
      animation: hit-anim 0.3s forwards;
  }
  @keyframes hit-anim {
      0% { transform: scale(1) rotate(0deg); filter: hue-rotate(0deg); }
      50% { transform: scale(1.4) rotate(15deg); filter: hue-rotate(180deg) brightness(2); }
      100% { transform: scale(0) rotate(-15deg); opacity: 0; }
  }

  /* Móvil */
  @media (max-width: 768px) {
    #board { width: 100%; height: 100%; margin: 0; border: none; border-radius: 0; }
    thead { display: none; }
    tbody tr { display: flex; flex-wrap: wrap; margin-bottom: 15px; border: 1px solid var(--border-color); padding: 10px; border-radius: 8px; }
    tbody td { border: none; width: 100%; padding: 2px 0; display: flex; justify-content: space-between; }
    .col-day { display: none; }
    .col-rank { font-size: 0.8rem; color: var(--gold-accent); width: 100%; text-align: right; }
  }
</style>
</head>
<body>
<canvas id="matrix-canvas"></canvas>
<div id="wake-overlay"></div>

<div id="mini-score-panel">
    <span class="score-label">TARGETS_HIT:</span>
    <span class="score-val" id="score-counter">00</span>
</div>
<div id="flying-cupid" onclick="hitCupid()">👼</div>

<div id='board'>
  <div class='top-header-flex'> 
    <h2>AFINITY_V14</h2>
    <div id='dailyTotalDisplay' onmouseover="startScramble()" onmouseout="stopScramble()">
      <span class='label'>LOVE_FREQUENCY (TODAY):</span>
      <span class='value' id='totalTodayValue'>0000</span>
    </div>
  </div>

  <div class='chips'>
    <div id='chipWeekly' class='chip'>CYCLE: ???</div>
    <div id='chipDaily' class='chip'>SYNC: ???</div>
  </div>

  <div class='table-wrap'>
    <table id='tbl'>
      <thead>
        <tr>
          <th class='col-rank'>#</th>
          <th class='col-agent'>ENTITY / NAME</th>
          <th class='col-today' style="width:20%">AFFECTION FLOW</th>
          <th class='col-day'>W</th><th class='col-day'>T</th><th class='col-day'>F</th>
          <th class='col-day'>S</th><th class='col-day'>M</th><th class='col-day'>T</th>
          <th class='col-total' style="width:20%">TOTAL DEVOTION</th>
        </tr>
      </thead>
      <tbody></tbody>
    </table>
  </div>

  <div id='meta'>
    <div id='diag'>INITIALIZING HEARTBEAT...</div>
    <div>V14.02.2026</div>
  </div>
</div>

<script>
/* 1. VISUAL: RAIN OF HEARTS & BINARY */
const canvas = document.getElementById('matrix-canvas');
const ctx = canvas.getContext('2d');
function resizeCanvas() { canvas.width = window.innerWidth; canvas.height = window.innerHeight; }
window.addEventListener('resize', resizeCanvas); resizeCanvas();

const chars = '♥♡10XY❤10❥'; 
const charArray = chars.split('');
const fontSize = 16; const columns = canvas.width / fontSize; const drops = [];
for (let i = 0; i < columns; i++) drops[i] = Math.random() * -100;

function drawMatrix() {
    const isCupid = document.body.classList.contains('cupid-mode');
    ctx.fillStyle = 'rgba(15, 5, 5, 0.05)'; 
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    ctx.font = fontSize + 'px monospace';
    
    for (let i = 0; i < drops.length; i++) {
        const r = Math.random();
        if (r > 0.90) ctx.fillStyle = '#FFD700'; // Dorado
        else if (r > 0.6) ctx.fillStyle = '#FF4D6D'; // Rosa
        else ctx.fillStyle = '#591018'; // Rojo oscuro
        
        if(isCupid) ctx.fillStyle = '#FF0055'; // Neón en modo cupido

        const text = charArray[Math.floor(Math.random() * charArray.length)];
        ctx.fillText(text, i * fontSize, drops[i] * fontSize);
        if (drops[i] * fontSize > canvas.height && Math.random() > 0.98) drops[i] = 0;
        drops[i]++;
    }
}
setInterval(drawMatrix, 40);

/* 2. LÓGICA DE DATOS (BLINDADA POR ID) */
const BAR_LENGTH = 12; 
const CHAR_FILL = '♥'; 
const CHAR_EMPTY = '.'; 

// === CONFIGURACIÓN ===
const TARGET_NAME_KEY = "CUPID"; // Cambiar por nombre especial si se desea

const API_KEY = "AIzaSyDwOqp2uizZol2et6Uqi7CnntW9Hkrinjg";
const WEEKLY_SHEETID = "1xNrDZ6uXUS0XMU3033SALOPPORgyjQomH68W2GyTAUo";
const DAILY_ID_RAW = "1MeGKl3Qok84NymsXnuHuA4reL_l9Y1SqqLuejIMeaUA";
const TIMEZONE = "America/Tijuana";
const DAILY_REFRESH = 12000; 
let ALL_DATA=[]; 
let CURRENT_TOTAL = 0;
let CUPID_ACTIVE = false;

function diag(t){ document.getElementById('diag').textContent = `>> ${t}`; }
function setChipWeekly(t){ document.getElementById('chipWeekly').textContent = `CYCLE: ${t}`; }
function setChipDaily(t){ document.getElementById('chipDaily').textContent = `SYNC: ${t}`; }
function getLocalDate(){ const s=new Date().toLocaleString('en-US',{timeZone:TIMEZONE}); return new Date(s); }
function isoWeek(d){ const x=new Date(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate())); const n=x.getUTCDay()||7; x.setUTCDate(x.getUTCDate()+4-n); const y=new Date(Date.UTC(x.getUTCFullYear(),0,1)); return {week:Math.ceil((((x-y)/86400000)+1)/7), year:x.getUTCFullYear()}; }
function weeksInISOYear(y){ const d=new Date(Date.UTC(y,11,31)); const day=d.getUTCDay(); return (day===4 || (d.getUTCDate()===31 && day===3))?53:52; }
function computeWeeklyTabName(){
  const url=new URL(window.location.href); const o=url.searchParams.get('weeklyTab'); if(o) return o;
  const local=getLocalDate(); const hrs=local.getHours(); const dow=local.getDay(); const iw=isoWeek(local); let w=iw.week;
  const afterCut=(dow>4)||(dow===4&&hrs>=14); if(afterCut){ w++; const mx=weeksInISOYear(iw.year); if(w>mx){w=1;} } return `W${w}`;
}
function normName(s){ return (s||"").normalize('NFD').replace(/[\u0300-\u036f]/g,"").replace(/[^\x20-\x7E]/g,"").trim().toUpperCase(); }
function normID(s){ return (s||"").toString().trim(); }

async function fetchSafeJSON(url) {
  try { const r = await fetch(url); if (r.ok) return await r.json(); } catch (e) {} return null;
}

// Lectura de la Hoja Semanal
async function readWeeklyTab(weeklyTab){
  const ranges=[`${weeklyTab}!A3:C96`,`${weeklyTab}!D3:D96`,`${weeklyTab}!F3:F96`,`${weeklyTab}!H3:H96`,`${weeklyTab}!J3:J96`,`${weeklyTab}!L3:L96`,`${weeklyTab}!N3:N96`,`${weeklyTab}!O3:O96`].map(encodeURIComponent);
  const url=`https://sheets.googleapis.com/v4/spreadsheets/${WEEKLY_SHEETID}/values:batchGet?`+ranges.map(r=>`ranges=${r}`).join("&")+`&valueRenderOption=UNFORMATTED_VALUE&key=${API_KEY}`;
  const j=await fetchSafeJSON(url); if(!j) return []; const vr=j.valueRanges||[];
  const base=vr[0]?.values||[]; const toCol=v=>(v?.values||[]).map(r=>(r[0]??"").toString().trim());
  const d=toCol(vr[1]), f=toCol(vr[2]), h=toCol(vr[3]), jv=toCol(vr[4]), l=toCol(vr[5]), n=toCol(vr[6]), oT=toCol(vr[7]);
  const len=Math.max(base.length,d.length,f.length,h.length,jv.length,l.length,n.length,oT.length);
  const out=[];
  for(let i=0;i<len;i++){
    const id=normID(base[i]?.[0]??""); 
    const name=(base[i]?.[1]??"").toString().trim(); 
    if(!id && !name) continue;
    out.push({ id,idKey:id, name, nameKey:normName(name), wed:parseInt(d[i]||0), thu:parseInt(f[i]||0), fri:parseInt(h[i]||0), sat:parseInt(jv[i]||0), mon:parseInt(l[i]||0), tue:parseInt(n[i]||0), total:parseInt(oT[i]||0), today:0 });
  }
  return out;
}

function fmtDailyTab(dt){ const m=new Intl.DateTimeFormat('en-US',{month:'short',timeZone:TIMEZONE}).format(dt); const dd=new Intl.DateTimeFormat('en-US',{day:'2-digit',timeZone:TIMEZONE}).format(dt); return `${m} ${dd}`; }

// Lectura de la Hoja Diaria (Por ID, Columna B)
async function readDailyApproved(){
  const tabs=[fmtDailyTab(getLocalDate())];
  const url=`https://sheets.googleapis.com/v4/spreadsheets/${DAILY_ID_RAW}/values:batchGet?ranges=${tabs[0]}!A2:C70&valueRenderOption=UNFORMATTED_VALUE&key=${API_KEY}`;
  const j=await fetchSafeJSON(url); 
  
  const mapByID = new Map(); 
  if(j && j.valueRanges){
      const A=(j.valueRanges[0]?.values)||[]; 
      for(let i=0; i<A.length; i++){
          // Columna B (index 1) es el ID numérico
          const idRaw = (A[i][1]??"").toString().trim(); 
          // Columna C (index 2) es el valor
          const v = parseInt(A[i][2]??0) || 0;
          if(idRaw){ mapByID.set(idRaw, (mapByID.get(idRaw)||0) + v); }
      }
      return {tab:tabs[0], mapByID}; 
  }
  return {tab:'OFFLINE', mapByID:new Map()};
}

let SCRAMBLING = false; let scrambleInterval;
function updateTotalDisplay(total){ 
    CURRENT_TOTAL = total;
    if(!SCRAMBLING) document.getElementById('totalTodayValue').textContent = total.toString().padStart(4, '0'); 
}
function startScramble(){
    SCRAMBLING = true;
    const target = document.getElementById('totalTodayValue'); const chars = "0123456789♥";
    scrambleInterval = setInterval(() => { target.textContent = Array(4).fill(0).map(() => chars[Math.floor(Math.random() * chars.length)]).join(''); }, 50);
}
function stopScramble(){
    SCRAMBLING = false; clearInterval(scrambleInterval);
    document.getElementById('totalTodayValue').textContent = CURRENT_TOTAL.toString().padStart(4, '0');
}

function generateAsciiBar(value, max) {
  if (max === 0) max = 1;
  const filledCount = Math.round((value / max) * BAR_LENGTH);
  const barStr = CHAR_FILL.repeat(filledCount) + CHAR_EMPTY.repeat(BAR_LENGTH - filledCount);
  return `${barStr} ${value}`;
}

// === ACTIVAR CUPIDO ===
function activateCupid() {
    CUPID_ACTIVE = !CUPID_ACTIVE; // Toggle
    const board = document.getElementById('board');
    if(CUPID_ACTIVE) {
        board.classList.add('infected');
        document.body.classList.add('cupid-mode');
        createHeartExplosion();
    } else {
        board.classList.remove('infected');
        document.body.classList.remove('cupid-mode');
    }
}

function createHeartExplosion() {
    for(let i=0; i<30; i++){
        setTimeout(() => {
            const span = document.createElement('span');
            span.textContent = Math.random() > 0.5 ? '♥' : '❤';
            span.style.position = 'fixed'; 
            span.style.left = '50%'; span.style.top = '50%';
            span.style.color = '#FF0055'; 
            span.style.fontSize = (20 + Math.random() * 40) + 'px';
            span.style.zIndex = '9999';
            document.body.appendChild(span);
            const x = (Math.random() - 0.5) * window.innerWidth;
            const y = (Math.random() - 0.5) * window.innerHeight;
            const anim = span.animate([ 
                { transform: 'translate(-50%,-50%) scale(0)', opacity: 1 }, 
                { transform: `translate(${x}px, ${y}px) scale(1)`, opacity: 0 } 
            ], { duration: 1500, easing: 'ease-out' });
            anim.onfinish = () => span.remove();
        }, i * 50);
    }
}

function renderList(list){
  const tbody=document.querySelector("#tbl tbody"); tbody.innerHTML="";
  const maxToday=Math.max(1, ...list.map(p=>p.today||0)); 
  const maxTotal=Math.max(1, ...list.map(p=>p.total||0));
  
  list.forEach((p,i)=>{
    const isTarget = (p.name && (p.name.includes(TARGET_NAME_KEY)));
    let rowClass = "";
    if (isTarget) rowClass = "smith-row"; 
    let nameHtml = `<div class="name">${p.name}</div>`;
    if (isTarget) { nameHtml = `<div class="name smith-glitch">${p.name} ♥</div>`; }
    let rankTxt = `${(i + 1)}`;
    let rankClass = 'rank-txt';
    if (i===0) { rankTxt = '♛'; rankClass += ' rank-1'; } 
    let clickAttr = isTarget ? 'onclick="activateCupid()"' : '';

    const tr=document.createElement('tr');
    if(rowClass) tr.className = rowClass;
    if(clickAttr) tr.innerHTML = `<tr ${clickAttr}>`; 
    tr.innerHTML = `
      <td class="col-rank"><span class="${rankClass}">${rankTxt}</span></td>
      <td class="col-agent" ${clickAttr}>
        <div class="agent-wrap">${nameHtml}</div>
      </td>
      <td class="col-today"><div class="ascii-bar">${generateAsciiBar(p.today||0, maxToday)}</div></td>
      <td class="col-day">${p.wed||0}</td><td class="col-day">${p.thu||0}</td><td class="col-day">${p.fri||0}</td>
      <td class="col-day">${p.sat||0}</td><td class="col-day">${p.mon||0}</td><td class="col-day">${p.tue||0}</td>
      <td class="col-total"><div class="ascii-bar">${generateAsciiBar(p.total||0, maxTotal)}</div></td>
    `;
    tbody.appendChild(tr);
  });
}

// ACTUALIZACIÓN DE DATOS
async function updateData(){
  diag('SEARCHING FOR HEARTBEAT...');
  const weeklyTab=computeWeeklyTabName();
  setChipWeekly(weeklyTab);

  const [weeklyData, dailyData] = await Promise.all([ readWeeklyTab(weeklyTab), readDailyApproved() ]);
  setChipDaily(dailyData.tab);
  
  // Cruce de datos por ID
  weeklyData.forEach(agent => {
      if(agent.idKey && dailyData.mapByID.has(agent.idKey)){
          agent.today = dailyData.mapByID.get(agent.idKey);
      } else {
          agent.today = 0;
      }
  });
  
  weeklyData.sort((a, b) => {
    if ((b.today || 0) !== (a.today || 0)) return (b.today || 0) - (a.today || 0);
    return ((b.total||0) + (b.today||0)) - ((a.total||0) + (a.today||0));
  });

  ALL_DATA = weeklyData.filter((p, i) => i < 3 || (p.total||0) > 0 || (p.today||0) > 0);
  updateTotalDisplay(ALL_DATA.reduce((sum, p) => sum + (p.today || 0), 0));
  diag(`CONNECTION ESTABLISHED.`);
  renderList(ALL_DATA);
}

(async function init(){ await updateData(); setInterval(updateData, DAILY_REFRESH); })();

/* 3. INTERACCIONES EXTRA */
// Click global (partículas)
document.addEventListener('click', (e) => {
    if(e.target.closest('.chip') || e.target.closest('.smith-row') || e.target.id === 'flying-cupid') return; 
    const particleCount = 6; 
    for(let i=0; i<particleCount; i++) {
        const span = document.createElement('span');
        span.textContent = Math.random() > 0.5 ? '♥' : '♡';
        span.style.position = 'fixed'; span.style.left = e.clientX + 'px'; span.style.top = e.clientY + 'px';
        span.style.color = '#FF4D6D'; span.style.textShadow = '0 0 5px #fff';
        span.style.fontSize = (10 + Math.random() * 15) + 'px';
        span.style.pointerEvents = 'none'; span.style.zIndex = '9999';
        document.body.appendChild(span);
        const x = (Math.random() - 0.5) * 100;
        const y = (Math.random() - 1) * 100; 
        const anim = span.animate([ { transform: 'translate(0,0) scale(1)', opacity: 1 }, { transform: `translate(${x}px, ${y}px) scale(0)`, opacity: 0 } ], { duration: 800 });
        anim.onfinish = () => span.remove();
    }
});

// Mensaje secreto
document.addEventListener('keydown', async (e) => {
    if (e.key === 'Escape' || e.key.toLowerCase() === 'l') { 
        const overlay = document.getElementById('wake-overlay');
        overlay.style.display = 'flex'; overlay.innerHTML = '';
        await typeWriter("Not to be loved is ...", overlay); await new Promise(r => setTimeout(r, 1500));
        overlay.innerHTML = ''; 
        await typeWriter("a simple misfortune...", overlay); await new Promise(r => setTimeout(r, 1500));
        overlay.innerHTML = '';
        await typeWriter("the true misfortune is not to love..", overlay); await new Promise(r => setTimeout(r, 3000));
        overlay.style.display = 'none';
    }
});
async function typeWriter(text, container) {
    for (let i = 0; i < text.length; i++) {
        container.innerHTML += text.charAt(i); await new Promise(r => setTimeout(r, 100));
    }
}

/* ================================
   MINI JUEGO: CAZA-CUPIDOS
   ================================ */
let gameScore = 0;
const cupidEl = document.getElementById('flying-cupid');
const scoreEl = document.getElementById('score-counter');

function moveCupid() {
    const maxX = window.innerWidth - 100;
    const maxY = window.innerHeight - 100;
    const randomX = Math.floor(Math.random() * maxX);
    const randomY = Math.floor(Math.random() * maxY);
    cupidEl.classList.remove('cupid-hit');
    cupidEl.style.opacity = "1";
    cupidEl.style.transform = "scale(1)";
    cupidEl.style.left = randomX + 'px';
    cupidEl.style.top = randomY + 'px';
}

function hitCupid() {
    gameScore++;
    scoreEl.textContent = gameScore.toString().padStart(2, '0');
    // Efecto visual rápido
    cupidEl.classList.add('cupid-hit');
    setTimeout(moveCupid, 400); // Se mueve rápido tras el golpe
}

// Mover automáticamente cada 2.5s si no lo atrapan
setInterval(() => {
    if(!cupidEl.classList.contains('cupid-hit')){ moveCupid(); }
}, 2500);

moveCupid(); // Inicio
</script>
