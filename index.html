<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Neo-Gothic Dashboard v2.0</title>
    <style>
        :root {
            --primary-glow: #00ff41; /* Verde Matrix/Gótico */
            --bg-dark: #0a0a0a;
            --cell-empty: #1a1a1a;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--primary-glow);
            font-family: 'Courier New', monospace;
            overflow: hidden;
            user-select: none;
        }

        /* --- SISTEMA DE BARRA DE CARGA MODERNA --- */
        .status-container {
            display: flex;
            align-items: center;
            gap: 10px;
            margin: 20px;
        }

        .power-bar {
            display: flex;
            gap: 3px;
            background: rgba(0, 0, 0, 0.5);
            padding: 4px;
            border: 1px solid var(--primary-glow);
            box-shadow: 0 0 5px var(--primary-glow);
        }

        .cell {
            width: 12px;
            height: 20px;
            background: var(--cell-empty);
            transition: background 0.3s ease;
        }

        .cell.active {
            background: var(--primary-glow);
            box-shadow: 0 0 10px var(--primary-glow);
        }

        /* --- ANIMACIÓN AL CLICK --- */
        .click-particle {
            position: absolute;
            color: var(--primary-glow);
            font-size: 10px;
            pointer-events: none;
            animation: fall 0.8s forwards linear;
            z-index: 999;
        }

        @keyframes fall {
            0% { transform: translateY(0) opacity(1); }
            100% { transform: translateY(50px) opacity(0); }
        }

        .glitch-mode {
            filter: invert(1) hue-rotate(90deg);
            transition: filter 0.5s;
        }
    </style>
</head>
<body onclick="triggerClickEffect(event)">

    <div id="main-interface">
        <h2>SISTEMA DE MONITOREO - ACCESO: SEÑOR</h2>
        
        <div class="status-container">
            <span>UNIDAD 01:</span>
            <div id="bar-1" class="power-bar"></div>
            <span id="percent-1">0%</span>
        </div>

        <div class="status-container">
            <span>UNIDAD 02:</span>
            <div id="bar-2" class="power-bar"></div>
            <span id="percent-2">0%</span>
        </div>
    </div>

    <script>
        // Generar las barras de carga (Sustituye los 1 y 0)
        function createBar(elementId, segments = 10) {
            const container = document.getElementById(elementId);
            for (let i = 0; i < segments; i++) {
                let cell = document.createElement('div');
                cell.className = 'cell';
                container.appendChild(cell);
            }
        }

        function updateLoading(elementId, percentId, val) {
            const cells = document.querySelectorAll(`#${elementId} .cell`);
            const threshold = Math.floor(val / 10);
            cells.forEach((cell, index) => {
                if (index < threshold) cell.classList.add('active');
                else cell.classList.remove('active');
            });
            document.getElementById(percentId).innerText = `${val}%`;
        }

        // Efecto de Click: Animación de Código
        function triggerClickEffect(e) {
            const chars = "01ABCDEF<>[]{}$#@";
            for (let i = 0; i < 5; i++) {
                const particle = document.createElement('div');
                particle.className = 'click-particle';
                particle.innerText = chars[Math.floor(Math.random() * chars.length)];
                particle.style.left = `${e.clientX + (Math.random() * 20 - 10)}px`;
                particle.style.top = `${e.clientY + (Math.random() * 20 - 10)}px`;
                document.body.appendChild(particle);
                
                setTimeout(() => particle.remove(), 800);
            }
        }

        // Easter Egg: Modo Inverso (Alt + Click)
        window.onclick = function(e) {
            if (e.altKey) {
                document.body.classList.toggle('glitch-mode');
                console.log("SEÑOR, EL ORÁCULO HA SIDO ACTIVADO...");
            }
        };

        // Inicialización
        createBar('bar-1');
        createBar('bar-2');
        
        // Simulación de carga dinámica (mecánica original)
        setInterval(() => {
            updateLoading('bar-1', 'percent-1', Math.floor(Math.random() * 101));
            updateLoading('bar-2', 'percent-2', Math.floor(Math.random() * 101));
        }, 2000);

    </script>
</body>
</html>
