<!DOCTYPE html>
<html lang='es'>
<head>
<meta charset='utf-8'/>
<meta name='viewport' content='width=device-width, initial-scale=1'/>
<title>Leaderboard — Blue Protocol Clean Señor</title>
<style>
  /* Variables de Color (Dark Neon Blue/Purple) */
  :root{
    --vh: 1vh;
    --dark-bg: #0A0A0A; 
    --ink:#E0E0E0;  
    --glass: rgba(0,0,0, .55);
    --glass-strong: rgba(0,0,0, .75);
    --neon-blue: #44CCFF;
    --neon-purple: #FF44CC;
    --glow-blue: rgba(44, 204, 255, .6);
    --glow-purple: rgba(255, 68, 204, .5);
  }
  
  html,body{
    margin:0; min-height:100%; width:100%;
    background:var(--dark-bg); color:var(--ink);
    font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;
    overflow-x: hidden; overflow-y: auto;
  }
  body::before, body::after{
    content:""; position:fixed; inset:-20%;
    background: radial-gradient(40% 40% at 20% 20%, var(--glow-blue), transparent),
                radial-gradient(35% 35% at 80% 10%, rgba(255,255,255,.20), transparent),
                radial-gradient(30% 30% at 50% 90%, var(--glow-purple), transparent);
    z-index:0; pointer-events:none; mix-blend-mode:lighten; animation:float 22s linear infinite;
  }
  body::after{ animation-direction:reverse; animation-duration:27s; opacity:.7; }
  @keyframes float{ 0%{transform:translate3d(0,0,0)} 50%{transform:translate3d(2%, -2%, 0)} 100%{transform:translate3d(0,0,0)} }

  #board{
    position:relative; z-index:1; width:100vw; min-height:100vh;
    padding:calc(1.2*var(--vh)) calc(1.6*var(--vh)); box-sizing:border-box;
    background: radial-gradient(ellipse at top, #1a0a2e 0%, var(--dark-bg) 100%);
    display:flex;flex-direction:column;gap:calc(0.8*var(--vh));
  }
  
  .top-header-flex{ display: flex; justify-content: space-between; align-items: center; gap: 10px; }
  #dailyTotalDisplay{
    background: var(--glass-strong); padding: 8px 16px; border-radius: 10px;
    border: 1px solid var(--neon-blue); box-shadow: 0 0 15px var(--glow-blue);
    text-align: right; flex-shrink: 0;
  }
  #dailyTotalDisplay .label{ font-size: calc(1.4*var(--vh)); font-weight: 600; color: var(--neon-blue); text-transform: uppercase; }
  #dailyTotalDisplay .value{ font-size: calc(3.0*var(--vh)); font-weight: 900; color: var(--neon-purple); line-height: 1; filter: drop-shadow(0 0 8px var(--glow-purple)); }

  h2{ margin:0;text-align:left;font-weight:900; font-size:calc(4.0*var(--vh)); filter: drop-shadow(0 0 8px var(--neon-blue)); }
  .chips{ display:flex;gap:calc(.6*var(--vh)); flex-wrap:wrap; justify-content:center; }
  .chip{ padding:calc(.35*var(--vh)) calc(.8*var(--vh)); border-radius:999px; background:var(--glass); backdrop-filter: blur(6px); border:1px solid rgba(255,255,255,.2); font-weight:800; font-size:calc(1.5*var(--vh)); }

  .table-wrap{ flex:1; min-height:0; position:relative; }
  table{ width:100%; border-collapse:separate; border-spacing:0 10px; table-layout:fixed; font-size:calc(1.7*var(--vh)); }
  thead th{ position:sticky; top:0; z-index:2; background:var(--glass-strong); backdrop-filter: blur(6px); font-size:calc(1.6*var(--vh)); font-weight:900; padding:calc(.6*var(--vh)); border-radius:10px; border:1px solid rgba(255,255,255,.15); }
  
  th.col-rank, td.col-rank { width:9%; text-align:center; }
  th.col-agent,td.col-agent{ width:30%; text-align:left; }
  th.col-today,td.col-today{ width:15%; text-align:center; }
  th.col-day,  td.col-day  { width:7%;  text-align:center; }
  th.col-total,td.col-total{ width:12%; text-align:center; }

  tbody td{ background: var(--glass); border-top:1px solid rgba(255,255,255,.05); border-bottom:1px solid rgba(255,255,255,.05); padding:calc(.7*var(--vh)); }
  tbody tr td:first-child{ border-left:1px solid rgba(255,255,255,.05); border-top-left-radius:14px; border-bottom-left-radius:14px; }
  tbody tr td:last-child { border-right:1px solid rgba(255,255,255,.05); border-top-right-radius:14px; border-bottom-right-radius:14px; }
  
  .name{ font-weight:900; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; padding-left: 5px; }

  .bar{ position:relative; height:22px; border-radius:999px; background:rgba(255,255,255,.1); border:1px solid rgba(255,255,255,.06); overflow:hidden; }
  .bar > .fill{ position:absolute; left:0; top:0; bottom:0; width:0%; background:linear-gradient(90deg, var(--neon-blue), #0099EE); box-shadow: 0 0 16px var(--glow-blue); transition: width .8s ease; }
  .bar.total > .fill{ background:linear-gradient(90deg, var(--neon-purple), #EE00AA); box-shadow: 0 0 16px var(--glow-purple); }
  .bar .value{ position:relative; z-index:1; font-weight:900; font-size:90%; color:#fff; text-shadow: 1px 1px 2px #000; line-height: 22px; }

  .medal{ display:inline-grid; place-items:center; width:30px; height:30px; border-radius:50%; font-weight:1000; color: #000; }
  .gold { background: linear-gradient(135deg, #FFD700, #FDB931); box-shadow: 0 0 10px #FFD700; }
  .silver{ background: linear-gradient(135deg, #E0E0E0, #BDBDBD); box-shadow: 0 0 10px #E0E0E0; }
  .bronze{ background: linear-gradient(135deg, #E67E22, #A04000); box-shadow: 0 0 10px #E67E22; color: #fff; }
</style>
</head>
<body>
<div id='board'>
  <div class='top-header-flex'> 
    <h2>🏁 Leaderboard</h2>
    <div id='dailyTotalDisplay'>
      <div class='label'>Total Diario (Today)</div>
      <div class='value' id='totalTodayValue'>0</div>
    </div>
  </div>

  <div class='chips'>
    <div id='chipWeekly' class='chip'>Week: —</div>
    <div id='chipDaily' class='chip'>Daily: —</div>
  </div>

  <div class='table-wrap'>
    <table id='tbl'>
      <thead>
        <tr>
          <th class='col-rank'>#</th>
          <th class='col-agent'>Agent</th>
          <th class='col-today'>Today Xfers</th>
          <th class='col-day'>Wed</th><th class='col-day'>Thu</th><th class='col-day'>Fri</th>
          <th class='col-day'>Sat</th><th class='col-day'>Mon</th><th class='col-day'>Tue</th>
          <th class='col-total'>Total</th>
        </tr>
      </thead>
      <tbody></tbody>
    </table>
  </div>
  <div id='meta' style="font-size: 10px; opacity: 0.5; padding: 10px;">
    <div id='diag'>Iniciando sistemas...</div>
  </div>
</div>

<script>
const API_KEY = "AIzaSyCCBAapFj9Fd-8cOIfpDJxrOP__76zxAxM";
const WEEKLY_ID = "1xNrDZ6uXUS0XMU3033SALOPPORgyjQomH68W2GyTAUo";
const DAILY_ID = "1MeGKl3Qok84NymsXnuHuA4reL_l9Y1SqqLuejIMeaUA";
const TIMEZONE = "America/Tijuana";

function diag(t) { document.getElementById('diag').textContent = t; }

async function syncData() {
    diag('Actualizando datos...');
    try {
        const weeklyTab = "W9"; // O usar computeWeeklyTabName() si prefiere automático
        document.getElementById('chipWeekly').textContent = `Week: ${weeklyTab}`;
        
        // Hoja semanal (A-O para cubrir nombre y totales)
        const mUrl = `https://sheets.googleapis.com/v4/spreadsheets/${WEEKLY_ID}/values/${weeklyTab}!A3:O96?key=${API_KEY}`;
        // Hoja diaria (Tabla_25: Columna B es ID, Columna C es Xfers)
        const dUrl = `https://sheets.googleapis.com/v4/spreadsheets/${DAILY_ID}/values/Tabla_25!A2:D100?key=${API_KEY}`;

        const [mRes, dRes] = await Promise.all([fetch(mUrl), fetch(dUrl)]);
        const master = await mRes.json();
        const daily = await dRes.json();

        const agentsRows = master.values || [];
        const dailyRows = daily.values || [];
        let grandTotalToday = 0;

        let processed = agentsRows.map(row => {
            const id = (row[0] || "").toString().trim();
            const name = (row[1] || "Sin Nombre").toString().trim();
            if(!id || id === "") return null;

            // BUSCAR EN DIARIO: Columna B (index 1) es el ID, Columna C (index 2) es XFERS
            const dailyMatch = dailyRows.find(d => (d[1] || "").toString().trim() === id);
            const xfersToday = dailyMatch ? parseInt(dailyMatch[2]) || 0 : 0;
            
            grandTotalToday += xfersToday;

            return {
                name,
                today: xfersToday,
                wed: row[3] || 0, thu: row[5] || 0, fri: row[7] || 0,
                sat: row[9] || 0, mon: row[11] || 0, tue: row[13] || 0,
                totalWeekly: parseInt(row[14]) || 0
            };
        }).filter(x => x !== null);

        // ORDENAR: Primero por producción de hoy, luego por el total de la semana
        processed.sort((a,b) => b.today - a.today || b.totalWeekly - a.totalWeekly);

        document.getElementById('totalTodayValue').textContent = grandTotalToday;
        render(processed);
        diag('Sincronizado: ' + new Date().toLocaleTimeString());
    } catch(e) { 
        console.error(e); 
        diag('Error de conexión'); 
    }
}

function render(data) {
    const tbody = document.querySelector("#tbl tbody");
    tbody.innerHTML = "";
    const maxToday = Math.max(...data.map(d => d.today), 1);
    const maxTotal = Math.max(...data.map(d => d.totalWeekly), 1);

    data.forEach((a, i) => {
        let rankHTML = `<span>${i+1}</span>`;
        if(i===0) rankHTML = `<div class="medal gold">1</div>`;
        if(i===1) rankHTML = `<div class="medal silver">2</div>`;
        if(i===2) rankHTML = `<div class="medal bronze">3</div>`;

        tbody.innerHTML += `
            <tr>
                <td class="col-rank">${rankHTML}</td>
                <td class="col-agent"><div class="name">${a.name}</div></td>
                <td class="col-today">
                    <div class="bar">
                        <div class="fill" style="width:${(a.today/maxToday)*100}%"></div>
                        <div class="value">${a.today}</div>
                    </div>
                </td>
                <td class="col-day">${a.wed}</td><td class="col-day">${a.thu}</td><td class="col-day">${a.fri}</td>
                <td class="col-day">${a.sat}</td><td class="col-day">${a.mon}</td><td class="col-day">${a.tue}</td>
                <td class="col-total">
                    <div class="bar total">
                        <div class="fill" style="width:${(a.totalWeekly/maxTotal)*100}%"></div>
                        <div class="value">${a.totalWeekly}</div>
                    </div>
                </td>
            </tr>`;
    });
}

syncData();
setInterval(syncData, 15000); // Refresco cada 15 seg
</script>
</body>
</html>
