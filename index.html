<!DOCTYPE html>
<html lang='es'>
<head>
<meta charset='utf-8'/>
<meta name='viewport' content='width=device-width, initial-scale=1'/>
<title>C:\DATA\LEADER.EXE</title>
<style>
  /* ===== VARIABLES ESTILO DOS/VGA TEXT MODE ===== */
  :root{
    /* Paleta clásica VGA Modo Texto (Azul/Gris/Blanco) */
    --dos-bg: #0000A8;      /* Fondo Azul Oscuro */
    --dos-fg: #A8A8A8;      /* Texto Gris Claro (Low Intensity) */
    --dos-hl: #FFFFFF;      /* Texto Blanco Brillante (High Intensity) */
    --dos-accent: #55FFFF;  /* Cian Brillante para acentos */
    --dos-yellow: #FFFF55;  /* Amarillo para alertas */
    --term-font: 'Courier New', Courier, monospace; /* Fuente monoespaciada del sistema */
  }
  
  /* Reset General para estilo Terminal */
  html,body{
    margin:0;
    height:100%;
    width:100%;
    background-color: #000; /* Borde negro del monitor */
    color:var(--dos-fg);
    font-family: var(--term-font);
    font-size: 16px;
    text-transform: uppercase; /* Todo en mayúsculas siempre */
    overflow: hidden; /* El contenedor principal manejará el scroll */
  }

  /* EFECTO CRT SCANLINE OVERLAY */
  body::after {
    content: " ";
    display: block;
    position: absolute;
    top: 0; left: 0; bottom: 0; right: 0;
    background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%), linear-gradient(90deg, rgba(255, 0, 0, 0.06), rgba(0, 255, 0, 0.02), rgba(0, 0, 255, 0.06));
    z-index: 999;
    pointer-events: none;
    background-size: 100% 2px, 3px 100%;
  }

  /* CONTENEDOR PRINCIPAL "LA PANTALLA" */
  #board{
    position:relative; z-index:1;
    width: 98%;
    height: 98%;
    margin: 1vh auto;
    background-color: var(--dos-bg); /* Fondo azul de la terminal */
    border: 2px solid var(--dos-fg); /* Borde simple */
    padding: 10px; box-sizing:border-box;
    display:flex; flex-direction:column; gap: 10px;
    overflow-y: auto;
    box-shadow: inset 0 0 20px rgba(0,0,0,0.5); /* Sombra interna para profundidad CRT */
  }
  
  /* HEADER TIPO PROGRAMA C */
  .top-header-flex{
    display: flex;
    justify-content: space-between;
    align-items: center;
    border-bottom: 1px dashed var(--dos-fg); /* Línea discontinua ASCII simulada */
    padding-bottom: 10px;
  }

  h2{
    margin:0; text-align:left;
    font-size: 1.5rem; font-weight: bold;
    color: var(--dos-hl);
  }
  h2::before { content: "PROGRAM: "; color: var(--dos-fg); }

  #dailyTotalDisplay{
    border: 1px solid var(--dos-fg);
    padding: 5px 10px;
    background: var(--dos-bg);
  }
  #dailyTotalDisplay .label{ font-size: 1rem; color: var(--dos-hl); display: inline; }
  #dailyTotalDisplay .value{ font-size: 1.2rem; color: var(--dos-accent); font-weight: bold; display: inline; margin-left: 10px;}
  #dailyTotalDisplay .value::before { content: "[ "; color: var(--dos-fg); }
  #dailyTotalDisplay .value::after { content: " ]"; color: var(--dos-fg); }

  /* CHIPS TIPO LÍNEA DE COMANDOS */
  .chips{
    display:flex; gap: 15px; flex-wrap:wrap;
    justify-content:flex-start; color: var(--dos-hl);
  }
  .chip::before{ content: "> "; color: var(--dos-fg); }

  /* TABLA TIPO HOJA DE CÁLCULO DOS */
  .table-wrap{ flex:1; min-height:0; position:relative; overflow: auto; border: 1px solid var(--dos-fg); }
  table{
    width:100%;
    min-width: 800px;
    border-collapse: collapse; 
    border-spacing: 0;
    font-size: 1rem;
  }
  
  /* Cabecera de tabla */
  thead th{
    position:sticky; top:0; z-index:2;
    background: var(--dos-fg); /* Cabecera gris invertida */
    color: var(--dos-bg);       /* Texto azul sobre gris */
    font-weight: bold;
    text-align: center; padding: 5px;
    border: 1px solid var(--dos-bg);
  }
  th.col-agent, td.col-agent{ text-align:left; }

  /* Cuerpos de tabla */
  tbody td{
    border: 1px solid var(--dos-fg); /* Rejilla simple */
    padding: 4px 8px;
    vertical-align: middle;
  }
  
  /* Cursor de selección tipo DOS */
  tbody tr:hover td{ 
    background: var(--dos-hl);
    color: var(--dos-bg);
    cursor: default;
  }
  tbody tr:hover .ascii-bar { color: var(--dos-bg); } /* Invertir color de barra al hover */

  .agent-wrap .name{ font-weight: bold; white-space:nowrap; letter-spacing: 1px; }

  /* BARRAS ASCII (Texto en lugar de DIVs) */
  .ascii-bar{ 
    font-family: var(--term-font);
    white-space: pre; /* Mantiene los espacios exactos */
    color: var(--dos-accent);
    font-weight: bold;
  }

  #meta{ margin-top: 10px; border-top: 1px dashed var(--dos-fg); padding-top:10px; }
  #diag { color: var(--dos-fg); }
  /* Efecto parpadeo del cursor */
  @keyframes blink { 50% { opacity: 0; } }
  #diag::after { content: "_"; animation: blink 1s step-start infinite; }

  /* INDICADORES DE RANGO TEXTUALES */
  .rank-txt { font-weight: bold; color: var(--dos-hl); }
  .rank-1 { color: var(--dos-yellow); } /* Oro se vuelve Amarillo brillante */

  /* MOBILE DOS VIEW (Lista secuencial) */
  @media (max-width: 768px) {
    #board { width: 100%; height: 100%; margin: 0; border: none; }
    .top-header-flex { flex-direction: column; align-items: flex-start; gap: 10px;}
    #dailyTotalDisplay { width: 100%; box-sizing: border-box; text-align: center;}
    table { min-width: unset; }
    thead { display: none; }
    tbody, tr, td { display: block; width: 100%; box-sizing: border-box; border: none; }
    
    tbody tr { 
      margin-bottom: 15px; padding: 10px; 
      border: 1px solid var(--dos-fg);
      background: var(--dos-bg);
    }
    tbody td { 
      padding: 2px 0; display: flex; 
      justify-content: space-between; align-items: center; 
      text-align: left;
    }
    th.col-day, td.col-day { display: none; }
    
    /* Etiquetas para móvil */
    td.col-rank::before { content: 'RANK:'; color: var(--dos-fg); margin-right: 10px; }
    td.col-agent::before { content: 'AGENT:'; color: var(--dos-fg); margin-right: 10px; }
    td.col-today::before { content: 'TODAY:'; color: var(--dos-fg); margin-right: 5px; }
    td.col-total::before { content: 'TOTAL:'; color: var(--dos-fg); margin-right: 5px; }
    
    .ascii-bar { text-align: right; flex-grow: 1; }
  }
</style>
</head>
<body>
<div id='board'>
  <div class='top-header-flex'> 
    <h2>SALES_DB.C</h2>
    <div id='dailyTotalDisplay'>
      <span class='label'>TOTAL(TODAY):</span>
      <span class='value' id='totalTodayValue'>0</span>
    </div>
  </div>

  <div class='chips'>
    <div id='chipWeekly' class='chip'>WEEK: ???</div>
    <div id='chipDaily' class='chip'>DAILY: ???</div>
  </div>

  <div class='table-wrap'>
    <table id='tbl'>
      <thead>
        <tr>
          <th class='col-rank'>ID</th>
          <th class='col-agent'>AGENT_NAME</th>
          <th class='col-today' style="width:15%">TODAY_PERF</th>
          <th class='col-day'>WED</th>
          <th class='col-day'>THU</th>
          <th class='col-day'>FRI</th>
          <th class='col-day'>SAT</th>
          <th class='col-day'>MON</th>
          <th class='col-day'>TUE</th>
          <th class='col-total' style="width:15%">TOTAL_ACC</th>
        </tr>
      </thead>
      <tbody></tbody>
    </table>
  </div>

  <div id='meta'>
    <div id='diag'>C:\> INITIATING DATA RETRIEVAL...</div>
  </div>
</div>

<script>
// Configuración para barras ASCII
const BAR_LENGTH = 12; // Longitud total de caracteres de la barra
const CHAR_FILL = '█'; // Carácter lleno (Bloque sólido ASCII 219)
const CHAR_EMPTY = '░'; // Carácter vacío (Sombra ligera ASCII 176)

/* IDs y API (MISMOS DATOS) */
const API_KEY        = "AIzaSyDwOqp2uizZol2et6Uqi7CnntW9Hkrinjg";
const WEEKLY_SHEETID = "1xNrDZ6uXUS0XMU3033SALOPPORgyjQomH68W2GyTAUo";
const DAILY_ID_RAW   = "1MeGKl3Qok84NymsXnuHuA4reL_l9Y1SqqLuejIMeaUA";
const TIMEZONE       = "America/Tijuana";
const DAILY_REFRESH  = 12000; 
let ALL_DATA=[]; 

function diag(t){ document.getElementById('diag').textContent = `C:\\> ${t}`; }
function setChipWeekly(t){ document.getElementById('chipWeekly').textContent = `WEEK: ${t}`; }
function setChipDaily(t){ document.getElementById('chipDaily').textContent = `DAILY: ${t}`; }
function getLocalDate(){ const s=new Date().toLocaleString('en-US',{timeZone:TIMEZONE}); return new Date(s); }
function isoWeek(d){ const x=new Date(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate())); const n=x.getUTCDay()||7; x.setUTCDate(x.getUTCDate()+4-n); const y=new Date(Date.UTC(x.getUTCFullYear(),0,1)); return {week:Math.ceil((((x-y)/86400000)+1)/7), year:x.getUTCFullYear()}; }
function weeksInISOYear(y){ const d=new Date(Date.UTC(y,11,31)); const day=d.getUTCDay(); return (day===4 || (d.getUTCDate()===31 && day===3))?53:52; }
function computeWeeklyTabName(){
  const url=new URL(window.location.href); const override=url.searchParams.get('weeklyTab'); if(override) return override;
  const local=getLocalDate(); const hrs=local.getHours(); const dow=local.getDay(); const iw=isoWeek(local); let w=iw.week;
  const afterCut=(dow>4)||(dow===4&&hrs>=14); if(afterCut){ w++; const mx=weeksInISOYear(iw.year); if(w>mx){w=1;} }
  return `W${w}`;
}
const emoji=/[\u{1F1E6}-\u{1F1FF}\u{1F300}-\u{1FAFF}\u{1F900}-\u{1F9FF}\u{2600}-\u{27BF}\u{FE0F}]/gu;
function normName(s){ return (s||"").replace(emoji,"").normalize('NFD').replace(/[\u0300-\u036f]/g,"").replace(/[^\x20-\x7E]/g,"").replace(/\s{2,}/g," ").trim().toUpperCase(); }
function normID(s){ return (s||"").toString().trim(); }

async function fetchSafeJSON(url, {tries=4, baseDelay=700} = {}) {
  let lastErr;
  for (let i = 0; i < tries; i++) {
    try {
      const r = await fetch(url, { cache: 'no-store', headers: { 'Cache-Control': 'no-cache, no-store, max-age=0', 'Pragma': 'no-cache' }});
      if (r.ok) return await r.json();
      const text = await r.text();
      if (r.status === 429 || (r.status >= 500 && r.status < 600)) {
        await new Promise(res => setTimeout(res, baseDelay * Math.pow(2, i) + Math.random() * 250)); continue;
      }
      throw new Error(`HTTP ${r.status}`);
    } catch (e) { lastErr = e; await new Promise(res => setTimeout(res, baseDelay * Math.pow(2, i) + Math.random() * 250)); }
  }
  throw lastErr || new Error('Err');
}

// (Funciones de lectura de datos readWeeklyTab y readDailyApproved se mantienen igual que en versiones anteriores. Omitidas por brevedad pero NECESARIAS)
async function readWeeklyTab(weeklyTab){
  const ranges=[`${weeklyTab}!A3:C96`,`${weeklyTab}!D3:D96`,`${weeklyTab}!F3:F96`,`${weeklyTab}!H3:H96`,`${weeklyTab}!J3:J96`,`${weeklyTab}!L3:L96`,`${weeklyTab}!N3:N96`,`${weeklyTab}!O3:O96`].map(encodeURIComponent);
  const url=`https://sheets.googleapis.com/v4/spreadsheets/${WEEKLY_SHEETID}/values:batchGet?`+ranges.map(r=>`ranges=${r}`).join("&")+`&valueRenderOption=UNFORMATTED_VALUE&key=${API_KEY}`;
  const j=await fetchSafeJSON(url); const vr=j.valueRanges||[];
  const base=vr[0]?.values||[]; const toCol=v=>(v?.values||[]).map(r=>(r[0]??"").toString().trim());
  const d=toCol(vr[1]), f=toCol(vr[2]), h=toCol(vr[3]), jv=toCol(vr[4]), l=toCol(vr[5]), n=toCol(vr[6]), oT=toCol(vr[7]);
  const len=Math.max(base.length,d.length,f.length,h.length,jv.length,l.length,n.length,oT.length);
  const out=[];
  for(let i=0;i<len;i++){
    const id=normID(base[i]?.[0]??""); const name=(base[i]?.[1]??"").toString().trim();
    if(!id && !name) continue;
    out.push({ id,idKey:id, name, nameKey:normName(name),
      wed:parseInt(d[i]||0), thu:parseInt(f[i]||0), fri:parseInt(h[i]||0),
      sat:parseInt(jv[i]||0), mon:parseInt(l[i]||0), tue:parseInt(n[i]||0),
      total:parseInt(oT[i]||0), today:0 });
  }
  out.sort((a,b)=>(b.total||0)-(a.total||0));
  return out;
}
function fmtDailyTab(dt){ const m=new Intl.DateTimeFormat('en-US',{month:'short',timeZone:TIMEZONE}).format(dt); const dd=new Intl.DateTimeFormat('en-US',{day:'2-digit',timeZone:TIMEZONE}).format(dt); return `${m} ${dd}`; }
function getDailyTabCandidates(){
  const url=new URL(window.location.href); const o=url.searchParams.get('dailyTab'); if(o) return [o];
  const now=getLocalDate(); const y=new Date(now.getTime()-86400000); return [fmtDailyTab(now), fmtDailyTab(y)];
}
async function readDailyApproved(){
  const rangesFor=tab=>([`${tab}!A2:A70`,`${tab}!B2:B70`,`${tab}!C2:C70`,`${tab}!E2:E70`,`${tab}!F2:F70`,`${tab}!G2:G70`].map(encodeURIComponent));
  const tabs=getDailyTabCandidates();
  const DAILY_IDS=[DAILY_ID_RAW];
  for(const id of DAILY_IDS){
    for(const tab of tabs){
      const url=`https://sheets.googleapis.com/v4/spreadsheets/${id}/values:batchGet?`+rangesFor(tab).map(r=>`ranges=${r}`).join("&")+`&valueRenderOption=UNFORMATTED_VALUE&key=${API_KEY}`;
      try{
        const j=await fetchSafeJSON(url); const vr=j.valueRanges||[];
        const A=vr[0]?.values||[], B=vr[1]?.values||[], C=vr[2]?.values||[];
        const E=vr[3]?.values||[], F=vr[4]?.values||[], G=vr[5]?.values||[];
        const mapByName=new Map(); const mapByID=new Map();
        function addPair(nmCell,idCell,valCell){
          const nm=(nmCell?.[0]??"").toString(); const id=(idCell?.[0]??"").toString().trim(); const v=parseInt((valCell?.[0]??0))||0;
          if(nm.trim()){ const nk=normName(nm); mapByName.set(nk,(mapByName.get(nk)||0)+v); }
          if(id){ mapByID.set(id,(mapByID.get(id)||0)+v); }
        }
        const rowsFK=Math.max(A.length,B.length,C.length); for(let i=0;i<rowsFK;i++) addPair(A[i],B[i],C[i]);
        const rowsRG=Math.max(E.length,F.length,G.length); for(let i=0;i<rowsRG;i++) addPair(E[i],F[i],G[i]);
        return {id, tab, mapByName, mapByID};
      }catch(e){ /* intenta siguiente tab */ }
    }
  }
  return {id:DAILY_IDS[0], tab:tabs[0], mapByName:new Map(), mapByID:new Map()};
}

function updateTotalDisplay(total){ document.getElementById('totalTodayValue').textContent = total; }

// ===== NUEVA FUNCIÓN PARA GENERAR BARRAS ASCII =====
function generateAsciiBar(value, max) {
  if (max === 0) max = 1;
  // Calcular cuántos caracteres llenar
  const filledCount = Math.round((value / max) * BAR_LENGTH);
  const emptyCount = BAR_LENGTH - filledCount;
  // Generar string: █████░░░░░ [123]
  const barStr = CHAR_FILL.repeat(filledCount) + CHAR_EMPTY.repeat(emptyCount);
  // Añadir el número al final, alineado a la derecha con ceros si se desea, o simple
  return `[${barStr}] ${value.toString().padStart(3, ' ')}`;
}

function renderList(list){
  const tbody=document.querySelector("#tbl tbody"); tbody.innerHTML="";
  
  // Obtenemos máximos para calcular las barras relativas
  const maxToday=Math.max(1, ...list.map(p=>p.today||0)); 
  const maxTotal=Math.max(1, ...list.map(p=>p.total||0));
  
  list.forEach((p,i)=>{
    const rowIndex=i;
    const today=p.today||0, total=p.total||0;

    // ===== MEDALLAS DE TEXTO SIMPLE =====
    let rankTxt = (rowIndex + 1).toString().padStart(2, '0'); // 01, 02, 03...
    let rankClass = 'rank-txt';
    if (rowIndex===0) { rankTxt = '[1ST]'; rankClass += ' rank-1'; }
    else if (rowIndex===1) { rankTxt = '[2ND]'; }
    else if (rowIndex===2) { rankTxt = '[3RD]'; }

    // GENERAR BARRAS ASCII
    const asciiToday = generateAsciiBar(today, maxToday);
    const asciiTotal = generateAsciiBar(total, maxTotal);

    const tr=document.createElement('tr');
    tr.innerHTML = `
      <td class="col-rank"><span class="${rankClass}">${rankTxt}</span></td>
      <td class="col-agent">
        <div class="agent-wrap"><div class="name">${p.name}</div></div>
      </td>
      <td class="col-today"><div class="ascii-bar">${asciiToday}</div></td>
      <td class="col-day">${p.wed||0}</td>
      <td class="col-day">${p.thu||0}</td>
      <td class="col-day">${p.fri||0}</td>
      <td class="col-day">${p.sat||0}</td>
      <td class="col-day">${p.mon||0}</td>
      <td class="col-day">${p.tue||0}</td>
      <td class="col-total"><div class="ascii-bar">${asciiTotal}</div></td>
    `;
    tbody.appendChild(tr);
    // Nota: Se eliminó la animación setTimeout, las barras de texto son instantáneas.
  });
}

async function updateData(){
  diag('EXECUTING QUERY...');
  const weeklyTab=computeWeeklyTabName();
  setChipWeekly(weeklyTab);

  const [weeklyData, dailyData] = await Promise.all([ readWeeklyTab(weeklyTab), readDailyApproved() ]);
  setChipDaily(dailyData.tab);
  
  const tempMap = new Map(); weeklyData.forEach(p => tempMap.set(p.idKey, p));
  dailyData.mapByName.forEach((score, nameKey) => { let agent = weeklyData.find(p => p.nameKey === nameKey); if (agent) agent.today = score; });
  dailyData.mapByID.forEach((score, idKey) => { let agent = tempMap.get(idKey); if (agent) agent.today = score; });

  weeklyData.sort((a, b) => {
    if ((b.today || 0) !== (a.today || 0)) return (b.today || 0) - (a.today || 0);
    return ((b.total||0) + (b.today||0)) - ((a.total||0) + (a.today||0));
  });

  ALL_DATA = weeklyData.filter((p, i) => i < 3 || (p.total||0) > 0 || (p.today||0) > 0);
  updateTotalDisplay(ALL_DATA.reduce((sum, p) => sum + (p.today || 0), 0));

  // Timestamp estilo DOS
  const now = new Date();
  const timeStr = now.toLocaleTimeString('en-US', {timeZone: TIMEZONE, hour12: false});
  diag(`DATA REFRESHED. LAST_UPDATE: [${timeStr}] TAB:[${weeklyTab}]`);
}

(async function init(){ await updateData(); renderList(ALL_DATA); setInterval(updateData, DAILY_REFRESH); })();
</script>
</body>
</html>
