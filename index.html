<!DOCTYPE html>
<html lang='es'>
<head>
<meta charset='utf-8'/>
<meta name='viewport' content='width=device-width, initial-scale=1'/>
<title>Leaderboard — Valentine's Edition</title>
<style>
  /* Variables de Color (Valentine Theme) */
  :root{
    --vh: 1vh;
    --dark-bg: #1a0205; /* Rojo muy oscuro */
    --ink:#fff0f3;  
    --glass: rgba(145, 10, 45, 0.3);
    --glass-strong: rgba(70, 5, 20, 0.8);
    --valentine-red: #ff4d6d;
    --valentine-pink: #ff85a1;
    --valentine-gold: #ffb703;
    --glow-red: rgba(255, 77, 109, 0.5);
    --glow-pink: rgba(255, 133, 161, 0.4);
  }
  
  /* ===== BACKGROUND CON CORAZONES ===== */
  html,body{
    margin:0;
    min-height:100%;
    width:100%;
    background:var(--dark-bg);
    color:var(--ink);
    font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    overflow-x: hidden;
    overflow-y: auto;
  }
  
  /* Efecto de fondo animado */
  body::before {
    content: "❤"; position: fixed; top: -10%; left: 10%;
    font-size: 20px; color: var(--valentine-pink); opacity: 0.2;
    z-index: 0; animation: hearts 15s linear infinite;
    text-shadow: 40vw 15vh 0, 70vw 45vh 0, 20vw 80vh 0, 80vw 20vh 0;
  }
  
  @keyframes hearts {
    0% { transform: translateY(0) rotate(0deg); opacity: 0; }
    50% { opacity: 0.3; }
    100% { transform: translateY(110vh) rotate(360deg); opacity: 0; }
  }

  #board{
    position:relative; z-index:1;
    width:100vw;
    min-height:100vh;
    padding:calc(1.2*var(--vh)) calc(1.6*var(--vh)); box-sizing:border-box;
    background: radial-gradient(circle at center, #4a0414 0%, var(--dark-bg) 100%);
    display:flex;flex-direction:column;gap:calc(0.8*var(--vh));
  }
  
  /* HEADER */
  .top-header-flex{
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 10px;
  }
  #dailyTotalDisplay{
    background: var(--glass-strong);
    padding: 8px 16px;
    border-radius: 15px;
    border: 2px solid var(--valentine-red);
    box-shadow: 0 0 20px var(--glow-red);
    text-align: right;
  }
  #dailyTotalDisplay .label{
    font-size: calc(1.4*var(--vh));
    font-weight: 700;
    color: var(--valentine-pink);
    text-transform: uppercase;
  }
  #dailyTotalDisplay .value{
    font-size: calc(3.0*var(--vh));
    font-weight: 900;
    color: #fff;
    filter: drop-shadow(0 0 8px var(--valentine-red));
  }

  h2{
    margin:0; text-align:left; font-weight:900;
    font-size:calc(4.0*var(--vh)); line-height:1.1;
    color: var(--valentine-red);
    filter: drop-shadow(0 2px 4px rgba(0,0,0,0.5));
  }
  .chips{
    display:flex; gap:calc(.6*var(--vh)); flex-wrap:wrap;
    justify-content:center; margin-top:calc(-.3*var(--vh));
  }
  .chip{
    padding:calc(.35*var(--vh)) calc(.8*var(--vh));
    border-radius:999px;
    background: var(--glass);
    backdrop-filter: blur(8px);
    border:1px solid var(--valentine-pink);
    font-weight:800; font-size:calc(1.5*var(--vh));
    color: var(--valentine-pink);
  }

  /* TABLA */
  .table-wrap{ flex:1; min-height:0; position:relative; }
  table{
    width:100%; min-width: 500px;
    border-collapse:separate; border-spacing:0 12px;
    table-layout:fixed; font-size:calc(1.7*var(--vh));
  }
  thead th{
    position:sticky; top:0; z-index:2;
    background: #5e0b1b;
    color: var(--valentine-pink);
    text-transform:uppercase; font-size:calc(1.6*var(--vh)); padding:calc(.6*var(--vh));
    border-radius:8px;
  }
  
  tbody td{
    background: var(--glass);
    border-top:1px solid rgba(255,133,161,.1);
    border-bottom:1px solid rgba(255,133,161,.1);
    padding:calc(.7*var(--vh)) calc(0.9*var(--vh));
  }
  tbody tr td:first-child{ border-left:2px solid var(--valentine-red); border-top-left-radius:20px; border-bottom-left-radius:20px; }
  tbody tr td:last-child { border-right:2px solid var(--valentine-red); border-top-right-radius:20px; border-bottom-right-radius:20px; }
  
  tbody tr:hover{ 
    transform: scale(1.01); 
    background: rgba(255, 77, 109, 0.15); 
    transition: all 0.3s ease;
  }

  /* Barras Románticas */
  .bar{ position:relative; height:22px; border-radius:999px; background:rgba(255,255,255,0.05); overflow:hidden; border: 1px solid rgba(255,255,255,0.1); }
  .bar > .fill{ 
    position:absolute; left:0; top:0; bottom:0; width:0%; 
    background: linear-gradient(90deg, #ff4d6d, #c9184a); 
    box-shadow: 0 0 15px var(--glow-red);
    transition: width 1s cubic-bezier(0.175, 0.885, 0.32, 1.275); 
  }
  .bar.total > .fill{ 
    background: linear-gradient(90deg, #ffb703, #fb8500); 
    box-shadow: 0 0 15px rgba(255, 183, 3, 0.4); 
  }
  .bar .value{ position:relative; z-index:1; font-weight:900; font-size:90%; color:#fff; text-shadow: 1px 1px 2px #000; }

  /* MEDALLAS DE CORAZÓN */
  .medal{
    display:inline-grid; place-items:center;
    width:38px; height:38px;
    clip-path: path('M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z');
    margin-right:8px; font-weight:1000; font-size:14px;
    transform: scale(1.8);
  }
  .gold { background: #FFD700; color: #5e0b1b; }
  .silver{ background: #E0E0E0; color: #5e0b1b; }
  .bronze{ background: #CD7F32; color: #fff; }
  
  #meta{ padding: 10px; font-weight:800; color: var(--valentine-pink); }
  .pulse { animation: heartBeat 1.5s infinite; }
  @keyframes heartBeat {
    0% { transform: scale(1); }
    14% { transform: scale(1.1); }
    28% { transform: scale(1); }
    42% { transform: scale(1.1); }
    70% { transform: scale(1); }
  }

  /* MOBILE ADAPTATION */
  @media (max-width: 768px) {
    h2 { font-size: 2.5em; text-align: center; }
    tbody tr { border: 1px solid var(--valentine-red); margin-bottom: 15px; background: var(--glass-strong); }
    .medal { transform: scale(1.4); }
  }
</style>
</head>
<body>
<div id='board'>
  <div class='top-header-flex'> 
    <h2>🌹 Love Board</h2>
    <div id='dailyTotalDisplay'>
      <div class='label'>Pasión del Día</div>
      <div class='value' id='totalTodayValue'>0</div>
    </div>
  </div>

  <div class='chips'>
    <div id='chipWeekly' class='chip'>Semana: —</div>
    <div id='chipDaily' class='chip'>Hoy: —</div>
  </div>

  <div class='table-wrap'>
    <table id='tbl'>
      <thead>
        <tr>
          <th class='col-rank'>#</th>
          <th class='col-agent'>Agente</th>
          <th class='col-today'>Hoy</th>
          <th class='col-day'>Mié</th>
          <th class='col-day'>Jue</th>
          <th class='col-day'>Vie</th>
          <th class='col-day'>Sáb</th>
          <th class='col-day'>Lun</th>
          <th class='col-day'>Mar</th>
          <th class='col-total'>Total</th>
        </tr>
      </thead>
      <tbody></tbody>
    </table>
  </div>

  <div id='meta'>
    <div id='diag' class="pulse">Preparando flechas de Cupido...</div>
  </div>
</div>

<script>
// Mantengo toda su lógica funcional intacta para que el dashboard siga operando igual
function setVHVar(){ const vh=window.innerHeight*0.01; document.documentElement.style.setProperty('--vh', `${vh}px`); }
setVHVar(); window.addEventListener('resize', setVHVar);

const API_KEY        = "AIzaSyDwOqp2uizZol2et6Uqi7CnntW9Hkrinjg";
const WEEKLY_SHEETID = "1xNrDZ6uXUS0XMU3033SALOPPORgyjQomH68W2GyTAUo";
const DAILY_ID_RAW   = "1MeGKl3Qok84NymsXnuHuA4reL_l9Y1SqqLuejIMeaUA";
const TIMEZONE        = "America/Tijuana";
const DAILY_REFRESH   = 12000; 
const WEEKLY_REFRESH = 5*60*1000;

let ALL_DATA=[]; 

function diag(t, cls){ document.getElementById('diag').innerHTML = `<span class="${cls||''}">${t}</span>`; }
function setChipWeekly(t){ document.getElementById('chipWeekly').textContent = `Semana: ${t}`; }
function setChipDaily(t){ document.getElementById('chipDaily').textContent = `Día: ${t}`; }
function getLocalDate(){ const s=new Date().toLocaleString('en-US',{timeZone:TIMEZONE}); return new Date(s); }
function isoWeek(d){ const x=new Date(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate())); const n=x.getUTCDay()||7; x.setUTCDate(x.getUTCDate()+4-n); const y=new Date(Date.UTC(x.getUTCFullYear(),0,1)); return {week:Math.ceil((((x-y)/86400000)+1)/7), year:x.getUTCFullYear()}; }
function weeksInISOYear(y){ const d=new Date(Date.UTC(y,11,31)); const day=d.getUTCDay(); return (day===4 || (d.getUTCDate()===31 && day===3))?53:52; }
function computeWeeklyTabName(){
  const url=new URL(window.location.href); const override=url.searchParams.get('weeklyTab'); if(override) return override;
  const local=getLocalDate(); const hrs=local.getHours(); const dow=local.getDay(); const iw=isoWeek(local); let w=iw.week;
  const afterCut=(dow>4)||(dow===4&&hrs>=14); if(afterCut){ w++; const mx=weeksInISOYear(iw.year); if(w>mx){w=1;} }
  return `W${w}`;
}
const emoji=/[\u{1F1E6}-\u{1F1FF}\u{1F300}-\u{1FAFF}\u{1F900}-\u{1F9FF}\u{2600}-\u{27BF}\u{FE0F}]/gu;
function normName(s){ return (s||"").replace(emoji,"").normalize('NFD').replace(/[\u0300-\u036f]/g,"").replace(/[^\x20-\x7E]/g,"").replace(/\s{2,}/g," ").trim().toUpperCase(); }
function normID(s){ return (s||"").toString().trim(); }

async function fetchSafeJSON(url, {tries=4, baseDelay=700} = {}) {
  let lastErr;
  for (let i = 0; i < tries; i++) {
    try {
      const r = await fetch(url, { cache: 'no-store' });
      if (r.ok) return await r.json();
      await new Promise(res => setTimeout(res, baseDelay * Math.pow(2, i)));
    } catch (e) { lastErr = e; }
  }
  throw lastErr || new Error('Error de conexión');
}

async function readWeeklyTab(weeklyTab){
  const ranges=[`${weeklyTab}!A3:C96`,`${weeklyTab}!D3:D96`,`${weeklyTab}!F3:F96`,`${weeklyTab}!H3:H96`,`${weeklyTab}!J3:J96`,`${weeklyTab}!L3:L96`,`${weeklyTab}!N3:N96`,`${weeklyTab}!O3:O96`].map(encodeURIComponent);
  const url=`https://sheets.googleapis.com/v4/spreadsheets/${WEEKLY_SHEETID}/values:batchGet?`+ranges.map(r=>`ranges=${r}`).join("&")+`&valueRenderOption=UNFORMATTED_VALUE&key=${API_KEY}`;
  const j=await fetchSafeJSON(url); const vr=j.valueRanges||[];
  const base=vr[0]?.values||[]; const toCol=v=>(v?.values||[]).map(r=>(r[0]??"").toString().trim());
  const d=toCol(vr[1]), f=toCol(vr[2]), h=toCol(vr[3]), jv=toCol(vr[4]), l=toCol(vr[5]), n=toCol(vr[6]), oT=toCol(vr[7]);
  const len=Math.max(base.length,d.length,f.length,h.length,jv.length,l.length,n.length,oT.length);
  const out=[];
  for(let i=0;i<len;i++){
    const id=normID(base[i]?.[0]??""); const name=(base[i]?.[1]??"").toString().trim();
    if(!id && !name) continue;
    out.push({ id,idKey:id, name, nameKey:normName(name),
      wed:parseInt(d[i]||0), thu:parseInt(f[i]||0), fri:parseInt(h[i]||0),
      sat:parseInt(jv[i]||0), mon:parseInt(l[i]||0), tue:parseInt(n[i]||0),
      total:parseInt(oT[i]||0), today:0 });
  }
  return out;
}

function fmtDailyTab(dt){ const m=new Intl.DateTimeFormat('en-US',{month:'short',timeZone:TIMEZONE}).format(dt); const dd=new Intl.DateTimeFormat('en-US',{day:'2-digit',timeZone:TIMEZONE}).format(dt); return `${m} ${dd}`; }

async function readDailyApproved(){
  const tabs = [fmtDailyTab(getLocalDate()), fmtDailyTab(new Date(getLocalDate().getTime()-86400000))];
  for(const tab of tabs){
    const url=`https://sheets.googleapis.com/v4/spreadsheets/${DAILY_ID_RAW}/values:batchGet?ranges=${tab}!A2:G70&valueRenderOption=UNFORMATTED_VALUE&key=${API_KEY}`;
    try{
      const j=await fetchSafeJSON(url);
      const rows = j.valueRanges[0].values || [];
      const mapByName=new Map(); const mapByID=new Map();
      rows.forEach(r => {
        if(r[0]){ const nk=normName(r[0]); mapByName.set(nk, (mapByName.get(nk)||0) + (parseInt(r[2])||0)); }
        if(r[4]){ const nk=normName(r[4]); mapByName.set(nk, (mapByName.get(nk)||0) + (parseInt(r[6])||0)); }
      });
      return {tab, mapByName, mapByID};
    }catch(e){}
  }
  return {tab:'N/A', mapByName:new Map(), mapByID:new Map()};
}

function renderList(list){
  const tbody=document.querySelector("#tbl tbody"); tbody.innerHTML="";
  const maxToday=Math.max(1, ...list.map(p=>p.today||0)); 
  const maxTotal=Math.max(1, ...list.map(p=>p.total||0));
  
  list.forEach((p,i)=>{
    const tr=document.createElement('tr');
    let medal = i < 3 ? `<span class="medal ${['gold','silver','bronze'][i]}">${i+1}</span>` : `<span>${i+1}</span>`;
    
    tr.innerHTML = `
      <td class="col-rank"><div class="rankwrap">${medal}</div></td>
      <td class="col-agent"><div class="name"><strong>${p.name}</strong></div></td>
      <td class="col-today"><div class="bar today"><div class="fill"></div><div class="value">${p.today}</div></div></td>
      <td class="col-day">${p.wed}</td><td class="col-day">${p.thu}</td><td class="col-day">${p.fri}</td>
      <td class="col-day">${p.sat}</td><td class="col-day">${p.mon}</td><td class="col-day">${p.tue}</td>
      <td class="col-total"><div class="bar total"><div class="fill"></div><div class="value">${p.total}</div></div></td>
    `;
    tbody.appendChild(tr);
    setTimeout(()=>{
      tr.querySelector('.today .fill').style.width = (p.today/maxToday*100)+'%';
      tr.querySelector('.total .fill').style.width = (p.total/maxTotal*100)+'%';
    }, 100);
  });
}

async function updateData(){
  diag('Sincronizando corazones...', 'pulse');
  const weeklyTab=computeWeeklyTabName();
  const [weekly, daily] = await Promise.all([readWeeklyTab(weeklyTab), readDailyApproved()]);
  
  setChipWeekly(weeklyTab); setChipDaily(daily.tab);
  
  weekly.forEach(p => {
    p.today = daily.mapByName.get(p.nameKey) || 0;
  });

  weekly.sort((a,b) => (b.today||0) - (a.today||0) || (b.total||0) - (a.total||0));
  ALL_DATA = weekly.filter((p,i) => i < 10 || p.total > 0 || p.today > 0);
  
  document.getElementById('totalTodayValue').textContent = ALL_DATA.reduce((s,p)=>s+p.today,0);
  renderList(ALL_DATA);
  diag(`Último flechazo: ${new Date().toLocaleTimeString()}`);
}

(async function init(){
  await updateData();
  setInterval(updateData, DAILY_REFRESH);
})();
</script>
</body>
</html>
