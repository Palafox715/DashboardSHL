<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Monthly Competition — Rugrats vs Cotton Pickers</title>
<style>
  :root {
    --bg-dark: #0b0c10;
    --panel-dark: #1f2833;
    --text-main: #c5c6c7;
    --text-light: #ffffff;
    --neon-green: #00ffcc; /* Verde Ciberpunk */
    --neon-orange: #ff4500; /* Naranja Intenso */
  }

  body {
    margin: 0;
    font-family: "Inter", system-ui, sans-serif;
    background: var(--bg-dark);
    color: var(--text-main);
    overflow-x: hidden;
  }

  header {
    text-align: center;
    padding: 1rem 0 0.5rem 0;
  }

  h1 {
    font-size: 2.4rem;
    font-weight: 800;
    margin-bottom: 0.3rem;
    color: var(--text-light);
    text-shadow: 0 0 10px rgba(255, 255, 255, 0.2);
  }

  #week-num { display: none; }

  /* ===== Barra de Conquista ===== */
  .supremacy-wrapper {
    position: relative;
    width: 80%;
    height: 45px;
    margin: 1.5rem auto;
    background: #111;
    border-radius: 8px;
    border: 2px solid #333;
    display: flex;
    overflow: hidden;
    box-shadow: 0 0 20px rgba(0, 0, 0, 0.8) inset, 0 5px 15px rgba(0,0,0,0.5);
  }

  .supremacy-side {
    height: 100%;
    transition: width 0.8s cubic-bezier(0.25, 1, 0.5, 1);
    display: flex;
    align-items: center;
    position: relative;
  }

  .team-rug-bar {
    width: 50%;
    background: linear-gradient(90deg, rgba(0,255,204,0.2) 0%, rgba(0,255,204,0.8) 100%);
    box-shadow: inset -5px 0 15px var(--neon-green);
  }

  .team-fk-bar {
    width: 50%;
    background: linear-gradient(270deg, rgba(255,69,0,0.2) 0%, rgba(255,69,0,0.8) 100%);
    box-shadow: inset 5px 0 15px var(--neon-orange);
  }

  .clash-point {
    position: absolute;
    top: -5px;
    bottom: -5px;
    width: 6px;
    background: #fff;
    box-shadow: 0 0 15px #fff, 0 0 30px #fff;
    transform: translateX(-50%);
    z-index: 10;
    transition: left 0.8s cubic-bezier(0.25, 1, 0.5, 1);
    left: 50%; 
  }

  .bar-labels {
    display: flex;
    justify-content: space-between;
    width: 80%;
    margin: 0.5rem auto 1.5rem auto;
    font-weight: 800;
    font-size: 1.2rem;
    text-transform: uppercase;
    letter-spacing: 1px;
  }

  #rugrats-label { color: var(--neon-green); text-shadow: 0 0 8px rgba(0, 255, 204, 0.5); }
  #filekeepers-label { color: var(--neon-orange); text-shadow: 0 0 8px rgba(255, 69, 0, 0.5); }

  /* ===== Dashboard ===== */
  .dashboard {
    display: flex;
    justify-content: center;
    align-items: flex-start;
    width: 90%;
    margin: 1rem auto 3rem auto;
    gap: 19rem;
    position: relative;
  }

  .team {
    flex: 1;
    background: var(--panel-dark);
    border-radius: 46px;
    box-shadow: 0 10px 25px rgba(0,0,0,0.5);
    overflow: hidden;
    min-width: 580px;
    max-width: 840px;
    border: 1px solid #333;
  }

  h2 {
    text-align: center;
    color: var(--neon-green);
    background: rgba(0, 255, 204, 0.1);
    padding: 0.8rem;
    font-size: 1.4rem;
    font-weight: 800;
    margin: 0;
    text-shadow: 0 0 5px var(--neon-green);
  }

  h2.orange {
    color: var(--neon-orange);
    background: rgba(255, 69, 0, 0.1);
    text-shadow: 0 0 5px var(--neon-orange);
  }

  table {
    width: 100%;
    border-collapse: collapse;
    text-align: center;
    font-size: 1.0rem;
    color: var(--text-main);
  }

  th, td {
    padding: 8px 10px;
    border-bottom: 1px solid #333;
  }

  th {
    background: rgba(0, 255, 204, 0.2);
    color: var(--neon-green);
    font-weight: 700;
    text-transform: uppercase;
  }

  .team.orange th { 
    background: rgba(255, 69, 0, 0.2); 
    color: var(--neon-orange);
  }

  tr:nth-child(even) td { background: rgba(255, 255, 255, 0.03); }

  .sum-row {
    background: #111;
    color: var(--text-light);
    font-weight: 700;
  }

  /* === Middle XFER Totals === */
  .totals-center {
    position: absolute;
    top: 30%;
    left: 50%;
    transform: translate(-50%, -55%);
    background: var(--panel-dark);
    border-radius: 65px;
    padding: 1.3rem 2.3rem;
    text-align: center;
    box-shadow: 0 8px 25px rgba(0,0,0,0.5);
    border: 2px solid #333;
  }

  .totals-center h3 {
    margin: 0;
    font-size: 1.3rem;
    color: var(--text-light);
  }

  .totals-center span {
    display: block;
    font-size: 2.7rem;
    font-weight: 800;
    margin: 0.3rem 0;
    transition: all 0.3s ease-in-out;
  }

  .win { color: var(--neon-green); text-shadow: 0 0 10px var(--neon-green); }
  .lose { color: var(--neon-orange); opacity: 0.8; }

  footer {
    text-align: center;
    font-size: 0.9rem;
    color: #555;
    margin-bottom: 1rem;
  }
</style>
</head>
<body>
<header>
  <h1>Monthly Competition</h1>
  
  <div class="supremacy-wrapper">
    <div id="rug-bar" class="supremacy-side team-rug-bar"></div>
    <div id="fk-bar" class="supremacy-side team-fk-bar"></div>
    <div id="clash-indicator" class="clash-point"></div>
  </div>

  <div class="bar-labels">
    <span id="rugrats-label">🦖 Rugrats: 0% (0)</span>
    <span id="filekeepers-label">🧑🏿‍🌾 Cotton Pickers: 0% (0)</span>
  </div>
</header>

<div class="dashboard">
  <div class="team">
    <h2>🦖 Rugrats</h2>
    <table id="table-rugrats">
      <thead>
        <tr><th>Agent</th><th>ID</th><th>Cr Pull</th><th>Xfer</th><th>Total</th></tr>
      </thead>
      <tbody></tbody>
      <tfoot><tr class="sum-row"><td colspan="2">TOTAL</td><td id="rug-cr">0</td><td id="rug-xf">0</td><td id="rug-total">0</td></tr></tfoot>
    </table>
  </div>

  <div class="totals-center" id="totals-center">
    <h3>XFER Totals</h3>
    <span id="rug-xfer-total">0</span>
    <span style="font-size:3.0rem;">🦖 vs 🧑🏿‍🌾</span>
    <span id="fk-xfer-total">0</span>
  </div>

  <div class="team orange">
    <h2 class="orange">🧑🏿‍🌾 Cotton Pickers</h2>
    <table id="table-filekeepers">
      <thead>
        <tr><th>Agent</th><th>ID</th><th>Cr Pull</th><th>Xfer</th><th>Total</th></tr>
      </thead>
      <tbody></tbody>
      <tfoot><tr class="sum-row"><td colspan="2">TOTAL</td><td id="fk-cr">0</td><td id="fk-xf">0</td><td id="fk-total">0</td></tr></tfoot>
    </table>
  </div>
</div>

<footer>Endless Marketing Services — Monthly Dashboard</footer>

<script>
const SHEET_ID = "1xNrDZ6uXUS0XMU3033SALOPPORgyjQomH68W2GyTAUo";
const API_KEY  = "AIzaSyB0TtVnOafgkbRwCaqkSxPogGLUgyWqZaE";

const TIMEZONE = "America/Tijuana";

function num(v) {
  const n = Number(String(v ?? "").replace(/,/g, "").trim());
  return Number.isFinite(n) ? n : 0; 
}
function pad2(n) { return String(n).padStart(2, "0"); }

function nowTZ() {
  const s = new Date().toLocaleString("en-US", { timeZone: TIMEZONE });
  return new Date(s);
}

function getCurrentWeekNumber() {
  const now = nowTZ();
  const firstJan = new Date(now.getFullYear(), 0, 1);
  const days = Math.floor((now - firstJan) / 86400000);
  let weekNum = Math.ceil((days + firstJan.getDay() + 1) / 7);
  if (weekNum < 1) weekNum = 1;
  if (weekNum > 53) weekNum = 53;
  return weekNum; 
}

async function fetchJSON(url, { tries = 4, baseDelay = 700 } = {}) {
  let lastErr;
  for (let i = 0; i < tries; i++) {
    try {
      const r = await fetch(url, { cache: "no-store" });
      const text = await r.text();
      if (r.ok) return JSON.parse(text);

      if (r.status === 429 || (r.status >= 500 && r.status < 600)) {
        const jitter = Math.random() * 250;
        await new Promise(res => setTimeout(res, baseDelay * Math.pow(2, i) + jitter));
        continue;
      }
      throw new Error(`HTTP ${r.status} • ${text.slice(0,180)}`);
    } catch (e) {
      lastErr = e;
      const jitter = Math.random() * 250;
      await new Promise(res => setTimeout(res, baseDelay * Math.pow(2, i) + jitter));
    }
  }
  throw lastErr || new Error("fetchJSON: unknown");
}

async function listSheetTitles() {
  const cache = window.__tabsCache;
  if (cache && (Date.now() - cache.at) < 10 * 60 * 1000) return cache.titles;

  const url = `https://sheets.googleapis.com/v4/spreadsheets/${SHEET_ID}?fields=sheets(properties(title))&key=${API_KEY}`;
  const j = await fetchJSON(url);
  const titles = (j.sheets || []).map(s => s?.properties?.title).filter(Boolean);

  window.__tabsCache = { at: Date.now(), titles };
  return titles;
}

function extractW(title) {
  const m = /^W(\d{1,2})$/.exec(title.trim());
  if (!m) return null;
  const n = Number(m[1]);
  return { n, title, normalized: `W${pad2(n)}` };
}

async function sheetValues(rangeA1) {
  const url = `https://sheets.googleapis.com/v4/spreadsheets/${SHEET_ID}/values/${encodeURIComponent(rangeA1)}?valueRenderOption=UNFORMATTED_VALUE&key=${API_KEY}`;
  const j = await fetchJSON(url);
  return j.values || [];
}

function tryParseDate(value) {
  if (value == null) return null;
  const s = String(value).trim();
  if (!s) return null;

  const d1 = new Date(s);
  if (Number.isFinite(d1.getTime())) return d1;

  const n = Number(s);
  if (Number.isFinite(n) && n > 20000 && n < 90000) {
    const base = new Date(Date.UTC(1899, 11, 30));
    const ms = base.getTime() + n * 86400000;
    const d2 = new Date(ms);
    if (Number.isFinite(d2.getTime())) return d2;
  }
  return null;
}

async function getWeekTabMonthKey(tabTitle) {
  window.__wkMonth = window.__wkMonth || new Map();
  if (window.__wkMonth.has(tabTitle)) return window.__wkMonth.get(tabTitle);

  const header = await sheetValues(`${tabTitle}!A1:T2`);
  let found = null;
  for (const row of header) {
    for (const cell of row) {
      const d = tryParseDate(cell);
      if (d) { found = d; break; }
    }
    if (found) break;
  }

  const key = found ? `${found.getFullYear()}-${pad2(found.getMonth() + 1)}` : null;
  window.__wkMonth.set(tabTitle, key);
  return key;
}

async function getActiveWeeklyTabsForCurrentMonth() {
  const titles = await listSheetTitles();
  const weekTabs = titles.map(extractW).filter(Boolean);

  if (!weekTabs.length) {
    throw new Error('No encontré tabs tipo "W01/W02/..." en este spreadsheet.');
  }

  const currentWeek = getCurrentWeekNumber();
  const candidates = weekTabs
    .filter(w => w.n >= 1 && w.n <= currentWeek)
    .map(w => w.title);

  const baseCandidates = candidates.length ? candidates : weekTabs.map(w => w.title);
  const now = nowTZ();
  const monthKeyNow = `${now.getFullYear()}-${pad2(now.getMonth() + 1)}`;

  const monthTabs = [];
  for (const t of baseCandidates.sort()) {
    const mk = await getWeekTabMonthKey(t);
    if (mk && mk === monthKeyNow) monthTabs.push(t);
  }

  if (!monthTabs.length) {
    const best = baseCandidates
      .map(extractW).filter(Boolean)
      .sort((a,b)=>b.n-a.n)[0];
    return { tabs: [best?.title || baseCandidates[0]], mode: "fallback-single-week", monthKeyNow };
  }

  return { tabs: monthTabs, mode: "month-sum", monthKeyNow };
}

async function loadData() {
  try {
    const teamRange = `Teams!A3:O100`;
    const teamData  = (await fetchJSON(
      `https://sheets.googleapis.com/v4/spreadsheets/${SHEET_ID}/values/${encodeURIComponent(teamRange)}?key=${API_KEY}`
    )).values || [];

    const { tabs, mode, monthKeyNow } = await getActiveWeeklyTabsForCurrentMonth();
    
    const map = new Map();

    for (const weeklyTab of tabs) {
     // 1. Apuntamos a la nueva estructura maestra
    const teamRange = `NewTeamLayout!A2:F100`; 
    const teamData  = (await fetchJSON(
      `https://sheets.googleapis.com/v4/spreadsheets/${SHEET_ID}/values/${encodeURIComponent(teamRange)}?key=${API_KEY}`
    )).values || [];

    // ... (La lógica intermedia que extrae datos de las semanas W12, W11 se queda intacta) ...

    // 2. Clasificador dinámico para Javi (Lado Verde) y Ricky (Lado Naranja)
    const fkArr = []; 
    const rrArr = []; 

    teamData.forEach(row => {
      const id   = String(row[0] || "").trim();
      const name = String(row[1] || "").trim();
      const team = String(row[5] || "").trim().toLowerCase(); // Extraemos el valor de la Columna F

      if (id && team) {
        const stats = map.get(id) || { cr:0, xf:0, total:0 };
        
        if (team === "javi") {
          rrArr.push({ name: name, id: id, ...stats });
        } else if (team === "ricky") {
          fkArr.push({ name: name, id: id, ...stats });
        }
      }
    }); 

    fkArr.sort((a,b)=> b.total - a.total);
    rrArr.sort((a,b)=> b.total - a.total);

    let fkCr=0,fkXf=0,fkTot=0, rrCr=0,rrXf=0,rrTot=0;

    fkArr.forEach(d=>{
      fkCr += num(d.cr); fkXf += num(d.xf); fkTot += num(d.total);
      fkBody.insertAdjacentHTML("beforeend",
        `<tr><td>${d.name}</td><td>${d.id}</td><td>${num(d.cr)}</td><td>${num(d.xf)}</td><td>${num(d.total)}</td></tr>`
      );
    });

    rrArr.forEach(d=>{
      rrCr += num(d.cr); rrXf += num(d.xf); rrTot += num(d.total);
      rrBody.insertAdjacentHTML("beforeend",
        `<tr><td>${d.name}</td><td>${d.id}</td><td>${num(d.cr)}</td><td>${num(d.xf)}</td><td>${num(d.total)}</td></tr>`
      );
    });

    // 3) Totales UI y Barra de Conquista
    document.getElementById("fk-cr").textContent    = fkCr;
    document.getElementById("fk-xf").textContent    = fkXf;
    document.getElementById("fk-total").textContent = fkTot;

    document.getElementById("rug-cr").textContent    = rrCr;
    document.getElementById("rug-xf").textContent    = rrXf;
    document.getElementById("rug-total").textContent = rrTot;

    const totalXfer = (fkXf + rrXf) > 0 ? (fkXf + rrXf) : 1; 
    
    const rugDomination = (rrXf / totalXfer) * 100;
    const fkDomination  = (fkXf / totalXfer) * 100;

    document.getElementById("rug-bar").style.width = `${rugDomination}%`;
    document.getElementById("fk-bar").style.width = `${fkDomination}%`;
    document.getElementById("clash-indicator").style.left = `${rugDomination}%`;

    document.getElementById("rugrats-label").textContent = `🦖 Rugrats: ${rugDomination.toFixed(1)}% (${rrXf} XFER)`;
    document.getElementById("filekeepers-label").textContent = `🧑🏿‍🌾 Cotton Pickers: ${fkDomination.toFixed(1)}% (${fkXf} XFER)`;

    const rugXferBox = document.getElementById("rug-xfer-total");
    const fkXferBox  = document.getElementById("fk-xfer-total");
    rugXferBox.textContent = rrXf;
    fkXferBox.textContent  = fkXf;

    rugXferBox.classList.remove("win","lose");
    fkXferBox.classList.remove("win","lose");
    if (rrXf > fkXf){ rugXferBox.classList.add("win"); fkXferBox.classList.add("lose"); }
    else if (fkXf > rrXf){ fkXferBox.classList.add("win"); rugXferBox.classList.add("lose"); }

  } catch (err) {
    console.error("❌ Error al cargar los datos:", err);
  }
}

loadData();
setInterval(loadData, 60000);
</script>
</body>
</html>
