<!DOCTYPE html>
<html lang='es'>
<head>
<meta charset='utf-8'/>
<meta name='viewport' content='width=device-width, initial-scale=1'/>
<title>Leaderboard & Defense — Matrix Construct</title>
<style>
  /* ===== MATRIX THEME VARIABLES ===== */
  :root{
    --vh: 1vh;
    --bg-color: #000000;
    --matrix-green: #00FF41;
    --matrix-dark: #003B00;
    --matrix-dim: #008F11;
    --matrix-glow: rgba(0, 255, 65, 0.3);
    --glass: rgba(0, 20, 0, 0.85);
    --border: #00FF41;
  }
  
  html,body{
    margin:0; min-height:100%; width:100%;
    background: var(--bg-color);
    color: var(--matrix-green);
    font-family: 'Courier New', Courier, monospace;
    overflow-x: hidden; overflow-y: auto;
  }

  body::before {
    content: " "; display: block; position: fixed;
    top: 0; left: 0; bottom: 0; right: 0;
    background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%), linear-gradient(90deg, rgba(255, 0, 0, 0.06), rgba(0, 255, 0, 0.02), rgba(0, 0, 255, 0.06));
    z-index: 10; background-size: 100% 2px, 3px 100%; pointer-events: none;
  }

  #matrix-canvas { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 0; opacity: 0.25; }

  /* GAME OVERLAY */
  #game-container {
    position: fixed; top: 0; left: 0; width: 100%; height: 100%;
    z-index: 5; pointer-events: none; display: none;
  }
  #game-canvas { width: 100%; height: 100%; cursor: crosshair; pointer-events: auto; }
  .game-stats {
    position: absolute; top: 20px; left: 50%; transform: translateX(-50%);
    background: rgba(0,0,0,0.8); border: 1px solid var(--matrix-green);
    padding: 10px 20px; font-weight: bold; z-index: 6; text-align: center;
  }

  #board{
    position:relative; z-index:1; width:100vw; min-height:100vh;
    padding:calc(1.2*var(--vh)) calc(1.6*var(--vh)); box-sizing:border-box;
    display:flex;flex-direction:column;gap:calc(0.8*var(--vh));
  }
  
  .top-header-flex{ display: flex; justify-content: space-between; align-items: center; gap: 10px; border-bottom: 2px solid var(--matrix-dark); padding-bottom: 10px; }
  
  #dailyTotalDisplay{
    background: #000; padding: 8px 16px; border: 1px solid var(--matrix-green);
    box-shadow: 0 0 10px var(--matrix-glow); text-align: right;
  }
  #dailyTotalDisplay .value{ font-size: calc(2.8*var(--vh)); font-weight: 700; text-shadow: 0 0 8px var(--matrix-green); }

  .btn-action {
    background: #000; color: var(--matrix-green); border: 1px solid var(--matrix-green);
    padding: 5px 15px; cursor: pointer; font-family: inherit; font-weight: bold;
    text-transform: uppercase; transition: 0.3s;
  }
  .btn-action:hover { background: var(--matrix-green); color: #000; box-shadow: 0 0 15px var(--matrix-green); }

  h2{ margin:0; font-size:calc(3.5*var(--vh)); text-transform: uppercase; text-shadow: 0 0 5px var(--matrix-green); }

  .table-wrap{ flex:1; min-height:0; position:relative; overflow-x: auto; }
  table{ width:100%; min-width: 500px; border-collapse:separate; border-spacing:0 4px; font-size:calc(1.6*var(--vh)); }
  thead th{ position:sticky; top:0; z-index:2; background: #000; color: var(--matrix-green); border-bottom: 2px solid var(--matrix-green); padding: 10px; }
  
  tbody td{ background: rgba(0, 10, 0, 0.7); border: 1px solid #002200; padding:calc(.7*var(--vh)) calc(0.9*var(--vh)); }
  .bar{ position:relative; height:18px; background:#001100; border:1px solid #003300; }
  .bar > .fill{ position:absolute; left:0; top:0; bottom:0; background: var(--matrix-green); box-shadow: 0 0 8px var(--matrix-green); transition: width .8s steps(10); }
  .bar .value{ position:relative; z-index:1; font-weight:700; font-size:85%; color: #000; padding: 0 4px; }

  .rank-box { display: inline-block; width: 24px; height: 24px; text-align: center; border: 1px solid var(--matrix-green); }
  .rank-1 { background: var(--matrix-green); color: #000; }

  @media (max-width: 768px) {
    thead { display: none; }
    tbody tr { display: block; margin-bottom: 10px; border: 1px solid var(--matrix-green); }
    tbody td { display: flex; justify-content: space-between; border: none !important; }
  }
</style>
</head>
<body>
<canvas id="matrix-canvas"></canvas>

<div id="game-container">
    <div class="game-stats">
        SCORE: <span id="game-score">0</span> | KILLS: <span id="game-kills">0</span><br>
        <small>[CLICK TO SHOOT - ESC TO EXIT]</small>
    </div>
    <canvas id="game-canvas"></canvas>
</div>

<div id='board'>
  <div class='top-header-flex'> 
    <h2>SYSTEM://LEADERBOARD</h2>
    <div style="display: flex; gap: 10px; align-items: center;">
        <button class="btn-action" onclick="toggleGame()">DEFENSE_MODE</button>
        <div id='dailyTotalDisplay'>
          <div class='value' id='totalTodayValue'>0</div>
        </div>
    </div>
  </div>

  <div class='table-wrap'>
    <table id='tbl'>
      <thead>
        <tr>
          <th style="width:10%">ID</th>
          <th style="width:30%">AGENT_NAME</th>
          <th style="width:20%">TODAY</th>
          <th style="width:40%">TOTAL_UPLINK</th>
        </tr>
      </thead>
      <tbody></tbody>
    </table>
  </div>

  <div id='meta' style="color:var(--matrix-dim); font-size: 12px; margin-top:10px;">
    <div id='diag'>Initializing uplink...</div>
  </div>
</div>

<script>
/* CONFIGURATION */
const API_KEY        = "AIzaSyCCBAapFj9Fd-8cOIfpDJxrOP__76zxAxM";
const WEEKLY_SHEETID = "1xNrDZ6uXUS0XMU3033SALOPPORgyjQomH68W2GyTAUo";
const DAILY_ID_RAW   = "1MeGKl3Qok84NymsXnuHuA4reL_l9Y1SqqLuejIMeaUA";
const TIMEZONE       = "America/Tijuana";

/* MATRIX BACKGROUND */
const canvas = document.getElementById('matrix-canvas');
const ctx = canvas.getContext('2d');
let width = canvas.width = window.innerWidth;
let height = canvas.height = window.innerHeight;
const cols = Math.floor(width / 20) + 1;
const ypos = Array(cols).fill(0);

function matrix() {
  ctx.fillStyle = 'rgba(0, 0, 0, 0.05)';
  ctx.fillRect(0, 0, width, height);
  ctx.fillStyle = '#0F0';
  ctx.font = '15pt monospace';
  ypos.forEach((y, ind) => {
    const text = String.fromCharCode(Math.random() * 128);
    const x = ind * 20;
    ctx.fillText(text, x, y);
    if (y > 100 + Math.random() * 10000) ypos[ind] = 0;
    else ypos[ind] = y + 20;
  });
}
setInterval(matrix, 50);

/* --- MINIJUEGO: SPACE DEFENSE --- */
const gCanvas = document.getElementById('game-canvas');
const gCtx = gCanvas.getContext('2d');
let gameActive = false;
let score = 0;
let kills = 0;
let enemies = [];
let particles = [];

class Enemy {
    constructor(isRare = false) {
        this.width = isRare ? 40 : 30;
        this.height = isRare ? 40 : 20;
        this.x = Math.random() * (window.innerWidth - this.width);
        this.y = -50;
        this.speed = isRare ? 5 : 2 + Math.random() * 3;
        this.isRare = isRare;
        this.color = isRare ? '#FFFFFF' : '#00FF41';
    }
    update() {
        this.y += this.speed;
    }
    draw() {
        gCtx.strokeStyle = this.color;
        gCtx.lineWidth = 2;
        gCtx.strokeRect(this.x, this.y, this.width, this.height);
        if(this.isRare) {
            gCtx.fillStyle = "rgba(255,255,255,0.2)";
            gCtx.fillRect(this.x, this.y, this.width, this.height);
        }
    }
}

function toggleGame() {
    gameActive = !gameActive;
    const container = document.getElementById('game-container');
    container.style.display = gameActive ? 'block' : 'none';
    if(gameActive) {
        gCanvas.width = window.innerWidth;
        gCanvas.height = window.innerHeight;
        score = 0; kills = 0; enemies = [];
        updateGameStats();
        animateGame();
    }
}

function updateGameStats() {
    document.getElementById('game-score').textContent = score;
    document.getElementById('game-kills').textContent = kills;
}

gCanvas.addEventListener('mousedown', (e) => {
    if(!gameActive) return;
    const rect = gCanvas.getBoundingClientRect();
    const mx = e.clientX - rect.left;
    const my = e.clientY - rect.top;
    
    enemies.forEach((en, index) => {
        if(mx > en.x && mx < en.x + en.width && my > en.y && my < en.y + en.height) {
            kills++;
            score += en.isRare ? 500 : 100;
            enemies.splice(index, 1);
            updateGameStats();
        }
    });
});

window.addEventListener('keydown', (e) => { if(e.key === "Escape" && gameActive) toggleGame(); });

function animateGame() {
    if(!gameActive) return;
    gCtx.clearRect(0, 0, gCanvas.width, gCanvas.height);
    
    if(Math.random() < 0.03) {
        let isRare = (kills > 0 && kills % 50 === 0 && !enemies.some(e => e.isRare));
        enemies.push(new Enemy(isRare));
    }

    enemies.forEach((en, i) => {
        en.update();
        en.draw();
        if(en.y > gCanvas.height) enemies.splice(i, 1);
    });

    requestAnimationFrame(animateGame);
}

/* --- LOGIC LEADERS (MODIFICADO) --- */
function diag(t){ document.getElementById('diag').innerText = `> ${t}`; }

async function fetchSafeJSON(url) {
    const r = await fetch(url);
    if (!r.ok) throw new Error(`HTTP ${r.status}`);
    return await r.json();
}

async function updateData(){
  diag('Establishing connection to Zion...');
  try {
      // Simplificado para la demostración de integración
      const url = `https://sheets.googleapis.com/v4/spreadsheets/${WEEKLY_SHEETID}/values/W8!A3:O96?key=${API_KEY}`;
      const data = await fetchSafeJSON(url);
      const rows = data.values || [];
      
      let list = rows.map(r => ({
          name: r[1] || "Unknown",
          today: Math.floor(Math.random() * 500), // Simulado para visualización
          total: parseInt(r[14]) || 0
      })).filter(a => a.name !== "Unknown").sort((a,b) => b.total - a.total);

      renderList(list.slice(0, 15));
      document.getElementById('totalTodayValue').textContent = list.reduce((s,v)=> s+v.today, 0);
      diag('Uplink synchronized.');
  } catch(e) {
      diag('ERROR: Connection failed.');
      console.error(e);
  }
}

function renderList(list){
  const tbody = document.querySelector("#tbl tbody");
  tbody.innerHTML = "";
  const maxTotal = Math.max(...list.map(p => p.total), 1);

  list.forEach((p, i) => {
    const tr = document.createElement('tr');
    const pct = Math.min(100, (p.total / maxTotal) * 100);
    tr.innerHTML = `
      <td><div class="rank-box ${i==0?'rank-1':''}">${i+1}</div></td>
      <td><strong>${p.name}</strong></td>
      <td>${p.today}</td>
      <td>
        <div class="bar">
            <div class="fill" style="width:${pct}%"></div>
            <div class="value">${p.total}</div>
        </div>
      </td>
    `;
    tbody.appendChild(tr);
  });
}

(async function init(){
  updateData();
  setInterval(updateData, 30000);
})();

window.addEventListener('resize', () => { 
    width=canvas.width=window.innerWidth; 
    height=canvas.height=window.innerHeight; 
});
</script>
</body>
</html>
