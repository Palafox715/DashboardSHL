<!DOCTYPE html>
<html lang='es'>
<head>
<meta charset='utf-8'/>
<meta name='viewport' content='width=device-width, initial-scale=1'/>
<title>Shoreline Dashboard</title>
<style>
    /* ===== ELECTRIC BLUE THEME VARIABLES ===== */
    :root{
        --vh: 1vh;
        --bg-color: #000103; /* Fondo casi negro con tinte azul */
        /* Nueva paleta Azul Eléctrico */
        --electric-blue: #00F7FF; 
        --electric-dark: #001A24;
        --electric-dim: #007A80;
        --blue-glow: rgba(0, 247, 255, 0.3);
        --winner-glow: rgba(0, 247, 255, 0.7);
    }
    
    html,body{
        margin:0; min-height:100%; width:100%;
        background: var(--bg-color); 
        color: var(--electric-blue); /* Color principal cambiado */
        font-family: 'Courier New', Courier, monospace;
        overflow-x: hidden; overflow-y: auto;
    }

    /* Efecto CRT Scanlines (ligeramente azulado) */
    body::before {
        content: " "; display: block; position: fixed;
        top: 0; left: 0; bottom: 0; right: 0;
        background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%), linear-gradient(90deg, rgba(0, 50, 255, 0.03), rgba(0, 255, 255, 0.02), rgba(0, 0, 255, 0.03));
        z-index: 2; background-size: 100% 2px, 3px 100%; pointer-events: none;
    }

    #matrix-canvas { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 0; opacity: 0.15; }

    #board{
        position:relative; z-index:1; width:100vw; min-height:100vh;
        padding:calc(1.2*var(--vh)) calc(1.6*var(--vh)); box-sizing:border-box;
        display:flex; flex-direction:column; gap:calc(0.8*var(--vh));
    }
    
    .top-header-flex{
        display: flex; justify-content: space-between; align-items: center;
        border-bottom: 2px solid var(--electric-dark); padding-bottom: 10px;
    }

    h2{
        margin:0; font-weight:700; letter-spacing:2px; font-size:calc(3.5*var(--vh));
        text-transform: uppercase; 
        text-shadow: 0 0 15px var(--electric-blue); /* Brillo azul más intenso */
    }

    .chips{ display:flex; gap:10px; }
    .chip{
        padding: 5px 10px; background: #000; border: 1px solid var(--electric-dim);
        color: var(--electric-dim); font-size: calc(1.4*var(--vh)); text-transform: uppercase;
        box-shadow: inset 0 0 5px var(--electric-dark);
    }

    /* TABLE */
    .table-wrap{ flex:1; min-height:0; position:relative; margin-top: 20px;}
    table{
        width:100%; border-collapse:separate; border-spacing:0 8px;
        table-layout:fixed; font-size:calc(1.8*var(--vh));
    }
    thead th{
        text-align: center; color: var(--electric-blue); text-transform:uppercase;
        border-bottom: 2px solid var(--electric-blue); padding: 10px; letter-spacing: 1px;
    }
    
    /* Nuevos anchos de columna */
    th.col-rank { width: 8%; }
    th.col-agent { width: 35%; text-align: left; }
    th.col-status { width: 12%; } /* Nueva columna para el Checkbox */
    th.col-xfers { width: 15%; }  /* Nueva columna para Xfers */
    th.col-score { width: 30%; }

    tbody td{
        background: rgba(0, 5, 15, 0.6); border: 1px solid var(--electric-dark);
        padding: 12px; text-align: center; transition: all 0.3s;
    }

    /* ESTILOS DE GANADORES (TOP 5) */
    tr.winner-group td {
        border-color: var(--electric-blue);
        background: rgba(0, 20, 40, 0.5);
        box-shadow: inset 0 0 15px var(--blue-glow);
    }
    
    tr.winner-group .col-score {
        color: #fff;
        text-shadow: 0 0 10px var(--electric-blue);
        font-weight: 900;
    }

    td.col-agent { text-align: left; font-weight: bold; }
    
    /* Estilo para el Checkmark */
    .checkmark { font-size: 1.4em; text-shadow: 0 0 5px var(--electric-blue); }

    /* BARRAS */
    .bar{ position:relative; height:16px; background:#000510; border:1px solid var(--electric-dark); margin-top:5px;}
    .fill{
        position:absolute; left:0; top:0; bottom:0; width:0%;
        background: var(--electric-dim);
        transition: width 1.5s cubic-bezier(0.1, 0, 0.1, 1);
    }
    tr.winner-group .fill {
        background: var(--electric-blue);
        box-shadow: 0 0 20px var(--electric-blue); /* Glow azul intenso */
    }

    .rank-box {
        display: inline-block; width: 35px; height: 35px; line-height: 35px;
        border: 1px solid var(--electric-dim); background: #000;
        font-weight: bold; color: var(--electric-dim);
    }

    /* Resaltado especial Top 5 */
    tr.winner-group .rank-box {
        border-color: var(--electric-blue);
        box-shadow: 0 0 10px var(--electric-blue);
        color: #fff; background: var(--electric-dark);
    }

    .rank-1 { 
        background: var(--electric-blue) !important; 
        color: #000 !important; 
        transform: scale(1.2);
        box-shadow: 0 0 20px var(--electric-blue) !important;
    }

    #meta { color: var(--electric-dim); font-size: 12px; margin-top: 10px; border-top: 1px dashed var(--electric-dark); padding-top: 5px; }

    @media (max-width: 768px) {
        th.col-status, td.col-status, th.col-xfers, td.col-xfers { display: none; } /* Ocultar en móviles pequeños */
        h2 { font-size: 2em; }
    }
</style>
</head>
<body>
<canvas id="matrix-canvas"></canvas>

<div id='board'>
    <div class='top-header-flex'> 
        <h2>SHORELINE DASHBOARD</h2>
        <div class='chips'>
            <div id='status' class='chip'>SYSTEM_BOOT...</div>
            <div id='currentWk' class='chip'>WK: --</div>
        </div>
    </div>

    <div class='table-wrap'>
        <table id='tbl'>
            <thead>
                <tr>
                    <th class='col-rank'>RNK</th>
                    <th class='col-agent'>AGENT</th>
                    <th class='col-status'>44H STATUS</th> <th class='col-xfers'>XFERS (WK)</th> <th class='col-score'>POWER SCORE</th>
                </tr>
            </thead>
            <tbody></tbody>
        </table>
    </div>

    <div id='meta'>
        <div id='diag'>Initializing blue uplink protocol...</div>
    </div>
</div>

<script>
/* MATRIX EFFECT - CAMBIADO A AZUL */
const canvas = document.getElementById('matrix-canvas');
const ctx = canvas.getContext('2d');
let width = canvas.width = window.innerWidth;
let height = canvas.height = window.innerHeight;
const cols = Math.floor(width / 20) + 1;
const ypos = Array(cols).fill(0);
function matrix() {
    ctx.fillStyle = '#0001'; ctx.fillRect(0, 0, width, height);
    ctx.fillStyle = '#00F7FF'; // CAMBIO 1: Color de la lluvia digital a Azul Eléctrico
    ctx.font = '15pt monospace';
    ypos.forEach((y, ind) => {
        const text = String.fromCharCode(Math.random() * 128);
        const x = ind * 20; ctx.fillText(text, x, y);
        if (y > 100 + Math.random() * 10000) ypos[ind] = 0;
        else ypos[ind] = y + 20;
    });
}
setInterval(matrix, 50);

/* CONFIGURATION */
const API_KEY = "AIzaSyCCBAapFj9Fd-8cOIfpDJxrOP__76zxAxM";
const SHEET_ID = "1FRwPAtQ-BUOG9uiBti63dWuJW6JWaY8SisvuXtLM5h0";
const REFRESH_RATE = 30000; 

function diag(t){ document.getElementById('diag').innerText = `> ${t}`; }

async function fetchData() {
    diag('Ping Shoreline database...');
    const tabName = "W7"; 
    document.getElementById('currentWk').innerText = `SECTOR: ${tabName}`;

    const ranges = [`${tabName}!A3:B96`, `${tabName}!C3:M96`, `${tabName}!O3:P96`].map(encodeURIComponent);
    const url = `https://sheets.googleapis.com/v4/spreadsheets/${SHEET_ID}/values:batchGet?` + 
                ranges.map(r => `ranges=${r}`).join("&") + `&valueRenderOption=UNFORMATTED_VALUE&key=${API_KEY}`;

    try {
        const response = await fetch(url);
        const data = await response.json();
        const vr = data.valueRanges;

        const baseInfo = vr[0].values || [];
        const dailyData = vr[1].values || [];
        const totals = vr[2].values || [];

        let agents = [];

        for (let i = 0; i < baseInfo.length; i++) {
            const name = baseInfo[i][1];
            if (!name) continue;

            const hours = parseFloat(totals[i]?.[1] || 0);
            
            // EL FILTRO SIGUE ACTIVO: Si tiene menos de 44, NO aparece en el dashboard.
            // Por lo tanto, todos los que aparezcan tendrán el checkmark.
            if (hours < 44) continue;

            const row = dailyData[i] || [];
            const crPulls = [0, 2, 4, 6, 8, 10].reduce((sum, idx) => sum + (parseInt(row[idx]) || 0), 0);
            
            // CAMBIO 4: Capturar el total de Xfers crudo
            const totalXfers = parseInt(totals[i]?.[0] || 0);

            const powerScore = (totalXfers * 10) + (crPulls * 1);

            agents.push({
                name: name.toUpperCase(),
                // hours: hours, // Ya no necesitamos el número para mostrarlo
                xfers: totalXfers, // Guardamos el dato crudo de Xfers
                score: powerScore
            });
        }

        agents.sort((a, b) => b.score - a.score);

        render(agents);
        diag('Data synchronization successful.');
        document.getElementById('status').innerText = 'ONLINE';
        document.getElementById('status').style.color = "var(--electric-blue)";

    } catch (e) {
        diag('CONNECTION ERROR. Retrying...');
        console.error(e);
        document.getElementById('status').innerText = 'OFFLINE';
        document.getElementById('status').style.color = "red";
    }
}

function render(list) {
    const tbody = document.querySelector("#tbl tbody");
    tbody.innerHTML = "";

    const maxScore = list.length > 0 ? list[0].score : 1;

    list.forEach((agent, i) => {
        const tr = document.createElement('tr');
        const pct = (agent.score / maxScore) * 100;
        
        const isWinnerGroup = i < 5;
        if(isWinnerGroup) tr.classList.add('winner-group');
        
        // CAMBIO 3 y 4: Renderizado de las nuevas columnas
        // La columna de horas ahora es un Checkmark estático (✔) porque pasaron el filtro.
        tr.innerHTML = `
            <td class="col-rank">
                <div class="rank-box ${i===0?'rank-1':''}">${i+1}</div>
            </td>
            <td class="col-agent">
                ${agent.name}
                <div class="bar"><div class="fill" style="width: 0%"></div></div>
            </td>
            <td class="col-status">
                <span class="checkmark">✔</span>
            </td>
            <td class="col-xfers">${agent.xfers.toLocaleString()}</td>
            <td class="col-score">${agent.score.toLocaleString()}</td>
        `;
        tbody.appendChild(tr);

        setTimeout(() => {
            const fill = tr.querySelector('.fill');
            if(fill) fill.style.width = pct + '%';
        }, 100 + (i * 50));
    });
}

fetchData();
setInterval(fetchData, REFRESH_RATE);
</script>
</body>
</html>
