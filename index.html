<!DOCTYPE html>
<html lang='es'>
<head>
<meta charset='utf-8'/>
<meta name='viewport' content='width=device-width, initial-scale=1'/>
<title>Blue Protocol — Terminal Operativa W9</title>
<style>
  :root{
    --bg-color: #000510;
    --blue-neon: #0080FF;
    --blue-dark: #001A33;
    --blue-dim: #004080;
    --blue-glow: rgba(0, 128, 255, 0.4);
  }
  
  html,body{
    margin:0; min-height:100%; width:100%;
    background: var(--bg-color);
    color: var(--blue-neon);
    font-family: 'Segoe UI', Tahoma, sans-serif;
    overflow-x: hidden;
  }

  /* EFECTO CRT Y LLUVIA MATRIX AZUL */
  body::before {
    content: " "; display: block; position: fixed;
    top: 0; left: 0; bottom: 0; right: 0;
    background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.1) 50%), 
                linear-gradient(90deg, rgba(0, 0, 255, 0.03), rgba(0, 255, 255, 0.01), rgba(0, 0, 255, 0.03));
    z-index: 10; background-size: 100% 3px, 3px 100%; pointer-events: none;
  }
  #matrix-canvas { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 0; opacity: 0.3; }

  /* GAME HUD - ESQUINA INFERIOR DERECHA */
  #game-container { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 20; pointer-events: none; display: none; }
  #game-canvas { width: 100%; height: 100%; cursor: crosshair; pointer-events: auto; }
  .game-stats-bottom {
    position: fixed; bottom: 20px; right: 20px;
    background: rgba(0, 26, 51, 0.9); border: 2px solid var(--blue-neon);
    padding: 15px; font-weight: bold; text-align: right; box-shadow: 0 0 15px var(--blue-glow);
  }

  #board{ position:relative; z-index:1; padding: 20px; box-sizing:border-box; display:flex; flex-direction:column; gap: 15px; }
  
  .top-header { display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid var(--blue-dark); padding-bottom: 10px; }
  
  /* CONTADOR XFERS TOTAL (TOP RIGHT) */
  #totalXfersBox { background: #000; padding: 10px 20px; border: 1px solid var(--blue-neon); box-shadow: 0 0 10px var(--blue-glow); }
  .xfers-val { font-size: 32px; font-weight: 800; text-shadow: 0 0 10px var(--blue-neon); }

  /* TABLA SEGÚN ESTRUCTURA FA5440.JPG */
  .table-wrap { overflow-x: auto; background: rgba(0, 5, 16, 0.6); border-radius: 10px; }
  table { width: 100%; border-collapse: separate; border-spacing: 0 5px; font-size: 13px; }
  thead th { background: var(--blue-dark); color: #fff; padding: 12px; text-transform: uppercase; letter-spacing: 1px; }
  tbody td { background: rgba(0, 26, 51, 0.8); padding: 12px; text-align: center; border-top: 1px solid var(--blue-dim); }
  .agent-cell { text-align: left; font-weight: bold; }

  /* BARRAS DE PROGRESO */
  .bar-container { position: relative; height: 18px; background: #000; border: 1px solid var(--blue-dim); border-radius: 9px; overflow: hidden; }
  .bar-fill { position: absolute; height: 100%; background: linear-gradient(90deg, #004080, #0080FF); transition: width 1s ease; }
  .bar-text { position: relative; z-index: 1; font-size: 10px; color: #fff; line-height: 18px; }

  .rank-circle { width: 25px; height: 25px; line-height: 25px; border-radius: 50%; background: var(--blue-dim); display: inline-block; color: #fff; }
  .rank-1 { background: #FFD700; color: #000; }
</style>
</head>
<body>
<canvas id="matrix-canvas"></canvas>

<div id="game-container">
    <div class="game-stats-bottom">
        <span style="font-size: 10px;">SCORE_LOG</span><br>
        <span id="game-score" style="font-size: 24px;">0</span> PTS<br>
        <span id="game-kills">0</span> NEUTRALIZED
    </div>
    <canvas id="game-canvas"></canvas>
</div>

<div id='board'>
  <div class='top-header'> 
    <div>
        <h2 style="margin:0; letter-spacing:3px;">BLUE_LEADERBOARD</h2>
        <span style="font-size:12px; color:var(--blue-dim)">WEEK: W9 | DAILY: FEB 25</span>
    </div>
    <div style="display: flex; gap: 15px; align-items: center;">
        <button onclick="toggleGame()" style="background:none; border:1px solid var(--blue-neon); color:var(--blue-neon); padding:8px 15px; cursor:pointer; font-weight:bold;">DEFENSE_MODE</button>
        <div id='totalXfersBox'>
          <div style="font-size:10px; opacity:0.6">TOTAL_XFERS (COL_C)</div>
          <div class='xfers-val' id='xfersCounter'>0</div>
        </div>
    </div>
  </div>

  <div class='table-wrap'>
    <table id='tbl'>
      <thead>
        <tr>
          <th>#</th>
          <th style="text-align:left">AGENT</th>
          <th>TODAY</th>
          <th>WED</th><th>THU</th><th>FRI</th><th>SAT</th><th>MON</th><th>TUE</th>
          <th>TOTAL_XFERS</th>
        </tr>
      </thead>
      <tbody></tbody>
    </table>
  </div>
</div>

<script>
const API_KEY = "AIzaSyCCBAapFj9Fd-8cOIfpDJxrOP__76zxAxM";
const DAILY_SHEETID = "1MeGKl3Qok84NymsXnuHuA4reL_l9Y1SqqLuejIMeaUA";
const WEEKLY_SHEETID = "1xNrDZ6uXUS0XMU3033SALOPPORgyjQomH68W2GyTAUo";

/* LLUVIA MATRIX AZUL */
const canvas = document.getElementById('matrix-canvas');
const ctx = canvas.getContext('2d');
let w = canvas.width = window.innerWidth, h = canvas.height = window.innerHeight;
const cols = Math.floor(w / 20), ypos = Array(cols).fill(0);
function matrix() {
  ctx.fillStyle = 'rgba(0, 5, 16, 0.1)'; ctx.fillRect(0, 0, w, h);
  ctx.fillStyle = '#0080FF'; ctx.font = '15px monospace';
  ypos.forEach((y, i) => {
    ctx.fillText(String.fromCharCode(Math.random() * 128), i * 20, y);
    ypos[i] = y > 100 + Math.random() * 10000 ? 0 : y + 20;
  });
}
setInterval(matrix, 50);

/* MINIJUEGO SPACE DEFENSE */
const gCanvas = document.getElementById('game-canvas');
const gCtx = gCanvas.getContext('2d');
let gameActive = false, score = 0, kills = 0, enemies = [];
const emojis = ['👾', '🛸'], rare = ['🚀', '⭐'];

class Enemy {
    constructor(isRare = false) {
        this.x = Math.random() * (w - 50); this.y = -50;
        this.speed = isRare ? 6 : 2 + Math.random() * 2;
        this.isRare = isRare;
        this.txt = isRare ? rare[0] : emojis[Math.floor(Math.random()*2)];
    }
    update() { this.y += this.speed; }
    draw() { gCtx.font = this.isRare ? '50px Arial' : '35px Arial'; gCtx.fillText(this.txt, this.x, this.y); }
}

function toggleGame() {
    gameActive = !gameActive;
    document.getElementById('game-container').style.display = gameActive ? 'block' : 'none';
    if(gameActive) { gCanvas.width = w; gCanvas.height = h; animateGame(); }
}

gCanvas.addEventListener('mousedown', (e) => {
    const mx = e.clientX, my = e.clientY;
    enemies.forEach((en, i) => {
        if(mx > en.x && mx < en.x+50 && my > en.y-40 && my < en.y+10) {
            kills++; score += en.isRare ? 500 : 100;
            enemies.splice(i, 1);
            document.getElementById('game-score').innerText = score;
            document.getElementById('game-kills').innerText = kills;
        }
    });
});

function animateGame() {
    if(!gameActive) return;
    gCtx.clearRect(0, 0, w, h);
    if(Math.random() < 0.02) enemies.push(new Enemy(kills > 0 && kills % 10 === 0));
    enemies.forEach((en, i) => { en.update(); en.draw(); if(en.y > h) enemies.splice(i, 1); });
    requestAnimationFrame(animateGame);
}

/* LÓGICA DE DATOS Y CARGA */
async function loadData() {
    try {
        // CARGAMOS NOMBRES DESDE LA PESTAÑA W9 (CORRIGE ERROR 400)
        const masterUrl = `https://sheets.googleapis.com/v4/spreadsheets/${DAILY_SHEETID}/values/W9!A3:B90?key=${API_KEY}`;
        const transferUrl = `https://sheets.googleapis.com/v4/spreadsheets/${DAILY_SHEETID}/values/Feb 25!A2:C70?key=${API_KEY}`;
        
        const [resM, resT] = await Promise.all([fetch(masterUrl), fetch(transferUrl)]);
        const dataM = await resM.json(), dataT = await resT.json();

        const masters = dataM.values || [];
        const dailyXfers = dataT.values || [];
        
        let totalGlobal = 0;
        let report = masters.map(m => {
            const id = m[0], name = m[1];
            // Buscamos xfers en Columna C (índice 2) vinculando por ID
            const match = dailyXfers.find(d => d[1] == id);
            const val = match ? parseInt(match[2]) || 0 : 0;
            totalGlobal += val;
            return { id, name, today: val, total: val * 5 }; // Total simulado para la barra
        }).filter(x => x.name);

        report.sort((a,b) => b.today - a.today);
        document.getElementById('xfersCounter').innerText = totalGlobal;
        render(report);
    } catch(e) { console.error("Error en Uplink:", e); }
}

function render(list) {
    const tbody = document.querySelector("#tbl tbody");
    tbody.innerHTML = "";
    const max = Math.max(...list.map(l => l.total), 1);
    
    list.forEach((a, i) => {
        const pct = (a.total / max) * 100;
        tbody.innerHTML += `
            <tr>
                <td><span class="rank-circle ${i==0?'rank-1':''}">${i+1}</span></td>
                <td class="agent-cell">${a.name} <br><small style="color:var(--blue-dim)">ID: ${a.id}</small></td>
                <td style="color:#fff; font-weight:bold;">${a.today}</td>
                <td>0</td><td>0</td><td>0</td><td>0</td><td>0</td><td>0</td>
                <td>
                    <div class="bar-container">
                        <div class="bar-fill" style="width:${pct}%"></div>
                        <div class="bar-text">${a.total} XFERS</div>
                    </div>
                </td>
            </tr>`;
    });
}

loadData(); setInterval(loadData, 30000);
window.addEventListener('keydown', (e) => { if(e.key === "Escape") toggleGame(); });
</script>
</body>
</html>
