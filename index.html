<!DOCTYPE html>
<html lang='es'>
<head>
<meta charset='utf-8'/>
<meta name='viewport' content='width=device-width, initial-scale=1'/>
<title>Leaderboard — Matrix Construct</title>
<style>
  /* ===== MATRIX THEME VARIABLES ===== */
  :root{
    --vh: 1vh;
    --bg-color: #000000;
    --matrix-green: #00FF41;
    --matrix-dark: #003B00;
    --matrix-dim: #008F11;
    --matrix-glow: rgba(0, 255, 65, 0.3);
    --glass: rgba(0, 20, 0, 0.85);
    --border: #00FF41;
  }
  
  /* FUENTE Y FONDO */
  html,body{
    margin:0;
    min-height:100%;
    width:100%;
    background: var(--bg-color);
    color: var(--matrix-green);
    font-family: 'Courier New', Courier, monospace; /* Fuente estilo terminal */
    overflow-x: hidden;
    overflow-y: auto;
  }

  /* EFECTO CRT (Scanlines) */
  body::before {
    content: " ";
    display: block;
    position: fixed;
    top: 0; left: 0; bottom: 0; right: 0;
    background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%), linear-gradient(90deg, rgba(255, 0, 0, 0.06), rgba(0, 255, 0, 0.02), rgba(0, 0, 255, 0.06));
    z-index: 2;
    background-size: 100% 2px, 3px 100%;
    pointer-events: none;
  }

  /* CANVAS PARA LLUVIA DIGITAL */
  #matrix-canvas {
    position: fixed;
    top: 0; left: 0;
    width: 100%; height: 100%;
    z-index: 0;
    opacity: 0.25; /* Sutil */
  }

  #board{
    position:relative; z-index:1;
    width:100vw;
    min-height:100vh;
    padding:calc(1.2*var(--vh)) calc(1.6*var(--vh)); box-sizing:border-box;
    display:flex;flex-direction:column;gap:calc(0.8*var(--vh));
  }
  
  /* HEADER */
  .top-header-flex{
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 10px;
    border-bottom: 2px solid var(--matrix-dark);
    padding-bottom: 10px;
  }
  
  #dailyTotalDisplay{
    background: #000;
    padding: 8px 16px;
    border: 1px solid var(--matrix-green);
    box-shadow: 0 0 10px var(--matrix-glow);
    text-align: right;
    flex-shrink: 0;
  }
  #dailyTotalDisplay .label{
    font-size: calc(1.2*var(--vh));
    font-weight: 700;
    color: var(--matrix-dim);
    text-transform: uppercase;
    letter-spacing: 1px;
  }
  #dailyTotalDisplay .value{
    font-size: calc(2.8*var(--vh));
    font-weight: 700;
    color: var(--matrix-green);
    text-shadow: 0 0 8px var(--matrix-green);
  }

  h2{
    margin:0;text-align:left;font-weight:700;letter-spacing:2px;
    font-size:calc(3.5*var(--vh)); line-height:1.1;
    text-transform: uppercase;
    text-shadow: 0 0 5px var(--matrix-green);
  }

  .chips{
    display:flex;gap:calc(.6*var(--vh));flex-wrap:wrap;
    justify-content:center;margin-top:calc(-.3*var(--vh));
  }
  .chip{
    padding:calc(.35*var(--vh)) calc(.8*var(--vh));
    background: #000;
    border: 1px solid var(--matrix-dim);
    color: var(--matrix-dim);
    font-weight:700; font-size:calc(1.4*var(--vh));
    text-transform: uppercase;
  }

  /* TABLA */
  .table-wrap{ flex:1; min-height:0; position:relative; }
  table{
    width:100%;
    min-width: 500px;
    border-collapse:separate; border-spacing:0 4px; /* Espaciado estilo consola */
    table-layout:fixed; font-size:calc(1.6*var(--vh));
  }
  thead th{
    position:sticky; top:0; z-index:2;
    background: #000;
    color: var(--matrix-green);
    text-transform:uppercase; letter-spacing:1px;
    font-size:calc(1.5*var(--vh)); font-weight:700; padding:calc(.6*var(--vh)) calc(0.9*var(--vh));
    border: 1px solid var(--matrix-dark);
    border-bottom: 2px solid var(--matrix-green);
  }
  
  /* Columnas */
  th.col-rank, td.col-rank { width:9%; text-align:center; }
  th.col-agent,td.col-agent{ width:30%; text-align:left; }
  th.col-today,td.col-today{ width:12%; text-align:center; }
  th.col-day,  td.col-day  { width:7%;  text-align:center; color: var(--matrix-dim); }
  th.col-total,td.col-total{ width:12%; text-align:center; }

  tbody td{
    background: rgba(0, 10, 0, 0.7);
    border: 1px solid #002200;
    padding:calc(.7*var(--vh)) calc(0.9*var(--vh));
    position: relative;
  }
  
  /* Efecto Hover en fila estilo terminal */
  tbody tr:hover td {
    background: var(--matrix-dark);
    color: #fff;
    box-shadow: inset 0 0 10px var(--matrix-green);
    border-color: var(--matrix-green);
  }

  .agent-wrap{ display:flex; align-items:center; min-width:0; }
  .name{ 
      font-weight:700; 
      overflow:hidden; 
      text-overflow:ellipsis; 
      white-space:nowrap; 
      font-size: 1.1em;
      padding-left: 5px;
      letter-spacing: -0.5px;
  }

  /* Barras Digitales */
  .bar{ position:relative; height:18px; background:#001100; border:1px solid #003300; }
  .bar > .fill{ 
    position:absolute; left:0; top:0; bottom:0; width:0%; 
    background: var(--matrix-green); /* Verde plano */
    box-shadow: 0 0 8px var(--matrix-green);
    transition: width .8s steps(10); /* Transición "escalonada" digital */
  }
  /* Barra Total diferente */
  .bar.total > .fill{ 
    background: #fff; /* Blanco brillante para resaltar */
    box-shadow: 0 0 8px #fff;
  }
  .bar .value{ 
    position:relative; z-index:1; font-weight:700; font-size:85%; 
    color: #000; /* Texto negro sobre la barra verde */
    mix-blend-mode: normal;
    padding: 0 4px;
  }

  #meta{ 
      display:flex;justify-content:flex-start;align-items:center; 
      font-weight:700; font-size:calc(1.3*var(--vh)); 
      color: var(--matrix-dim);
      margin-top: 5px;
      border-top: 1px dashed var(--matrix-dark);
      padding-top: 5px;
  }

  /* ===== RANGOS ESTILO MATRIX ===== */
  .rank-box {
    display: inline-block;
    width: 24px; height: 24px;
    line-height: 24px;
    text-align: center;
    border: 1px solid var(--matrix-green);
    background: #000;
    color: var(--matrix-green);
    font-weight: bold;
    box-shadow: 0 0 5px var(--matrix-green);
  }
  .rank-1 { background: var(--matrix-green); color: #000; box-shadow: 0 0 10px var(--matrix-green); } /* El Elegido */
  .rank-2 { border-color: #fff; color: #fff; box-shadow: 0 0 5px #fff; }
  .rank-3 { border-color: var(--matrix-dim); color: var(--matrix-dim); }

  /* MOBILE */
  @media (max-width: 768px) {
    #board { padding: 10px; gap: 10px; }
    .top-header-flex { flex-direction: column; align-items: stretch; border: none; }
    #dailyTotalDisplay { width: 100%; text-align: center; margin-top: 10px; }
    .chips { margin-top: 10px; }
    h2 { text-align: center; font-size: 2.5em; text-shadow: none; border-bottom: 1px solid var(--matrix-green); padding-bottom: 5px;}
    table { table-layout: auto; min-width: unset; border-spacing: 0; }
    thead { display: none; }
    tbody, tr, td { display: block; width: 100%; }
    tbody tr { 
      margin-bottom: 15px; border: 1px solid var(--matrix-green);
      background: #000;
      box-shadow: 0 0 5px var(--matrix-dark);
    }
    tbody td { 
      padding: 8px 10px; border: none !important; display: flex; 
      justify-content: space-between; align-items: center; 
      background: none !important; 
      border-bottom: 1px dashed #003300 !important;
    }
    th.col-day, td.col-day { display: none; }
    th.col-rank, td.col-rank, th.col-agent, td.col-agent, th.col-today, td.col-today, th.col-total, td.col-total { width: auto; }
    
    td.col-rank::before { content: 'RANK_ID:'; color: var(--matrix-dim); margin-right: 10px; font-size: 0.8em;}
    td.col-agent::before { content: 'AGENT:'; color: var(--matrix-dim); margin-right: 10px; font-size: 0.8em;}
    td.col-today::before { content: 'DATA_TODAY:'; color: var(--matrix-dim); margin-right: 10px; font-size: 0.8em;}
    td.col-total::before { content: 'DATA_TOTAL:'; color: var(--matrix-dim); margin-right: 10px; font-size: 0.8em;}
    
    .agent-wrap { display: flex; align-items: center; gap: 10px; }
    .bar { height: 18px; flex-grow: 1; margin-left: 10px; }
  }
</style>
</head>
<body>
<canvas id="matrix-canvas"></canvas>

<div id='board'>
  <div class='top-header-flex'> 
    <h2>SYSTEM://LEADERBOARD</h2>
    <div id='dailyTotalDisplay'>
      <div class='label'>INPUT_TODAY</div>
      <div class='value' id='totalTodayValue'>0</div>
    </div>
  </div>

  <div class='chips'>
    <div id='chipWeekly' class='chip'>WK: --</div>
    <div id='chipDaily' class='chip'>DAY: --</div>
  </div>

  <div class='table-wrap'>
    <table id='tbl'>
      <thead>
        <tr>
          <th class='col-rank'>ID</th>
          <th class='col-agent'>AGENT_NAME</th>
          <th class='col-today'>TODAY</th>
          <th class='col-day'>WED</th>
          <th class='col-day'>THU</th>
          <th class='col-day'>FRI</th>
          <th class='col-day'>SAT</th>
          <th class='col-day'>MON</th>
          <th class='col-day'>TUE</th>
          <th class='col-total'>TOTAL</th>
        </tr>
      </thead>
      <tbody></tbody>
    </table>
  </div>

  <div id='meta'>
    <div id='diag'>Initializing uplink...</div>
  </div>
</div>

<script>
/* MATRIX RAIN EFFECT */
const canvas = document.getElementById('matrix-canvas');
const ctx = canvas.getContext('2d');
let width = canvas.width = window.innerWidth;
let height = canvas.height = window.innerHeight;
const cols = Math.floor(width / 20) + 1;
const ypos = Array(cols).fill(0);
function matrix() {
  ctx.fillStyle = '#0001';
  ctx.fillRect(0, 0, width, height);
  ctx.fillStyle = '#0F0';
  ctx.font = '15pt monospace';
  ypos.forEach((y, ind) => {
    const text = String.fromCharCode(Math.random() * 128);
    const x = ind * 20;
    ctx.fillText(text, x, y);
    if (y > 100 + Math.random() * 10000) ypos[ind] = 0;
    else ypos[ind] = y + 20;
  });
}
setInterval(matrix, 50);
window.addEventListener('resize', () => { width=canvas.width=window.innerWidth; height=canvas.height=window.innerHeight; });

/* LOGIC */
function setVHVar(){ const vh=window.innerHeight*0.01; document.documentElement.style.setProperty('--vh', `${vh}px`); }
setVHVar(); window.addEventListener('resize', setVHVar);

const API_KEY         = "AIzaSyDwOqp2uizZol2et6Uqi7CnntW9Hkrinjg";
const WEEKLY_SHEETID = "1xNrDZ6uXUS0XMU3033SALOPPORgyjQomH68W2GyTAUo";
const DAILY_ID_RAW   = "1MeGKl3Qok84NymsXnuHuA4reL_l9Y1SqqLuejIMeaUA";
const TIMEZONE        = "America/Tijuana";
const DAILY_REFRESH  = 12000; 
const WEEKLY_REFRESH = 5*60*1000;

let ALL_DATA=[]; 

function diag(t){ document.getElementById('diag').innerText = `> ${t}`; }
function setChipWeekly(t){ document.getElementById('chipWeekly').textContent = `WK: ${t}`; }
function setChipDaily(t){ document.getElementById('chipDaily').textContent = `DAY: ${t}`; }
function getLocalDate(){ const s=new Date().toLocaleString('en-US',{timeZone:TIMEZONE}); return new Date(s); }
function isoWeek(d){ const x=new Date(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate())); const n=x.getUTCDay()||7; x.setUTCDate(x.getUTCDate()+4-n); const y=new Date(Date.UTC(x.getUTCFullYear(),0,1)); return {week:Math.ceil((((x-y)/86400000)+1)/7), year:x.getUTCFullYear()}; }
function weeksInISOYear(y){ const d=new Date(Date.UTC(y,11,31)); const day=d.getUTCDay(); return (day===4 || (d.getUTCDate()===31 && day===3))?53:52; }

/* FIX: SEMANA CORREGIDA (Corte Miércoles 12PM) */
function computeWeeklyTabName(){
  const url=new URL(window.location.href); const override=url.searchParams.get('weeklyTab'); if(override) return override;
  const local=getLocalDate(); const hrs=local.getHours(); const dow=local.getDay(); const iw=isoWeek(local); let w=iw.week;
  const beforeCut = (dow === 1 || dow === 2 || (dow === 3 && hrs < 12));
  if(beforeCut){ 
    w--; 
    if(w < 1) w = weeksInISOYear(iw.year - 1); 
  }
  return `W${w}`;
}

const emoji=/[\u{1F1E6}-\u{1F1FF}\u{1F300}-\u{1FAFF}\u{1F900}-\u{1F9FF}\u{2600}-\u{27BF}\u{FE0F}]/gu;
function normName(s){ return (s||"").replace(emoji,"").normalize('NFD').replace(/[\u0300-\u036f]/g,"").replace(/[^\x20-\x7E]/g,"").replace(/\s{2,}/g," ").trim().toUpperCase(); }
function normID(s){ return (s||"").toString().trim(); }

/* fetch seguro */
async function fetchSafeJSON(url, {tries=4, baseDelay=700} = {}) {
  let lastErr;
  for (let i = 0; i < tries; i++) {
    try {
      const r = await fetch(url, { cache: 'no-store' });
      if (r.ok) return await r.json();
      throw new Error(`HTTP ${r.status}`);
    } catch (e) {
      lastErr = e;
      await new Promise(res => setTimeout(res, baseDelay * Math.pow(2, i)));
    }
  }
  throw lastErr || new Error('Fetch failed');
}

async function readWeeklyTab(weeklyTab){
  const ranges=[`${weeklyTab}!A3:C96`,`${weeklyTab}!D3:D96`,`${weeklyTab}!F3:F96`,`${weeklyTab}!H3:H96`,`${weeklyTab}!J3:J96`,`${weeklyTab}!L3:L96`,`${weeklyTab}!N3:N96`,`${weeklyTab}!O3:O96`].map(encodeURIComponent);
  const url=`https://sheets.googleapis.com/v4/spreadsheets/${WEEKLY_SHEETID}/values:batchGet?`+ranges.map(r=>`ranges=${r}`).join("&")+`&valueRenderOption=UNFORMATTED_VALUE&key=${API_KEY}`;
  const j=await fetchSafeJSON(url); const vr=j.valueRanges||[];
  const base=vr[0]?.values||[]; const toCol=v=>(v?.values||[]).map(r=>(r[0]??"").toString().trim());
  const d=toCol(vr[1]), f=toCol(vr[2]), h=toCol(vr[3]), jv=toCol(vr[4]), l=toCol(vr[5]), n=toCol(vr[6]), oT=toCol(vr[7]);
  const len=Math.max(base.length,d.length,f.length,h.length,jv.length,l.length,n.length,oT.length);
  const out=[];
  for(let i=0;i<len;i++){
    const id=normID(base[i]?.[0]??""); const name=(base[i]?.[1]??"").toString().trim();
    if(!id && !name) continue;
    out.push({ id,idKey:id, name, nameKey:normName(name),
      wed:parseInt(d[i]||0), thu:parseInt(f[i]||0), fri:parseInt(h[i]||0),
      sat:parseInt(jv[i]||0), mon:parseInt(l[i]||0), tue:parseInt(n[i]||0),
      total:parseInt(oT[i]||0), today:0 });
  }
  out.sort((a,b)=>(b.total||0)-(a.total||0));
  return out;
}

function fmtDailyTab(dt){ 
  // Formato estricto: "Feb 14". Asegura coincidencia con Google Sheets default.
  const m=new Intl.DateTimeFormat('en-US',{month:'short',timeZone:TIMEZONE}).format(dt); 
  const dd=new Intl.DateTimeFormat('en-US',{day:'2-digit',timeZone:TIMEZONE}).format(dt); 
  return `${m} ${dd}`; 
}

function getDailyTabCandidates(){
  const url=new URL(window.location.href); const o=url.searchParams.get('dailyTab'); if(o) return [o];
  const now=getLocalDate(); const y=new Date(now.getTime()-86400000); 
  return [fmtDailyTab(now), fmtDailyTab(y)];
}

async function readDailyApproved(){
  const rangesFor=tab=>([`${tab}!A2:A70`,`${tab}!B2:B70`,`${tab}!C2:C70`,`${tab}!E2:E70`,`${tab}!F2:F70`,`${tab}!G2:G70`].map(encodeURIComponent));
  const tabs=getDailyTabCandidates();
  const DAILY_IDS=[DAILY_ID_RAW];
  
  let usedTab = "None";
  
  for(const id of DAILY_IDS){
    for(const tab of tabs){
      diag(`Scanning sector: ${tab}...`);
      const url=`https://sheets.googleapis.com/v4/spreadsheets/${id}/values:batchGet?`+rangesFor(tab).map(r=>`ranges=${r}`).join("&")+`&valueRenderOption=UNFORMATTED_VALUE&key=${API_KEY}`;
      try{
        const j=await fetchSafeJSON(url); const vr=j.valueRanges||[];
        const A=vr[0]?.values||[], B=vr[1]?.values||[], C=vr[2]?.values||[];
        const E=vr[3]?.values||[], F=vr[4]?.values||[], G=vr[5]?.values||[];
        const mapByName=new Map(); const mapByID=new Map();
        
        let foundData = false;
        function addPair(nmCell,idCell,valCell){
          const nm=(nmCell?.[0]??"").toString(); const id=(idCell?.[0]??"").toString().trim(); const v=parseInt((valCell?.[0]??0))||0;
          if(v > 0) foundData = true;
          if(nm.trim()){ const nk=normName(nm); mapByName.set(nk,(mapByName.get(nk)||0)+v); }
          if(id){ mapByID.set(id,(mapByID.get(id)||0)+v); }
        }
        
        const rowsFK=Math.max(A.length,B.length,C.length); for(let i=0;i<rowsFK;i++) addPair(A[i],B[i],C[i]);
        const rowsRG=Math.max(E.length,F.length,G.length); for(let i=0;i<rowsRG;i++) addPair(E[i],F[i],G[i]);
        
        // Si encontramos datos o es la pestaña de hoy (aunque esté vacía), retornamos
        if(foundData || tab === tabs[0]) {
           return {id, tab, mapByName, mapByID};
        }
      }catch(e){ 
        console.log(`Failed tab ${tab}:`, e);
      }
    }
  }
  return {id:DAILY_IDS[0], tab:tabs[0], mapByName:new Map(), mapByID:new Map()};
}

function updateTotalDisplay(total){
  document.getElementById('totalTodayValue').textContent = total.toLocaleString('en-US');
}

function renderList(list){
  const tbody=document.querySelector("#tbl tbody"); tbody.innerHTML="";
  
  const maxToday=Math.max(1, ...list.map(p=>p.today||0)); 
  const maxTotal=Math.max(1, ...list.map(p=>p.total||0));
  const toPct=(v,max)=>Math.max(3, Math.min(100, Math.round((v/max)*100)));
  
  list.forEach((p,i)=>{
    const rowIndex=i;
    const today=p.today||0, total=p.total||0;

    let rankClass = 'rank-3';
    if(rowIndex === 0) rankClass = 'rank-1';
    if(rowIndex === 1) rankClass = 'rank-2';

    const tr=document.createElement('tr');
    tr.innerHTML = `
      <td class="col-rank">
        <div class="rankwrap">
          <div class="rank-box ${rankClass}">${rowIndex+1}</div>
        </div>
      </td>
      <td class="col-agent">
        <div class="agent-wrap">
          <div class="name" title="${p.name}">${p.name}</div>
        </div>
      </td>
      <td class="col-today">
        <div class="bar today">
          <div class="fill" style="width:0%"></div>
          <div class="value">${today}</div>
        </div>
      </td>
      <td class="col-day">${p.wed||0}</td>
      <td class="col-day">${p.thu||0}</td>
      <td class="col-day">${p.fri||0}</td>
      <td class="col-day">${p.sat||0}</td>
      <td class="col-day">${p.mon||0}</td>
      <td class="col-day">${p.tue||0}</td>
      <td class="col-total">
        <div class="bar total">
          <div class="fill" style="width:0%"></div>
          <div class="value">${total}</div>
        </div>
      </td>
    `;
    tbody.appendChild(tr);

    setTimeout(()=>{
      tr.querySelector('.bar.today > .fill').style.width = toPct(today, maxToday) + '%';
      tr.querySelector('.bar.total > .fill').style.width = toPct(total, maxTotal) + '%';
    }, 50);
  });
}

async function updateData(){
  diag('Establishing connection...');
  const weeklyTab=computeWeeklyTabName();
  setChipWeekly(weeklyTab);

  const [weeklyData, dailyData] = await Promise.all([
    readWeeklyTab(weeklyTab),
    readDailyApproved()
  ]);
  
  setChipDaily(dailyData.tab);
  
  const tempMap = new Map();
  weeklyData.forEach(p => tempMap.set(p.idKey, p));
  
  dailyData.mapByName.forEach((score, nameKey) => {
    let agent = weeklyData.find(p => p.nameKey === nameKey);
    if (agent) agent.today = score;
  });
  
  dailyData.mapByID.forEach((score, idKey) => {
    let agent = tempMap.get(idKey);
    if (agent) agent.today = score;
  });

  weeklyData.sort((a, b) => {
    if ((b.today || 0) !== (a.today || 0)) return (b.today || 0) - (a.today || 0);
    return ((b.total||0) + (b.today||0)) - ((a.total||0) + (a.today||0));
  });

  ALL_DATA = weeklyData.filter((p, i) => i < 3 || (p.total||0) > 0 || (p.today||0) > 0);
  
  const totalToday = ALL_DATA.reduce((sum, p) => sum + (p.today || 0), 0);
  updateTotalDisplay(totalToday);

  diag(`Uplink established. Data: ${weeklyTab} + ${dailyData.tab}`);
}

(async function init(){
  await updateData();
  renderList(ALL_DATA); 
  setInterval(updateData, DAILY_REFRESH); 
})();
</script>
</body>
</html>
