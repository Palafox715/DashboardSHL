<!DOCTYPE html>
<html lang='es'>
<head>
<meta charset='utf-8'/>
<meta name='viewport' content='width=device-width, initial-scale=1'/>
<title>Leaderboard — Quartz Rift & Guardian Protocol</title>
<style>
  :root{
    --vh: 1vh;
    --dark-bg: #0A0A0A;
    --ink:#E0E0E0;
    --glass: rgba(0,0,0, .55);
    --glass-strong: rgba(0,0,0, .75);
    --neon-blue: #44CCFF;
    --neon-purple: #FF44CC;
    --neon-red: #FF4444;
    --neon-yellow: #FFDD44;
    --neon-green: #44FF88;
    
    --glow-blue: rgba(44, 204, 255, .6);
    --glow-purple: rgba(255, 68, 204, .5);
  }
  
  html,body{ margin:0; min-height:100%; width:100%; background:var(--dark-bg); color:var(--ink); font-family:system-ui,-apple-system,sans-serif; overflow-x: hidden; overflow-y: hidden; } /* Hidden Y para no hacer scroll con el familiar */

  /* FONDO MATRIX Y GRADIENTES */
  #matrix-canvas { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: -2; opacity: 0.12; pointer-events: none; }
  body::before, body::after{ content:""; position:fixed; inset:-20%; background: radial-gradient(40% 40% at 20% 20%, var(--glow-blue), transparent), radial-gradient(30% 30% at 50% 90%, var(--glow-purple), transparent); z-index:-1; pointer-events:none; mix-blend-mode:lighten; animation:float 22s linear infinite; }
  @keyframes float{ 0%, 100%{transform:translate3d(0,0,0)} 50%{transform:translate3d(2%, -2%, 0)} }

  /* ESTRUCTURA DEL DASHBOARD CENTRAL */
  #board{ position:relative; z-index:1; width:100vw; height: 100vh; padding:calc(1.2*var(--vh)) calc(1.6*var(--vh)); box-sizing:border-box; display:flex;flex-direction:column;gap:calc(0.8*var(--vh)); max-width: 1200px; margin: 0 auto; overflow-y: auto; padding-bottom: 120px; }
  .top-header-flex{ display: flex; justify-content: space-between; align-items: center; gap: 10px; }
  .header-controls { display: flex; align-items: center; gap: 15px; }
  #dailyTotalDisplay{ background: var(--glass-strong); padding: 8px 16px; border-radius: 10px; border: 1px solid var(--neon-blue); box-shadow: 0 0 15px var(--glow-blue); text-align: right; }
  #dailyTotalDisplay .label{ font-size: 10px; font-weight: 600; color: var(--neon-blue); text-transform: uppercase; }
  #dailyTotalDisplay .value{ font-size: 24px; font-weight: 900; color: var(--neon-blue); line-height: 1; }
  .chips{ display:flex; gap:10px; flex-wrap:wrap; justify-content:center; }
  .chip{ padding: 5px 12px; border-radius:999px; background:var(--glass); border:1px solid rgba(255,255,255,.2); font-weight:800; font-size:12px; }
  .table-wrap{ flex:1; overflow-x: auto; background: var(--glass); border-radius: 12px; border: 1px solid rgba(255,255,255,0.05); }
  table{ width:100%; border-collapse:separate; border-spacing:0 8px; table-layout:fixed; }
  thead th{ background:var(--glass-strong); text-transform:uppercase; font-size:12px; padding:10px; border-bottom: 2px solid rgba(255,255,255,.1); }
  tbody td{ padding:10px; text-align:center; border-top:1px solid rgba(255,255,255,.05); }
  .bar{ position:relative; height:18px; border-radius:10px; background:rgba(255,255,255,0.1); overflow:hidden; }
  .bar > .fill{ position:absolute; left:0; top:0; bottom:0; width:0%; transition: width 0.8s ease; }
  .bar.today > .fill{ background: var(--neon-blue); box-shadow: 0 0 10px var(--glow-blue); }
  .bar.total > .fill{ background: var(--neon-purple); box-shadow: 0 0 10px var(--glow-purple); }
  .bar .value{ position:relative; z-index:1; font-size:11px; font-weight:900; color:white; text-shadow: 1px 1px 2px black; }
  #diag { position: fixed; top: 10px; left: 10px; font-size: 10px; padding: 5px 10px; border-radius: 5px; background: rgba(0,0,0,0.8); border-left: 3px solid var(--neon-blue); z-index: 100; }

  /* =========================================
     CAPA DE MINERÍA DE ALTA FIDELIDAD (24 NODOS) 
     ========================================= */
  .rift-overlay { position: fixed; top: 0; bottom: 0; width: 200px; z-index: 50; pointer-events: none; }
  #rift-left { left: 0; background: linear-gradient(to right, rgba(0,0,0,0.95), rgba(0,0,0,0.4) 80%, transparent); border-right: 1px solid rgba(255,255,255,0.02); }
  #rift-right { right: 0; background: linear-gradient(to left, rgba(0,0,0,0.95), rgba(0,0,0,0.4) 80%, transparent); border-left: 1px solid rgba(255,255,255,0.02); }

  .crystal-node {
    position: absolute; width: 60px; height: 70px; pointer-events: auto; background-size: contain; background-position: center; background-repeat: no-repeat;
    transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275), opacity 0.4s ease, filter 0.4s ease, top 0.6s ease-in-out, left 0.6s ease-in-out, right 0.6s ease-in-out;
    cursor: not-allowed; opacity: 0.1; transform: scale(0.1); filter: brightness(0.5) grayscale(1);
  }
  .crystal-node.ready { cursor: pointer; opacity: 1; filter: brightness(1.2) grayscale(0); animation: levitate-neon-pulse 2s infinite alternate ease-in-out; }

  @keyframes levitate-neon-pulse {
    0% { transform: scale(1) translateY(0px); filter: drop-shadow(0 0 10px var(--node-color)) brightness(1.1); }
    100% { transform: scale(1.1) translateY(-10px); filter: drop-shadow(0 0 15px var(--node-color)) drop-shadow(0 0 30px var(--node-color)) brightness(1.5); }
  }

  /* BÓVEDA LOCAL */
  #vault-hud {
    position: fixed; top: 30px; right: 30px; z-index: 100; background: rgba(10, 10, 15, 0.85); backdrop-filter: blur(10px);
    border: 1px solid rgba(255,255,255,0.1); border-radius: 15px; padding: 15px 25px; text-align: right; box-shadow: 0 10px 30px rgba(0,0,0,0.8); border-right: 3px solid #FFF; transition: border-color 0.5s;
  }
  .vault-title { font-size: 10px; color: var(--ink); letter-spacing: 2px; opacity: 0.6; margin-bottom: 5px; }
  .vault-score { font-size: 32px; font-weight: 900; color: #FFF; line-height: 1; text-shadow: 0 0 10px rgba(255,255,255,0.5); transition: color 0.3s; }
  .floating-text { position: fixed; font-weight: 900; font-size: 24px; z-index: 200; pointer-events: none; animation: floatUp 1s cubic-bezier(0.1, 0.8, 0.3, 1) forwards; }
  @keyframes floatUp { 0% { transform: translateY(0) scale(0.5); opacity: 1; } 100% { transform: translateY(-70px) scale(1.5); opacity: 0; } }

  /* =========================================
     NUEVO: SUBSISTEMA GUARDIÁN (TAMAGOTCHI)
     ========================================= */
  #guardian-area { position: fixed; bottom: 0; left: 0; width: 100vw; height: 120px; z-index: 90; pointer-events: none; }
  
  /* El Sprite Placeholder (Bloque Amarillo) */
  #guardian-sprite {
    position: absolute; bottom: 20px; left: 50%; width: 64px; height: 64px;
    background-color: var(--neon-yellow); border-radius: 8px;
    box-shadow: 0 0 20px rgba(255, 221, 68, 0.5);
    pointer-events: auto; cursor: pointer;
    transition: background-color 0.3s, transform 0.1s;
    /* Para cuando inyectemos la imagen: */
    background-size: contain; background-position: bottom center; background-repeat: no-repeat;
  }

  /* Animaciones Placeholder de Estados */
  .anim-walk { animation: bounce-walk 0.5s infinite alternate; }
  .anim-eat { animation: jump-eat 0.4s ease; background-color: var(--neon-green) !important; }
  .anim-train { animation: shake-train 0.2s infinite; background-color: var(--neon-red) !important; }
  .anim-sleep { background-color: #555 !important; box-shadow: none !important; height: 32px !important; bottom: 20px !important; }

  @keyframes bounce-walk { 0% { transform: translateY(0); } 100% { transform: translateY(-10px); } }
  @keyframes jump-eat { 0% { transform: scale(1) translateY(0); } 50% { transform: scale(1.2) translateY(-30px); } 100% { transform: scale(1) translateY(0); } }
  @keyframes shake-train { 0% { transform: translateX(0); } 25% { transform: translateX(-5px) rotate(-5deg); } 75% { transform: translateX(5px) rotate(5deg); } 100% { transform: translateX(0); } }

  /* HUD del Guardián (Barra y Menú) */
  #guardian-hud {
    position: fixed; bottom: 20px; right: 30px; z-index: 95;
    background: var(--glass-strong); padding: 15px; border-radius: 12px;
    border: 1px solid var(--neon-yellow); display: none; /* Oculto por defecto */
    backdrop-filter: blur(5px); box-shadow: 0 5px 20px rgba(0,0,0,0.8);
    pointer-events: auto; width: 220px;
  }
  .g-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
  .g-title { font-size: 14px; font-weight: 900; color: var(--neon-yellow); text-transform: uppercase; }
  .g-level { font-size: 11px; color: var(--ink); background: #333; padding: 2px 6px; border-radius: 4px; }
  
  /* Barra de Satisfacción */
  .sat-bar-bg { width: 100%; height: 8px; background: #222; border-radius: 4px; overflow: hidden; margin-bottom: 15px; }
  .sat-bar-fill { height: 100%; width: 100%; background: linear-gradient(90deg, #FF4444, #FFDD44, #44FF88); transition: width 0.5s ease; }

  /* Botones de Acción */
  .g-btn {
    width: 100%; background: transparent; border: 1px solid rgba(255,255,255,0.2);
    color: var(--ink); padding: 8px; border-radius: 6px; margin-bottom: 5px;
    cursor: pointer; font-size: 11px; font-weight: bold; text-align: left;
    display: flex; justify-content: space-between; transition: 0.2s;
  }
  .g-btn:hover { background: rgba(255,255,255,0.1); border-color: var(--neon-yellow); }
  .g-btn span.cost { color: var(--neon-purple); }
  .g-btn:disabled { opacity: 0.4; cursor: not-allowed; border-color: rgba(255,255,255,0.1); }
</style>
</head>
<body>

<canvas id="matrix-canvas"></canvas>

<div id="rift-left" class="rift-overlay"></div>
<div id="rift-right" class="rift-overlay"></div>

<div id="vault-hud">
    <div class="vault-title">BÓVEDA LOCAL</div>
    <div id="vault-score" class="vault-score">0</div>
</div>

<div id="guardian-area">
    <div id="guardian-sprite" class="anim-walk" onclick="toggleGuardianMenu()"></div>
</div>

<div id="guardian-hud">
    <div class="g-header">
        <div class="g-title">Guardián</div>
        <div class="g-level" id="g-lvl-display">Lv. 1</div>
    </div>
    <div style="font-size:9px; margin-bottom:3px; color:#aaa; display:flex; justify-content:space-between;">
        <span>Satisfacción</span> <span id="g-buff-status" style="color:var(--neon-green)">+20% Vel.</span>
    </div>
    <div class="sat-bar-bg"><div class="sat-bar-fill" id="g-sat-fill"></div></div>
    
    <button class="g-btn" id="btn-feed" onclick="feedGuardian()">
        <span>🥩 Alimentar (+30%)</span> <span class="cost">500 pts</span>
    </button>
    <button class="g-btn" id="btn-train" onclick="trainGuardian()">
        <span>⚔️ Entrenar (EXP)</span> <span class="cost">1500 pts</span>
    </button>
    <button class="g-btn" onclick="toggleGuardianMenu()" style="text-align:center; display:block; margin-top:10px; border:none; color:#888;">Cerrar Panel</button>
</div>

<div id='board'>
  <div class='top-header-flex'> 
    <h2 style="margin:0; font-size: 28px;">🏁 Leaderboard</h2>
    <div class="header-controls"><div id='dailyTotalDisplay'><div class='label'>Total Diario</div><div class='value' id='totalTodayValue'>0</div></div></div>
  </div>
  <div class='chips'>
    <div id='chipWeekly' class='chip'>Week: —</div><div id='chipDaily' class='chip'>Daily: —</div>
    <button class="chip" onclick="updateData()" style="cursor:pointer; background:rgba(255,255,255,0.1)">🔄 Refrescar Red</button>
  </div>
  <div class='table-wrap'>
    <table id='tbl'>
      <thead><tr><th style="width:50px">#</th><th style="text-align:left">Agent</th><th>Today</th><th>Total</th></tr></thead>
      <tbody></tbody>
    </table>
  </div>
</div>

<div id="diag">Iniciando sistemas...</div>

<script>
/* ==========================================================================
   MÓDULO 1: ECONOMÍA Y BÓVEDA LOCAL
   ========================================================================== */
let localVault = 0;

function initVault() {
    localVault = parseInt(localStorage.getItem('qv_vault_v3')) || 0;
    updateVaultUI();
}

function updateVaultUI(glowColor = '#FFF') {
    const scoreEl = document.getElementById('vault-score');
    const hudEl = document.getElementById('vault-hud');
    scoreEl.innerText = localVault.toLocaleString();
    hudEl.style.borderRightColor = glowColor;
    scoreEl.style.color = glowColor;
    scoreEl.style.textShadow = `0 0 20px ${glowColor}`;
    checkGuardianButtons(); // Verifica si alcanza para comprar
    setTimeout(() => {
        hudEl.style.borderRightColor = '#FFF';
        scoreEl.style.color = '#FFF';
        scoreEl.style.textShadow = `0 0 10px rgba(255,255,255,0.5)`;
    }, 600);
}

function deductPoints(amount) {
    if (localVault >= amount) {
        localVault -= amount;
        localStorage.setItem('qv_vault_v3', localVault);
        updateVaultUI(document.documentElement.style.getPropertyValue('--neon-red') || '#FF4444');
        return true;
    }
    return false;
}

/* ==========================================================================
   MÓDULO 2: SISTEMA DEL GUARDIÁN (TAMAGOTCHI)
   ========================================================================== */
let gStats = { sat: 100, exp: 0, level: 1, lastTick: Date.now() };
let gState = 'walk'; // walk, sleep, act
let gPos = window.innerWidth / 2;
let gDir = 1; // 1 derecha, -1 izquierda

function initGuardian() {
    const saved = localStorage.getItem('qv_guardian');
    if(saved) {
        gStats = JSON.parse(saved);
        // Descontar satisfacción por el tiempo offline (1 punto por minuto)
        const minsOffline = Math.floor((Date.now() - gStats.lastTick) / 60000);
        gStats.sat = Math.max(0, gStats.sat - (minsOffline * 0.5)); 
    }
    gStats.lastTick = Date.now();
    updateGuardianUI();
    
    // Bucle de Lógica del Guardián
    setInterval(guardianLogicTick, 1000);
    // Bucle de Movimiento (Suave)
    requestAnimationFrame(guardianMoveLoop);
}

function saveGuardian() {
    gStats.lastTick = Date.now();
    localStorage.setItem('qv_guardian', JSON.stringify(gStats));
}

function guardianLogicTick() {
    // Reducir satisfacción (1 punto cada 20 segundos para probar rápido)
    gStats.sat = Math.max(0, gStats.sat - 0.05);
    
    const sprite = document.getElementById('guardian-sprite');
    
    // Cambio de estado según satisfacción
    if (gStats.sat <= 0 && gState !== 'act') {
        if (gState !== 'sleep') { gState = 'sleep'; sprite.className = 'anim-sleep'; updateGuardianUI(); }
    } else if (gStats.sat > 0 && gState === 'sleep') {
        gState = 'walk'; sprite.className = 'anim-walk'; updateGuardianUI();
    }
    
    saveGuardian();
    updateGuardianUI(); // Actualizar barra visualmente
}

function guardianMoveLoop() {
    if (gState === 'walk') {
        gPos += 1 * gDir;
        const spriteW = 64;
        const padding = 220; // Para no meterse debajo de la grieta derecha
        if (gPos > window.innerWidth - padding) gDir = -1;
        if (gPos < 220) gDir = 1; // Para no meterse debajo de la grieta izquierda
        
        const sprite = document.getElementById('guardian-sprite');
        sprite.style.left = `${gPos}px`;
        // Voltear el sprite si va a la izquierda (preparación para el GIF)
        sprite.style.transform = `scaleX(${gDir})`; 
    }
    requestAnimationFrame(guardianMoveLoop);
}

function getGuardianBuff() {
    if (gStats.sat > 70) return 1.2; // +20% Velocidad
    if (gStats.sat <= 0) return 0.8; // -20% Velocidad
    return 1.0; // Normal
}

// INTERACCIONES UI
function toggleGuardianMenu() {
    const menu = document.getElementById('guardian-hud');
    menu.style.display = menu.style.display === 'block' ? 'none' : 'block';
    checkGuardianButtons();
}

function checkGuardianButtons() {
    document.getElementById('btn-feed').disabled = localVault < 500;
    document.getElementById('btn-train').disabled = localVault < 1500;
}

function updateGuardianUI() {
    document.getElementById('g-sat-fill').style.width = `${Math.min(100, Math.max(0, gStats.sat))}%`;
    document.getElementById('g-lvl-display').innerText = `Lv. ${gStats.level}`;
    
    const buffTxt = document.getElementById('g-buff-status');
    if(gStats.sat > 70) { buffTxt.innerText = "+20% Vel."; buffTxt.style.color = "var(--neon-green)"; }
    else if(gStats.sat <= 0) { buffTxt.innerText = "-20% Vel."; buffTxt.style.color = "var(--neon-red)"; }
    else { buffTxt.innerText = "Estado Nominal"; buffTxt.style.color = "var(--ink)"; }
}

function playActionAnimation(animClass) {
    const sprite = document.getElementById('guardian-sprite');
    const oldClass = sprite.className;
    gState = 'act';
    sprite.className = animClass; // Asignar animación temporal
    
    setTimeout(() => {
        gState = gStats.sat > 0 ? 'walk' : 'sleep';
        sprite.className = gState === 'walk' ? 'anim-walk' : 'anim-sleep';
    }, 1500); // Volver al estado normal en 1.5s
}

function feedGuardian() {
    if (deductPoints(500)) {
        gStats.sat = Math.min(100, gStats.sat + 30);
        saveGuardian();
        updateGuardianUI();
        playActionAnimation('anim-eat');
    }
}

function trainGuardian() {
    if (deductPoints(1500)) {
        gStats.sat = Math.min(100, gStats.sat + 10);
        gStats.exp += 50;
        if(gStats.exp >= gStats.level * 100) {
            gStats.level++; gStats.exp = 0; // Level up simple
        }
        saveGuardian();
        updateGuardianUI();
        playActionAnimation('anim-train');
    }
}

/* ==========================================================================
   MÓDULO 3: MINERÍA (24 NODOS CON EFECTO DE BUFF DEL GUARDIÁN)
   ========================================================================== */
const GEM_TYPES = {
    blue:   { points: 250,  time: 1 * 60 * 1000, color: 'var(--neon-blue)',   img: 'https://i.ibb.co/7sBBH4c/pngwing-com-1.png' },
    red:    { points: 500,  time: 5 * 60 * 1000, color: 'var(--neon-red)',    img: 'https://i.ibb.co/XZrXPwGc/pngwing-com.png' },
    purple: { points: 1000, time: 10 * 60 * 1000,color: 'var(--neon-purple)', img: 'https://i.ibb.co/4gwYj5LG/pngegg.png' }
};

const ACTIVE_SLOTS = [];
for(let i=1; i<=12; i++) {
    let type = i <= 6 ? 'blue' : (i <= 10 ? 'red' : 'purple');
    ACTIVE_SLOTS.push({ id: `L${i}`, side: 'left', type: type });
    ACTIVE_SLOTS.push({ id: `R${i}`, side: 'right', type: type });
}

const POSITIONS_POOL = { left: [], right: [] };
const cols = ['15px', '75px', '135px', '45px', '105px'];
for(let i=0; i<30; i++) {
    let topPct = 2 + (i * 3.1); 
    POSITIONS_POOL.left.push({ t: `${topPct}%`, l: cols[i % cols.length] });
    POSITIONS_POOL.right.push({ t: `${topPct}%`, r: cols[i % cols.length] });
}

let occupiedPositions = { left: new Set(), right: new Set() };

function initMiner() {
    ACTIVE_SLOTS.forEach(slot => {
        const gem = GEM_TYPES[slot.type];
        const riftEl = document.getElementById(`rift-${slot.side}`);
        
        const node = document.createElement('div');
        node.id = `gem-${slot.id}`;
        node.className = 'crystal-node';
        node.style.backgroundImage = `url('${gem.img}')`;
        node.style.setProperty('--node-color', gem.color);
        node.onclick = () => mineCrystal(slot.id);
        riftEl.appendChild(node);

        if (!localStorage.getItem(`qv_time_v3_${slot.id}`)) {
            localStorage.setItem(`qv_time_v3_${slot.id}`, Date.now());
            assignNewRandomPosition(slot.id);
        } else {
            loadStoredPosition(slot.id);
        }
    });

    setInterval(checkGrowth, 1000);
    checkGrowth();
}

function assignNewRandomPosition(slotId) {
    const slot = ACTIVE_SLOTS.find(s => s.id === slotId);
    const pool = POSITIONS_POOL[slot.side];
    const el = document.getElementById(`gem-${slotId}`);

    const oldPosIdx = localStorage.getItem(`qv_pos_v3_${slotId}`);
    if (oldPosIdx !== null) occupiedPositions[slot.side].delete(parseInt(oldPosIdx));

    let newIdx; let attempts = 0;
    do { newIdx = Math.floor(Math.random() * pool.length); attempts++; } while (occupiedPositions[slot.side].has(newIdx) && attempts < 25);

    occupiedPositions[slot.side].add(newIdx);
    localStorage.setItem(`qv_pos_v3_${slotId}`, newIdx);
    
    const pos = pool[newIdx];
    el.style.top = pos.t; el.style.left = ''; el.style.right = ''; 
    if(slot.side === 'left') el.style.left = pos.l; else el.style.right = pos.r;
}

function loadStoredPosition(slotId) {
    const slot = ACTIVE_SLOTS.find(s => s.id === slotId);
    const posIdx = parseInt(localStorage.getItem(`qv_pos_v3_${slotId}`));
    const el = document.getElementById(`gem-${slotId}`);
    if (isNaN(posIdx)) { assignNewRandomPosition(slotId); return; }
    occupiedPositions[slot.side].add(posIdx);
    const pos = POSITIONS_POOL[slot.side][posIdx];
    el.style.top = pos.t;
    if(slot.side === 'left') el.style.left = pos.l; else el.style.right = pos.r;
}

function checkGrowth() {
    const now = Date.now();
    const currentBuff = getGuardianBuff(); // OBTENEMOS EL BUFF DEL TAMAGOTCHI

    ACTIVE_SLOTS.forEach(slot => {
        const gem = GEM_TYPES[slot.type];
        const el = document.getElementById(`gem-${slot.id}`);
        const lastMined = parseInt(localStorage.getItem(`qv_time_v3_${slot.id}`));
        
        // APLICAMOS EL MULTIPLICADOR DE VELOCIDAD
        const elapsed = (now - lastMined) * currentBuff;
        const progress = Math.min(elapsed / gem.time, 1.0);

        if (progress >= 1.0) {
            if (!el.classList.contains('ready')) { el.classList.add('ready'); el.style.transform = `scale(1)`; }
        } else {
            el.classList.remove('ready');
            const scale = 0.1 + (progress * 0.8); 
            const opacity = 0.1 + (progress * 0.5);
            el.style.transform = `scale(${scale})`; el.style.opacity = opacity;
        }
    });
}

function mineCrystal(slotId) {
    const el = document.getElementById(`gem-${slotId}`);
    if (!el.classList.contains('ready')) return;

    const slot = ACTIVE_SLOTS.find(s => s.id === slotId);
    const gem = GEM_TYPES[slot.type];

    localVault += gem.points;
    localStorage.setItem('qv_vault_v3', localVault);
    localStorage.setItem(`qv_time_v3_${slotId}`, Date.now());
    
    el.classList.remove('ready');
    updateVaultUI(gem.color);
    spawnFloatingText(gem.points, gem.color, el);
    
    assignNewRandomPosition(slotId);
    checkGrowth();
}

function spawnFloatingText(points, color, sourceEl) {
    const rect = sourceEl.getBoundingClientRect();
    const floating = document.createElement('div');
    floating.className = 'floating-text'; floating.innerText = `+${points}`;
    floating.style.color = color; floating.style.left = `${rect.left + (rect.width/2) - 20}px`; floating.style.top = `${rect.top}px`;
    floating.style.textShadow = `0 0 15px ${color}`;
    document.body.appendChild(floating);
    setTimeout(() => floating.remove(), 1000);
}

function setDiag(msg, color = "#44CCFF") { const d = document.getElementById('diag'); if(d) { d.innerText = msg; d.style.borderLeftColor = color; } }
function getLocalDate(){ return new Date(new Date().toLocaleString('en-US',{timeZone:"America/Tijuana"})); }
function computeWeeklyTab(){ const d = getLocalDate(); const start = new Date(d.getFullYear(), 0, 1); const days = Math.floor((d - start) / 86400000); let week = Math.ceil((days + start.getDay() + 1) / 7); if (d.getDay() < 3 || (d.getDay() === 3 && d.getHours() < 12)) week--; return `W${week}`; }
async function fetchSheet(id, range) { try { const r = await fetch(`https://sheets.googleapis.com/v4/spreadsheets/${id}/values/${encodeURIComponent(range)}?key=${API_KEY}`); return r.ok ? await r.json() : null; } catch (e) { return null; } }

async function updateData() {
    setDiag("📡 Sincronizando Uplink...");
    const weeklyTab = computeWeeklyTab();
    const master = await fetchSheet(WEEKLY_ID, `${weeklyTab}!A3:O96`);
    if (!master) { setDiag("❌ Error Weekly Sheets", "#FF44CC"); return; }
    const today = getLocalDate(); const fmt = today.toLocaleString('en-US', {month:'short', day:'2-digit'});
    let daily = await fetchSheet(DAILY_ID, `${fmt}!A2:D100`);
    if (!daily) daily = await fetchSheet(DAILY_ID, `Tabla_25!A2:D100`);
    const dailyRows = daily?.values || [];
    const agents = master.values.map(row => {
        const id = (row[0] || "").toString().trim(); const name = (row[1] || "").toString().trim(); if (!id || !name) return null;
        const match = dailyRows.find(d => (d[1] || "").toString().trim() === id);
        return { name, today: match ? parseInt(match[2]) || 0 : 0, total: parseInt(row[14]) || 0 };
    }).filter(x => x).sort((a,b) => b.today - a.today);
    renderList(agents);
    document.getElementById('totalTodayValue').innerText = agents.reduce((s, a) => s + a.today, 0);
    document.getElementById('chipWeekly').innerText = `Week: ${weeklyTab}`;
    document.getElementById('chipDaily').innerText = `Daily: ${daily ? (daily.range.split('!')[0]) : '---'}`;
    setDiag("✅ Uplink Estable");
}

function renderList(data) {
    const tbody = document.querySelector("#tbl tbody"); if(!tbody) return; tbody.innerHTML = "";
    const maxT = Math.max(1, ...data.map(d => d.today)); const maxW = Math.max(1, ...data.map(d => d.total));
    data.forEach((a, i) => { tbody.innerHTML += `<tr><td>${i+1}</td><td style="text-align:left; font-weight:800">${a.name}</td><td><div class="bar today"><div class="fill" style="width:${(a.today/maxT)*100}%"></div><div class="value">${a.today}</div></div></td><td><div class="bar total"><div class="fill" style="width:${(a.total/maxW)*100}%"></div><div class="value">${a.total}</div></div></td></tr>`; });
}

const mCanvas = document.getElementById('matrix-canvas'); const mCtx = mCanvas.getContext('2d'); let mw, mh, mCols, mYpos;
function initMatrix() { mw = mCanvas.width = window.innerWidth; mh = mCanvas.height = window.innerHeight; mCols = Math.floor(mw / 25); mYpos = Array(mCols).fill(0); }
function drawMatrix() { mCtx.fillStyle = 'rgba(10, 10, 10, 0.1)'; mCtx.fillRect(0, 0, mw, mh); mCtx.fillStyle = '#44CCFF'; mCtx.font = '15px monospace'; mYpos.forEach((y, i) => { mCtx.fillText(String.fromCharCode(0x30A0 + Math.random() * 96), i * 25, y); mYpos[i] = y > 100 + Math.random() * 10000 ? 0 : y + 20; }); }
