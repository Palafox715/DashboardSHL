<!DOCTYPE html>
<html lang='es'>
<head>
<meta charset='utf-8'/>
<meta name='viewport' content='width=device-width, initial-scale=1'/>
<title>Leaderboard — Core Dashboard</title>
<style>
  :root{
    --vh: 1vh;
    --dark-bg: #0A0A0A;
    --ink:#E0E0E0;
    --glass: rgba(0,0,0, .6);
    --glass-strong: rgba(0,0,0, .85);
    --neon-blue: #44CCFF;
    --neon-purple: #FF44CC;
    --glow-blue: rgba(44, 204, 255, .6);
    --glow-purple: rgba(255, 68, 204, .5);
  }
  
  html,body{ margin:0; min-height:100%; width:100%; background:var(--dark-bg); color:var(--ink); font-family:system-ui,-apple-system,sans-serif; overflow: hidden; }

  /* FONDO MATRIX Y GRADIENTES */
  #matrix-canvas { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: -2; opacity: 0.12; pointer-events: none; }
  body::before, body::after{ content:""; position:fixed; inset:-20%; background: radial-gradient(40% 40% at 20% 20%, var(--glow-blue), transparent), radial-gradient(30% 30% at 50% 90%, var(--glow-purple), transparent); z-index:-1; pointer-events:none; mix-blend-mode:lighten; animation:float 22s linear infinite; }
  @keyframes float{ 0%, 100%{transform:translate3d(0,0,0)} 50%{transform:translate3d(2%, -2%, 0)} }

  /* =========================================
     ZONA DE JUEGO (FRAME PARA FUTUROS PROYECTOS)
     ========================================= */
  #game-zone {
    position: fixed;
    inset: 0; /* Ocupa toda la pantalla */
    z-index: 0; /* Detrás del dashboard */
    pointer-events: auto; /* Permite interacciones en los márgenes libres */
  }

  /* ESTRUCTURA DEL DASHBOARD CENTRAL */
  #board{ position:relative; z-index:1; width:100vw; height: 100vh; padding:calc(1.2*var(--vh)) calc(1.6*var(--vh)); box-sizing:border-box; display:flex;flex-direction:column;gap:calc(0.8*var(--vh)); max-width: 1200px; margin: 0 auto; overflow-y: auto; padding-bottom: 120px; pointer-events: auto; }
  .top-header-flex{ display: flex; justify-content: space-between; align-items: center; gap: 10px; }
  .header-controls { display: flex; align-items: center; gap: 15px; }
  #dailyTotalDisplay{ background: var(--glass-strong); padding: 8px 16px; border-radius: 10px; border: 1px solid var(--neon-blue); box-shadow: 0 0 15px var(--glow-blue); text-align: right; }
  #dailyTotalDisplay .label{ font-size: 10px; font-weight: 600; color: var(--neon-blue); text-transform: uppercase; }
  #dailyTotalDisplay .value{ font-size: 24px; font-weight: 900; color: var(--neon-blue); line-height: 1; }
  .chips{ display:flex; gap:10px; flex-wrap:wrap; justify-content:center; }
  .chip{ padding: 5px 12px; border-radius:999px; background:var(--glass); border:1px solid rgba(255,255,255,.2); font-weight:800; font-size:12px; }
  .table-wrap{ flex:1; overflow-x: auto; background: var(--glass); border-radius: 12px; border: 1px solid rgba(255,255,255,0.05); }
  table{ width:100%; border-collapse:separate; border-spacing:0 8px; table-layout:fixed; }
  thead th{ background:var(--glass-strong); text-transform:uppercase; font-size:12px; padding:10px; border-bottom: 2px solid rgba(255,255,255,.1); }
  tbody td{ padding:10px; text-align:center; border-top:1px solid rgba(255,255,255,.05); }
  .bar{ position:relative; height:18px; border-radius:10px; background:rgba(255,255,255,0.1); overflow:hidden; }
  .bar > .fill{ position:absolute; left:0; top:0; bottom:0; width:0%; transition: width 0.8s ease; }
  .bar.today > .fill{ background: var(--neon-blue); box-shadow: 0 0 10px var(--glow-blue); }
  .bar.total > .fill{ background: var(--neon-purple); box-shadow: 0 0 10px var(--glow-purple); }
  .bar .value{ position:relative; z-index:1; font-size:11px; font-weight:900; color:white; text-shadow: 1px 1px 2px black; }
  
  #diag { position: fixed; top: 10px; left: 10px; font-size: 10px; padding: 5px 10px; border-radius: 5px; background: rgba(0,0,0,0.8); border-left: 3px solid var(--neon-blue); z-index: 100; pointer-events: none;}
</style>
</head>
<body>

<canvas id="matrix-canvas"></canvas>

<div id="game-zone"></div>

<div id='board'>
  <div class='top-header-flex'> 
    <h2 style="margin:0; font-size: 28px;">🏁 Leaderboard</h2>
    <div class="header-controls"><div id='dailyTotalDisplay'><div class='label'>Total Diario</div><div class='value' id='totalTodayValue'>0</div></div></div>
  </div>
  <div class='chips'>
    <div id='chipWeekly' class='chip'>Week: —</div><div id='chipDaily' class='chip'>Daily: —</div>
    <button class="chip" onclick="updateData()" style="cursor:pointer; background:rgba(255,255,255,0.1)">🔄 Refrescar Red</button>
  </div>
  <div class='table-wrap'>
    <table id='tbl'>
      <thead><tr><th style="width:50px">#</th><th style="text-align:left">Agent</th><th>Today</th><th>Total</th></tr></thead>
      <tbody></tbody>
    </table>
  </div>
</div>

<div id="diag">Iniciando sistemas...</div>

<script>
/* ==========================================================================
   MOTOR DEL DASHBOARD Y RED API
   ========================================================================== */
const API_KEY = "AIzaSyCCBAapFj9Fd-8cOIfpDJxrOP__76zxAxM"; 
const WEEKLY_ID = "1xNrDZ6uXUS0XMU3033SALOPPORgyjQomH68W2GyTAUo"; 
const DAILY_ID = "1MeGKl3Qok84NymsXnuHuA4reL_l9Y1SqqLuejIMeaUA";

function setDiag(msg, color = "#44CCFF") { 
    const d = document.getElementById('diag'); 
    if(d) { d.innerText = msg; d.style.borderLeftColor = color; } 
}

function getLocalDate(){ 
    return new Date(new Date().toLocaleString('en-US',{timeZone:"America/Tijuana"})); 
}

function computeWeeklyTab(){ 
    const d = getLocalDate(); 
    const start = new Date(d.getFullYear(), 0, 1); 
    const days = Math.floor((d - start) / 86400000); 
    let week = Math.ceil((days + start.getDay() + 1) / 7); 
    if (d.getDay() < 3 || (d.getDay() === 3 && d.getHours() < 12)) week--; 
    return `W${week}`; 
}

async function fetchSheet(id, range) { 
    try { 
        const r = await fetch(`https://sheets.googleapis.com/v4/spreadsheets/${id}/values/${encodeURIComponent(range)}?key=${API_KEY}`); 
        return r.ok ? await r.json() : null; 
    } catch (e) { return null; } 
}

async function updateData() {
    setDiag("📡 Sincronizando Uplink..."); 
    const weeklyTab = computeWeeklyTab(); 
    const master = await fetchSheet(WEEKLY_ID, `${weeklyTab}!A3:O96`);
    
    if (!master) { setDiag("❌ Error Weekly Sheets", "#FF44CC"); return; }
    
    const today = getLocalDate(); 
    const fmt = today.toLocaleString('en-US', {month:'short', day:'2-digit'});
    let daily = await fetchSheet(DAILY_ID, `${fmt}!A2:D100`); 
    if (!daily) daily = await fetchSheet(DAILY_ID, `Tabla_25!A2:D100`);
    
    const dailyRows = daily?.values || [];
    const agents = master.values.map(row => {
        const id = (row[0] || "").toString().trim(); 
        const name = (row[1] || "").toString().trim(); 
        if (!id || !name) return null;
        const match = dailyRows.find(d => (d[1] || "").toString().trim() === id); 
        return { name, today: match ? parseInt(match[2]) || 0 : 0, total: parseInt(row[14]) || 0 };
    }).filter(x => x).sort((a,b) => b.today - a.today);
    
    renderList(agents); 
    document.getElementById('totalTodayValue').innerText = agents.reduce((s, a) => s + a.today, 0);
    document.getElementById('chipWeekly').innerText = `Week: ${weeklyTab}`; 
    document.getElementById('chipDaily').innerText = `Daily: ${daily ? (daily.range.split('!')[0]) : '---'}`;
    setDiag("✅ Uplink Estable");
}

function renderList(data) {
    const tbody = document.querySelector("#tbl tbody"); 
    if(!tbody) return; 
    tbody.innerHTML = "";
    const maxT = Math.max(1, ...data.map(d => d.today)); 
    const maxW = Math.max(1, ...data.map(d => d.total));
    
    data.forEach((a, i) => { 
        tbody.innerHTML += `<tr>
            <td>${i+1}</td>
            <td style="text-align:left; font-weight:800">${a.name}</td>
            <td><div class="bar today"><div class="fill" style="width:${(a.today/maxT)*100}%"></div><div class="value">${a.today}</div></div></td>
            <td><div class="bar total"><div class="fill" style="width:${(a.total/maxW)*100}%"></div><div class="value">${a.total}</div></div></td>
        </tr>`; 
    });
}

/* ==========================================================================
   FONDO ANIMADO (MATRIX)
   ========================================================================== */
const mCanvas = document.getElementById('matrix-canvas'); 
const mCtx = mCanvas.getContext('2d'); 
let mw, mh, mCols, mYpos;

function initMatrix() { 
    mw = mCanvas.width = window.innerWidth; 
    mh = mCanvas.height = window.innerHeight; 
    mCols = Math.floor(mw / 25); 
    mYpos = Array(mCols).fill(0); 
}

function drawMatrix() { 
    mCtx.fillStyle = 'rgba(10, 10, 10, 0.1)'; 
    mCtx.fillRect(0, 0, mw, mh); 
    mCtx.fillStyle = '#44CCFF'; 
    mCtx.font = '15px monospace'; 
    mYpos.forEach((y, i) => { 
        mCtx.fillText(String.fromCharCode(0x30A0 + Math.random() * 96), i * 25, y); 
        mYpos[i] = y > 100 + Math.random() * 10000 ? 0 : y + 20; 
    }); 
}

window.addEventListener('resize', initMatrix);

/* ==========================================================================
   INICIALIZACIÓN MAESTRA
   ========================================================================== */
(async function init() { 
    initMatrix(); 
    setInterval(drawMatrix, 50); 
    await updateData(); 
    setInterval(updateData, 60000); 
})();
</script>
</body>
</html>
