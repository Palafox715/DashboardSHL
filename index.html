<!DOCTYPE html>
<html lang='es'>
<head>
<meta charset='utf-8'/>
<meta name='viewport' content='width=device-width, initial-scale=1'/>
<title>Leaderboard — Blue Protocol Final Señor</title>
<style>
  :root {
    --bg: #0b0a1a;
    --card-bg: rgba(20, 20, 35, 0.9);
    --blue-neon: #00d4ff;
    --pink-neon: #ff00ff;
    --text: #ffffff;
    --blue-glow: rgba(0, 212, 255, 0.5);
  }
  
  html, body { margin: 0; padding: 0; background: var(--bg); color: var(--text); font-family: 'Segoe UI', sans-serif; overflow-x: hidden; }
  
  #matrix-canvas { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 0; opacity: 0.2; pointer-events: none; }

  #board { position: relative; z-index: 5; padding: 25px; max-width: 1200px; margin: auto; }
  .header-flex { display: flex; justify-content: space-between; align-items: center; margin-bottom: 25px; }
  .title-area h1 { margin: 0; font-size: 36px; text-transform: uppercase; letter-spacing: 2px; }
  
  .total-box { background: rgba(0,0,0,0.6); border: 2px solid var(--blue-neon); padding: 10px 25px; border-radius: 12px; text-align: right; box-shadow: 0 0 15px var(--blue-glow); }
  .total-box .val { font-size: 42px; font-weight: 900; color: var(--pink-neon); line-height: 1; }

  .table-wrap { background: var(--card-bg); border-radius: 20px; padding: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; }
  th { text-transform: uppercase; color: #777; padding: 15px 5px; font-size: 11px; letter-spacing: 1px; border-bottom: 1px solid #333; }
  td { padding: 15px 5px; border-bottom: 1px solid rgba(255,255,255,0.05); text-align: center; }

  .rank-circle { width: 35px; height: 35px; line-height: 35px; border-radius: 50%; display: inline-block; font-weight: bold; color: #000; }
  .rank-1 { background: #ffcc00; box-shadow: 0 0 20px #ffcc00; }
  .rank-2 { background: #e0e0e0; box-shadow: 0 0 15px #e0e0e0; }
  .rank-3 { background: #ff8800; box-shadow: 0 0 15px #ff8800; }

  .bar-ui { height: 20px; background: #000; border-radius: 10px; position: relative; overflow: hidden; min-width: 90px; border: 1px solid #222; }
  .fill-blue { background: linear-gradient(90deg, #0066ff, #00d4ff); transition: width 0.5s ease; }
  .fill-pink { background: linear-gradient(90deg, #cc00ff, #ff00ff); transition: width 0.5s ease; }
  .bar-text { position: absolute; width: 100%; z-index: 2; font-size: 11px; font-weight: bold; line-height: 20px; color: #fff; text-align: center; }

  #game-container { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 100; pointer-events: none; display: none; }
  #game-canvas { width: 100%; height: 100%; pointer-events: auto; cursor: crosshair; }
  .game-hud { position: fixed; bottom: 30px; right: 30px; background: rgba(0,0,0,0.9); padding: 20px; border: 2px solid var(--blue-neon); border-radius: 15px; z-index: 110; text-align: right; }
  .btn-defense { background: none; border: 2px solid var(--blue-neon); color: var(--blue-neon); padding: 10px 25px; border-radius: 8px; cursor: pointer; font-weight: bold; text-transform: uppercase; }
</style>
</head>
<body>

<canvas id="matrix-canvas"></canvas>

<div id="game-container">
    <div class="game-hud">
        <div style="font-size: 11px; color: #ff4444; margin-bottom: 5px;">INTEGRIDAD DEL NÚCLEO</div>
        <div id="lives-display" style="font-size: 24px;">❤️❤️❤️❤️❤️</div>
        <hr style="border:0; border-top:1px solid #333; margin: 15px 0;">
        <div id="score-display" style="font-size: 32px; font-weight: bold; color: var(--blue-neon);">0</div>
        <div style="font-size: 10px; opacity: 0.6;">PUNTOS TÁCTICOS</div>
    </div>
    <canvas id="game-canvas"></canvas>
</div>

<div id='board'>
  <div class='header-flex'> 
    <div class="title-area">
        <h1>Leaderboard</h1>
        <div style="display:flex; gap:10px; margin-top:10px;">
            <span style="background:#000; padding:5px 15px; border-radius:20px; font-size:12px; font-weight:bold; border:1px solid #333;">Week: W9</span>
            <button class="btn-defense" onclick="startDefense()">Defense_Mode</button>
        </div>
    </div>
    <div class="total-box">
        <div style="font-size: 11px; opacity: 0.6; margin-bottom:5px;">TOTAL DIARIO (TODAY)</div>
        <div class="val" id="globalTotal">0</div>
    </div>
  </div>

  <div class='table-wrap'>
    <table id='leaderTable'>
      <thead>
        <tr>
          <th>#</th>
          <th style="text-align: left;">AGENT</th>
          <th>TODAY XFERS</th>
          <th>WED</th><th>THU</th><th>FRI</th><th>SAT</th><th>MON</th><th>TUE</th>
          <th>WEEK TOTAL</th>
        </tr>
      </thead>
      <tbody></tbody>
    </table>
  </div>
</div>

<script>
const API_KEY = "AIzaSyCCBAapFj9Fd-8cOIfpDJxrOP__76zxAxM";
const WEEKLY_ID = "1xNrDZ6uXUS0XMU3033SALOPPORgyjQomH68W2GyTAUo"; 
const DAILY_ID = "1MeGKl3Qok84NymsXnuHuA4reL_l9Y1SqqLuejIMeaUA";

/* MATRIX BACKGROUND */
const mCanvas = document.getElementById('matrix-canvas');
const mCtx = mCanvas.getContext('2d');
let mw, mh, mCols, mYpos;

function initMatrix() {
    mw = mCanvas.width = window.innerWidth; 
    mh = mCanvas.height = window.innerHeight;
    mCols = Math.floor(mw / 20); 
    mYpos = Array(mCols).fill(0);
}

function drawMatrix() {
    mCtx.fillStyle = 'rgba(11, 10, 26, 0.1)'; mCtx.fillRect(0, 0, mw, mh);
    mCtx.fillStyle = '#0080FF'; mCtx.font = '15px monospace';
    mYpos.forEach((y, i) => {
        mCtx.fillText(String.fromCharCode(Math.random() * 128), i * 20, y);
        mYpos[i] = y > 100 + Math.random() * 10000 ? 0 : y + 20;
    });
}
initMatrix(); setInterval(drawMatrix, 50);

/* --- SINCRONIZACIÓN DE DATOS --- */
async function syncData() {
    try {
        // Master List: Weekly File (Referencial)
        const mUrl = `https://sheets.googleapis.com/v4/spreadsheets/${WEEKLY_ID}/values/W9!A3:O96?key=${API_KEY}`;
        // Daily Data: El que define el Ranking (Xfers y CP) - Rango extendido hasta D para Credit Pulls
        const dUrl = `https://sheets.googleapis.com/v4/spreadsheets/${DAILY_ID}/values/Tabla_25!A2:D100?key=${API_KEY}`;

        const [mRes, dRes] = await Promise.all([fetch(mUrl), fetch(dUrl)]);
        const masterData = await mRes.json();
        const dailyData = await dRes.json();

        const agents = masterData.values || [];
        const dailyRows = dailyData.values || [];
        let totalGlobalToday = 0;

        let report = agents.map(a => {
            const id = a[0]; 
            const name = a[1];
            if(!id || !name) return null;

            // Buscamos en el documento diario usando el ID (Columna B de la sheet diaria es índice 1)
            // Columna C es Xfers (índice 2), Columna D es CP (índice 3)
            const dMatch = dailyRows.find(d => d[1] == id);
            
            const xfersToday = dMatch ? parseInt(dMatch[2]) || 0 : 0;
            const cpToday = dMatch ? parseInt(dMatch[3]) || 0 : 0;
            
            totalGlobalToday += xfersToday;

            return {
                id, name, 
                today: xfersToday,
                cp: cpToday, // Usado para desempates
                wed: a[3] || 0, thu: a[5] || 0, fri: a[7] || 0,
                sat: a[9] || 0, mon: a[11] || 0, tue: a[13] || 0,
                totalWeekly: parseInt(a[14]) || 0
            };
        }).filter(x => x !== null);

        // ORDENAMIENTO: 1. Por Xfers hoy, 2. Por Credit Pulls (desempate)
        report.sort((a, b) => {
            if (b.today !== a.today) {
                return b.today - a.today;
            }
            return b.cp - a.cp; // Si empatan en Xfers, el de más CP va arriba
        });

        document.getElementById('globalTotal').innerText = totalGlobalToday;
        render(report);
    } catch(e) { console.error("Error de Uplink:", e); }
}

function render(data) {
    const tbody = document.querySelector("#leaderTable tbody");
    tbody.innerHTML = "";
    const maxToday = Math.max(...data.map(d => d.today), 1);
    const maxTotal = Math.max(...data.map(d => d.totalWeekly), 1);

    data.forEach((a, i) => {
        const rankClass = i === 0 ? 'rank-1' : i === 1 ? 'rank-2' : i === 2 ? 'rank-3' : '';
        tbody.innerHTML += `
            <tr>
                <td><span class="rank-circle ${rankClass}">${i+1}</span></td>
                <td style="text-align:left; font-weight:bold;">${a.name} <small style="color:#555; font-size:9px;">[${a.id}]</small></td>
                <td>
                    <div class="bar-ui">
                        <div class="fill-blue" style="width:${(a.today/maxToday)*100}%;"></div>
                        <div class="bar-text">${a.today} <span style="font-size:8px; opacity:0.7">(${a.cp} CP)</span></div>
                    </div>
                </td>
                <td>${a.wed}</td><td>${a.thu}</td><td>${a.fri}</td><td>${a.sat}</td><td>${a.mon}</td><td>${a.tue}</td>
                <td>
                    <div class="bar-ui">
                        <div class="fill-pink" style="width:${(a.totalWeekly/maxTotal)*100}%;"></div>
                        <div class="bar-text">${a.totalWeekly}</div>
                    </div>
                </td>
            </tr>`;
    });
}

/* --- MOTOR DEL VIDEOJUEGO --- */
const canvas = document.getElementById('game-canvas');
const ctx = canvas.getContext('2d');
let gameActive = false, score = 0, lives = 5, enemies = [], particles = [], nextHeart = 5000;

class Particle {
    constructor(x,y) { this.x=x; this.y=y; this.vx=(Math.random()-0.5)*12; this.vy=(Math.random()-0.5)*12; this.a=1; }
    draw() { ctx.globalAlpha=this.a; ctx.fillStyle='#00d4ff'; ctx.fillRect(this.x,this.y,4,4); ctx.globalAlpha=1; }
}

function startDefense() {
    gameActive = true; document.getElementById('game-container').style.display = 'block';
    canvas.width = window.innerWidth; canvas.height = window.innerHeight;
    score = 0; lives = 5; enemies = []; particles = []; nextHeart = 5000;
    updateHUD(); run();
}

function updateHUD() {
    document.getElementById('score-display').innerText = score;
    document.getElementById('lives-display').innerText = "❤️".repeat(lives);
}

canvas.addEventListener('mousedown', (e) => {
    enemies.forEach((en, i) => {
        if(e.clientX > en.x && e.clientX < en.x+60 && e.clientY > en.y-50 && e.clientY < en.y+10) {
            if(en.isH) { if(lives < 5) lives++; } else { score += en.r ? 500 : 100; }
            for(let j=0; j<15; j++) particles.push(new Particle(en.x+30, en.y-20));
            enemies.splice(i,1);
            if(score >= nextHeart) { enemies.push({x: Math.random()*(mw-60), y:-50, s:4, isH:true}); nextHeart+=5000; }
            updateHUD();
        }
    });
});

function run() {
    if(!gameActive) return;
    ctx.clearRect(0,0,mw,mh);
    if(Math.random() < 0.02) enemies.push({x: Math.random()*(mw-60), y:-60, s:2+Math.random()*3, r:Math.random()<0.1});
    enemies.forEach((en, i) => {
        en.y += en.s; ctx.font = en.isH ? '50px Arial' : (en.r ? '55px Arial' : '40px Arial');
        ctx.fillText(en.isH ? '❤️' : (en.r ? '🛸' : '👾'), en.x, en.y);
        if(en.y > mh) { if(!en.isH) lives--; enemies.splice(i,1); updateHUD(); }
    });
    particles.forEach((p,i) => { p.x+=p.vx; p.y+=p.vy; p.a-=0.03; p.draw(); if(p.a<=0) particles.splice(i,1); });
    if(lives <= 0) { gameActive = false; alert(`DERROTA CRÍTICA\nPuntaje: ${score} PTS`); startDefense(); }
    else requestAnimationFrame(run);
}

// Ejecución inicial
syncData(); 
// Refresco automático cada 30 segundos
setInterval(syncData, 30000);

window.addEventListener('keydown', (e) => { 
    if(e.key === "Escape") { 
        gameActive=false; 
        document.getElementById('game-container').style.display='none'; 
    }
});
</script>
</body>
</html>
