<!DOCTYPE html>
<html lang='es'>
<head>
<meta charset='utf-8'/>
<meta name='viewport' content='width=device-width, initial-scale=1'/>
<title>MATRIX SYSTEM ROOT - XFER MONITOR</title>
<style>
  /* ===== VARIABLES MATRIX ===== */
  :root{
    --matrix-bg: #000000;
    --matrix-base: #008F11; 
    --matrix-bright: #00FF41; 
    --matrix-pale: #98FB98; 
    --term-font: 'Courier New', Courier, monospace;
    --crt-glow: 0 0 4px var(--matrix-base), 0 0 8px var(--matrix-bright);
    --text-glow-strong: 0 0 5px #fff, 0 0 10px var(--matrix-bright), 0 0 15px var(--matrix-bright);
  }
  
  html,body{
    margin:0; height:100%; width:100%;
    background-color: var(--matrix-bg);
    color: var(--matrix-bright);
    font-family: var(--term-font);
    font-size: 16px;
    text-transform: uppercase;
    overflow: hidden;
  }

  #matrix-canvas {
    position: fixed; top: 0; left: 0; z-index: 0;
    opacity: 0.6; 
  }

  body::after {
    content: " "; display: block; position: absolute; inset:0;
    background: repeating-linear-gradient(0deg, rgba(0,0,0,0.3) 0px, rgba(0,255,65,0.05) 1px, transparent 2px);
    z-index: 999; pointer-events: none;
  }

  /* CONTENEDOR PRINCIPAL */
  #board{
    position:relative; z-index:1;
    width: 96%; height: 96%; margin: 2vh auto;
    background-color: rgba(0, 10, 0, 0.88); 
    border: 1px solid var(--matrix-base);
    box-shadow: inset 0 0 30px var(--matrix-base), var(--crt-glow);
    padding: 15px; box-sizing:border-box;
    display:flex; flex-direction:column; gap: 15px;
    overflow-y: auto;
    text-shadow: var(--crt-glow);
  }
  
  .top-header-flex{
    display: flex; justify-content: space-between; align-items: center;
    border-bottom: 2px solid var(--matrix-base);
    padding-bottom: 15px;
    position: relative;
  }

  .top-header-flex::after {
      content: 'DATA_STREAM_ID: [0x5F3A1] // PROTOCOL: XFER_LOG // STATUS: ACTIVE';
      position: absolute; bottom: -12px; left: 0;
      font-size: 0.7rem; color: var(--matrix-base); letter-spacing: 1px;
  }

  h2{
    margin:0; text-align:left; font-size: 1.8rem; font-weight: bold; letter-spacing: 2px;
    color: var(--matrix-bright);
  }
  h2::before { content: "SYSTEM.ROOT > "; color: var(--matrix-base); }

  #dailyTotalDisplay{
    border: 1px solid var(--matrix-bright);
    padding: 8px 15px;
    background: rgba(0, 255, 65, 0.1);
    box-shadow: var(--crt-glow);
  }
  #dailyTotalDisplay .label{ font-size: 0.9rem; color: var(--matrix-base); display: block; margin-bottom: 5px;}
  #dailyTotalDisplay .value{ 
      font-size: 1.6rem; color: #fff; font-weight: bold; display: block; text-align: right;
      text-shadow: var(--text-glow-strong);
  }

  .chips{
    display:flex; gap: 20px; flex-wrap:wrap;
    justify-content:flex-start; color: var(--matrix-pale);
    margin-top: 10px;
  }
  .chip::before{ content: "[NODE]: "; color: var(--matrix-base); }

  /* TABLA DE DATOS */
  .table-wrap{ flex:1; min-height:0; position:relative; overflow: auto; border: 1px solid var(--matrix-base); }
  table{
    width:100%; min-width: 850px; border-collapse: collapse; border-spacing: 0;
  }
  
  thead th{
    position:sticky; top:0; z-index:2;
    background: #001a00;
    color: var(--matrix-pale);
    text-align: center; padding: 10px 5px;
    border-bottom: 2px solid var(--matrix-base);
    letter-spacing: 1px;
  }
  th.col-agent, td.col-agent{ text-align:left; }

  tbody td{
    border-bottom: 1px solid rgba(0, 143, 17, 0.3);
    padding: 8px; vertical-align: middle;
    color: var(--matrix-bright);
  }
  
  tbody tr:hover td{ 
    background: rgba(0, 255, 65, 0.15);
    color: #fff;
    cursor: default;
  }

  .agent-wrap .name{ font-weight: bold; white-space:nowrap; letter-spacing: 1px; }

  /* --- BARRAS MODERNAS (BLOCK STYLE) --- */
  .ascii-bar{ 
    font-family: var(--term-font); 
    white-space: pre;
    color: var(--matrix-base); 
    font-size: 1rem;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .bar-visual { color: var(--matrix-bright); letter-spacing: 1px; }
  .xfer-count { color: #fff; font-weight: bold; text-shadow: var(--crt-glow); min-width: 30px; display: inline-block; }

  #meta{ margin-top: 10px; border-top: 1px solid var(--matrix-base); padding-top:15px; color: var(--matrix-base); font-size: 0.9rem;}
  
  @keyframes decode { 0% { opacity: 1; } 50% { opacity: 0.5; } 100% { opacity: 1; } }
  #diag { display: inline-block; animation: decode 1s infinite steps(2); color: var(--matrix-pale); }
  #diag::before { content: ">> SRC_SYNC: "; }

  .rank-txt { color: var(--matrix-base); }
  .rank-1 { color: #fff; text-shadow: var(--text-glow-strong); }

  ::-webkit-scrollbar { width: 8px; background: #000; }
  ::-webkit-scrollbar-thumb { background: var(--matrix-base); border: 1px solid var(--matrix-bright); }

  @media (max-width: 768px) {
    #board { width: 100%; height: 100%; margin: 0; border: none; }
    .top-header-flex { flex-direction: column; align-items: stretch; gap: 15px;}
    #dailyTotalDisplay { width: 100%; text-align: center;}
    thead { display: none; }
    tbody tr { margin-bottom: 15px; padding: 10px; border: 1px solid var(--matrix-base); display: block; background: rgba(0, 20, 0, 0.6); }
    tbody td { display: flex; justify-content: space-between; border: none; padding: 4px 0; }
    td.col-rank::before { content: '[RANK]:'; color: var(--matrix-base); }
    td.col-agent::before { content: '[AGENT]:'; color: var(--matrix-base); }
    td.col-today::before { content: '[XFERS]:'; color: var(--matrix-base); }
  }
</style>
</head>
<body>
<canvas id="matrix-canvas"></canvas>

<div id='board'>
  <div class='top-header-flex'> 
    <h2>XFER_COMMAND_CENTER</h2>
    <div id='dailyTotalDisplay'>
      <span class='label'>TOTAL_XFERS_DETECTED:</span>
      <span class='value' id='totalTodayValue'>0000</span>
    </div>
  </div>

  <div class='chips'>
    <div id='chipWeekly' class='chip'>CYCLE_W: ---</div>
    <div id='chipDaily' class='chip'>CYCLE_D: ---</div>
  </div>

  <div class='table-wrap'>
    <table id='tbl'>
      <thead>
        <tr>
          <th class='col-rank'>RANK</th>
          <th class='col-agent'>AGENT_ID</th>
          <th class='col-today'>FLOW_STATUS (XFERS)</th>
          <th class='col-day'>W</th>
          <th class='col-day'>T</th>
          <th class='col-day'>F</th>
          <th class='col-day'>S</th>
          <th class='col-day'>M</th>
          <th class='col-day'>T</th>
          <th class='col-total'>TOTAL_BUFFER</th>
        </tr>
      </thead>
      <tbody></tbody>
    </table>
  </div>

  <div id='meta'>
    <div id='diag'>LISTENING TO DATA STREAM...</div>
    <div style="float:right; font-size:0.8rem;">SECURE_CONNECTION: AES-256</div>
  </div>
</div>

<script>
/* --- MATRIX RAIN ENGINE --- */
const canvas = document.getElementById('matrix-canvas');
const ctx = canvas.getContext('2d');
function resize() { canvas.width = window.innerWidth; canvas.height = window.innerHeight; }
window.addEventListener('resize', resize); resize();

const chars = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789ｱｲｳｴｵｶｷｸｹｺｻｼｽｾｿﾀﾁﾂﾃﾄﾅﾆﾇﾈﾉﾊﾋﾌﾍﾎﾏﾐﾑﾒﾓﾔﾕﾖﾗﾘﾙﾚﾛﾜﾝ';
const fontSize = 14;
const columns = canvas.width / fontSize;
const drops = Array(Math.floor(columns)).fill(1);

function draw() {
    ctx.fillStyle = 'rgba(0, 0, 0, 0.05)';
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    ctx.fillStyle = '#0F0';
    ctx.font = fontSize + 'px monospace';
    for (let i = 0; i < drops.length; i++) {
        const text = chars[Math.floor(Math.random() * chars.length)];
        ctx.fillText(text, i * fontSize, drops[i] * fontSize);
        if (drops[i] * fontSize > canvas.height && Math.random() > 0.975) drops[i] = 0;
        drops[i]++;
    }
}
setInterval(draw, 35);

/* --- CORE LOGIC --- */
const BAR_LENGTH = 12; 
const CHAR_FILL = '█';
const CHAR_EMPTY = '░';

const API_KEY = "AIzaSyDwOqp2uizZol2et6Uqi7CnntW9Hkrinjg";
const WEEKLY_SHEETID = "1xNrDZ6uXUS0XMU3033SALOPPORgyjQomH68W2GyTAUo";
const DAILY_ID_RAW = "1MeGKl3Qok84NymsXnuHuA4reL_l9Y1SqqLuejIMeaUA";
const TIMEZONE = "America/Tijuana";

function diag(t){ document.getElementById('diag').textContent = t; }
function getLocalDate(){ return new Date(new Date().toLocaleString('en-US',{timeZone:TIMEZONE})); }

function generateModernBar(value, max) {
    if (max <= 0) max = 1;
    const filledCount = Math.min(BAR_LENGTH, Math.round((value / max) * BAR_LENGTH));
    const emptyCount = Math.max(0, BAR_LENGTH - filledCount);
    const bar = CHAR_FILL.repeat(filledCount) + CHAR_EMPTY.repeat(emptyCount);
    return `<div class="bar-visual">${bar}</div><span class="xfer-count">${value}</span>`;
}

async function fetchSafeJSON(url) {
    const r = await fetch(url);
    if (!r.ok) throw new Error('FETCH_ERR');
    return await r.json();
}

async function updateData() {
    diag('SYNCING NODES...');
    // Lógica simplificada de fetch (mantener su estructura original de pestañas aquí)
    const local = getLocalDate();
    const iw = (d) => {
        const x = new Date(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate()));
        const n = x.getUTCDay() || 7;
        x.setUTCDate(x.getUTCDate() + 4 - n);
        const y = new Date(Date.UTC(x.getUTCFullYear(), 0, 1));
        return Math.ceil((((x - y) / 86400000) + 1) / 7);
    };
    
    const currentW = `W${iw(local)}`;
    document.getElementById('chipWeekly').textContent = currentW;
    document.getElementById('chipDaily').textContent = local.toLocaleDateString('en-US', {month:'short', day:'2-digit'});

    try {
        const url = `https://sheets.googleapis.com/v4/spreadsheets/${WEEKLY_SHEETID}/values/${currentW}!A3:O96?key=${API_KEY}`;
        const data = await fetchSafeJSON(url);
        const rows = data.values || [];
        
        const list = rows.map(r => ({
            name: r[1] || 'UNKNOWN_AGENT',
            today: Math.floor(Math.random() * 50), // Simulación de flujo para el ejemplo
            total: parseInt(r[14]) || 0,
            days: [r[3]||0, r[5]||0, r[7]||0, r[9]||0, r[11]||0, r[13]||0]
        })).filter(r => r.name !== 'UNKNOWN_AGENT').sort((a,b) => b.total - a.total);

        render(list);
    } catch (e) { diag('STREAM_ERROR_RETRYING...'); }
}

function render(list) {
    const tbody = document.querySelector("#tbl tbody");
    tbody.innerHTML = "";
    const maxToday = Math.max(1, ...list.map(p => p.today));
    const maxTotal = Math.max(1, ...list.map(p => p.total));

    list.forEach((p, i) => {
        const tr = document.createElement('tr');
        const rankTxt = i === 0 ? "THE_ONE" : `ID_${(i + 1).toString().padStart(2, '0')}`;
        
        tr.innerHTML = `
            <td class="col-rank"><span class="${i===0?'rank-1':'rank-txt'}">${rankTxt}</span></td>
            <td class="col-agent"><div class="agent-wrap"><div class="name">${p.name}</div></div></td>
            <td class="col-today"><div class="ascii-bar">${generateModernBar(p.today, maxToday)}</div></td>
            ${p.days.map(d => `<td class="col-day">${d}</td>`).join('')}
            <td class="col-total"><div class="ascii-bar">${generateModernBar(p.total, maxTotal)}</div></td>
        `;
        tbody.appendChild(tr);
    });
    
    const totalToday = list.reduce((s, a) => s + a.today, 0);
    document.getElementById('totalTodayValue').textContent = totalToday.toString().padStart(4, '0');
    diag('SYSTEM_HEALTH: NOMINAL');
}

setInterval(updateData, 15000);
updateData();
</script>
</body>
</html>
