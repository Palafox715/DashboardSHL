<!DOCTYPE html>
<html lang='es'>
<head>
<meta charset='utf-8'/>
<meta name='viewport' content='width=device-width, initial-scale=1'/>
<title>Leaderboard — Dark Neon Edition</title>
<style>
  :root{
    --vh: 1vh;
    --from:#7B2EFA;
    --to:#2EFAEB;
    --dark-bg: #0A0A0A;
    --ink:#E0E0E0;
    --glass: rgba(0,0,0, .55);
    --glass-strong: rgba(0,0,0, .75);
    --neon-blue: #44CCFF;
    --neon-purple: #FF44CC;
    --glow-blue: rgba(44, 204, 255, .6);
    --glow-purple: rgba(255, 68, 204, .5);
  }

  html,body{
    margin:0;
    min-height:100%;
    width:100%;
    background:var(--dark-bg);
    color:var(--ink);
    font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;
    overflow-x: hidden;
    overflow-y: auto;
  }

  body::before, body::after{
    content:""; position:fixed; inset:-20%;
    background: radial-gradient(40% 40% at 20% 20%, var(--glow-blue), transparent),
                radial-gradient(35% 35% at 80% 10%, rgba(255,255,255,.20), transparent),
                radial-gradient(30% 30% at 50% 90%, var(--glow-purple), transparent);
    z-index:0; pointer-events:none; mix-blend-mode:lighten; animation:float 22s linear infinite;
  }
  body::after{ animation-direction:reverse; animation-duration:27s; opacity:.7; }
  @keyframes float{ 0%{transform:translate3d(0,0,0)} 50%{transform:translate3d(2%, -2%, 0)} 100%{transform:translate3d(0,0,0)} }

  #board{
    position:relative; z-index:1;
    width:100vw;
    min-height:100vh;
    padding:calc(1.2*var(--vh)) calc(1.6*var(--vh)); box-sizing:border-box;
    background: radial-gradient(ellipse at top, #1a0a2e 0%, var(--dark-bg) 100%);
    display:flex;flex-direction:column;gap:calc(0.8*var(--vh));
  }
  
  .top-header-flex{
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 10px;
  }

  #dailyTotalDisplay{
    background: var(--glass-strong);
    padding: 8px 16px;
    border-radius: 10px;
    border: 1px solid var(--neon-blue);
    box-shadow: 0 0 15px var(--glow-blue);
    text-align: right;
    flex-shrink: 0;
  }
  #dailyTotalDisplay .label{
    font-size: calc(1.4*var(--vh));
    font-weight: 600;
    color: var(--neon-blue);
    text-transform: uppercase;
    letter-spacing: 0.5px;
    text-shadow: 0 0 5px var(--glow-blue);
  }
  #dailyTotalDisplay .value{
    font-size: calc(3.0*var(--vh));
    font-weight: 900;
    color: var(--neon-purple);
    line-height: 1;
    filter: drop-shadow(0 0 8px var(--glow-purple));
  }

  h2{
    margin:0;text-align:left;font-weight:900;letter-spacing:.3px;
    font-size:calc(4.0*var(--vh)); line-height:1.1;
    filter: drop-shadow(0 0 8px var(--neon-blue));
  }

  .chips{
    display:flex;gap:calc(.6*var(--vh));flex-wrap:wrap;
    justify-content:center;margin-top:calc(-.3*var(--vh));
  }
  .chip{
    padding:calc(.35*var(--vh)) calc(.8*var(--vh));
    border-radius:999px;
    background:var(--glass);
    backdrop-filter: blur(6px);
    border:1px solid rgba(255,255,255,.2);
    font-weight:800;font-size:calc(1.5*var(--vh));
    box-shadow: 0 6px 16px rgba(0,0,0,.3) inset, 0 1px 0 rgba(255,255,255,.1);
  }

  .table-wrap{ flex:1; min-height:0; position:relative; overflow-x: auto; }
  table{
    width:100%;
    min-width: 700px;
    border-collapse:separate; border-spacing:0 10px;
    table-layout:fixed; font-size:calc(1.7*var(--vh));
  }
  thead th{
    position:sticky; top:0; z-index:2;
    background:var(--glass-strong);
    backdrop-filter: blur(6px);
    text-transform:uppercase; letter-spacing:.3px;
    font-size:calc(1.6*var(--vh)); font-weight:900; padding:calc(.6*var(--vh)) calc(0.9*var(--vh));
    border-radius:10px;
    border:1px solid rgba(255,255,255,.15);
  }
  th.col-rank, td.col-rank { width:60px; text-align:center; }
  th.col-agent,td.col-agent{ width:180px; text-align:left; }
  th.col-today,td.col-today{ width:100px; text-align:center; }
  th.col-day,  td.col-day  { width:60px;  text-align:center; }
  th.col-total,td.col-total{ width:100px; text-align:center; }

  tbody td{
    background: var(--glass);
    border-top:1px solid rgba(255,255,255,.05);
    border-bottom:1px solid rgba(255,255,255,.05);
    padding:calc(.7*var(--vh)) calc(0.9*var(--vh));
  }
  tbody tr td:first-child{ border-left:1px solid rgba(255,255,255,.05); border-top-left-radius:14px; border-bottom-left-radius:14px; }
  tbody tr td:last-child { border-right:1px solid rgba(255,255,255,.05); border-top-right-radius:14px; border-bottom-right-radius:14px; }
  
  .agent-wrap{ display:flex; align-items:center; gap:12px; min-width:0; }
  .avatar{
    flex:0 0 auto; width:36px; height:36px; border-radius:50%;
    background: linear-gradient(135deg, var(--neon-blue), var(--neon-purple)); 
    border:1px solid rgba(0,0,0,.08);
    display:grid; place-items:center;
    font-weight:900; font-size:12px;
    color:var(--dark-bg);
    text-transform:uppercase;
    box-shadow: 0 4px 14px rgba(0,0,0,.4);
  }
  .name{ font-weight:900; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }

  .bar{ position:relative; height:18px; border-radius:999px; background:rgba(255,255,255,.1); border:1px solid rgba(255,255,255,.06); overflow:hidden; }
  .bar > .fill{ 
    position:absolute; left:0; top:0; bottom:0; width:0%; 
    background:linear-gradient(90deg, var(--neon-blue), #0099EE); 
    box-shadow: 0 0 10px var(--glow-blue);
    transition: width .8s cubic-bezier(0.175, 0.885, 0.32, 1.275); 
  }
  .bar.total > .fill{ 
    background:linear-gradient(90deg, var(--neon-purple), #EE00AA); 
    box-shadow: 0 0 10px var(--glow-purple);
  }
  .bar .value{ position:relative; z-index:1; font-weight:900; font-size:11px; color:var(--ink); text-shadow: 0 0 5px #000; line-height: 18px; }

  .medal{
    display:inline-grid; place-items:center;
    width:28px; height:28px; border-radius:50%;
    font-weight:900; font-size:13px;
    color:var(--dark-bg);
  }
  .gold  { background:linear-gradient(180deg,#FFD700,#FFA500); box-shadow: 0 0 10px gold; }
  .silver{ background:linear-gradient(180deg,#C0C0C0,#808080); box-shadow: 0 0 10px silver; }
  .bronze{ background:linear-gradient(180deg,#CD7F32,#8B4513); box-shadow: 0 0 10px #CD7F32; }

  #diag{ font-weight:800; font-size:calc(1.5*var(--vh)); opacity: 0.7; }

  @media (max-width: 768px) {
    #board { padding: 10px; }
    h2 { font-size: 2.2em; text-align: left; }
    thead { display: none; }
    table, tbody, tr, td { display: block; width: 100%; min-width: 0; }
    tbody tr { margin-bottom: 15px; border: 1px solid rgba(255,255,255,0.1); border-radius: 12px; padding: 10px; background: var(--glass-strong); }
    tbody td { display: flex; justify-content: space-between; align-items: center; border: none !important; padding: 5px 0; }
    td.col-rank::before { content: "Rank"; opacity: 0.5; font-size: 0.8em; }
    td.col-agent { border-bottom: 1px solid rgba(255,255,255,0.1) !important; margin-bottom: 5px; padding-bottom: 10px; }
    td.col-today::before { content: "Hoy"; opacity: 0.5; font-size: 0.8em; }
    td.col-total::before { content: "Total"; opacity: 0.5; font-size: 0.8em; }
    .bar { width: 60%; }
    .col-day { display: none !important; }
  }
</style>
</head>
<body>
<div id='board'>
  <div class='top-header-flex'> 
    <h2>🏁 Leaderboard</h2>
    <div id='dailyTotalDisplay'>
      <div class='label'>Total Diario</div>
      <div class='value' id='totalTodayValue'>0</div>
    </div>
  </div>

  <div class='chips'>
    <div id='chipWeekly' class='chip'>Week: ...</div>
    <div id='chipDaily' class='chip'>Daily: ...</div>
  </div>

  <div class='table-wrap'>
    <table id='tbl'>
      <thead>
        <tr>
          <th class='col-rank'>#</th>
          <th class='col-agent'>Agent</th>
          <th class='col-today'>Today</th>
          <th class='col-day'>Mié</th>
          <th class='col-day'>Jue</th>
          <th class='col-day'>Vie</th>
          <th class='col-day'>Sáb</th>
          <th class='col-day'>Lun</th>
          <th class='col-day'>Mar</th>
          <th class='col-total'>Total</th>
        </tr>
      </thead>
      <tbody id="leaderboardBody"></tbody>
    </table>
  </div>

  <div id='meta'>
    <div id='diag'>Iniciando sistema...</div>
  </div>
</div>

<script>
function setVHVar(){ const vh=window.innerHeight*0.01; document.documentElement.style.setProperty('--vh', `${vh}px`); }
setVHVar(); window.addEventListener('resize', setVHVar);

const API_KEY        = "AIzaSyDwOqp2uizZol2et6Uqi7CnntW9Hkrinjg";
const WEEKLY_SHEETID = "1xNrDZ6uXUS0XMU3033SALOPPORgyjQomH68W2GyTAUo";
const DAILY_ID_RAW   = "1MeGKl3Qok84NymsXnuHuA4reL_l9Y1SqqLuejIMeaUA";
const REFRESH_RATE   = 15000;

function diag(t){ document.getElementById('diag').textContent = t; }

async function fetchSheets(id, range = "A:I") {
    const url = `https://sheets.googleapis.com/v4/spreadsheets/${id}/values/${range}?key=${API_KEY}`;
    const res = await fetch(url);
    if (!res.ok) throw new Error("Error en Google API");
    return await res.json();
}

async function fetchData() {
  try {
    diag("Actualizando...");
    
    // Obtenemos datos de ambas hojas
    const weeklyData = await fetchSheets(WEEKLY_SHEETID, "A1:I100");
    const dailyData = await fetchSheets(DAILY_ID_RAW, "A1:B100");

    if (!weeklyData.values || !dailyData.values) {
        diag("No hay datos disponibles");
        return;
    }

    // Procesamos Diario para el total superior y mapeo rápido
    const dailyMap = {};
    let grandTotalDaily = 0;
    dailyData.values.slice(1).forEach(row => {
        const name = row[0];
        const val = parseFloat(row[1]) || 0;
        if(name) {
            dailyMap[name] = val;
            grandTotalDaily += val;
        }
    });

    // Mapeamos los datos semanales
    // Estructura esperada: [Nombre, Hoy(opcional), Mier, Jue, Vie, Sab, Lun, Mar, Total]
    const list = weeklyData.values.slice(1).map(row => {
        return {
            name: row[0],
            today: dailyMap[row[0]] || 0, // Tomamos el valor de la hoja diaria si existe
            wed: parseFloat(row[2]) || 0,
            thu: parseFloat(row[3]) || 0,
            fri: parseFloat(row[4]) || 0,
            sat: parseFloat(row[5]) || 0,
            mon: parseFloat(row[6]) || 0,
            tue: parseFloat(row[7]) || 0,
            total: parseFloat(row[8]) || 0
        };
    }).filter(a => a.name)
      .sort((a, b) => b.total - a.total); // Ordenar por total semanal

    renderTable(list, grandTotalDaily);
    
    // Actualizar Chips
    document.getElementById('totalTodayValue').textContent = grandTotalDaily.toLocaleString();
    document.getElementById('chipDaily').textContent = `Daily: ${grandTotalDaily}`;
    document.getElementById('chipWeekly').textContent = `Agents: ${list.length}`;
    
    diag("Conectado");
  } catch (e) {
    diag("Error de conexión");
    console.error(e);
  }
}

function renderTable(data, totalDaily) {
    const tbody = document.getElementById('leaderboardBody');
    tbody.innerHTML = '';

    const maxTotal = Math.max(...data.map(d => d.total), 1);
    const maxToday = Math.max(...data.map(d => d.today), 1);

    data.forEach((item, index) => {
        const rank = index + 1;
        let rankDisplay = rank;
        if(rank === 1) rankDisplay = `<span class="medal gold">1</span>`;
        if(rank === 2) rankDisplay = `<span class="medal silver">2</span>`;
        if(rank === 3) rankDisplay = `<span class="medal bronze">3</span>`;

        const initials = item.name.split(' ').map(n => n[0]).join('').substring(0, 2);
        const todayPerc = (item.today / maxToday) * 100;
        const totalPerc = (item.total / maxTotal) * 100;

        const tr = document.createElement('tr');
        tr.innerHTML = `
            <td class="col-rank">${rankDisplay}</td>
            <td class="col-agent">
                <div class="agent-wrap">
                    <div class="avatar">${initials}</div>
                    <div class="name">${item.name}</div>
                </div>
            </td>
            <td class="col-today">
                <div class="bar">
                    <div class="fill" style="width: ${todayPerc}%"></div>
                    <span class="value">${item.today}</span>
                </div>
            </td>
            <td class="col-day">${item.wed}</td>
            <td class="col-day">${item.thu}</td>
            <td class="col-day">${item.fri}</td>
            <td class="col-day">${item.sat}</td>
            <td class="col-day">${item.mon}</td>
            <td class="col-day">${item.tue}</td>
            <td class="col-total">
                <div class="bar total">
                    <div class="fill" style="width: ${totalPerc}%"></div>
                    <span class="value">${item.total}</span>
                </div>
            </td>
        `;
        tbody.appendChild(tr);
    });
}

// Iniciar ciclo de actualización
setInterval(fetchData, REFRESH_RATE);
window.onload = fetchData;

</script>
</body>
</html>
