<!DOCTYPE html>
<html lang='es'>
<head>
<meta charset='utf-8'/>
<meta name='viewport' content='width=device-width, initial-scale=1'/>
<title>Leaderboard — Core Dashboard</title>
<style>
  :root{
    --vh: 1vh;
    --dark-bg: #0A0A0A;
    --ink:#E0E0E0;
    --glass: rgba(0,0,0, .6);
    --glass-strong: rgba(0,0,0, .85);
    --neon-blue: #44CCFF;
    --neon-purple: #FF44CC;
    --neon-gold: #FFD700;
    --glow-blue: rgba(44, 204, 255, .6);
    --glow-purple: rgba(255, 68, 204, .5);
    --glow-gold: rgba(255, 215, 0, .6);
  }
  
  html,body{ margin:0; min-height:100%; width:100%; background:var(--dark-bg); color:var(--ink); font-family:system-ui,-apple-system,sans-serif; overflow: hidden; }

  /* CAPA -2: FONDO MATRIX Y GRADIENTES */
  #matrix-canvas { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: -2; opacity: 0.12; pointer-events: none; }
  body::before, body::after{ content:""; position:fixed; inset:-20%; background: radial-gradient(40% 40% at 20% 20%, var(--glow-blue), transparent), radial-gradient(30% 30% at 50% 90%, var(--glow-purple), transparent); z-index:-1; pointer-events:none; mix-blend-mode:lighten; animation:float 22s linear infinite; }
  @keyframes float{ 0%, 100%{transform:translate3d(0,0,0)} 50%{transform:translate3d(2%, -2%, 0)} }

  /* CAPA 1: ESTRUCTURA DEL DASHBOARD CENTRAL */
  #board{ position:relative; z-index:1; width:100vw; height: 100vh; padding:calc(1.2*var(--vh)) calc(1.6*var(--vh)); box-sizing:border-box; display:flex;flex-direction:column;gap:calc(0.8*var(--vh)); max-width: 1200px; margin: 0 auto; overflow-y: auto; padding-bottom: 120px; pointer-events: auto; }
  .top-header-flex{ display: flex; justify-content: space-between; align-items: center; gap: 10px; }
  .header-controls { display: flex; align-items: center; gap: 15px; }
  #dailyTotalDisplay{ background: var(--glass-strong); padding: 8px 16px; border-radius: 10px; border: 1px solid var(--neon-blue); box-shadow: 0 0 15px var(--glow-blue); text-align: right; }
  #dailyTotalDisplay .label{ font-size: 10px; font-weight: 600; color: var(--neon-blue); text-transform: uppercase; }
  #dailyTotalDisplay .value{ font-size: 24px; font-weight: 900; color: var(--neon-blue); line-height: 1; }
  .chips{ display:flex; gap:10px; flex-wrap:wrap; justify-content:center; }
  .chip{ padding: 5px 12px; border-radius:999px; background:var(--glass); border:1px solid rgba(255,255,255,.2); font-weight:800; font-size:12px; }
  .table-wrap{ flex:1; overflow-x: auto; background: var(--glass); border-radius: 12px; border: 1px solid rgba(255,255,255,0.05); }
  table{ width:100%; border-collapse:separate; border-spacing:0 8px; table-layout:fixed; }
  thead th{ background:var(--glass-strong); text-transform:uppercase; font-size:12px; padding:10px; border-bottom: 2px solid rgba(255,255,255,.1); }
  tbody td{ padding:10px; text-align:center; border-top:1px solid rgba(255,255,255,.05); }
  .bar{ position:relative; height:18px; border-radius:10px; background:rgba(255,255,255,0.1); overflow:hidden; }
  .bar > .fill{ position:absolute; left:0; top:0; bottom:0; width:0%; transition: width 0.8s ease; }
  .bar.today > .fill{ background: var(--neon-blue); box-shadow: 0 0 10px var(--glow-blue); }
  .bar.total > .fill{ background: var(--neon-purple); box-shadow: 0 0 10px var(--glow-purple); }
  .bar .value{ position:relative; z-index:1; font-size:11px; font-weight:900; color:white; text-shadow: 1px 1px 2px black; }
  
  #diag { position: fixed; bottom: 10px; left: 50%; transform: translateX(-50%); font-size: 10px; padding: 5px 10px; border-radius: 5px; background: rgba(0,0,0,0.8); border-bottom: 2px solid var(--neon-blue); z-index: 100; pointer-events: none;}

  /* CAPAS DE JUEGO Y FOREGROUND */
  #game-zone { position: fixed; inset: 0; z-index: 10; pointer-events: none; }
  .duende-sprite { position: absolute; width: 60px; height: 60px; background-size: contain; background-repeat: no-repeat; background-position: bottom center; pointer-events: auto; cursor: pointer; filter: drop-shadow(0 5px 10px rgba(0,0,0,0.8)); transition: transform 0.2s ease-out; }
  @keyframes breathe { 0%, 100% { filter: drop-shadow(0 5px 10px rgba(0,0,0,0.8)) brightness(1); } 50% { filter: drop-shadow(0 8px 15px var(--glow-blue)) brightness(1.1); } }
  .duende-sprite:hover { animation: breathe 1s infinite; }
  
  #foreground-zone { position: fixed; inset: 0; z-index: 20; pointer-events: none; overflow: hidden; }
  #grass-floor { position: absolute; bottom: -10px; left: 0; width: 100%; height: 100px; background-image: url('https://i.ibb.co/kgxbj8F5/grass.png'); background-repeat: repeat-x; background-size: auto 100%; background-position: bottom center; filter: drop-shadow(0 -5px 15px rgba(0,0,0,0.9)); pointer-events: none; }
  .fg-item { position: absolute; bottom: 40px; font-size: 120px; pointer-events: auto; user-select: none; filter: drop-shadow(0 10px 15px rgba(0,0,0,0.9)); }

  /* HUD Y CASINO */
  #coin-hud { position: fixed; top: 20px; left: 20px; z-index: 100; background: var(--glass-strong); padding: 8px 20px; border-radius: 12px; border: 2px solid var(--neon-gold); box-shadow: 0 0 20px var(--glow-gold), inset 0 0 10px rgba(255,215,0,0.2); display: flex; align-items: center; gap: 10px; pointer-events: auto; }
  #coin-hud .coin-icon { font-size: 24px; filter: drop-shadow(0 0 5px var(--neon-gold)); }
  #coin-hud .coin-value { font-size: 28px; font-weight: 900; color: var(--neon-gold); text-shadow: 0 0 10px var(--neon-gold); line-height: 1; transition: color 0.3s; }
  .coin-drop { position: absolute; font-size: 45px; z-index: 25; cursor: pointer; pointer-events: auto; user-select: none; filter: drop-shadow(0 0 15px var(--neon-gold)); animation: coin-fall 3s cubic-bezier(0.25, 1, 0.5, 1) forwards; }
  @keyframes coin-fall { 0% { top: -60px; opacity: 0; transform: scale(0.5) rotate(0deg); } 10% { opacity: 1; transform: scale(1) rotate(36deg); } 80% { top: calc(100vh - 120px); opacity: 1; transform: scale(1) rotate(288deg); } 100% { top: calc(100vh - 80px); opacity: 0; transform: scale(0) rotate(360deg); } }

  #slot-machine { position: fixed; top: 20px; right: 20px; z-index: 100; background: var(--glass-strong); padding: 15px; border-radius: 12px; border: 2px solid #555; box-shadow: 0 10px 30px rgba(0,0,0,0.8); display: flex; flex-direction: column; align-items: center; gap: 10px; pointer-events: auto; transition: all 0.3s ease; }
  .slot-display { display: flex; gap: 5px; background: #000; padding: 10px; border-radius: 8px; border: inset 3px #333; overflow: hidden; }
  .reel { width: 40px; height: 40px; background: #222; border-radius: 4px; display: flex; justify-content: center; align-items: center; font-size: 28px; user-select: none; box-shadow: inset 0 0 10px rgba(0,0,0,1); }
  .reel.spinning { animation: spin-blur 0.1s linear infinite; color: transparent; text-shadow: 0 0 15px rgba(255,255,255,0.8); }
  @keyframes spin-blur { 0% { transform: translateY(-10px); } 100% { transform: translateY(10px); } }
  #spin-btn { background: linear-gradient(180deg, var(--neon-blue), #005588); color: #FFF; border: none; padding: 8px 20px; border-radius: 6px; font-weight: 900; font-size: 14px; cursor: pointer; box-shadow: 0 4px 0 #003355, 0 0 10px var(--glow-blue); text-transform: uppercase; transition: all 0.1s; }
  #spin-btn:active { transform: translateY(4px); box-shadow: 0 0 0 #003355, 0 0 5px var(--glow-blue); }
  #spin-btn:disabled { background: #444; box-shadow: 0 4px 0 #222; cursor: not-allowed; color: #888; }
  .slot-message { font-size: 10px; color: var(--ink); font-weight: bold; text-transform: uppercase; height: 12px; }
  .win-anim { animation: win-pulse 1s infinite alternate; }
  @keyframes win-pulse { 0% { border-color: var(--neon-gold); box-shadow: 0 0 20px var(--glow-gold); } 100% { border-color: #FFF; box-shadow: 0 0 40px #FFF; } }

  /* =========================================
     NUEVO: TIENDA / MERCADO CLANDESTINO
     ========================================= */
  #market-toggle {
    position: fixed;
    bottom: 30px;
    left: 30px;
    z-index: 105;
    background: var(--glass-strong);
    border: 2px solid var(--neon-purple);
    color: #FFF;
    font-size: 24px;
    width: 60px;
    height: 60px;
    border-radius: 50%;
    cursor: pointer;
    box-shadow: 0 0 15px var(--glow-purple);
    display: flex;
    justify-content: center;
    align-items: center;
    pointer-events: auto;
    transition: transform 0.2s, box-shadow 0.2s;
  }
  #market-toggle:hover { transform: scale(1.1); box-shadow: 0 0 25px var(--glow-purple); }

  #market-drawer {
    position: fixed;
    top: 0;
    left: 0;
    bottom: 0;
    width: 350px;
    background: rgba(10, 10, 15, 0.95);
    backdrop-filter: blur(10px);
    border-right: 2px solid var(--neon-purple);
    z-index: 110;
    transform: translateX(-100%);
    transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    padding: 30px;
    box-sizing: border-box;
    display: flex;
    flex-direction: column;
    gap: 20px;
    pointer-events: auto;
    box-shadow: 20px 0 50px rgba(0,0,0,0.8);
  }

  #market-drawer.open { transform: translateX(0); }

  .market-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    border-bottom: 1px solid rgba(255,255,255,0.1);
    padding-bottom: 15px;
  }
  
  .market-title { font-size: 20px; font-weight: 900; color: var(--neon-purple); text-transform: uppercase; letter-spacing: 2px; }
  .close-market { background: transparent; border: none; color: #888; font-size: 24px; cursor: pointer; transition: color 0.2s; }
  .close-market:hover { color: #FFF; }

  .market-items-container {
    flex: 1;
    overflow-y: auto;
    display: flex;
    flex-direction: column;
    gap: 15px;
    padding-right: 10px;
  }

  /* Scrollbar estético para la tienda */
  .market-items-container::-webkit-scrollbar { width: 5px; }
  .market-items-container::-webkit-scrollbar-thumb { background: var(--neon-purple); border-radius: 5px; }

  .store-item {
    background: rgba(0,0,0,0.5);
    border: 1px solid rgba(255,255,255,0.1);
    border-radius: 10px;
    padding: 15px;
    display: flex;
    align-items: center;
    gap: 15px;
    transition: border-color 0.3s;
  }
  
  .store-item:hover { border-color: rgba(255,255,255,0.3); }

  .item-icon { font-size: 35px; filter: drop-shadow(0 0 8px rgba(255,255,255,0.3)); }
  .item-details { flex: 1; }
  .item-name { font-size: 14px; font-weight: bold; color: #FFF; margin-bottom: 3px; }
  .item-desc { font-size: 10px; color: #aaa; margin-bottom: 8px; line-height: 1.2; }
  
  .buy-btn {
    background: transparent;
    border: 1px solid var(--neon-gold);
    color: var(--neon-gold);
    padding: 5px 10px;
    border-radius: 5px;
    font-size: 11px;
    font-weight: bold;
    cursor: pointer;
    transition: all 0.2s;
    display: flex;
    align-items: center;
    gap: 5px;
  }

  .buy-btn:hover:not(:disabled) { background: var(--glow-gold); color: #000; }
  .buy-btn:disabled { border-color: #444; color: #666; cursor: not-allowed; }
  .buy-btn.owned { border-color: var(--neon-blue); color: var(--neon-blue); cursor: default; }
  .buy-btn.owned:hover { background: transparent; color: var(--neon-blue); }

</style>
</head>
<body>

<canvas id="matrix-canvas"></canvas>

<div id='board'>
  <div class='top-header-flex'> 
    <h2 style="margin:0; font-size: 28px;">🏁 Leaderboard</h2>
    <div class="header-controls"><div id='dailyTotalDisplay'><div class='label'>Total Diario</div><div class='value' id='totalTodayValue'>0</div></div></div>
  </div>
  <div class='chips'>
    <div id='chipWeekly' class='chip'>Week: —</div><div id='chipDaily' class='chip'>Daily: —</div>
    <button class="chip" onclick="updateData()" style="cursor:pointer; background:rgba(255,255,255,0.1)">🔄 Refrescar Red</button>
  </div>
  <div class='table-wrap'>
    <table id='tbl'>
      <thead><tr><th style="width:50px">#</th><th style="text-align:left">Agent</th><th>Today</th><th>Total</th></tr></thead>
      <tbody></tbody>
    </table>
  </div>
</div>

<div id="game-zone"></div>

<div id="foreground-zone">
  <div id="grass-floor"></div>
</div>

<div id="coin-hud">
  <div class="coin-icon">🪙</div>
  <div class="coin-value" id="coin-count">0</div>
</div>

<div id="slot-machine">
  <div class="slot-display">
    <div class="reel" id="reel-1">🍒</div>
    <div class="reel" id="reel-2">🍒</div>
    <div class="reel" id="reel-3">🍒</div>
  </div>
  <button id="spin-btn" onclick="spinSlot()">GIRAR (1🪙)</button>
  <div class="slot-message" id="slot-msg">Premio Máx: 100🪙</div>
</div>

<button id="market-toggle" onclick="toggleMarket()" title="Mercado Clandestino">🛒</button>

<div id="market-drawer">
  <div class="market-header">
    <div class="market-title">Mercado Negro</div>
    <button class="close-market" onclick="toggleMarket()">✖</button>
  </div>
  <div style="font-size:11px; color:#888; text-align:center;">Colecciona reliquias de prestigio.</div>
  <div class="market-items-container" id="market-list">
    </div>
</div>

<div id="diag">Iniciando sistemas...</div>

<script>
/* ==========================================================================
   MOTOR DEL DASHBOARD Y RED API
   ========================================================================== */
const API_KEY = "AIzaSyCCBAapFj9Fd-8cOIfpDJxrOP__76zxAxM"; 
const WEEKLY_ID = "1xNrDZ6uXUS0XMU3033SALOPPORgyjQomH68W2GyTAUo"; 
const DAILY_ID = "1MeGKl3Qok84NymsXnuHuA4reL_l9Y1SqqLuejIMeaUA";

function setDiag(msg, color = "#44CCFF") { 
    const d = document.getElementById('diag'); 
    if(d) { d.innerText = msg; d.style.borderLeftColor = color; } 
}

function getLocalDate(){ 
    return new Date(new Date().toLocaleString('en-US',{timeZone:"America/Tijuana"})); 
}

function computeWeeklyTab(){ 
    const d = getLocalDate(); 
    const start = new Date(d.getFullYear(), 0, 1); 
    const days = Math.floor((d - start) / 86400000); 
    let week = Math.ceil((days + start.getDay() + 1) / 7); 
    if (d.getDay() < 3 || (d.getDay() === 3 && d.getHours() < 12)) week--; 
    return `W${week}`; 
}

async function fetchSheet(id, range) { 
    try { 
        const r = await fetch(`https://sheets.googleapis.com/v4/spreadsheets/${id}/values/${encodeURIComponent(range)}?key=${API_KEY}`); 
        return r.ok ? await r.json() : null; 
    } catch (e) { return null; } 
}

async function updateData() {
    setDiag("📡 Sincronizando Uplink..."); 
    const weeklyTab = computeWeeklyTab(); 
    const master = await fetchSheet(WEEKLY_ID, `${weeklyTab}!A3:O96`);
    
    if (!master) { setDiag("❌ Error Weekly Sheets", "#FF44CC"); return; }
    
    const today = getLocalDate(); 
    const fmt = today.toLocaleString('en-US', {month:'short', day:'2-digit'});
    let daily = await fetchSheet(DAILY_ID, `${fmt}!A2:D100`); 
    if (!daily) daily = await fetchSheet(DAILY_ID, `Tabla_25!A2:D100`);
    
    const dailyRows = daily?.values || [];
    const agents = master.values.map(row => {
        const id = (row[0] || "").toString().trim(); 
        const name = (row[1] || "").toString().trim(); 
        if (!id || !name) return null;
        const match = dailyRows.find(d => (d[1] || "").toString().trim() === id); 
        return { name, today: match ? parseInt(match[2]) || 0 : 0, total: parseInt(row[14]) || 0 };
    }).filter(x => x).sort((a,b) => b.today - a.today);
    
    renderList(agents); 
    document.getElementById('totalTodayValue').innerText = agents.reduce((s, a) => s + a.today, 0);
    document.getElementById('chipWeekly').innerText = `Week: ${weeklyTab}`; 
    document.getElementById('chipDaily').innerText = `Daily: ${daily ? (daily.range.split('!')[0]) : '---'}`;
    setDiag("✅ Uplink Estable");
}

function renderList(data) {
    const tbody = document.querySelector("#tbl tbody"); 
    if(!tbody) return; 
    tbody.innerHTML = "";
    const maxT = Math.max(1, ...data.map(d => d.today)); 
    const maxW = Math.max(1, ...data.map(d => d.total));
    
    data.forEach((a, i) => { 
        tbody.innerHTML += `<tr>
            <td>${i+1}</td>
            <td style="text-align:left; font-weight:800">${a.name}</td>
            <td><div class="bar today"><div class="fill" style="width:${(a.today/maxT)*100}%"></div><div class="value">${a.today}</div></div></td>
            <td><div class="bar total"><div class="fill" style="width:${(a.total/maxW)*100}%"></div><div class="value">${a.total}</div></div></td>
        </tr>`; 
    });
}

const mCanvas = document.getElementById('matrix-canvas'); 
const mCtx = mCanvas.getContext('2d'); 
let mw, mh, mCols, mYpos;
function initMatrix() { mw = mCanvas.width = window.innerWidth; mh = mCanvas.height = window.innerHeight; mCols = Math.floor(mw / 25); mYpos = Array(mCols).fill(0); }
function drawMatrix() { mCtx.fillStyle = 'rgba(10, 10, 10, 0.1)'; mCtx.fillRect(0, 0, mw, mh); mCtx.fillStyle = '#44CCFF'; mCtx.font = '15px monospace'; mYpos.forEach((y, i) => { mCtx.fillText(String.fromCharCode(0x30A0 + Math.random() * 96), i * 25, y); mYpos[i] = y > 100 + Math.random() * 10000 ? 0 : y + 20; }); }
window.addEventListener('resize', initMatrix);


/* ==========================================================================
   MOTOR DE FÍSICAS, DUENDES Y ECONOMÍA
   ========================================================================== */
const DUENDE_ASSETS = [
    'https://raw.githubusercontent.com/Palafox715/DashboardSHL/main/Duendes/D1.png',
    'https://raw.githubusercontent.com/Palafox715/DashboardSHL/main/Duendes/D2.png',
    'https://raw.githubusercontent.com/Palafox715/DashboardSHL/main/Duendes/D3.png',
    'https://raw.githubusercontent.com/Palafox715/DashboardSHL/main/Duendes/D4.png'
];

const duendes = [];
const GRAVITY = 0.6;
const FLOOR_OFFSET = 30; 
let vaultCoins = 0;

function updateCoinHUD() {
    document.getElementById('coin-count').innerText = vaultCoins;
    localStorage.setItem('shl_vault_coins', vaultCoins);
    
    const spinBtn = document.getElementById('spin-btn');
    if(vaultCoins >= 1 && !isSpinning) { spinBtn.disabled = false; } else { spinBtn.disabled = true; }
    
    renderMarket(); // Actualiza los botones de la tienda según el dinero disponible
}

function initDuendes() {
    const gameZone = document.getElementById('game-zone');
    const savedCoins = localStorage.getItem('shl_vault_coins');
    if (savedCoins) { vaultCoins = parseInt(savedCoins); }
    updateCoinHUD();
    
    DUENDE_ASSETS.forEach((url, index) => {
        const el = document.createElement('div');
        el.className = 'duende-sprite';
        el.style.backgroundImage = `url('${url}')`;
        el.id = `duende-${index}`;
        gameZone.appendChild(el);

        duendes.push({
            el: el,
            x: Math.random() * (window.innerWidth - 100) + 50, 
            y: window.innerHeight - FLOOR_OFFSET - 60,         
            vx: (Math.random() > 0.5 ? 1 : -1) * (2 + Math.random() * 2), 
            vy: 0,                                             
            isJumping: false,
            size: 60
        });
        
        el.onclick = () => { pokeDuende(index); };
    });

    requestAnimationFrame(updateDuendes);
}

function updateDuendes() {
    const floorY = window.innerHeight - FLOOR_OFFSET;
    const maxX = window.innerWidth;

    duendes.forEach(d => {
        d.vy += GRAVITY; d.y += d.vy; d.x += d.vx;
        if (d.y + d.size >= floorY) {
            d.y = floorY - d.size; d.vy = 0; d.isJumping = false;
            if (Math.random() < 0.02) { d.vy = -(10 + Math.random() * 5); d.isJumping = true; }
        }
        if (d.x <= 0) { d.x = 0; d.vx *= -1; } else if (d.x + d.size >= maxX) { d.x = maxX - d.size; d.vx *= -1; }
        d.el.style.left = `${d.x}px`; d.el.style.top = `${d.y}px`;
        const scaleX = d.vx > 0 ? 1 : -1; d.el.style.transform = `scaleX(${scaleX})`;
    });
    requestAnimationFrame(updateDuendes);
}

function pokeDuende(index) {
    const d = duendes[index];
    if(!d.isJumping) { d.vy = -15; d.vx *= -1; spawnCoin(d.x); }
}

function spawnCoin(originX) {
    const coin = document.createElement('div');
    coin.className = 'coin-drop'; coin.innerText = '🪙';
    const safeX = Math.max(30, Math.min(window.innerWidth - 60, originX));
    coin.style.left = `${safeX}px`;
    
    coin.onclick = (e) => {
        e.stopPropagation(); 
        vaultCoins++; updateCoinHUD();
        coin.style.animation = 'none'; coin.style.transform = 'scale(1.5)'; coin.style.opacity = '0'; coin.style.transition = 'all 0.2s ease-out';
        setTimeout(() => coin.remove(), 200);
    };

    document.getElementById('game-zone').appendChild(coin);
    setTimeout(() => { if (document.body.contains(coin)) { coin.remove(); } }, 3000);
}

/* ==========================================================================
   SISTEMA DE FOREGROUND
   ========================================================================== */
function initForeground() {
    const fgZone = document.getElementById('foreground-zone');
    const emojis = ['🌲', '🌳', '🍄', '🪨'];
    const positions = [ { side: 'left', val: '5%' }, { side: 'left', val: '18%' }, { side: 'right', val: '5%' }, { side: 'right', val: '18%' } ];

    positions.forEach(pos => {
        const el = document.createElement('div'); el.className = 'fg-item'; el.innerText = emojis[Math.floor(Math.random() * emojis.length)];
        if (pos.side === 'left') { el.style.left = pos.val; } else { el.style.right = pos.val; }
        const scale = 0.9 + Math.random() * 0.2; el.style.transform = `scale(${scale})`;
        fgZone.appendChild(el);
    });
}

/* ==========================================================================
   SISTEMA DE CASINO (LA CASA GANA)
   ========================================================================== */
let isSpinning = false;
const slotSymbols = ['🍒', '🍋', '🔔', '💎', '💀'];
function getRandomSymbolExcept(exclude) { let sym; do { sym = slotSymbols[Math.floor(Math.random() * slotSymbols.length)]; } while (sym === exclude); return sym; }

function spinSlot() {
    if (vaultCoins < 1 || isSpinning) return;
    vaultCoins--; isSpinning = true; updateCoinHUD();
    
    const machine = document.getElementById('slot-machine');
    const msg = document.getElementById('slot-msg');
    machine.classList.remove('win-anim'); machine.style.borderColor = '#555';
    msg.innerText = "GIRANDO..."; msg.style.color = "var(--neon-blue)";
    
    let rng = Math.random() * 100;
    let targetSymbol = ''; let reward = 0; let isWin = false;

    // MATEMÁTICAS PUNITIVAS: 80% de perder
    if (rng < 30.1) { targetSymbol = '💎'; reward = 100; isWin = true; }      
    else if (rng < 3) { targetSymbol = '🔔'; reward = 10; isWin = true; }    
    else if (rng < 8) { targetSymbol = '🍋'; reward = 5; isWin = true; }     
    else if (rng < 25) { targetSymbol = '🍒'; reward = 2; isWin = true; }    
    else { isWin = false; targetSymbol = '💀'; }                             

    const finalReels = [targetSymbol, targetSymbol, targetSymbol];
    if (!isWin) {
        finalReels[0] = slotSymbols[Math.floor(Math.random() * slotSymbols.length)];
        finalReels[1] = slotSymbols[Math.floor(Math.random() * slotSymbols.length)];
        finalReels[2] = getRandomSymbolExcept(finalReels[1]); 
    }

    const reelElements = [document.getElementById('reel-1'), document.getElementById('reel-2'), document.getElementById('reel-3')];
    reelElements.forEach(r => r.classList.add('spinning'));

    setTimeout(() => { reelElements[0].classList.remove('spinning'); reelElements[0].innerText = finalReels[0]; }, 800);
    setTimeout(() => { reelElements[1].classList.remove('spinning'); reelElements[1].innerText = finalReels[1]; }, 1400);
    setTimeout(() => { 
        reelElements[2].classList.remove('spinning'); reelElements[2].innerText = finalReels[2]; 
        isSpinning = false;
        if (isWin) {
            vaultCoins += reward; updateCoinHUD();
            machine.classList.add('win-anim');
            msg.innerText = `¡GANASTE +${reward}🪙!`; msg.style.color = "var(--neon-gold)";
            spawnFloatingReward(reward, machine);
        } else {
            msg.innerText = "Sigue intentando..."; msg.style.color = "var(--ink)";
            updateCoinHUD(); 
        }
    }, 2000);
}

function spawnFloatingReward(amount, sourceEl) {
    const rect = sourceEl.getBoundingClientRect(); 
    const floating = document.createElement('div');
    floating.className = 'coin-drop'; floating.innerText = `+${amount}🪙`;
    floating.style.left = `${rect.left + (rect.width/2) - 30}px`; floating.style.top = `${rect.top + 20}px`;
    floating.style.fontSize = "30px"; floating.style.zIndex = "1000"; floating.style.animation = "none"; floating.style.transition = "all 1s ease-out";
    document.body.appendChild(floating);
    setTimeout(() => { floating.style.top = `${rect.top - 80}px`; floating.style.opacity = "0"; floating.style.transform = "scale(1.5)"; }, 50);
    setTimeout(() => floating.remove(), 1000);
}

/* ==========================================================================
   TIENDA: INVENTARIO LOCAL Y MERCADO
   ========================================================================== */
const marketCatalog = [
    { id: 'm1', name: 'Insignia del Novato', icon: '🥉', desc: 'El comienzo de un largo camino. Demuestra que has dado tus primeros pasos.', price: 500 },
    { id: 'm2', name: 'Ojo del Supervisor', icon: '👁️', desc: 'Permite ver más allá del caos. Una reliquia poco común.', price: 1500 },
    { id: 'm3', name: 'Sello del Cazador', icon: '🦇', desc: 'Otorgado a quienes dominan el arte de cazar duendes en el bosque.', price: 5000 },
    { id: 'm4', name: 'Corona de Sombras', icon: '👑', desc: 'Símbolo de la élite de Shoreline. Pocos logran adquirirla.', price: 10000 },
    { id: 'm5', name: 'Orbe de Obsidiana', icon: '🔮', desc: 'Poder absoluto. El máximo emblema de prestigio y dedicación.', price: 25000 }
];

// Cargar inventario propio del navegador
let userInventory = JSON.parse(localStorage.getItem('shl_user_inventory')) || [];

function toggleMarket() {
    const drawer = document.getElementById('market-drawer');
    drawer.classList.toggle('open');
    if(drawer.classList.contains('open')) { renderMarket(); }
}

function renderMarket() {
    const container = document.getElementById('market-list');
    container.innerHTML = '';

    marketCatalog.forEach(item => {
        const isOwned = userInventory.includes(item.id);
        const canAfford = vaultCoins >= item.price;
        
        let btnHtml = '';
        if (isOwned) {
            btnHtml = `<button class="buy-btn owned" disabled>✔️ ADQUIRIDO</button>`;
        } else {
            btnHtml = `<button class="buy-btn" ${!canAfford ? 'disabled' : ''} onclick="buyItem('${item.id}', ${item.price})">
                          <span>🪙 ${item.price.toLocaleString()}</span>
                       </button>`;
        }

        container.innerHTML += `
            <div class="store-item">
                <div class="item-icon">${item.icon}</div>
                <div class="item-details">
                    <div class="item-name">${item.name}</div>
                    <div class="item-desc">${item.desc}</div>
                    ${btnHtml}
                </div>
            </div>
        `;
    });
}

function buyItem(id, price) {
    if (vaultCoins >= price && !userInventory.includes(id)) {
        // Lógica de compra
        vaultCoins -= price;
        userInventory.push(id);
        
        // Persistencia de datos
        localStorage.setItem('shl_vault_coins', vaultCoins);
        localStorage.setItem('shl_user_inventory', JSON.stringify(userInventory));
        
        updateCoinHUD();
        renderMarket();
        
        // Pequeño efecto en consola como diagnóstico
        console.log(`[Sistema] Objeto ${id} adquirido con éxito.`);
    }
}

   INICIALIZACIÓN MAESTRA
   ========================================================================== */
(async function init() { 
    initMatrix(); 
    setInterval(drawMatrix, 50); 
    initDuendes(); 
    initForeground(); 
    updateCoinHUD();
    await updateData(); 
    setInterval(updateData, 60000); 
})();
</script>
