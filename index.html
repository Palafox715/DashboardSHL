<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Shoreline — Dashboard</title>
<style>
  :root {
    --bg-dark: #0b0c10;
    --panel-dark: rgba(31, 40, 51, 0.85); 
    --text-main: #c5c6c7;
    --text-light: #ffffff;
    --neon-green: #00ffcc;
    --neon-orange: #ff4500;
  }

  body {
    font-family: 'Inter', sans-serif;
    color: white;
    margin: 0;
    padding: 20px;
    height: 100vh;
    box-sizing: border-box;
    display: flex;
    flex-direction: column;
    background-color: var(--bg-dark); 
    background-image: url('./fondo.png');
    background-size: cover; 
    background-position: center; 
    background-attachment: fixed; 
  }

  #battlefield, #battlefield-entities {
    position: fixed;
    top: 0; left: 0;
    width: 100vw; height: 100vh;
    pointer-events: none;
  }
  #battlefield { z-index: 1; }
  #battlefield-entities { z-index: 2; }

  .agent-container {
    position: absolute;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    transition: transform 0.1s linear, opacity 0.3s ease;
    will-change: transform;
    pointer-events: auto; 
    cursor: crosshair;
  }

  .agent-container::after {
    content: '';
    position: absolute;
    top: -75%; left: -75%;
    width: 250%; height: 250%;
    background: transparent;
    z-index: 1; 
    border-radius: 50%;
  }

  .agent-sprite {
    width: 100%; height: auto;
    object-fit: contain;
    image-rendering: pixelated; 
    image-rendering: crisp-edges;
    transition: filter 0.2s ease, transform 0.2s ease; 
  }

  .agent-card-tooltip {
    position: absolute;
    bottom: 100%; left: 50%;
    transform: translateX(-50%) translateY(10px) scale(0.9);
    opacity: 0;
    visibility: hidden;
    transition: all 0.2s cubic-bezier(0.25, 1, 0.5, 1);
    pointer-events: none; 
    width: 140px; 
    z-index: 100;
    background: var(--bg-dark);
    border-radius: 8px;
    padding: 4px;
  }

  /* Facciones Estilos */
  .agent-container.javi .agent-card-tooltip { border: 2px solid var(--neon-green); box-shadow: 0 0 15px rgba(0,255,204,0.5); }
  .agent-container.aldo .agent-card-tooltip { border: 2px solid var(--neon-orange); box-shadow: 0 0 15px rgba(255,69,0,0.5); }

  .agent-card-tooltip img { width: 100%; height: auto; border-radius: 4px; display: block; }

  .agent-container:hover .agent-card-tooltip {
    opacity: 1;
    visibility: visible;
    transform: translateX(-50%) translateY(-10px) scale(1); 
  }

  .agent-container.javi .agent-sprite { filter: drop-shadow(0 0 5px rgba(0, 255, 204, 0.9)) drop-shadow(0 0 15px rgba(0, 255, 204, 0.6)); }
  .agent-container.aldo .agent-sprite {
    filter: drop-shadow(0 0 5px rgba(255, 69, 0, 0.9)) drop-shadow(0 0 15px rgba(255, 69, 0, 0.6));
    transform: scaleX(-1); 
  }

  @keyframes floatUp {
    0% { opacity: 1; transform: translateY(0) scale(1); }
    100% { opacity: 0; transform: translateY(-60px) scale(1.3); }
  }
  
  .floating-score {
    position: absolute; top: -20px;
    color: #fff; font-weight: 900; font-size: 14px;
    pointer-events: none;
    animation: floatUp 1.5s cubic-bezier(0.25, 1, 0.5, 1) forwards;
    z-index: 100;
  }

  .flash-active.javi .agent-sprite { filter: drop-shadow(0 0 20px #fff) drop-shadow(0 0 40px #fff) brightness(1.5) !important; }
  .flash-active.aldo .agent-sprite { filter: drop-shadow(0 0 20px #fff) drop-shadow(0 0 40px #fff) brightness(1.5) !important; transform: scaleX(-1); }

  .agent-name-label {
    margin-top: -5px; color: #fff; font-size: 11px; font-weight: 800; text-transform: uppercase;
    white-space: nowrap; pointer-events: none; text-align: center;
    text-shadow: -1px -1px 0 #000, 1px -1px 0 #000, -1px 1px 0 #000, 1px 1px 0 #000;
  }

  header, .dashboard { position: relative; z-index: 10; }
  header { text-align: center; padding: 1rem 0 0.5rem 0; }
  h1 { font-size: 2.4rem; font-weight: 800; margin-bottom: 0.3rem; color: var(--text-light); text-shadow: 0 0 10px rgba(255, 255, 255, 0.2); }

  .supremacy-wrapper {
    position: relative; width: 80%; height: 45px; margin: 1.5rem auto; background: #111;
    border-radius: 8px; border: 2px solid #333; display: flex; overflow: hidden;
    box-shadow: 0 0 20px rgba(0, 0, 0, 0.8) inset, 0 5px 15px rgba(0,0,0,0.5);
  }
  .supremacy-side { height: 100%; transition: width 0.8s cubic-bezier(0.25, 1, 0.5, 1); display: flex; align-items: center; position: relative; }
  .team-javi-bar { width: 50%; background: linear-gradient(90deg, rgba(0,255,204,0.2) 0%, rgba(0,255,204,0.8) 100%); box-shadow: inset -5px 0 15px var(--neon-green); }
  .team-aldo-bar { width: 50%; background: linear-gradient(270deg, rgba(255,69,0,0.2) 0%, rgba(255,69,0,0.8) 100%); box-shadow: inset 5px 0 15px var(--neon-orange); }
  
  .clash-point {
    position: absolute; top: -5px; bottom: -5px; width: 6px; background: #fff;
    box-shadow: 0 0 15px #fff, 0 0 30px #fff; transform: translateX(-50%); z-index: 10;
    transition: left 0.8s cubic-bezier(0.25, 1, 0.5, 1); left: 50%; 
  }

  .bar-labels { display: flex; justify-content: space-between; width: 80%; margin: 0.5rem auto 1.5rem auto; font-weight: 800; font-size: 1.2rem; text-transform: uppercase; letter-spacing: 1px; }
  #javi-label { color: var(--neon-green); text-shadow: 0 0 8px rgba(0, 255, 204, 0.5); }
  #aldo-label { color: var(--neon-orange); text-shadow: 0 0 8px rgba(255, 69, 0, 0.5); }

  .dashboard { display: flex; justify-content: center; align-items: flex-start; width: 90%; margin: 1rem auto 3rem auto; gap: 19rem; }
  .team { flex: 1; background: var(--panel-dark); backdrop-filter: blur(5px); border-radius: 46px; box-shadow: 0 10px 25px rgba(0,0,0,0.5); overflow: hidden; min-width: 580px; max-width: 840px; border: 1px solid rgba(255,255,255,0.1); }
  h2 { text-align: center; color: var(--neon-green); background: rgba(0, 255, 204, 0.1); padding: 0.8rem; font-size: 1.4rem; font-weight: 800; margin: 0; text-shadow: 0 0 5px var(--neon-green); }
  h2.orange { color: var(--neon-orange); background: rgba(255, 69, 0, 0.1); text-shadow: 0 0 5px var(--neon-orange); }
  
  table { width: 100%; border-collapse: collapse; text-align: center; font-size: 1.0rem; color: var(--text-main); }
  th, td { padding: 8px 10px; border-bottom: 1px solid #333; }
  th { background: rgba(0, 255, 204, 0.2); color: var(--neon-green); font-weight: 700; text-transform: uppercase; }
  .team.orange th { background: rgba(255, 69, 0, 0.2); color: var(--neon-orange); }
  tr:nth-child(even) td { background: rgba(255, 255, 255, 0.03); }
  .sum-row { background: #111; color: var(--text-light); font-weight: 700; }
  
  .totals-center { position: absolute; top: 30%; left: 50%; transform: translate(-50%, -55%); background: var(--panel-dark); backdrop-filter: blur(5px); border-radius: 65px; padding: 1.3rem 2.3rem; text-align: center; box-shadow: 0 8px 25px rgba(0,0,0,0.5); border: 2px solid rgba(255,255,255,0.1); }
  .totals-center h3 { margin: 0; font-size: 1.3rem; color: var(--text-light); }
  .totals-center span { display: block; font-size: 2.7rem; font-weight: 800; margin: 0.3rem 0; transition: all 0.3s ease-in-out; }

  /* Menú de Botones */
  .controles-inferiores {
    position: fixed; bottom: 30px; right: 30px; 
    display: flex; gap: 15px; z-index: 1000;
  }

  .btn-juego {
    background: rgba(31, 40, 51, 0.95); color: #fff; padding: 12px 24px;
    font-size: 1.1rem; font-weight: 800; border-radius: 8px;
    cursor: pointer; transition: all 0.3s ease; font-family: inherit;
    text-transform: uppercase; border: 2px solid rgba(255,255,255,0.2);
  }
  
  .btn-juego:hover { transform: translateY(-3px); }
  #btn-galeria { border-color: #ffffff; box-shadow: 0 0 15px rgba(255, 255, 255, 0.4); }
  #btn-galeria:hover { background: #ffffff; color: #000; box-shadow: 0 0 25px rgba(255, 255, 255, 0.8); }
  
  #btn-piramide { border-color: var(--neon-orange); box-shadow: 0 0 15px rgba(255, 69, 0, 0.4); }
  #btn-piramide:hover { background: var(--neon-orange); color: #000; box-shadow: 0 0 25px rgba(255, 69, 0, 0.8); }

  /* Visor Modal Universal */
  #modal-visor {
    position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
    background: rgba(11, 12, 16, 0.85); backdrop-filter: blur(8px);
    z-index: 9999; display: flex; justify-content: center; align-items: center;
    opacity: 1; transition: opacity 0.3s ease, visibility 0.3s ease;
  }
  
  #modal-visor.modal-oculto { opacity: 0; visibility: hidden; pointer-events: none; }

  .modal-contenido {
    position: relative; width: 90%; height: 90%;
    background: var(--panel-dark); border-radius: 15px;
    border: 1px solid rgba(255,255,255,0.1); box-shadow: 0 0 50px rgba(0,0,0,0.8);
  }

  .cerrar-btn {
    position: absolute; top: -15px; right: -15px; background: var(--neon-orange);
    color: white; border: none; width: 45px; height: 45px; border-radius: 50%;
    font-size: 1.8rem; font-weight: bold; cursor: pointer;
    box-shadow: 0 0 15px rgba(255,69,0,0.5); z-index: 10;
  }
  
  #frame-visor { width: 100%; height: 100%; border-radius: 15px; background: transparent; }
</style>
</head>
<body>

<canvas id="battlefield"></canvas>
<div id="battlefield-entities"></div>

<header>
  <h1>Shoreline Competition</h1>
  <div class="supremacy-wrapper">
    <div id="javi-bar" class="supremacy-side team-javi-bar"></div>
    <div id="aldo-bar" class="supremacy-side team-aldo-bar"></div>
    <div id="clash-indicator" class="clash-point"></div>
  </div>
  <div class="bar-labels">
    <span id="javi-label">🟢 Facción Javi: 0% (0)</span>
    <span id="aldo-label">🟠 Facción Aldo: 0% (0)</span>
  </div>
</header>

<div class="dashboard">
  <div class="team">
    <h2>🟢 Facción Javi</h2>
    <table id="table-javi">
      <thead><tr><th>Agent</th><th>ID</th><th>Cr Pull</th><th>Xfer</th><th>Total</th></tr></thead>
      <tbody></tbody>
      <tfoot><tr class="sum-row"><td colspan="2">TOTAL</td><td id="javi-cr">0</td><td id="javi-xf">0</td><td id="javi-total">0</td></tr></tfoot>
    </table>
  </div>
  <div class="totals-center" id="totals-center">
    <h3>XFER Totals</h3>
    <span id="javi-xfer-total">0</span>
    <span style="font-size:3.0rem;">VS</span>
    <span id="aldo-xfer-total">0</span>
  </div>
  <div class="team orange">
    <h2 class="orange">🟠 Facción Aldo</h2>
    <table id="table-aldo">
      <thead><tr><th>Agent</th><th>ID</th><th>Cr Pull</th><th>Xfer</th><th>Total</th></tr></thead>
      <tbody></tbody>
      <tfoot><tr class="sum-row"><td colspan="2">TOTAL</td><td id="aldo-cr">0</td><td id="aldo-xf">0</td><td id="aldo-total">0</td></tr></tfoot>
    </table>
  </div>
</div>

<div class="controles-inferiores">
  <button id="btn-galeria" class="btn-juego">🖼️ Galería</button> 
  <button id="btn-piramide" class="btn-juego">🃏 Pirámide</button> 
</div>

<div id="modal-visor" class="modal-oculto">
  <div class="modal-contenido">
    <button id="btn-cerrar-visor" class="cerrar-btn">&times;</button>
    <iframe id="frame-visor" src="" frameborder="0"></iframe>
  </div>
</div>

<script>
const SHEET_ID = "1xNrDZ6uXUS0XMU3033SALOPPORgyjQomH68W2GyTAUo";
const API_KEY  = "AIzaSyCCBAapFj9Fd-8cOIfpDJxrOP__76zxAxM"; 
const TIMEZONE = "America/Tijuana";

const canvas = document.getElementById('battlefield');
const ctx = canvas.getContext('2d');
const entitiesContainer = document.getElementById('battlefield-entities'); 

let width, height;
let currentDominancePct = 50; 
let particles = []; 

function resizeCanvas() {
  width = canvas.width = window.innerWidth;
  height = canvas.height = window.innerHeight;
}
window.addEventListener('resize', resizeCanvas);
resizeCanvas();

class Entity {
  constructor(id, name, team, xfer) {
    this.id = id;
    this.name = name;
    this.team = team;
    this.xfer = 0; 
    
    this.domElement = document.createElement('div');
    this.domElement.className = `agent-container ${this.team}`;
    this.domElement.id = `agent-${id}`; 

    this.isHovered = false;
    this.domElement.addEventListener('mouseenter', () => {
      this.isHovered = true;
      this.domElement.style.zIndex = "1000"; 
    });
    this.domElement.addEventListener('mouseleave', () => {
      this.isHovered = false;
      this.domElement.style.zIndex = ""; 
    });
    
    const cardTooltip = document.createElement('div');
    cardTooltip.className = 'agent-card-tooltip';
    const cardImg = document.createElement('img');
    
    cardImg.src = `./cartas/${id}.png`;
    cardImg.onerror = function() { 
      this.onerror = function() { cardTooltip.style.display = 'none'; };
      this.src = "./cartas/Default.png"; 
    };
    
    cardTooltip.appendChild(cardImg);
    this.domElement.appendChild(cardTooltip);

    const img = document.createElement('img');
    img.src = `./Sprite/${id}.gif`;
    img.onerror = function() {
      this.onerror = function() { this.style.display = 'none'; };
      this.src = "./Sprite/default.gif"; 
    };
    img.className = 'agent-sprite';
    this.domElement.appendChild(img);
    
    const nameLabel = document.createElement('span');
    nameLabel.className = 'agent-name-label';
    nameLabel.textContent = this.name.split(' ')[0]; 
    this.domElement.appendChild(nameLabel);

    entitiesContainer.appendChild(this.domElement);
    
    this.y = Math.random() * height;
    if (this.team === 'javi') {
      this.x = Math.random() * (width * (currentDominancePct/100));
    } else {
      this.x = (width * (currentDominancePct/100)) + Math.random() * (width * ((100-currentDominancePct)/100));
    }
    
    const angle = Math.random() * Math.PI * 2;
    this.vx = Math.cos(angle); 
    this.vy = Math.sin(angle);

    this.updateStats(xfer);
  }

  triggerScoreEffect(pointsGained) {
    if (!this.domElement) return;
    this.domElement.classList.add('flash-active');
    setTimeout(() => { if (this.domElement) this.domElement.classList.remove('flash-active'); }, 500);

    const scorePopup = document.createElement('div');
    scorePopup.className = 'floating-score';
    scorePopup.textContent = `+${pointsGained} XFER!`;
    const glowColor = this.team === 'javi' ? 'var(--neon-green)' : 'var(--neon-orange)';
    scorePopup.style.textShadow = `0 0 5px #000, 0 0 15px ${glowColor}`;
    this.domElement.appendChild(scorePopup);
    setTimeout(() => { if (scorePopup && scorePopup.parentNode) scorePopup.remove(); }, 1500);
  }

  updateStats(xfer) {
    this.xfer = xfer;
    this.size = 50 + Math.min(xfer * 2.0, 100); 
    this.collideRadius = this.size / 2;
    this.maxSpeed = 1.0 + Math.min(xfer * 0.15, 5.0);
    
    if (this.domElement) {
      this.domElement.style.width = `${this.size}px`;
      this.domElement.style.height = `${this.size}px`;
    }
  }

  update(wallX) {
    if (this.isHovered) return;

    const attractionForce = 0.015;
    if (this.team === 'javi') { this.vx += attractionForce; } else { this.vx -= attractionForce; }

    const currentSpeed = Math.sqrt(this.vx * this.vx + this.vy * this.vy);
    if (currentSpeed > this.maxSpeed) {
      this.vx = (this.vx / currentSpeed) * this.maxSpeed;
      this.vy = (this.vy / currentSpeed) * this.maxSpeed;
    }

    this.x += this.vx;
    this.y += this.vy;

    if (this.y - this.collideRadius <= 0 || this.y + this.collideRadius >= height) {
      this.vy *= -1;
      this.y = Math.max(this.collideRadius, Math.min(this.y, height - this.collideRadius));
    }

    if (this.team === 'javi') {
      if (this.x - this.collideRadius <= 0) { this.vx = Math.abs(this.vx); this.x = this.collideRadius; }
      if (this.x + this.collideRadius >= wallX) { 
        this.vx = -(this.maxSpeed * (1.5 + Math.random())); 
        this.vy += (Math.random() - 0.5) * 2; 
        this.x = wallX - this.collideRadius; 
      }
    } else {
      if (this.x + this.collideRadius >= width) { this.vx = -Math.abs(this.vx); this.x = width - this.collideRadius; }
      if (this.x - this.collideRadius <= wallX) { 
        this.vx = this.maxSpeed * (1.5 + Math.random()); 
        this.vy += (Math.random() - 0.5) * 2; 
        this.x = wallX + this.collideRadius; 
      }
    }
  }

  draw() {
    this.domElement.style.transform = `translate3d(${this.x - this.collideRadius}px, ${this.y - this.collideRadius}px, 0)`;
  }
}

function animate() {
  ctx.clearRect(0, 0, width, height);
  const wallX = width * (currentDominancePct / 100);
  ctx.beginPath(); ctx.moveTo(wallX, 0); ctx.lineTo(wallX, height);
  ctx.strokeStyle = 'rgba(255,255,255,0.1)'; ctx.lineWidth = 2; ctx.stroke();

  particles.forEach(p => { p.update(wallX); p.draw(); });
  requestAnimationFrame(animate);
}
animate(); 

function num(v) { const n = Number(String(v ?? "").replace(/,/g, "").trim()); return Number.isFinite(n) ? n : 0; }
function pad2(n) { return String(n).padStart(2, "0"); }
function nowTZ() { return new Date(new Date().toLocaleString("en-US", { timeZone: TIMEZONE })); }

function getCurrentWeekNumber() {
  const now = nowTZ();
  let firstThursday = new Date(now.getFullYear(), 0, 1);
  while (firstThursday.getDay() !== 4) { firstThursday.setDate(firstThursday.getDate() + 1); }
  if (now < firstThursday) return 52; 
  return Math.floor(Math.floor((now - firstThursday) / 86400000) / 7) + 1; 
}

async function fetchJSON(url, { tries = 4, baseDelay = 700 } = {}) {
  let lastErr;
  for (let i = 0; i < tries; i++) {
    try {
      const r = await fetch(url, { cache: "no-store" });
      if (r.ok) return JSON.parse(await r.text());
      if (r.status === 429 || (r.status >= 500 && r.status < 600)) {
        await new Promise(res => setTimeout(res, baseDelay * Math.pow(2, i) + Math.random() * 250));
        continue;
      }
      throw new Error(`HTTP ${r.status}`);
    } catch (e) {
      lastErr = e;
      await new Promise(res => setTimeout(res, baseDelay * Math.pow(2, i) + Math.random() * 250));
    }
  }
  throw lastErr;
}

async function listSheetTitles() {
  const cache = window.__tabsCache;
  if (cache && (Date.now() - cache.at) < 600000) return cache.titles;
  const url = `https://sheets.googleapis.com/v4/spreadsheets/${SHEET_ID}?fields=sheets(properties(title))&key=${API_KEY}`;
  const j = await fetchJSON(url);
  const titles = (j.sheets || []).map(s => s?.properties?.title).filter(Boolean);
  window.__tabsCache = { at: Date.now(), titles };
  return titles;
}

async function loadData() {
  try {
    const teamData = (await fetchJSON(`https://sheets.googleapis.com/v4/spreadsheets/${SHEET_ID}/values/TeamLayout!A1:Z150?key=${API_KEY}`)).values || [];
    const mapJavi = new Map(), mapAldo = new Map();

    if (teamData.length >= 2) {
      const headers1 = teamData[0] || [], headers2 = teamData[1] || [];
      let javiStart = -1, aldoStart = -1;
      
      headers1.forEach((h, i) => {
        if (String(h).toUpperCase().includes("JAVI")) javiStart = i;
        if (String(h).toUpperCase().includes("ALDO")) aldoStart = i;
      });
      
      if (javiStart === -1) javiStart = 0;
      if (aldoStart === -1) aldoStart = 9;
      
      let javiCols = { name: -1, id: -1 }, aldoCols = { name: -1, id: -1 };
      const limitJavi = aldoStart > javiStart ? aldoStart : headers2.length;
      
      for (let i = javiStart; i < limitJavi; i++) {
        const h = String(headers2[i]).toUpperCase();
        if (h.includes("NAME")) javiCols.name = i;
        if (h === "ID") javiCols.id = i;
      }
      for (let i = aldoStart; i < headers2.length; i++) {
        const h = String(headers2[i]).toUpperCase();
        if (h.includes("NAME")) aldoCols.name = i;
        if (h === "ID") aldoCols.id = i;
      }
      
      teamData.slice(2).forEach(row => {
        if (javiCols.id !== -1 && row[javiCols.id]) {
          const id = String(row[javiCols.id]).trim();
          if (id) mapJavi.set(id, { id, name: String(row[javiCols.name] || "Unknown").trim(), team: "javi", cr: 0, xf: 0, total: 0 });
        }
        if (aldoCols.id !== -1 && row[aldoCols.id]) {
          const id = String(row[aldoCols.id]).trim();
          if (id) mapAldo.set(id, { id, name: String(row[aldoCols.name] || "Unknown").trim(), team: "aldo", cr: 0, xf: 0, total: 0 });
        }
      });
    }

    const titles = await listSheetTitles();
    let weeklyTab = `W${pad2(getCurrentWeekNumber())}`;
    
    if (!titles.includes(weeklyTab)) {
      const weekTabs = titles.map(t => { const m = /^W(\d{1,2})$/.exec(t.trim()); return m ? { n: Number(m[1]), title: t } : null; }).filter(Boolean).sort((a,b) => b.n - a.n);
      if (weekTabs.length > 0) weeklyTab = weekTabs[0].title; 
      else throw new Error("No se encontraron pestañas semanales válidas.");
    }
    
    document.querySelector("h1").textContent = `Shoreline Competition - ${weeklyTab}`;

    const dataValues = (await fetchJSON(`https://sheets.googleapis.com/v4/spreadsheets/${SHEET_ID}/values/${encodeURIComponent(`${weeklyTab}!A1:Z150`)}?valueRenderOption=UNFORMATTED_VALUE&key=${API_KEY}`)).values || [];
    
    if (dataValues.length >= 3) {
      const crIndexes = [], xfIndexes = [];
      (dataValues[1] || []).forEach((h, i) => {
        const txt = String(h).toUpperCase().replace(/\s+/g, "");
        if (txt.includes("CRPULL") || txt === "CR") crIndexes.push(i);
        if (txt.includes("XFER") || txt === "XF") xfIndexes.push(i);
      });
      
      dataValues.slice(2).forEach(row => {
        const id = String(row[0] || "").trim();
        if (!id) return;
        let crSum = 0, xfSum = 0;
        crIndexes.forEach(idx => crSum += num(row[idx]));
        xfIndexes.forEach(idx => xfSum += num(row[idx]));
        
        if (mapJavi.has(id)) { let agent = mapJavi.get(id); agent.cr += crSum; agent.xf += xfSum; agent.total += (crSum + xfSum); } 
        else if (mapAldo.has(id)) { let agent = mapAldo.get(id); agent.cr += crSum; agent.xf += xfSum; agent.total += (crSum + xfSum); }
      });
    }

    const javiBody = document.querySelector("#table-javi tbody");
    const aldoBody = document.querySelector("#table-aldo tbody");
    javiBody.innerHTML = aldoBody.innerHTML = "";
    
    const javiArr = Array.from(mapJavi.values()).filter(a => a.total > 0 || a.cr > 0 || a.xf > 0).sort((a,b)=> b.total - a.total);
    const aldoArr = Array.from(mapAldo.values()).filter(a => a.total > 0 || a.cr > 0 || a.xf > 0).sort((a,b)=> b.total - a.total);

    const allAgents = [...javiArr, ...aldoArr];
    allAgents.forEach(agent => {
      let existingParticle = particles.find(p => p.id === agent.id);
      if (existingParticle) {
        existingParticle.team = agent.team; 
        if (agent.xf > existingParticle.xfer && existingParticle.xfer > 0) existingParticle.triggerScoreEffect(agent.xf - existingParticle.xfer);
        existingParticle.updateStats(agent.xf);
      } else {
        particles.push(new Entity(agent.id, agent.name, agent.team, agent.xf));
      }
    });

    particles = particles.filter(p => {
      const isActive = allAgents.some(a => a.id === p.id);
      if (!isActive && p.domElement) p.domElement.remove();
      return isActive;
    });

    let jCr=0, jXf=0, jTot=0, aCr=0, aXf=0, aTot=0;
    
    javiArr.forEach((d, i) => { jCr += d.cr; jXf += d.xf; jTot += d.total; javiBody.insertAdjacentHTML("beforeend", `<tr><td>${d.name}${i===0 && d.total>0?" 👑":""}</td><td>${d.id}</td><td>${d.cr}</td><td>${d.xf}</td><td>${d.total}</td></tr>`); });
    aldoArr.forEach((d, i) => { aCr += d.cr; aXf += d.xf; aTot += d.total; aldoBody.insertAdjacentHTML("beforeend", `<tr><td>${d.name}${i===0 && d.total>0?" 👑":""}</td><td>${d.id}</td><td>${d.cr}</td><td>${d.xf}</td><td>${d.total}</td></tr>`); });

    document.getElementById("javi-cr").textContent = jCr; document.getElementById("javi-xf").textContent = jXf; document.getElementById("javi-total").textContent = jTot;
    document.getElementById("aldo-cr").textContent = aCr; document.getElementById("aldo-xf").textContent = aXf; document.getElementById("aldo-total").textContent = aTot;
    
    const totalXfer = (jXf + aXf) > 0 ? (jXf + aXf) : 1; 
    const javiDomination = (jXf / totalXfer) * 100;
    const aldoDomination = (aXf / totalXfer) * 100;
    currentDominancePct = javiDomination; 
    
    document.getElementById("javi-bar").style.width = `${javiDomination}%`; document.getElementById("aldo-bar").style.width = `${aldoDomination}%`; document.getElementById("clash-indicator").style.left = `${javiDomination}%`;
    document.getElementById("javi-label").textContent = `🟢 Facción Javi: ${javiDomination.toFixed(1)}% (${jXf} XFER)`; document.getElementById("aldo-label").textContent = `🟠 Facción Aldo: ${aldoDomination.toFixed(1)}% (${aXf} XFER)`;

    const javiBox = document.getElementById("javi-xfer-total");
    const aldoBox = document.getElementById("aldo-xfer-total");
    javiBox.textContent = jXf; aldoBox.textContent = aXf;
    
    javiBox.style.color = "var(--neon-green)"; aldoBox.style.color = "var(--neon-orange)";
    if (jXf > aXf) { javiBox.style.opacity = "1"; javiBox.style.textShadow = "0 0 15px var(--neon-green)"; aldoBox.style.opacity = "0.5"; aldoBox.style.textShadow = "none"; } 
    else if (aXf > jXf) { aldoBox.style.opacity = "1"; aldoBox.style.textShadow = "0 0 15px var(--neon-orange)"; javiBox.style.opacity = "0.5"; javiBox.style.textShadow = "none"; }
    else { javiBox.style.opacity = aldoBox.style.opacity = "1"; javiBox.style.textShadow = aldoBox.style.textShadow = "none"; }

  } catch (err) {
    console.error("❌ Error al cargar los datos:", err);
  }
}

// === SISTEMA MODAL UNIVERSAL ===
const modalVisor = document.getElementById('modal-visor');
const iframeVisor = document.getElementById('frame-visor');
const btnCerrar = document.getElementById('btn-cerrar-visor');

function abrirModal(url) {
  modalVisor.classList.remove('modal-oculto');
  iframeVisor.src = url;
}

document.getElementById('btn-galeria').addEventListener('click', () => abrirModal('./galeria.html'));
document.getElementById('btn-piramide').addEventListener('click', () => abrirModal('./piramide.html'));

btnCerrar.addEventListener('click', () => {
  modalVisor.classList.add('modal-oculto');
  iframeVisor.src = ""; 
});

loadData();
setInterval(loadData, 60000); 
</script>
